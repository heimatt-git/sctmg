<!doctype html><html lang="fr"><head><meta charset="utf-8"><link rel="manifest" href="../manifest.webmanifest"><meta name="theme-color" content="#0e1319"><link rel="icon" type="image/svg+xml" href="../icons/icon.svg"><link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png"><link rel="apple-touch-icon" href="../icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="SC:TMG"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Règles en images SC:TMG</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout : planche de règle — en-tête, légende, grille 3×3 de cases (vue de côté + vue de dessus + verdict), encadré des conséquences. */
:root{
  --bg:#e9edf1; --surface:#ffffff; --sunk:#f3f5f8; --ink:#141c25; --muted:#586574; --line:#d0d8e1;
  --ok:#1f8a4f; --bad:#c62f26; --zone:#f6d6d9; --zone-line:#d98b93; --terrain:#6d5326; --terrain-ink:#ffffff;
  --high:#cfe2f3; --me:#2c6bc0; --opp:#b8452a; --fly:#7a4fb0; --ground:#b9c1ca; --hint:#2f9e5c; --tpl:#d98a00;
  --f-display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --f-body:"Barlow","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1319; --surface:#161e27; --sunk:#111821; --ink:#e2e8ee; --muted:#93a1b0; --line:#2a3644;
  --ok:#5fcf95; --bad:#ff7a6e; --zone:#3a2228; --zone-line:#a05a64; --terrain:#8a6a33; --terrain-ink:#fff7e6;
  --high:#1c3247; --me:#6fa8ff; --opp:#ef8a6c; --fly:#b493e6; --ground:#3a4654; --hint:#5fcf95; --tpl:#f0b84a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1319; --surface:#161e27; --sunk:#111821; --ink:#e2e8ee; --muted:#93a1b0; --line:#2a3644;
  --ok:#5fcf95; --bad:#ff7a6e; --zone:#3a2228; --zone-line:#a05a64; --terrain:#8a6a33; --terrain-ink:#fff7e6;
  --high:#1c3247; --me:#6fa8ff; --opp:#ef8a6c; --fly:#b493e6; --ground:#3a4654; --hint:#5fcf95; --tpl:#f0b84a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sheet>header{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline;justify-content:space-between}
.sheet>header h2{font-size:24px}
.sheet>header .ref{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.lead{padding:10px 18px;color:var(--muted);font-size:14px;border-bottom:1px solid var(--line);max-width:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;padding:10px 18px;border-bottom:1px solid var(--line);font-size:13px;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend svg{flex:none}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.grid{grid-template-columns:minmax(0,1fr)}}
.case{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.case .hd{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;align-items:start}
.case .lt{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:16px}
.case h3{font-size:15px;line-height:1.2}
.case .rule{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.verdict{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:700;font-size:15px;align-self:center}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.vw{font-family:var(--f-display);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
svg.d{width:100%;height:auto;display:block;border-radius:4px}
.case p.note{margin:0;font-size:13px;color:var(--muted)}
.cons{padding:14px 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px 24px;font-size:14px}
.cons h3{grid-column:1/-1;font-size:16px}
.cons ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.status{margin:14px 0 0;font-size:13px;color:var(--muted)}
.sheetnav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.sheetnav button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-family:var(--f-display);font-weight:600;font-size:14px;color:var(--ink);cursor:pointer}
.sheetnav button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.sheetnav .st{font-size:11px;font-weight:600;margin-left:6px;color:var(--ok)}
.sheetnav button.on .st{color:var(--surface)}
.sheetnav .draft{color:var(--bad)}
</style><style>.homelnk{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:6px;border:1px solid var(--line,#d0d8e1);color:inherit;text-decoration:none;font-size:16px;line-height:1;flex:none;align-self:center}.homelnk:hover{border-color:currentColor}</style></head><body>

<div class="wrap">
  <p style="margin:0 0 10px"><a class="homelnk" href="../" aria-label="Accueil" title="Accueil">⌂</a> <span style="color:var(--muted);font-size:13px;vertical-align:middle">Accueil</span></p><nav class="sheetnav" id="nav" aria-label="Planches"></nav>
  <div id="sheets"></div>
</div>

<script>
const IN = 16;             // 1 pouce = 16 px
const GY = 92;             // niveau du sol (vue de côté)
const BLK = 18;            // hauteur d’un niveau de taille
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const col = s => s === 'me' ? 'var(--me)' : s === 'fly' ? 'var(--fly)' : 'var(--opp)';

/* ---------- vue de côté ---------- */
function side(items, top){
  top = top ?? 12;
  let g = `<rect x="0" y="${GY}" width="300" height="10" fill="var(--ground)"/>`;
  items.forEach(it => {
    if (it.t === 'zone') g += `<rect x="${it.x}" y="${GY - 60}" width="${it.w}" height="60" fill="var(--zone)"/>`;
    if (it.t === 'high') g += `<rect x="${it.x}" y="${GY - 60}" width="${it.w}" height="60" fill="var(--high)"/>`;
    if (it.t === 'block'){ const h = it.h * BLK, y0 = GY - h - (it.base || 0) * BLK;
      for (let i = 0; i < it.h; i++) g += `<rect x="${it.x}" y="${y0 + i * BLK}" width="${it.w}" height="${BLK}" fill="var(--terrain)" stroke="var(--surface)" stroke-width="1"/>`;
      if (it.lbl !== false) for (let i = 0; i < it.h; i++) g += `<text x="${it.x + it.w / 2}" y="${GY - (it.base || 0) * BLK - i * BLK - 5}" text-anchor="middle" font-family="var(--f-mono)" font-size="11" font-weight="700" fill="var(--terrain-ink)">${(it.base || 0) + i + 1}</text>`;
      if (it.access) g += `<path d="M${it.access} ${GY} l0 -${BLK * (it.h + (it.base||0))}" stroke="var(--hint)" stroke-width="3" stroke-dasharray="3 3"/><text x="${it.access + 4}" y="${GY + 8}" font-size="8" fill="var(--ink)" font-family="var(--f-mono)">ACCESS POINT</text>`; }
    if (it.t === 'mini'){ const by = GY - (it.lv || 0) * BLK, h = it.sz * BLK - 2, w = it.w || 22;
      if (it.fly){ g += `<line x1="${it.x}" y1="${by}" x2="${it.x}" y2="${by - 26}" stroke="var(--muted)" stroke-width="2"/><rect x="${it.x - w / 2 - 2}" y="${by - 2}" width="${w + 4}" height="3" fill="var(--muted)"/>`; }
      const top = it.fly ? by - 26 - h : by - h;
      g += `<rect x="${it.x - w / 2}" y="${top}" width="${w}" height="${h}" rx="6" fill="${col(it.s)}"/>`;
      if (!it.fly) g += `<rect x="${it.x - w / 2 - 3}" y="${by - 3}" width="${w + 6}" height="3" fill="var(--ink)"/>`;
      g += `<text x="${it.x}" y="${top + h / 2 + 4}" text-anchor="middle" font-family="var(--f-mono)" font-size="10" font-weight="700" fill="var(--surface)">${it.fly ? 'vol' : it.sz}</text>`; }
    if (it.t === 'line') g += `<line x1="${it.x1}" y1="${it.y}" x2="${it.x2}" y2="${it.y2 ?? it.y}" stroke="${it.ok ? 'var(--ok)' : 'var(--bad)'}" stroke-width="3" ${it.ok ? '' : 'stroke-dasharray="7 5"'}/>`;
    if (it.t === 'dim') g += dim(it.x1, it.x2, it.y, it.txt);
    if (it.t === 'smk') g += `<rect x="${it.x - 10}" y="${GY - 4}" width="20" height="4" fill="var(--ink)"/><text x="${it.x}" y="${GY - 8}" text-anchor="middle" font-size="9" fill="var(--muted)" font-family="var(--f-body)">marqueur</text>`;
    if (it.t === 'txt') g += `<text x="${it.x}" y="${it.y}" text-anchor="${it.a || 'middle'}" font-size="10" fill="var(--muted)" font-family="var(--f-body)">${esc(it.s)}</text>`;
  });
  return `<svg class="d" viewBox="50 ${top} 240 ${104 - top}" role="img" aria-label="Vue de côté">${g}</svg>`;
}
/* ---------- vue de dessus ---------- */
function topv(items, H, dy){
  H = H || 76;
  const bg = `<rect x="50" y="0" width="240" height="${H}" fill="var(--sunk)" stroke="var(--line)"/>`;
  let g = '';
  items.forEach(it => {
    if (it.t === 'er') g += `<circle cx="${it.x}" cy="${it.y}" r="${it.r + IN}" fill="var(--zone)" stroke="var(--zone-line)" stroke-dasharray="4 3"/>`;
    if (it.t === 'high') g += `<rect x="${it.x}" y="0" width="${it.w}" height="76" fill="var(--high)"/>`;
    if (it.t === 'rect') g += `<rect x="${it.x}" y="${it.y}" width="${it.w}" height="${it.h}" fill="var(--terrain)"/>` + (it.lbl ? `<text x="${it.x + it.w / 2}" y="${it.y + it.h / 2 + 4}" text-anchor="middle" font-family="var(--f-mono)" font-size="10" font-weight="700" fill="var(--terrain-ink)">${it.lbl}</text>` : '');
    if (it.t === 'access') g += `<rect x="${it.x}" y="${it.y}" width="${it.w}" height="${it.h}" fill="none" stroke="var(--hint)" stroke-width="2.5" stroke-dasharray="4 3"/>`;
    if (it.t === 'base') g += `<circle cx="${it.x}" cy="${it.y}" r="${it.r}" fill="${col(it.s)}" stroke="var(--ink)" stroke-width="2.5"/>` + (it.lbl ? `<text x="${it.x}" y="${it.y + 4}" text-anchor="middle" font-family="var(--f-mono)" font-size="10" font-weight="700" fill="var(--surface)">${it.lbl}</text>` : '');
    if (it.t === 'line') g += `<line x1="${it.x1}" y1="${it.y1}" x2="${it.x2}" y2="${it.y2}" stroke="${it.ok ? 'var(--ok)' : 'var(--bad)'}" stroke-width="3" ${it.ok ? '' : 'stroke-dasharray="7 5"'}/>`;
    if (it.t === 'dim') g += dim(it.x1, it.x2, it.y, it.txt);
    if (it.t === 'ghost') g += `<circle cx="${it.x}" cy="${it.y}" r="${it.r}" fill="none" stroke="${col(it.s)}" stroke-width="2" stroke-dasharray="3 3"/>`;
    if (it.t === 'reach') g += `<circle cx="${it.x}" cy="${it.y}" r="${it.r}" fill="none" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="2 4"/>`;
    if (it.t === 'path'){ const pts = it.pts.map(p => p.join(',')).join(' '), c = it.ok === undefined ? 'var(--muted)' : it.ok ? 'var(--ok)' : 'var(--bad)';
      g += `<polyline points="${pts}" fill="none" stroke="${c}" stroke-width="2.5" ${it.ok === false ? 'stroke-dasharray="6 4"' : ''} marker-end="url(#arw-${it.ok === undefined ? 'n' : it.ok ? 'ok' : 'ko'})"/>`; }
    if (it.t === 'ring') g += `<circle cx="${it.x}" cy="${it.y}" r="${R + 4}" fill="none" stroke="${it.ok ? 'var(--ok)' : 'var(--bad)'}" stroke-width="2.5" ${it.ok ? '' : 'stroke-dasharray="4 3"'}/>`;
    if (it.t === 'die') g += `<rect x="${it.x - 7}" y="${it.y - 7}" width="14" height="14" rx="3" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5"/><text x="${it.x}" y="${it.y + 4}" text-anchor="middle" font-family="var(--f-mono)" font-size="10" font-weight="700" fill="var(--ink)">${it.n}</text>`;
    if (it.t === 'bt') g += `<circle cx="${it.x}" cy="${it.y}" r="${it.r || 30}" fill="var(--tpl)" fill-opacity=".22" stroke="var(--tpl)" stroke-width="2"/><circle cx="${it.x}" cy="${it.y}" r="2" fill="var(--tpl)"/>`;
    if (it.t === 'ft'){ const {x, y, L, w0, w1} = it; g += `<path d="M${x} ${y - w0} L${x + L} ${y - w1} A${w1} ${w1} 0 0 1 ${x + L} ${y + w1} L${x} ${y + w0} Z" fill="var(--tpl)" fill-opacity=".22" stroke="var(--tpl)" stroke-width="2"/>`; }
    if (it.t === 'sring') g += `<circle cx="${it.x}" cy="${it.y}" r="${R + 4}" fill="none" stroke="var(--tpl)" stroke-width="2.5" stroke-dasharray="5 2"/>`;
    if (it.t === 'cz') g += `<circle cx="${it.x}" cy="${it.y}" r="${R + 3 * IN}" fill="var(--high)" fill-opacity=".7" stroke="var(--hint)" stroke-width="1.5" stroke-dasharray="5 3"/>`;
    if (it.t === 'mk') g += (it.o ? `<circle cx="${it.x}" cy="${it.y}" r="${R + 4}" fill="none" stroke="${col(it.o)}" stroke-width="4"/>` : '') + `<circle cx="${it.x}" cy="${it.y}" r="${R}" fill="var(--ink)"/><path d="M${it.x} ${it.y - 6} L${it.x + 6} ${it.y} L${it.x} ${it.y + 6} L${it.x - 6} ${it.y} Z" fill="var(--surface)"/>`;
    if (it.t === 'zoi') g += `<rect x="${it.x}" y="${it.y}" width="${it.w}" height="${it.h}" fill="var(--opp)" fill-opacity=".13" stroke="var(--opp)" stroke-width="1.5" stroke-dasharray="5 3"/>`;
    if (it.t === 'edge') g += `<line x1="${it.x1}" y1="${it.y1}" x2="${it.x2}" y2="${it.y2}" stroke="${col(it.s)}" stroke-width="5"/>`;
    if (it.t === 'lmk') g += `<path d="M${it.x + it.dx * 14} ${it.y} L${it.x} ${it.y} L${it.x} ${it.y + 14}" fill="none" stroke="var(--ink)" stroke-width="4"/>`;
    if (it.t === 'grass') g += `<rect x="${it.x}" y="${it.y}" width="${it.w}" height="${it.h}" rx="6" fill="var(--hint)" fill-opacity=".35" stroke="var(--hint)" stroke-width="1.5"/><text x="${it.x + it.w / 2}" y="${it.y + 12}" text-anchor="middle" font-family="var(--f-mono)" font-size="9" font-weight="700" fill="var(--ink)">GRASS 2</text>`;
    if (it.t === 'cross') g += `<path d="M${it.x-6} ${it.y-6} l12 12 M${it.x+6} ${it.y-6} l-12 12" stroke="var(--bad)" stroke-width="3"/>`;
    if (it.t === 'lbl') g += `<text x="${it.x}" y="${it.y}" text-anchor="${it.a || 'middle'}" font-family="${it.mono ? 'var(--f-mono)' : 'var(--f-body)'}" font-size="${it.fs || 10}" font-weight="${it.b ? 700 : 500}" fill="${it.c || 'var(--ink)'}">${esc(it.s)}</text>`;
    if (it.t === 'tag') g += `<text x="${it.x}" y="${it.y + 3}" text-anchor="middle" font-family="var(--f-mono)" font-size="9" font-weight="700" fill="var(--surface)">${esc(it.s)}</text>`;
  });
  const defs = `<defs>${['ok','ko','n'].map(k => `<marker id="arw-${k}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="${k === 'ok' ? 'var(--ok)' : k === 'ko' ? 'var(--bad)' : 'var(--muted)'}"/></marker>`).join('')}</defs>`;
  return `<svg class="d" viewBox="50 0 240 ${H}" role="img" aria-label="Vue de dessus">${defs}${bg}<g transform="translate(0,${dy || 0})">${g}</g></svg>`;
}
function dim(x1, x2, y, txt){
  return `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="var(--muted)" stroke-width="1"/><line x1="${x1}" y1="${y - 4}" x2="${x1}" y2="${y + 4}" stroke="var(--muted)"/><line x1="${x2}" y1="${y - 4}" x2="${x2}" y2="${y + 4}" stroke="var(--muted)"/>
    <text x="${(x1 + x2) / 2}" y="${y - 7}" text-anchor="middle" font-family="var(--f-mono)" font-size="10" fill="var(--muted)">${txt}</text>`;
}

/* ---------- les cas ---------- */
const R = 10; // rayon d’un socle de 32 mm en vue de dessus
const ENG_CASES = [
 {k:'A', t:'Ground contre Ground à 1" ou moins', r:'7.2', ok:true,
  s:[{t:'zone',x:116,w:IN},{t:'mini',x:105,sz:1,s:'me'},{t:'mini',x:150,sz:1,s:'opp'},{t:'line',x1:117,x2:139,y:GY-9,ok:true},{t:'dim',x1:116,x2:132,y:28,txt:'1"'}],
  p:[{t:'er',x:105,y:38,r:R},{t:'base',x:105,y:38,r:R,s:'me'},{t:'base',x:140,y:38,r:R,s:'opp'},{t:'line',x1:115,y1:38,x2:130,y2:38,ok:true}],
  n:'Les socles sont à 1" ou moins l’un de l’autre : les deux figurines sont engagées.'},
 {k:'B', t:'Plus de 1" entre les socles', r:'7.2', ok:false,
  s:[{t:'zone',x:116,w:IN},{t:'mini',x:105,sz:1,s:'me'},{t:'mini',x:190,sz:1,s:'opp'},{t:'line',x1:117,x2:179,y:GY-9,ok:false},{t:'dim',x1:116,x2:132,y:28,txt:'1"'}],
  p:[{t:'er',x:105,y:38,r:R},{t:'base',x:105,y:38,r:R,s:'me'},{t:'base',x:185,y:38,r:R,s:'opp'},{t:'line',x1:115,y1:38,x2:175,y2:38,ok:false}],
  n:'Le socle ennemi est hors de l’Engagement Range : pas d’engagement.'},
 {k:'C', t:'Une figurine suffit pour toute l’unité', r:'7.2 · ENGAGED', ok:true,
  s:[{t:'zone',x:166,w:IN},{t:'mini',x:70,sz:1,s:'me'},{t:'mini',x:110,sz:1,s:'me'},{t:'mini',x:155,sz:1,s:'me'},{t:'mini',x:198,sz:1,s:'opp'},{t:'mini',x:236,sz:1,s:'opp'},{t:'line',x1:167,x2:187,y:GY-9,ok:true}],
  p:[{t:'er',x:155,y:38,r:R},{t:'base',x:75,y:30,r:R,s:'me'},{t:'base',x:110,y:50,r:R,s:'me'},{t:'base',x:155,y:38,r:R,s:'me'},{t:'base',x:190,y:38,r:R,s:'opp'},{t:'base',x:230,y:26,r:R,s:'opp'},{t:'line',x1:165,y1:38,x2:180,y2:38,ok:true}],
  n:'Dès qu’une figurine est engagée, ses deux unités entières sont engagées, même les figurines éloignées.'},
 {k:'D', t:'Une unité volante n’est jamais engagée', r:'7.2.1 · FLYING', ok:false,
  s:[{t:'zone',x:116,w:IN},{t:'mini',x:105,sz:1,s:'me'},{t:'mini',x:140,sz:2,s:'fly',fly:true},{t:'line',x1:117,x2:129,y:GY-9,ok:false}],
  p:[{t:'er',x:105,y:38,r:R},{t:'base',x:105,y:38,r:R,s:'me'},{t:'base',x:132,y:38,r:R,s:'fly',lbl:'vol'},{t:'line',x1:115,y1:38,x2:122,y2:38,ok:false}],
  n:'Ground n’engage que Ground. Un volant peut même finir au contact sans aucun effet sur l’une ou l’autre unité.'},
 {k:'E', t:'Décor de taille 0 ou 1 entre les deux', r:'7.2.1', ok:true,
  s:[{t:'zone',x:116,w:IN},{t:'block',x:121,w:8,h:1},{t:'mini',x:105,sz:1,s:'me'},{t:'mini',x:145,sz:1,s:'opp'},{t:'line',x1:117,x2:134,y:GY-26,ok:true}],
  p:[{t:'er',x:105,y:38,r:R},{t:'rect',x:121,y:8,w:8,h:60},{t:'base',x:105,y:38,r:R,s:'me'},{t:'base',x:142,y:38,r:R,s:'opp'},{t:'line',x1:115,y1:38,x2:132,y2:38,ok:true}],

   ['Toutes les visibles détruites → le reste est perdu. Pas assez pour tuer → <b>marqueur de dégâts</b>.','<b>Engagée</b> : on ignore la visibilité ; ordre strict 1 → 2 → 3.'],
   ['On ne retire pas une figurine qui romprait l’engagement avec une unité ennemie, s’il existe une autre perte valable.','Les pertes ne provoquent jamais de test de cohésion.']]]},
 {id:'gabarits', name:'Gabarits BT et FT', ok:true, ref:'Livre de règles · 8.7.6 · Quick Reference 12.8', yes:'', no:'',
  lead:'Les armes à gabarit (Blast Template, BT, et Flamer Template, FT) touchent toutes les figurines dont le socle est couvert. Les gabarits sont dessinés schématiquement : utilise toujours le gabarit physique. Toutes les vues sont de dessus.',
  legend:TPL_LEGEND, cases:TPL_CASES,
  cons:['La séquence complète',[
   ['<b>1. Aligner</b> : BT au maximum sur le socle visé ; FT collé au socle du tireur, pointé vers la cible.','<b>2. Déclarer</b> la cible principale ; toute autre figurine couverte, de même niveau et même Combat Tag, part en Spillover.'],
   ['<b>3. Affectées</b> : socle couvert (même en partie), même niveau que le Target Point, ligne non bloquée par un décor de taille 2+, type de cible valide.','<b>4. Dés</b> : Main = figurines affectées + modificateurs de RoA ; Spillover = figurines affectées de l’unité, sans modificateur.'],
   ['<b>5. Résoudre</b> : jet pour toucher normal ; pas de dé de Surge, Surge = figurines affectées de la Main target si le tag colle.','Le Spillover n’a jamais de Surge, et chaque unité touchée est un lot séparé.']]]},
 {id:'marqueurs', name:'Contrôle des marqueurs', ok:true, ref:'Livre de règles · 8.9.1 · glossaire', yes:'', no:'',
  lead:'Pendant la phase de Score, on regarde qui contrôle chaque marqueur de mission. On compte la Supply actuelle des unités qui le contestent, pas le nombre de figurines. Toutes les vues sont de dessus, sauf mention.',
  legend:MKR_LEGEND, cases:MKR_CASES,
  cons:['En résumé',[
   ['<b>Pour contester</b>, une unité doit être sur la table (pas en Réserves) et en cohésion.','Il lui faut aussi au moins une figurine à 3" du marqueur, qui le voit (marqueur de taille 0) et au même niveau que lui.'],
   ['<b>Calcul</b> : chaque joueur additionne la Supply actuelle de ses unités qui contestent ; le plus haut total contrôle.','<b>Égalité</b> : contesté, aucun changement. Une unité à Supply 0 contrôle quand même si personne ne conteste.'],
   ['<b>Contrôle collant</b> : on pose un pion de faction ; le marqueur reste à toi jusqu’à ce que l’adversaire le reprenne.','Volants et unités BURROWED ne contestent et ne contrôlent jamais.']]]},
 {id:'deploiement', name:'Déploiement et Zone of Influence', ok:true, ref:'Livre de règles · 8.3 · 8.5.5 · 5.6 · glossaire', yes:'', no:'',
  lead:'Aucune unité ne commence sur la table : tout part des Réserves et entre pendant la phase de Mouvement par l’action Deploy, si la Supply le permet. Toutes les vues sont de dessus ; la largeur de table n’est pas à l’échelle.',
  legend:DEP_LEGEND, cases:DEP_CASES,
  cons:['L’action Deploy',[
   ['<b>1. Supply</b> : la Supply actuelle de l’unité doit tenir dans la Supply disponible (Pool − unités sur la table).','<b>2. Entrée</b> : modèle de tête contre ton Entry Edge, hors table, puis Move jusqu’à sa Speed.'],
   ['<b>3. Cohésion</b> : le reste de l’unité est placé en cohésion ; sinon, pas de déploiement à cet endroit.','<b>4. Zone of Influence</b> : l’unité ne peut pas finir son activation dans celle de l’adversaire (6" depuis son Entry Edge).'],
   ['La restriction vaut pour toute arrivée (bord, transport, SUMMON), mais jamais pour les unités déjà sur la table.','Round 1 : Pool = Supply de départ de la Mission Card ; puis + Escalation chaque round ; dernier round : illimité.']]]},
 {id:'disengage', name:'Disengage et Tactical Mass', ok:true, ref:'Livre de règles · 8.5.4 · glossaire TACTICAL MASS, BURROWED', yes:'', no:'',
  lead:'En phase de Mouvement, une unité engagée ne peut pas faire de Move normal : elle peut se désengager (Disengage) ou rester (Hold). Se désengager coûte cher, sauf si l’unité a la Tactical Mass. Toutes les vues sont de dessus.',
  legend:DIS_LEGEND, cases:DIS_CASES,
  cons:['En résumé',[
   ['<b>1. Move normal</b> (règles de Move standard).','<b>2.</b> Chaque figurine qui ne finit pas <b>strictement</b> hors de l’Engagement Range de tous les ennemis est détruite.'],
   ['<b>3.</b> Si c’est le modèle de tête : échec, l’unité ne bouge pas, il est retiré, fin de l’activation.','<b>Pénalité</b> : ni Ranged Attack ni Charge à la phase d’Assaut suivante.'],
   ['<b>Tactical Mass</b> : Supply actuelle &gt; Supply cumulée de tous les ennemis engagés, au moment de la déclaration → pas de pénalité.','Une unité BURROWED compte 0 Supply pour ces tests.']]]},
 {id:'mouvement', name:'Mouvement', ok:true, ref:'Livre de règles · 8.5.3 · 4.6 · glossaire GRASS, ACCESS POINT', yes:'', no:'',
  lead:'Ces règles servent pour tout déplacement « normal » : Move, Deploy, Run, et en partie Charge, Disengage et Close Ranks. On bouge d’abord le modèle de tête, puis on pose le reste de l’unité. Vues de dessus, sauf mention.',
  legend:MOV_LEGEND, cases:MOV_CASES,
  cons:['Le modèle de tête ne peut pas…',[

   ['…passer un passage trop étroit (1" pour Size ≤ 2, 3" pour Size 3+).','…changer de niveau sans ACCESS POINT.'],
   ['…finir sur un décor (son emprise), sur un autre socle, ou en partie hors de la table.','…finir à 1" d’une unité ennemie Ground (sauf Charge).']]]},
 {id:'ldv', name:'Ligne de vue et couvert', ok:true, ref:'Livre de règles · 7.1 à 7.1.4', yes:'', no:'',
  lead:'La ligne de vue se trace vue de dessus (2D), mais on compare les tailles : celle du tireur, de la cible et du décor traversé. La vue de côté sert seulement à visualiser les tailles.',
  legend:LOS_LEGEND, cases:LOS_CASES,
  cons:['La méthode',[
   ['<b>1.</b> Tracer une ligne d’un socle à l’autre, vue de dessus. Aucun décor de taille 1+ traversé → visible.','<b>2. Full Cover</b> : un décor ≥ taille effective du tireur ET de la cible bloque.'],
   ['<b>3. Direct Cover</b> : un modèle à 1" du décor traversé, avec un décor ≥ sa taille → bloqué.','<b>4. Close Quarters</b> : à 1" du même décor et à 3" l’un de l’autre → ligne de vue normale.'],
   ['<b>Taille effective</b> = taille + taille du décor sur lequel on se tient. <b>Dead Zone</b> : HIGH GROUND contre modèle au pied du même décor.','<b>HIGH GROUND Cover</b> : une unité entièrement sur HIGH GROUND a un jet d’Evade contre les tirs venant d’en bas (jamais pour les volants).']]]}
];
let cur = (() => { try { return localStorage.getItem('planche') || 'ldv'; } catch(e){ return 'ldv'; } })();
function renderSheets(){
  const sh = SHEETS.find(x => x.id === cur) || SHEETS[0];
  document.getElementById('nav').innerHTML = SHEETS.map((x, i) => `<button data-sh="${x.id}" class="${x.id === sh.id ? 'on' : ''}">${i + 1}. ${esc(x.name)}<span class="st ${x.ok ? '' : 'draft'}">${x.ok ? '✓ validée' : 'brouillon'}</span></button>`).join('');
  document.getElementById('sheets').innerHTML = `<section class="sheet" id="${sh.id}">
    <header><h2>${esc(sh.name)}</h2><span class="ref">${esc(sh.ref)}</span></header>
    <p class="lead">${esc(sh.lead)}</p><div class="legend">${sh.legend}</div>
    <div class="grid">${sh.cases.map(c => `<article class="case">
      <div class="hd"><span class="lt">${c.k}</span><div><h3>${esc(c.t)}</h3><span class="rule">${esc(c.r)}</span></div></div>
      <span class="verdict ${c.ok ? 'ok' : 'bad'}">${c.ok ? '✓' : '✕'} ${esc(c.v || (c.ok ? sh.yes : sh.no))}</span>
      ${c.s ? `<span class="vw">Vue de côté</span>${side(c.s, c.st)}` : ''}
      <span class="vw">Vue de dessus</span>${topv(c.p, c.H, c.dy)}
      <p class="note">${esc(c.n)}</p></article>`).join('')}</div>
    <div class="cons"><h3>${esc(sh.cons[0])}</h3>${sh.cons[1].map(col => `<ul>${col.map(li => `<li>${li}</li>`).join('')}</ul>`).join('')}</div></section>
    <p class="status">Planche ${SHEETS.indexOf(sh) + 1} — ${sh.ok ? 'validée' : 'brouillon à valider'}.</p>`;
}
document.addEventListener('click', e => { const b = e.target.closest('[data-sh]'); if (!b) return; cur = b.dataset.sh; try { localStorage.setItem('planche', cur); } catch(e){} renderSheets(); window.scrollTo({top:0}); });
renderSheets();
</script>
