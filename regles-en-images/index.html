une figurine si cela la ferait passer dans une tranche de supply supérieure.\n• Place chaque figurine ramenée au contact socle à socle d’une figurine existante de l’unité. Elle ne peut pas être placée dans l’Engagement Range d’une unité ennemie.\n• Si une figurine ne peut pas être placée légalement, elle ne revient pas."],["SHIELDED","If a Shield value is present on a Unit Card, add it to the Hit Points (HP) of the first model. The Unit is Shielded. The Unit loses its Shielded Status when the Total Damage assigned to it exceeds its Shield value or when the first model in the Unit is removed. The Shielded Status is referenced by other abilities. Losing Shielded Status does not remove any remaining Hit Points, it only ends effects that require the Unit to be Shielded. Shielded Status cannot be restored by HEAL.","Si la carte d’unité indique une valeur de Shield, ajoute-la aux PV de la première figurine. L’unité est alors Shielded. Elle perd ce statut quand le total de dégâts qui lui est attribué dépasse sa valeur de Shield, ou quand sa première figurine est retirée. D’autres capacités font référence au statut Shielded. Le perdre ne retire pas les PV restants : cela met seulement fin aux effets qui demandent ce statut. HEAL ne rend pas le statut Shielded."],["SIDEARM","When this Unit performs a Ranged Attack or Close Combat Attack, models equipped with this weapon may use it, ignoring the normal restriction of one weapon per model (Part 8.7.3). If a model is equipped with multiple SIDEARM weapons, it may use all of them in the same activation. Attacks made with each SIDEARM must be resolved in separate Batches. Because they are separate Batches, SIDEARM attacks may target a different Enemy Unit than the Unit’s other weapons, subject to all standard target eligibility requirements.","Quand cette unité fait une Ranged Attack ou une Close Combat Attack, les figurines équipées de cette arme peuvent s’en servir en plus, en ignorant la limite d’une arme par figurine (partie 8.7.3). Une figurine qui a plusieurs armes SIDEARM peut toutes les utiliser dans la même activation. Chaque SIDEARM se résout dans un batch séparé ; ses attaques peuvent donc viser une autre unité ennemie que les autres armes de l’unité, en respectant les conditions normales de ciblage."],["SIEGE MODE","While a Unit has the SIEGE MODE Status, apply the following rules:\n• This Unit cannot perform the Move, Disengage, Run, Charge or Close Ranks actions.\n• Weapons profile with Siege Mode Status can only be used while this unit has SIEGE MODE Status.\n• While this unit has Siege Mode Status any other weapons can’t be used.\n• When this Unit is returned to Reserves, it loses the SIEGE MODE Status.","Tant qu’une unité a le statut SIEGE MODE, applique ces règles :\n• Elle ne peut pas faire les actions Move, Disengage, Run, Charge ni Close Ranks.\n• Les profils d’arme marqués Siege Mode ne s’utilisent que tant qu’elle a ce statut.\n• Tant qu’elle a ce statut, ses autres armes ne peuvent pas être utilisées.\n• Quand elle retourne en réserve, elle perd le statut SIEGE MODE."],["SPECIAL ABILITY","A Special Ability is any named ability printed on a Unit Card, Tactical Card, or Faction Card. Every Special Ability falls into one of three categories: Active Ability, Passive Ability, or Reaction Ability (Part 2.7).\n• Active Abilities require the Unit to be Activated and are triggered immediately before or after an action. Each named Active Ability may be used once per Round per Unit unless it has the REPEATABLE keyword.\n• Passive Abilities are always in effect as long as the Unit is on the battlefield.\n• Reaction Abilities fire in response to a specific trigger. Each player may resolve only one Reaction per Activation, and each named Reaction Ability may be used only once per Round per Unit. All three types are inactive while the Unit is in Reserves unless the ability explicitly states otherwise. A Unit cannot be affected by multiple instances of the same-named Special Ability simultaneously.","Une capacité spéciale est toute capacité nommée imprimée sur une carte d’unité, une Tactical Card ou une Faction Card. Elle appartient à l’une de trois catégories : Active, Passive ou Reaction (partie 2.7).\n• Les capacités Active demandent que l’unité soit activée et se déclenchent juste avant ou juste après une action. Chacune s’utilise une fois par round et par unité, sauf REPEATABLE.\n• Les capacités Passive sont toujours actives tant que l’unité est sur le champ de bataille.\n• Les capacités Reaction se déclenchent en réponse à un événement précis. Chaque joueur ne résout qu’une réaction par activation, et chaque réaction nommée ne sert qu’une fois par round et par unité.\nLes trois types sont inactifs tant que l’unité est en réserve, sauf mention contraire. Une unité ne peut pas subir en même temps plusieurs exemplaires d’une même capacité nommée."],["SPECIALIST","A Unit may include only one model equipped with this weapon. Multiple upgrades configuring more than one instance of this weapon are not permitted (Part 9.1.7).","Une unité ne peut avoir qu’une seule figurine équipée de cette arme. Les améliorations qui donneraient plus d’un exemplaire de cette arme sont interdites (partie 9.1.7)."],["SPILLOVER","Additional hits generated by a Template Weapon that strike models outside the Primary target Unit. When a Blast Template (BT) or Flamer Template (FT) covers models belonging to Units other than the Primary target, those models are resolved as Spillover. Each affected Unit is resolved as a separate Batch. Spillover Batches do not apply Rate of Attack modifiers and do not generate Surge. Spillover may affect both Friendly and Enemy Units. See Part 8.7.6 for the full Template Weapon procedure.","Touches supplémentaires générées par une arme à gabarit sur des figurines hors de l’unité ciblée principale. Quand un Blast Template (BT) ou un Flamer Template (FT) recouvre des figurines d’autres unités que la cible principale, elles sont résolues en Spillover. Chaque unité touchée est un batch séparé. Les batchs de Spillover n’appliquent pas les modificateurs de RoA et ne génèrent pas de Surge. Le Spillover peut toucher des unités amies comme ennemies. Voir partie 8.7.6 pour la procédure complète."],["STATIONARY","At the Start of the Round, all Units gain this Status. A Unit immediately loses this Status if any model in this Unit moves, is moved, or is PLACED for any reason.","Au début du round, toutes les unités gagnent ce statut. Une unité le perd immédiatement si l’une de ses figurines se déplace, est déplacée ou est replacée (PLACE) pour une raison quelconque."],["STATUS","A category of keyword representing a temporary or persistent operational mode, condition, or statistic modifier affecting a Unit (e.g. BURROWED, SIEGE MODE). Unless stated otherwise, Statuses aren’t removed during the Scoring and Cleanup Phase. They stay on the Unit until they are removed by other means. A Unit’s active Status is visually tracked using Status Markers set next to the Unit:\n• Modes: Use Plastic Markers to track operational shifts (e.g. SIEGE MODE, BURROWED). Those Status Markers have STAY IN PLAY.\n• Other Statuses: Use Markers to track other effects affecting the Unit. Positive effects are tracked with Buff Markers (Blue), and negative effects are tracked with Debuff Markers (Red). Those Status Markers have STAY IN PLAY.","Catégorie de mot-clé qui représente un mode, un état ou un modificateur de caractéristique, temporaire ou durable, qui affecte une unité (ex. BURROWED, SIEGE MODE). Sauf mention contraire, les statuts ne sont pas retirés pendant la phase de score et de nettoyage : ils restent sur l’unité jusqu’à ce qu’autre chose les retire. On les suit avec des marqueurs de statut posés à côté de l’unité :\n• Modes : marqueurs en plastique pour les changements de mode (ex. SIEGE MODE, BURROWED). Ces marqueurs ont STAY IN PLAY.\n• Autres statuts : marqueurs pour les autres effets. Les effets positifs se suivent avec des marqueurs Buff (bleus), les négatifs avec des marqueurs Debuff (rouges). Ces marqueurs ont STAY IN PLAY."],["STAY IN PLAY","This Token, Marker or Ability Effect persists through Cleanup & Refresh (overrides Part 8.9.5). It remains until a specific condition removes it (e.g. destroyed or duration expires).","Ce jeton, marqueur ou effet de capacité reste en place au nettoyage (prime sur la partie 8.9.5). Il reste jusqu’à ce qu’une condition précise le retire (ex. détruit ou durée écoulée)."],["SUMMON (Unit Name)","Set the Leading Model of the named Unit in Base-to-Base contact with the Parent Unit. Set remaining models In Coherency. Models cannot be set Within the Engagement Range of any Enemy Unit. Set an Activation Marker next to the summoned Unit – it cannot be Activated during the Phase in which it was summoned. In subsequent Phases, this Unit must be Activated immediately after its Parent Unit’s activation ends, before the opponent’s next activation. The Summoned Unit cannot be set Within the opponent’s Zone of Influence. The player must have sufficient Available Supply. If the Unit’s Current Supply Value would cause Total Current Supply to exceed the Supply Pool, it cannot be Summoned. If the Parent is not present on the battlefield, this Unit can be Activated normally.","Place le modèle de tête de l’unité nommée au contact socle à socle de l’unité mère, puis les autres figurines en cohésion. Aucune figurine ne peut être placée dans l’Engagement Range d’une unité ennemie. Place un marqueur d’activation à côté de l’unité invoquée : elle ne peut pas être activée pendant la phase où elle est invoquée. Dans les phases suivantes, elle doit être activée juste après la fin de l’activation de son unité mère, avant la prochaine activation adverse. L’unité invoquée ne peut pas être placée dans la Zone of Influence adverse. Il faut assez de supply disponible : si son supply actuel faisait dépasser le Supply Pool, elle ne peut pas être invoquée. Si l’unité mère n’est pas sur le champ de bataille, l’unité invoquée s’active normalement."],["SUPPLY VALUE","The Supply Value of a Unit is the value shown on the Unit Card’s Supply Profile corresponding to the Unit’s current model count. A Unit’s starting Supply Value is determined during Army Building by the Composition Option selected (Part 9.1.6) and defines how many Army Slots the Unit occupies. Supply Value is a dynamic characteristic – as casualties reduce the model count into a lower bracket on the Supply Profile, the Supply Value decreases. Update immediately when a casualty moves the Unit into a lower bracket. Supply is used for Deployment, Mission Marker Control, Tactical Mass, and scoring.","La valeur de Supply d’une unité est celle indiquée sur le profil de supply de sa carte pour son nombre actuel de figurines. Sa valeur de départ est fixée à la construction d’armée par l’option de composition choisie (partie 9.1.6) et détermine combien d’Army Slots elle occupe. C’est une caractéristique dynamique : quand les pertes font passer l’effectif dans une tranche inférieure, la valeur baisse, immédiatement. Le supply sert au déploiement, au contrôle des marqueurs, à la Tactical Mass et au score."],["SUPPORTING RANK","A model is in the Supporting Rank if it is in Base-to-Base contact with a Friendly model from the same Unit that is in the Fighting Rank, but is not itself Within the Engagement Range of an Enemy model. Models in the Supporting Rank may strike with their Combat Phase weapons as though they were in the fight. See Part 8.8.1, Step 2.","Une figurine est dans le Supporting Rank si elle est au contact socle à socle d’une figurine amie de la même unité qui est dans le Fighting Rank, sans être elle-même dans l’Engagement Range d’une figurine ennemie. Les figurines du Supporting Rank peuvent frapper avec leurs armes de phase de Combat comme si elles étaient au contact. Voir partie 8.8.1, étape 2."],["TACTICAL MASS","A Unit has Tactical Mass when its Current Supply Value exceeds the Combined Current Supply Value of all Enemy Units it is Engaged with. A Unit with Tactical Mass ignores the Disengage penalty (Part 8.5.4): it may Ranged Attack and Charge normally in the following Assault Phase after Disengaging.","Une unité a la Tactical Mass quand son supply actuel dépasse le supply actuel cumulé de toutes les unités ennemies avec lesquelles elle est engagée. Une unité qui a la Tactical Mass ignore la pénalité de Disengage (partie 8.5.4) : après s’être désengagée, elle peut faire une Ranged Attack ou une Charge normalement à la phase d’Assaut suivante."],["TOUGH (X)","When this Unit resolves an Armour Roll, change up to X failed results into successes. Treat them as meeting or exceeding the Armour characteristic – discard them without moving to the Damage Pool.","Quand cette unité fait un jet d’armure, change jusqu’à X échecs en réussites. Ils comptent comme ayant atteint la caractéristique Armour : défausse-les sans les mettre dans le pool de dégâts."],["UNENGAGED","A Ground Unit is Unengaged when none of its models is Within 1” of any Enemy Ground model, or when terrain restrictions (Part 7.2.1) prevent valid Engagement despite proximity. Flying Units are always Unengaged. An Unengaged Unit may perform a standard Move, Run, Ranged Attack, or Charge without restriction. Only Unengaged Units may be selected to perform a Move action (Part 8.5.2).","Une unité Ground est non engagée quand aucune de ses figurines n’est à 1\" d’une figurine Ground ennemie, ou quand le terrain (partie 7.2.1) empêche un engagement valide malgré la proximité. Les unités volantes sont toujours non engagées. Une unité non engagée peut faire Move, Run, Ranged Attack ou Charge sans restriction. Seules les unités non engagées peuvent faire une action Move (partie 8.5.2)."],["VISIBLE","A model is Visible to another model if a valid Line of Sight trace can be drawn between them (Part 7.1). If the trace does not pass through any Blocking Terrain, the target is Visible without further checks. If the trace passes through Blocking Terrain, apply the Cover rules (Part 7.1.1) – the target remains Visible unless Full Cover or Direct Cover blocks the Line of Sight. A model with the HIDDEN keyword is not Visible to any model more than 4” away, regardless of Line of Sight.","Une figurine est visible par une autre si on peut tracer entre elles une ligne de vue valide (partie 7.1). Si la ligne ne traverse aucun Blocking Terrain, la cible est visible sans autre vérification. Si elle en traverse, applique les règles de couvert (partie 7.1.1) : la cible reste visible sauf si un couvert total ou direct bloque la ligne de vue. Une figurine HIDDEN n’est visible par aucune figurine à plus de 4\", quelle que soit la ligne de vue."],["WHOLLY WITHIN","A model is Wholly Within a distance only if its entire base sits inside that range - no part of the base may extend beyond the edge. A Unit is Wholly Within a distance only if every model in the Unit satisfies this condition. Wholly Within is a stricter requirement than Within and is used for Coherency checks (Part 4.4), certain ability areas of effect, and Mission Marker eligibility. When a rule specifies Wholly Within, partial overlap is not sufficient.","Une figurine est entièrement à une distance seulement si tout son socle est dans cette zone : aucune partie du socle ne dépasse. Une unité est entièrement à une distance seulement si chacune de ses figurines l’est. C’est plus strict que « à » (Within) ; cela sert pour la cohésion (partie 4.4), certaines zones d’effet et l’éligibilité aux marqueurs. Quand une règle dit Wholly Within, un chevauchement partiel ne suffit pas."],["WITHIN","A model is Within a distance if any part of its base touches or crosses into that range. A Unit is Within a distance if at least one model in the Unit meets this condition. Within is a less restrictive requirement than Wholly Within. When a rule specifies Within without the word “Wholly,” partial overlap is sufficient.","Une figurine est à une distance si une partie de son socle touche ou entre dans cette zone. Une unité est à une distance si au moins une de ses figurines l’est. C’est moins strict que « entièrement à » (Wholly Within). Quand une règle dit Within sans « Wholly », un chevauchement partiel suffit."],["ZONE OF INFLUENCE","A restricted area of the battlefield extending 6” inward from a player’s Entry Edge, as defined by the Deployment Card. Where the Entry Edge does not run the full length of a table edge, the Zone of Influence is marked using Zone of Influence Markers set at the corners of the Entry Edge. Units arriving from Reserves cannot end their deployment Within the opponent’s Zone of Influence. This restriction applies to all forms of arrival - whether by standard deployment, transport, or SUMMON (Part 8.3.3). The Zone of Influence does not affect Units already on the battlefield. It does not restrict movement, block Line of Sight, or interact with any other rule once a Unit has completed its arrival.","Zone du champ de bataille qui s’étend à 6\" vers l’intérieur depuis l’Entry Edge d’un joueur, selon la Deployment Card. Si l’Entry Edge ne couvre pas tout le bord de table, la zone est délimitée par des marqueurs Zone of Influence posés aux coins de l’Entry Edge. Les unités qui arrivent de la réserve ne peuvent pas finir leur déploiement dans la Zone of Influence adverse, quel que soit leur mode d’arrivée : déploiement normal, transport ou SUMMON (partie 8.3.3). La Zone of Influence n’affecte pas les unités déjà sur le champ de bataille : elle ne limite pas le mouvement, ne bloque pas la ligne de vue et n’interagit avec aucune autre règle une fois l’arrivée terminée."]]</script>
<script>
const IN = 16;             // 1 pouce = 16 px
const GY = 92;             // niveau du sol (vue de côté)
const BLK = 18;            // hauteur d’un niveau de taille
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const col = s => s === 'me' ? 'var(--me)' : s === 'fly' ? 'var(--fly)' : 'var(--opp)';

/* ---------- vue de côté ---------- */
function side(items, top){
  top = top ?? 12;
  let g = `<rect x="0" y="${GY}" width="300" height="10" fill="var(--ground)"/>`;
  items.forEach(it => {
    if (it.t === 'zone') g += `<rect x="${it.x}" y="${GY - 60}" width="${it.w}" height="60" fill="var(--zone)"/>`;
    if (it.t === 'high') g += `<rect x="${it.x}" y="${GY - 60}" width="${it.w}" height="60" fill="var(--high)"/>`;
    if (it.t === 'block'){ const h = it.h * BLK, y0 = GY - h - (it.base || 0) * BLK;
      for (let i = 0; i < it.h; i++) g += `<rect x="${it.x}" y="${y0 + i * BLK}" width="${it.w}" height="${BLK}" fill="var(--terrain)" stroke="var(--surface)" stroke-width="1"/>`;
      if (it.lbl !== false) for (let i = 0; i < it.h; i++) g += `<text x="${it.x + it.w / 2}" y="${GY - (it.base || 0) * BLK - i * BLK - 5}" text-anchor="middle" font-family="var(--f-mono)" font-size="11" font-weight="700" fill="var(--terrain-ink)">${(it.base || 0) + i + 1}</text>`;
      if (it.access) g += `<path d="M${it.access} ${GY} l0 -${BLK * (it.h + (it.base||0))}" stroke="var(--hint)" stroke-width="3" stroke-dasharray="3 3"/><text x="${it.access + 4}" y="${GY + 8}" font-size="8" fill="var(--ink)" font-family="var(--f-mono)">ACCESS POINT</text>`; }
    if (it.t === 'mini'){ const by = GY - (it.lv || 0) * BLK, h = it.sz * BLK - 2, w = it.w || 22;
      if (it.fly){ g += `<line x1="${it.x}" y1="${by}" x2="${it.x}" y2="${by - 26}" stroke="var(--muted)" stroke-width="2"/><rect x="${it.x - w / 2 - 2}" y="${by - 2}" width="${w + 4}" height="3" fill="var(--muted)"/>`; }
      const top = it.fly ? by - 26 - h : by - h;
      g += `<rect x="${it.x - w / 2}" y="${top}" width="${w}" height="${h}" rx="6" fill="${col(it.s)}"/>`;
      if (!it.fly) g += `<rect x="${it.x - w / 2 - 3}" y="${by - 3}" width="${w + 6}" height="3" fill="var(--ink)"/>`;
      g += `<text x="${it.x}" y="${top + h / 2 + 4}" text-anchor="middle" font-family="var(--f-mono)" font-size="10" font-weight="700" fill="var(--surface)">${it.fly ? 'vol' : it.sz}</text>`; }
    if (it.t === 'line') g += `<line x1="${it.x1}" y1="${it.y}" x2="${it.x2}" y2="${it.y2 ?? it.y}" stroke="${it.ok ? 'var(--ok)' : 'var(--bad)'}" stroke-width="3" ${it.ok ? '' : 'stroke-dasharray="7 5"'}/>`;
    if (it.t === 'dim') g += dim(it.x1, it.x2, it.y, it.txt);
    if (it.t === 'smk') g += `<rect x="${it.x - 10}" y="${GY - 4}" width="20" height="4" fill="var(--ink)"/><text x="${it.x}" y="${GY - 8}" text-anchor="middle" font-size="9" fill="var(--muted)" font-family="var(--f-body)">marqueur</text>`;
    if (it.t === 'txt') g += `<text x="${it.x}" y="${it.y}" text-anchor="${it.a || 'middle'}" font-size="10" fill="var(--muted)" font-family="var(--f-body)">${esc(it.s)}</text>`;
  });
  return `<svg class="d" viewBox="50 ${top} 240 ${104 - top}" role="img" aria-label="Vue de côté">${g}</svg>`;
}
/* ---------- vue de dessus ---------- */
function topv(items, H, dy){
  H = H || 76;
  const bg = `<rect x="50" y="0" width="240" height="${H}" fill="var(--sunk)" stroke="var(--line)"/>`;
  let g = '';
  items.forEach(it => {
    if (it.t === 'er') g += `<circle cx="${it.x}" cy="${it.y}" r="${it.r + IN}" fill="var(--zone)" stroke="var(--zone-line)" stroke-dasharray="4 3"/>`;
    if (it.t === 'high') g += `<rect x="${it.x}" y="0" width="${it.w}" height="76" fill="var(--high)"/>`;
    if (it.t === 'rect') g += `<rect x="${it.x}" y="${it.y}" width="${it.w}" height="${it.h}" fill="var(--terrain)"/>` + (it.lbl ? `<text x="${it.x + it.w / 2}" y="${it.y + it.h / 2 + 4}" text-anchor="middle" font-family="var(--f-mono)" font-size="10" font-weight="700" fill="var(--terrain-ink)">${it.lbl}</text>` : '');
    if (it.t === 'access') g += `<rect x="${it.x}" y="${it.y}" width="${it.w}" height="${it.h}" fill="none" stroke="var(--hint)" stroke-width="2.5" stroke-dasharray="4 3"/>`;
    if (it.t === 'base') g += `<circle cx="${it.x}" cy="${it.y}" r="${it.r}" fill="${col(it.s)}" stroke="var(--ink)" stroke-width="2.5"/>` + (it.lbl ? `<text x="${it.x}" y="${it.y + 4}" text-anchor="middle" font-family="var(--f-mono)" font-size="10" font-weight="700" fill="var(--surface)">${it.lbl}</text>` : '');
    if (it.t === 'line') g += `<line x1="${it.x1}" y1="${it.y1}" x2="${it.x2}" y2="${it.y2}" stroke="${it.ok ? 'var(--ok)' : 'var(--bad)'}" stroke-width="3" ${it.ok ? '' : 'stroke-dasharray="7 5"'}/>`;
    if (it.t === 'dim') g += dim(it.x1, it.x2, it.y, it.txt);
    if (it.t === 'ghost') g += `<circle cx="${it.x}" cy="${it.y}" r="${it.r}" fill="none" stroke="${col(it.s)}" stroke-width="2" stroke-dasharray="3 3"/>`;
    if (it.t === 'reach') g += `<circle cx="${it.x}" cy="${it.y}" r="${it.r}" fill="none" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="2 4"/>`;
    if (it.t === 'path'){ const pts = it.pts.map(p => p.join(',')).join(' '), c = it.ok === undefined ? 'var(--muted)' : it.ok ? 'var(--ok)' : 'var(--bad)';
      g += `<polyline points="${pts}" fill="none" stroke="${c}" stroke-width="2.5" ${it.ok === false ? 'stroke-dasharray="6 4"' : ''} marker-end="url(#arw-${it.ok === undefined ? 'n' : it.ok ? 'ok' : 'ko'})"/>`; }
    if (it.t === 'ring') g += `<circle cx="${it.x}" cy="${it.y}" r="${R + 4}" fill="none" stroke="${it.ok ? 'var(--ok)' : 'var(--bad)'}" stroke-width="2.5" ${it.ok ? '' : 'stroke-dasharray="4 3"'}/>`;
    if (it.t === 'die') g += `<rect x="${it.x - 7}" y="${it.y - 7}" width="14" height="14" rx="3" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5"/><text x="${it.x}" y="${it.y + 4}" text-anchor="middle" font-family="var(--f-mono)" font-size="10" font-weight="700" fill="var(--ink)">${it.n}</text>`;
    if (it.t === 'bt') g += `<circle cx="${it.x}" cy="${it.y}" r="${it.r || 30}" fill="var(--tpl)" fill-opacity=".22" stroke="var(--tpl)" stroke-width="2"/><circle cx="${it.x}" cy="${it.y}" r="2" fill="var(--tpl)"/>`;
    if (it.t === 'ft'){ const {x, y, L, w0, w1} = it; g += `<path d="M${x} ${y - w0} L${x + L} ${y - w1} A${w1} ${w1} 0 0 1 ${x + L} ${y + w1} L${x} ${y + w0} Z" fill="var(--tpl)" fill-opacity=".22" stroke="var(--tpl)" stroke-width="2"/>`; }
    if (it.t === 'sring') g += `<circle cx="${it.x}" cy="${it.y}" r="${R + 4}" fill="none" stroke="var(--tpl)" stroke-width="2.5" stroke-dasharray="5 2"/>`;
    if (it.t === 'cz') g += `<circle cx="${it.x}" cy="${it.y}" r="${R + 3 * IN}" fill="var(--high)" fill-opacity=".7" stroke="var(--hint)" stroke-width="1.5" stroke-dasharray="5 3"/>`;
    if (it.t === 'mk') g += (it.o ? `<circle cx="${it.x}" cy="${it.y}" r="${R + 4}" fill="none" stroke="${col(it.o)}" stroke-width="4"/>` : '') + `<circle cx="${it.x}" cy="${it.y}" r="${R}" fill="var(--ink)"/><path d="M${it.x} ${it.y - 6} L${it.x + 6} ${it.y} L${it.x} ${it.y + 6} L${it.x - 6} ${it.y} Z" fill="var(--surface)"/>`;
    if (it.t === 'zoi') g += `<rect x="${it.x}" y="${it.y}" width="${it.w}" height="${it.h}" fill="var(--opp)" fill-opacity=".13" stroke="var(--opp)" stroke-width="1.5" stroke-dasharray="5 3"/>`;
    if (it.t === 'edge') g += `<line x1="${it.x1}" y1="${it.y1}" x2="${it.x2}" y2="${it.y2}" stroke="${col(it.s)}" stroke-width="5"/>`;
    if (it.t === 'lmk') g += `<path d="M${it.x + it.dx * 14} ${it.y} L${it.x} ${it.y} L${it.x} ${it.y + 14}" fill="none" stroke="var(--ink)" stroke-width="4"/>`;
    if (it.t === 'grass') g += `<rect x="${it.x}" y="${it.y}" width="${it.w}" height="${it.h}" rx="6" fill="var(--hint)" fill-opacity=".35" stroke="var(--hint)" stroke-width="1.5"/><text x="${it.x + it.w / 2}" y="${it.y + 12}" text-anchor="middle" font-family="var(--f-mono)" font-size="9" font-weight="700" fill="var(--ink)">GRASS 2</text>`;
    if (it.t === 'cross') g += `<path d="M${it.x-6} ${it.y-6} l12 12 M${it.x+6} ${it.y-6} l-12 12" stroke="var(--bad)" stroke-width="3"/>`;
    if (it.t === 'lbl') g += `<text x="${it.x}" y="${it.y}" text-anchor="${it.a || 'middle'}" font-family="${it.mono ? 'var(--f-mono)' : 'var(--f-body)'}" font-size="${it.fs || 10}" font-weight="${it.b ? 700 : 500}" fill="${it.c || 'var(--ink)'}">${esc(it.s)}</text>`;
    if (it.t === 'tag') g += `<text x="${it.x}" y="${it.y + 3}" text-anchor="middle" font-family="var(--f-mono)" font-size="9" font-weight="700" fill="var(--surface)">${esc(it.s)}</text>`;
  });
  const defs = `<defs>${['ok','ko','n'].map(k => `<marker id="arw-${k}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="${k === 'ok' ? 'var(--ok)' : k === 'ko' ? 'var(--bad)' : 'var(--muted)'}"/></marker>`).join('')}</defs>`;
  return `<svg class="d" viewBox="50 0 240 ${H}" role="img" aria-label="Vue de dessus">${defs}${bg}<g transform="translate(0,${dy || 0})">${g}</g></svg>`;
}
function dim(x1, x2, y, txt){
  return `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="var(--muted)" stroke-width="1"/><line x1="${x1}" y1="${y - 4}" x2="${x1}" y2="${y + 4}" stroke="var(--muted)"/><line x1="${x2}" y1="${y - 4}" x2="${x2}" y2="${y + 4}" stroke="var(--muted)"/>
    <text x="${(x1 + x2) / 2}" y="${y - 7}" text-anchor="middle" font-family="var(--f-mono)" font-size="10" fill="var(--muted)">${txt}</text>`;
}

/* ---------- les cas ---------- */
const R = 10; // rayon d’un socle de 32 mm en vue de dessus
const ENG_CASES = [
 {k:'A', t:'Ground contre Ground à 1" ou moins', r:'7.2', ok:true,
  s:[{t:'zone',x:116,w:IN},{t:'mini',x:105,sz:1,s:'me'},{t:'mini',x:150,sz:1,s:'opp'},{t:'line',x1:117,x2:139,y:GY-9,ok:true},{t:'dim',x1:116,x2:132,y:28,txt:'1"'}],
  p:[{t:'er',x:105,y:38,r:R},{t:'base',x:105,y:38,r:R,s:'me'},{t:'base',x:140,y:38,r:R,s:'opp'},{t:'line',x1:115,y1:38,x2:130,y2:38,ok:true}],
  n:'Les socles sont à 1" ou moins l’un de l’autre : les deux figurines sont engagées.'},
 {k:'B', t:'Plus de 1" entre les socles', r:'7.2', ok:false,
  s:[{t:'zone',x:116,w:IN},{t:'mini',x:105,sz:1,s:'me'},{t:'mini',x:190,sz:1,s:'opp'},{t:'line',x1:117,x2:179,y:GY-9,ok:false},{t:'dim',x1:116,x2:132,y:28,txt:'1"'}],
  p:[{t:'er',x:105,y:38,r:R},{t:'base',x:105,y:38,r:R,s:'me'},{t:'base',x:185,y:38,r:R,s:'opp'},{t:'line',x1:115,y1:38,x2:175,y2:38,ok:false}],
  n:'Le socle ennemi est hors de l’Engagement Range : pas d’engagement.'},
 {k:'C', t:'Une figurine suffit pour toute l’unité', r:'7.2 · ENGAGED', ok:true,
  s:[{t:'zone',x:166,w:IN},{t:'mini',x:70,sz:1,s:'me'},{t:'mini',x:110,sz:1,s:'me'},{t:'mini',x:155,sz:1,s:'me'},{t:'mini',x:198,sz:1,s:'opp'},{t:'mini',x:236,sz:1,s:'opp'},{t:'line',x1:167,x2:187,y:GY-9,ok:true}],
  p:[{t:'er',x:155,y:38,r:R},{t:'base',x:75,y:30,r:R,s:'me'},{t:'base',x:110,y:50,r:R,s:'me'},{t:'base',x:155,y:38,r:R,s:'me'},{t:'base',x:190,y:38,r:R,s:'opp'},{t:'base',x:230,y:26,r:R,s:'opp'},{t:'line',x1:165,y1:38,x2:180,y2:38,ok:true}],
  n:'Dès qu’une figurine est engagée, ses deux unités entières sont engagées, même les figurines éloignées.'},
 {k:'D', t:'Une unité volante n’est jamais engagée', r:'7.2.1 · FLYING', ok:false,
  s:[{t:'zone',x:116,w:IN},{t:'mini',x:105,sz:1,s:'me'},{t:'mini',x:140,sz:2,s:'fly',fly:true},{t:'line',x1:117,x2:129,y:GY-9,ok:false}],
  p:[{t:'er',x:105,y:38,r:R},{t:'base',x:105,y:38,r:R,s:'me'},{t:'base',x:132,y:38,r:R,s:'fly',lbl:'vol'},{t:'line',x1:115,y1:38,x2:122,y2:38,ok:false}],
  n:'Ground n’engage que Ground. Un volant peut même finir au contact sans aucun effet sur l’une ou l’autre unité.'},
 {k:'E', t:'Décor de taille 0 ou 1 entre les deux', r:'7.2.1', ok:true,
  s:[{t:'zone',x:116,w:IN},{t:'block',x:121,w:8,h:1},{t:'mini',x:105,sz:1,s:'me'},{t:'mini',x:145,sz:1,s:'opp'},{t:'line',x1:117,x2:134,y:GY-26,ok:true}],
  p:[{t:'er',x:105,y:38,r:R},{t:'rect',x:121,y:8,w:8,h:60},{t:'base',x:105,y:38,r:R,s:'me'},{t:'base',x:142,y:38,r:R,s:'opp'},{t:'line',x1:115,y1:38,x2:132,y2:38,ok:true}],
  n:'Un muret bas (taille 0 ou 1) n’empêche pas l’engagement si les socles sont à 1".'},
 {k:'F', t:'Décor de taille 2+ entre les deux', r:'7.2.1', ok:false,
  s:[{t:'zone',x:116,w:IN},{t:'block',x:121,w:8,h:2},{t:'mini',x:105,sz:1,s:'me'},{t:'mini',x:145,sz:1,s:'opp'},{t:'line',x1:117,x2:134,y:GY-9,ok:false}],
  p:[{t:'er',x:105,y:38,r:R},{t:'rect',x:121,y:8,w:8,h:60},{t:'base',x:105,y:38,r:R,s:'me'},{t:'base',x:142,y:38,r:R,s:'opp'},{t:'line',x1:115,y1:38,x2:132,y2:38,ok:false}],
  n:'Même à 1", un mur de taille 2 ou plus entre les figurines empêche l’engagement.'},
 {k:'G', t:'HIGH GROUND contre GROUND LEVEL', r:'7.2.1 · HIGH GROUND', ok:false,
  s:[{t:'block',x:120,w:150,h:3},{t:'mini',x:105,sz:1,s:'me'},{t:'mini',x:132,sz:1,s:'opp',lv:3},{t:'line',x1:117,x2:121,y:GY-9,y2:GY-60,ok:false},{t:'txt',x:195,y:20,s:'HIGH GROUND (taille 3+)'}],
  p:[{t:'rect',x:120,y:4,w:170,h:68},{t:'er',x:105,y:38,r:R},{t:'base',x:105,y:38,r:R,s:'me'},{t:'base',x:134,y:38,r:R,s:'opp'},{t:'line',x1:115,y1:38,x2:124,y2:38,ok:false}],
  n:'Une figurine sur HIGH GROUND et une au sol ne s’engagent jamais, même socles collés au pied du décor.'},
 {k:'H', t:'MID GROUND avec un ACCESS POINT commun', r:'7.2.1 · MID GROUND · ACCESS POINT', ok:true,
  s:[{t:'block',x:120,w:150,h:1,access:124},{t:'mini',x:105,sz:1,s:'me'},{t:'mini',x:140,sz:1,s:'opp',lv:1},{t:'line',x1:117,x2:129,y:GY-26,ok:true},{t:'txt',x:210,y:60,s:'MID GROUND (taille 1–2)'}],
  p:[{t:'rect',x:120,y:4,w:170,h:68},{t:'access',x:116,y:26,w:16,h:24},{t:'er',x:105,y:38,r:R},{t:'base',x:105,y:38,r:R,s:'me'},{t:'base',x:142,y:38,r:R,s:'opp'},{t:'line',x1:115,y1:38,x2:132,y2:38,ok:true}],
  n:'Entre MID GROUND et le sol (ou HIGH GROUND), l’engagement n’existe que si les deux figurines touchent le même ACCESS POINT (rampe, échelle…).'},

 {id:'marqueurs', name:'Contrôle des marqueurs', ok:true, ref:'Livre de règles · 8.9.1 · glossaire', yes:'', no:'',

   ['<b>Calcul</b> : chaque joueur additionne la Supply actuelle de ses unités qui contestent ; le plus haut total contrôle.','<b>Égalité</b> : contesté, aucun changement. Une unité à Supply 0 contrôle quand même si personne ne conteste.'],

 {id:'deploiement', name:'Déploiement et Zone of Influence', ok:true, ref:'Livre de règles · 8.3 · 8.5.5 · 5.6 · glossaire', yes:'', no:'',

   ['La restriction vaut pour toute arrivée (bord, transport, SUMMON), mais jamais pour les unités déjà sur la table.','Round 1 : Pool = Supply de départ de la Mission Card ; puis + Escalation chaque round ; dernier round : illimité.']]]},
 {id:'disengage', name:'Disengage et Tactical Mass', ok:true, ref:'Livre de règles · 8.5.4 · glossaire TACTICAL MASS, BURROWED', yes:'', no:'',
  lead:'En phase de Mouvement, une unité engagée ne peut pas faire de Move normal : elle peut se désengager (Disengage) ou rester (Hold). Se désengager coûte cher, sauf si l’unité a la Tactical Mass. Toutes les vues sont de dessus.',

   ['<b>3.</b> Si c’est le modèle de tête : échec, l’unité ne bouge pas, il est retiré, fin de l’activation.','<b>Pénalité</b> : ni Ranged Attack ni Charge à la phase d’Assaut suivante.'],
   ['<b>Tactical Mass</b> : Supply actuelle &gt; Supply cumulée de tous les ennemis engagés, au moment de la déclaration → pas de pénalité.','Une unité BURROWED compte 0 Supply pour ces tests.']]]},
 {id:'mouvement', name:'Mouvement', ok:true, ref:'Livre de règles · 8.5.3 · 4.6 · glossaire GRASS, ACCESS POINT', yes:'', no:'',
  lead:'Ces règles servent pour tout déplacement « normal » : Move, Deploy, Run, et en partie Charge, Disengage et Close Ranks. On bouge d’abord le modèle de tête, puis on pose le reste de l’unité. Vues de dessus, sauf mention.',
  legend:MOV_LEGEND, cases:MOV_CASES,
  cons:['Le modèle de tête ne peut pas…',[

 {id:'ldv', name:'Ligne de vue et couvert', ok:true, ref:'Livre de règles · 7.1 à 7.1.4', yes:'', no:'',

   ['<b>Taille effective</b> = taille + taille du décor sur lequel on se tient. <b>Dead Zone</b> : HIGH GROUND contre modèle au pied du même décor.','<b>HIGH GROUND Cover</b> : une unité entièrement sur HIGH GROUND a un jet d’Evade contre les tirs venant d’en bas (jamais pour les volants).']]]},
 {id:'statuts', name:'Statuts', ok:true, ref:'Glossaire · BURROWED, HIDDEN, SIEGE MODE, STATIONARY, SHIELDED · cartes d’unité', yes:'', no:'',
  lead:'Un statut change ce qu’une unité peut faire ou subir ; un marqueur posé à côté de l’unité le rappelle. Les modes (SIEGE MODE, BURROWED) restent jusqu’à ce qu’on les retire. Toutes les vues sont de dessus.',
  legend:STA_LEGEND, cases:STA_CASES,
  cons:['En résumé',[
   ['<b>BURROWED</b> : HIDDEN en plus, taille 0, supply 0 pour Disengage, ne conteste pas les marqueurs.','Seules Move, Disengage, Run, Hold et Close Ranks ; toutes sauf Hold retirent le statut. Les capacités restent utilisables.'],
   ['<b>HIDDEN</b> : visée au tir (ou capacité avec ligne de vue) seulement à 4" ; immunisé à IMPACT ; Evade contre chaque attaque.','<b>SIEGE MODE</b> : ni Move, Disengage, Run, Charge, Close Ranks ; seules les armes SIEGE MODE ; perdu en retournant en réserve.'],
   ['<b>STATIONARY</b> : gagné par tous au début du round, perdu dès qu’une figurine bouge, est déplacée ou placée.','<b>SHIELDED</b> : perdu quand les dégâts dépassent le bouclier ou que la 1re figurine est retirée ; HEAL ne le rend pas.']]]}

let cur = (() => { try { return localStorage.getItem('planche') || 'ldv'; } catch(e){ return 'ldv'; } })();
function renderSheets(){
  const sh = SHEETS.find(x => x.id === cur) || SHEETS[0];
  document.getElementById('nav').innerHTML = SHEETS.map((x, i) => `<button data-sh="${x.id}" class="${x.id === sh.id ? 'on' : ''}">${i + 1}. ${esc(x.name)}<span class="st ${x.ok ? '' : 'draft'}">${x.ok ? '✓ validée' : 'brouillon'}</span></button>`).join('');
  document.getElementById('sheets').innerHTML = `<section class="sheet" id="${sh.id}">
    <header><h2>${esc(sh.name)}</h2><span class="ref">${esc(sh.ref)}</span></header>
    <p class="lead">${esc(sh.lead)}</p><div class="legend">${sh.legend}</div>
    <div class="grid">${sh.cases.map(c => `<article class="case" id="pc-${sh.id}-${c.k}">
      <div class="hd"><span class="lt">${c.k}</span><div><h3>${esc(c.t)}</h3><span class="rule">${esc(c.r)}</span></div></div>
      <span class="verdict ${c.ok ? 'ok' : 'bad'}">${c.ok ? '✓' : '✕'} ${esc(c.v || (c.ok ? sh.yes : sh.no))}</span>
      ${c.s ? `<span class="vw">Vue de côté</span>${side(c.s, c.st)}` : ''}
      <span class="vw">Vue de dessus</span>${topv(c.p, c.H, c.dy)}
      <p class="note">${esc(c.n)}</p></article>`).join('')}</div>
    <div class="cons"><h3>${esc(sh.cons[0])}</h3>${sh.cons[1].map(col => `<ul>${col.map(li => `<li>${li}</li>`).join('')}</ul>`).join('')}</div></section>
    <p class="status">Planche ${SHEETS.indexOf(sh) + 1} — ${sh.ok ? 'validée' : 'brouillon à valider'}.</p>`;
}
document.addEventListener('click', e => { const b = e.target.closest('[data-sh]'); if (!b) return; cur = b.dataset.sh; try { localStorage.setItem('planche', cur); } catch(e){} renderSheets(); window.scrollTo({top:0}); });

/* ---------- recherche dans les règles ---------- */
const GLR = JSON.parse(document.getElementById('gl').textContent);
const KW_PL = {BURROWED:'statuts', HIDDEN:'statuts', 'SIEGE MODE':'statuts', STATIONARY:'statuts', SHIELDED:'statuts', 'LOCKED IN':'statuts', 'ENGAGEMENT RANGE':'engagement', ENGAGED:'engagement', UNENGAGED:'engagement', CHARGE:'charge', IMPACT:'charge', 'DEVASTATING CHARGE':'charge',
  'CLOSE RANKS':'combat', 'CLOSE COMBAT ATTACK':'combat', 'FIGHTING RANK':'combat', 'SUPPORTING RANK':'combat', 'DAMAGE MARKER':'pertes',
  'BLAST TEMPLATE':'gabarits', 'FLAMER TEMPLATE':'gabarits', SPILLOVER:'gabarits', 'MISSION MARKERS':'marqueurs', 'MISSION MARKER':'marqueurs',
  DEPLOY:'deploiement', 'ZONE OF INFLUENCE':'deploiement', 'ENTRY EDGE':'deploiement', 'AVAILABLE SUPPLY':'deploiement', 'SUPPLY POOL':'deploiement', RESERVES:'deploiement',
  DISENGAGE:'disengage', 'TACTICAL MASS':'disengage', MOVE:'mouvement', RUN:'mouvement', 'LEADING MODEL':'mouvement', GRASS:'mouvement', 'ACCESS POINT':'mouvement', FLYING:'mouvement',
  'LINE OF SIGHT':'ldv', 'HIGH GROUND':'ldv', 'DIRECT COVER':'ldv', 'FULL COVER':'ldv', 'CLOSE QUARTERS':'ldv'};
const nrm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const nk = s => String(s).toUpperCase().replace(/\(.*?\)/g, ' ').replace(/\s+/g, ' ').trim();
function rqResults(q){
  q = nrm(q).trim(); if (q.length < 2) return '';
  const words = q.split(/\s+/), has = t => words.every(w => nrm(t).includes(w));
  const gl = GLR.map(([k, en, fr]) => { const n = nrm(k); let sc = 0; if (n === q) sc = 100; else if (n.startsWith(q)) sc = 60; else if (has(k)) sc = 40; else if (has((fr || '') + ' ' + en)) sc = 10; return [sc, k, en, fr]; }).filter(x => x[0]).sort((a, b) => b[0] - a[0] || a[1].localeCompare(b[1]));
  const cs = []; SHEETS.forEach(sh => sh.cases.forEach(c => { let sc = 0; if (has(c.t)) sc = 30; else if (has(c.n + ' ' + c.r + ' ' + sh.name)) sc = 10; if (sc) cs.push([sc, sh, c]); }));
  cs.sort((a, b) => b[0] - a[0]);
  const sh = SHEETS.filter(x => has(x.name) || has(x.lead + ' ' + x.cons[1].flat().join(' ').replace(/<[^>]+>/g, '')));
  let h = '';
  if (sh.length) h += `<div class="rq-sh">${sh.map(x => `<button data-sh="${x.id}">Planche : ${esc(x.name)}</button>`).join('')}</div>`;
  if (gl.length) h += `<p class="rq-h">Glossaire (${gl.length})</p>` + gl.slice(0, 8).map(([, k, en, fr]) => { const pl = KW_PL[nk(k)];
    return `<div class="rq-e"><b>${esc(k)}</b><p>${esc(fr || en)}</p>${fr ? `<details><summary>Texte officiel (anglais)</summary><p>${esc(en)}</p></details>` : ''}${pl ? `<button data-sh="${pl}">Voir la planche</button>` : ''}</div>`; }).join('') + (gl.length > 8 ? `<p class="rq-e" style="color:var(--muted)">${gl.length - 8} autre(s) : précise ta recherche.</p>` : '');
  const FQ = JSON.parse(document.getElementById('faq').textContent).map(e => { let sc = 0; if (has(e[1] + ' ' + e[3])) sc = 25; else if (has(e[2] + ' ' + e[0])) sc = 8; return [sc, e]; }).filter(x => x[0]).sort((a, b) => b[0] - a[0]);
  if (FQ.length) h += `<p class="rq-h">FAQ officielle (${FQ.length})</p>` + FQ.slice(0, 6).map(([, e]) => `<div class="rq-e"><b>${esc(e[1])}</b><p>${esc(e[2])}</p><p class="m" style="margin:0;font-size:12px;opacity:.75">FAQ v1.0 · ${esc(e[0])}</p></div>`).join('');
  if (cs.length) h += `<p class="rq-h">Cas illustrés (${cs.length})</p>` + cs.slice(0, 8).map(([, s2, c]) => `<button class="rq-c" data-case="${s2.id}|${c.k}"><span class="lt">${esc(c.k)}</span><span><b>${esc(c.t)}</b> <span class="m">· ${esc(s2.name)}</span><br><span class="m">${esc(c.n)}</span></span></button>`).join('');
  return h || `<p class="rq-e">Aucun résultat pour « ${esc(q)} ».</p>`;
}
document.getElementById('rq').addEventListener('input', e => { document.getElementById('rqres').innerHTML = rqResults(e.target.value); });
document.addEventListener('click', e => { const b = e.target.closest('[data-case]'); if (!b) return; const [id, k] = b.dataset.case.split('|'); cur = id; try { localStorage.setItem('planche', cur); } catch(x){} renderSheets();
  const el = document.getElementById('pc-' + id + '-' + k); if (el){ el.scrollIntoView({behavior:'smooth', block:'start'}); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1600); } });
renderSheets();
</script>
