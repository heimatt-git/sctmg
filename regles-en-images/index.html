<!doctype html><html lang="fr"><head><meta charset="utf-8"><link rel="manifest" href="../manifest.webmanifest"><meta name="theme-color" content="#0e1319"><link rel="icon" type="image/svg+xml" href="../icons/icon.svg"><link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png"><link rel="apple-touch-icon" href="../icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="SC:TMG"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><script>try{if(localStorage.getItem('sctmg-skin')==='terran')document.documentElement.setAttribute('data-skin','terran')}catch(e){}</script><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Règles en images SC:TMG</title>

<style>
/* Layout : planche de règle — en-tête, légende, grille 3×3 de cases (vue de côté + vue de dessus + verdict), encadré des conséquences. */
:root{
  --bg:#e9edf1; --surface:#ffffff; --sunk:#f3f5f8; --ink:#141c25; --muted:#586574; --line:#d0d8e1;
  --ok:#1f8a4f; --bad:#c62f26; --zone:#f6d6d9; --zone-line:#d98b93; --terrain:#6d5326; --terrain-ink:#ffffff;
  --high:#cfe2f3; --me:#2c6bc0; --opp:#b8452a; --fly:#7a4fb0; --ground:#b9c1ca; --hint:#2f9e5c; --tpl:#d98a00;
  --f-display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --f-body:"Barlow","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1319; --surface:#161e27; --sunk:#111821; --ink:#e2e8ee; --muted:#93a1b0; --line:#2a3644;
  --ok:#5fcf95; --bad:#ff7a6e; --zone:#3a2228; --zone-line:#a05a64; --terrain:#8a6a33; --terrain-ink:#fff7e6;
  --high:#1c3247; --me:#6fa8ff; --opp:#ef8a6c; --fly:#b493e6; --ground:#3a4654; --hint:#5fcf95; --tpl:#f0b84a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1319; --surface:#161e27; --sunk:#111821; --ink:#e2e8ee; --muted:#93a1b0; --line:#2a3644;
  --ok:#5fcf95; --bad:#ff7a6e; --zone:#3a2228; --zone-line:#a05a64; --terrain:#8a6a33; --terrain-ink:#fff7e6;
  --high:#1c3247; --me:#6fa8ff; --opp:#ef8a6c; --fly:#b493e6; --ground:#3a4654; --hint:#5fcf95; --tpl:#f0b84a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sheet>header{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline;justify-content:space-between}
.sheet>header h2{font-size:24px}
.sheet>header .ref{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.lead{padding:10px 18px;color:var(--muted);font-size:14px;border-bottom:1px solid var(--line);max-width:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;padding:10px 18px;border-bottom:1px solid var(--line);font-size:13px;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend svg{flex:none}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.grid{grid-template-columns:minmax(0,1fr)}}
.case{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.case .hd{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;align-items:start}
.case .lt{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:16px}
.case h3{font-size:15px;line-height:1.2}
.case .rule{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.verdict{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:700;font-size:15px;align-self:center}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.vw{font-family:var(--f-display);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
svg.d{width:100%;height:auto;display:block;border-radius:4px}
.case p.note{margin:0;font-size:13px;color:var(--muted)}
.cons{padding:14px 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px 24px;font-size:14px}
.cons h3{grid-column:1/-1;font-size:16px}
.cons ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.status{margin:14px 0 0;font-size:13px;color:var(--muted)}
.sheetnav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.sheetnav button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-family:var(--f-display);font-weight:600;font-size:14px;color:var(--ink);cursor:pointer}
.sheetnav button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.sheetnav .st{font-size:11px;font-weight:600;margin-left:6px;color:var(--ok)}
.sheetnav button.on .st{color:var(--surface)}
.sheetnav .draft{color:var(--bad)}
.psearch{margin-bottom:14px;display:grid;gap:8px}
.psearch input{width:100%;box-sizing:border-box;padding:10px 12px;font:inherit;font-size:15px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
#rqres:empty{display:none}
#rqres{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 14px 10px}
.rq-h{font-family:var(--f-display);font-size:14px;margin:10px 0 4px}
.rq-e{border-top:1px solid var(--line);padding:8px 0;font-size:14px}.rq-e p{margin:4px 0}
.rq-e details{font-size:12px;color:var(--muted)}
.rq-sh{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.rq-sh button,.rq-e button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-family:var(--f-display);font-weight:600;font-size:13px;color:var(--ink);cursor:pointer}
.rq-c{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:8px 0;cursor:pointer;color:inherit;font:inherit;font-size:14px}
.rq-c .lt{width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:13px}
.rq-c .m{color:var(--muted);font-size:13px}
.case{scroll-margin-top:16px}.case.flash{outline:3px solid var(--ok);outline-offset:2px}
</style><style>/* ---------- skin Terran commun (accueil, builder, règles en images) ---------- */
.skinbtn{border:1px solid var(--line);background:var(--sunk,var(--surface-2,transparent));color:var(--ink);border-radius:6px;padding:6px 10px;min-height:32px;font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;cursor:pointer}
:root[data-skin="terran"]{
  --bg:#030813; --surface:#08172f; --sunk:#06122a; --surface-2:#06122a; --ink:#cfe6ff; --muted:#7fa6d0; --line:#1f63b5;
  --accent:#ffb23b; --ok:#7de08a; --ok-bg:#10261a; --warn:#ffb23b; --warn-bg:#2a2210; --bad:#ff7b47; --err:#ff7b47; --err-bg:#2a1710;
  --zerg:#c98be3; --terran:#46b4ff; --protoss:#e2b642;
  --zone:#3a2228; --zone-line:#a05a64; --terrain:#8a6a33; --terrain-ink:#fff7e6; --high:#1c3247; --me:#6fa8ff; --opp:#ef8a6c; --fly:#b493e6; --ground:#3a4654; --hint:#5fcf95; --tpl:#f0b84a;
  color-scheme:dark}
:root[data-skin="terran"] body{background:radial-gradient(ellipse at 50% -5%,#0f2c58 0%,#07142b 45%,#030813 100%) fixed;color:var(--ink)}
:root[data-skin="terran"] h1,:root[data-skin="terran"] h2,:root[data-skin="terran"] h3{text-transform:uppercase;letter-spacing:.08em}
:root[data-skin="terran"] h1{color:#fff;text-shadow:0 0 12px #46b4ff}
:root[data-skin="terran"] .skinbtn{background:#08172f;border-color:#46b4ff;color:#46b4ff;box-shadow:0 0 10px rgba(70,180,255,.35)}
:root[data-skin="terran"] .homelnk{border-color:#1f63b5;color:#46b4ff}
/* accueil */
:root[data-skin="terran"] a.app{background:linear-gradient(180deg,#0c2347 0%,#06132a 100%);border-color:#1f63b5;box-shadow:inset 0 0 14px rgba(70,180,255,.1)}
:root[data-skin="terran"] a.app:hover,:root[data-skin="terran"] a.app:focus-visible{border-color:#46b4ff;box-shadow:0 0 14px rgba(70,180,255,.4)}
:root[data-skin="terran"] .ico{background:#06122a;border-color:#1f63b5}
:root[data-skin="terran"] .kicker,:root[data-skin="terran"] .go{color:#ffb23b}
/* builder */
:root[data-skin="terran"] .top{background:linear-gradient(180deg,#0b1f40 0%,#06132a 100%);border-bottom-color:#2a7fd6;box-shadow:0 4px 18px rgba(70,180,255,.18)}
:root[data-skin="terran"] .seg{background:#08172f;border-color:#1f63b5}
:root[data-skin="terran"] .seg button[aria-selected="true"],:root[data-skin="terran"] .seg button.on{box-shadow:0 0 12px rgba(70,180,255,.45)}
/* règles en images */
:root[data-skin="terran"] .sheet{background:linear-gradient(180deg,#0c2347 0%,#06132a 100%);border-color:#1f63b5}
:root[data-skin="terran"] .sheetnav button{background:#08172f;border-color:#1f63b5;color:#cfe6ff}
:root[data-skin="terran"] .sheetnav button.on{background:linear-gradient(180deg,#123b73 0%,#0a2145 100%);border-color:#46b4ff;color:#fff;box-shadow:0 0 12px rgba(70,180,255,.45)}
:root[data-skin="terran"] .case .lt{background:#46b4ff;color:#04141c}
</style><style>.homelnk{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:6px;border:1px solid var(--line,#d0d8e1);color:inherit;text-decoration:none;font-size:16px;line-height:1;flex:none;align-self:center}.homelnk:hover{border-color:currentColor}</style></head><body>

<script type="application/json" id="faq">[["Unités et caractéristiques","Peut-on faire un Move ou un Run de 0\" ?","Non. L’unité doit vraiment changer de position. Si elle ne bouge pas, elle a fait un Hold.","move run hold 0"],["Unités et caractéristiques","Comment marche le Bouclier, et peut-il être soigné ?","La valeur de Bouclier s’ajoute aux PV de la première figurine (un Zealot à 4 PV avec Bouclier 3 a 7 PV). Les PV perdus de ce total se soignent normalement.","shield bouclier pv soin heal shielded"],["Unités et caractéristiques","Un mouvement « directement vers » ou « directement à l’opposé » doit-il être fait en entier ?","Oui. Le modèle de tête parcourt la distance maximale possible, directement vers la cible ou directement à l’opposé.","directly towards away vers opposé distance"],["Unités et caractéristiques","Quand perd-on le statut SHIELDED ?","Dans deux cas : quand le total de dégâts de l’unité dépasse strictement son Bouclier (Bouclier 3 : perdu à 4 dégâts, pas à 3 ; une réduction de dégâts appliquée avant peut donc l’éviter), ou quand la première figurine est retirée. Une fois perdu, le soin ne le rend pas.","shielded bouclier perdu"],["Unités et caractéristiques","Une figurine dont le socle ne tient pas sur un High Ground ?","Règle « Wobbly Model » : le centre du socle reste sur le décor, le socle déborde du minimum nécessaire.","high ground socle wobbly"],["Unités et caractéristiques","Gap Clearance et High Ground : peut-on passer près du bord ?","Le bord d’un High Ground compte comme Impassable Terrain pour le Gap Clearance : il faut 1\" de large pour les tailles 2 ou moins, 3\" pour les tailles 3 et plus. Un Siege Tank monte une rampe si elle fait au moins 3\" de large.","gap clearance high ground rampe"],["Unités et caractéristiques","Les dégâts non létaux font-ils perdre SHIELDED ?","Oui. Ils s’ajoutent au total de dégâts et retirent SHIELDED comme des dégâts normaux.","non-lethal non létaux shielded"],["Unités et caractéristiques","Une unité détruite peut-elle revenir en jeu ?","Non, une fois sa dernière figurine retirée, sauf si une mission ou une règle le prévoit.","détruite revenir respawn"],["Unités et caractéristiques","Une unité Ground peut-elle passer d’un High Ground à un autre non relié ?","Non, seulement entre High Grounds reliés.","high ground relié ground"],["Mesures et mouvement","Comment vérifier la cohésion pour contester un marqueur ?","La cohésion n’est vérifiée qu’à la fin d’un mouvement. Si l’unité l’a réussie, elle reste en cohésion pour les marqueurs, même après des pertes.","cohésion coherency marqueur contester"],["Le champ de bataille","Couvert direct : faut-il être à 1\" de la partie du décor qui gêne la ligne de vue ?","Non. Il suffit que la ligne de vue traverse le décor et que la figurine soit à 1\" de n’importe quelle partie de ce même décor.","direct cover couvert ligne de vue"],["Le champ de bataille","Le Gap Clearance s’applique-t-il entre figurines ?","Oui, à tout espace (décors ou figurines) que le socle doit traverser.","gap clearance figurines"],["Le champ de bataille","Charge ou Close Ranks : peut-on placer des figurines de l’autre côté d’une unité ennemie ?","Oui. Les liens de cohésion peuvent traverser les ennemis avec lesquels l’unité est engagée, s’il reste de la place pour les socles.","charge close ranks cohésion autre côté"],["Le champ de bataille","Un marqueur désactivé peut-il être contrôlé ?","Oui. Le contrôle s’applique à tous les marqueurs sur la table, activés ou non.","marqueur désactivé contrôle"],["Le champ de bataille","Un lien de cohésion peut-il traverser décors et figurines ?","Il peut traverser tout ce que le modèle de tête peut traverser. Les Raptors, qui franchissent l’Impassable Terrain, peuvent relier leurs figurines à travers.","cohésion raptor impassable"],["Le champ de bataille","Draft des missions : on retire une carte précise ou toutes celles du même nom ?","Seulement la carte physique bloquée. Un doublon reste disponible.","draft mission deployment carte"],["Le champ de bataille","Les longs murs des plans officiels sont-ils un seul décor ?","Non, plusieurs décors indépendants.","murs décor terrain"],["Le champ de bataille","Placer une figurine sur un High Ground par cohésion depuis un Access Point ?","Oui, sans action de Move séparée : seul le modèle de tête suit un trajet, les autres sont placés en cohésion, y compris à travers un Access Point.","access point high ground cohésion"],["Le champ de bataille","Artefact Hunt : une unité Flying ou BURROWED peut-elle récupérer un marqueur ?","Oui. Ne pas pouvoir contrôler ni contester n’empêche pas de récupérer le marqueur dans cette mission.","artefact hunt flying burrowed marqueur"],["Déploiement et Entry Edges","Peut-on se déployer directement sur un High Ground qui touche le bord ?","Oui, si ton Entry Edge touche ce décor, avec toutes les règles de déploiement habituelles.","high ground déploiement entry edge"],["Déploiement et Entry Edges","L’Omega Worm (Omega Network) et le Pylon sont-ils des Entry Edges ?","Oui : ce sont des Entry Edges amies du joueur qui les a posés. Burrow Ambush peut donc partir de là, et Photon Overcharge ne s’applique pas aux unités qui y entrent. Les cartes de déploiement avancé et les transports (Proxy Barracks, Warp Prism…) ne créent pas d’Entry Edge : ils permettent seulement d’entrer sans.","omega worm pylon entry edge burrow ambush photon overcharge warp prism proxy"],["Déploiement et Entry Edges","Une unité entrée par un Pylon peut-elle encore agir ?","Non. Ce déploiement prend toute son activation, qui se termine dès la pose : marqueur d’activation, plus d’action ni de capacité Active pendant la phase.","pylon déploiement activation"],["Déploiement et Entry Edges","L’Omega Network crée-t-il une Zone of Influence ?","Non. Seules les Entry Edges de la Deployment Card en créent, au moment de la mise en place.","omega worm zone of influence"],["Séquence d’attaque","L’Evade marche-t-il contre la Surge ?","Oui. L’Evade se lance contre le pool de dégâts final, Surge comprise. La Surge ne fait qu’éviter le jet d’armure.","evade surge"],["Séquence d’attaque","ANTI-EVADE (ou un autre modificateur) peut-il annuler un jet ?","Non. Un seuil ne descend jamais sous 2+ ni ne dépasse 6+ : ANTI-EVADE peut rendre l’Evade au pire à 6+.","anti-evade modificateur 6+ 2+ seuil"],["Séquence d’attaque","Un tir peut-il retirer des figurines hors de portée ?","Oui. Le retrait des pertes dépend seulement de la visibilité : toute figurine visible par au moins un tireur peut être retirée, même hors de portée.","tir portée pertes visibilité"],["Séquence d’attaque","Close Ranks si toutes les figurines sont déjà socle à socle ?","Impossible : le modèle de tête doit finir plus près de l’ennemi qu’au départ.","close ranks socle à socle"],["Séquence d’attaque","Pertes en mêlée contre plusieurs unités ?","Il faut garder l’engagement avec toutes les unités ennemies : aux priorités 2 et 3, on ne peut pas retirer une figurine qui casserait l’engagement avec une unité, s’il existe un autre choix valable.","pertes mêlée plusieurs unités engagement"],["Séquence d’attaque","Plusieurs armes de tir : faut-il annoncer toutes les cibles d’avance ?","Non. Une cible par batch d’arme : on résout entièrement le premier, puis on choisit la cible du suivant.","batch cible armes"],["Capacités et cartes","Déploiement de fin de round (Ventral Sacs, Ready for Dust Off, Warp Conduit) ?","Le modèle de tête au contact socle à socle de l’indicateur, le reste en cohésion, entièrement hors de l’Engagement Range ennemie. Si c’est impossible, l’unité n’entre pas et la capacité est perdue.","ventral sacs dust off warp conduit indicateur fin de round"],["Capacités et cartes","Comment payer en CP, BM ou PE ?","On épuise une ou plusieurs cartes prêtes du bon type. L’excédent est perdu : une carte à 2 CP utilisée pour une capacité à 1 CP gaspille 1 CP.","payer cp bm pe ressource épuiser excédent"],["Capacités et cartes","Peut-on utiliser une capacité avant de déployer l’unité (ex. Stimpack) ?","Non, rien ne marche en réserve. Sauf les capacités qui le disent (Raiders Roll) ou qui font entrer l’unité (Armed and Ready, Phase Prism).","réserve capacité stimpack raiders roll"],["Capacités et cartes","Une unité est-elle à portée d’elle-même ?","Oui, sauf mention contraire.","portée soi-même"],["Capacités et cartes","Que veut dire « désignée pour se déployer » ?","Que l’unité fait une action Deploy. Tout effet de carte, capacité ou règle qui lui fait faire un Deploy compte.","nominated to deploy désignée déployer"],["Capacités et cartes","Utiliser la capacité d’une carte demande-t-il une unité active sur la table ?","Oui, toujours, même si la carte n’affecte pas cette unité.","carte capacité active unité table"],["Capacités et cartes","Le bonus de vitesse du Creep marche-t-il pendant un Deploy ?","Non. En réserve, l’unité ne peut pas être ON CREEP : le Deploy se fait avec sa Speed normale.","creep deploy vitesse speed"],["Capacités et cartes","Combien de capacités Active ou de cartes pendant une activation ?","Autant de capacités de noms différents que tu peux payer. Une seule Réaction par activation. Une même capacité Active nommée : une fois par round et par unité, sauf mention contraire.","capacités activation réaction une fois par round"],["Capacités et cartes","Quand vérifie-t-on ON CREEP pour Accelerating Creep ?","Au début du mouvement. Si l’unité est ON CREEP au départ, elle garde le bonus tout le mouvement.","on creep accelerating creep mouvement"],["Capacités et cartes","Concussive Shells : ligne de vue vers le chargeur ou vers l’unité amie ?","Vers l’unité amie seulement : c’est elle qui sert de référence pour la portée et la visibilité.","concussive shells marauder ligne de vue"],["Capacités et cartes","Peut-on utiliser la capacité d’une carte épuisée ?","Non. Ses capacités sont inutilisables jusqu’au nettoyage de la phase 4.","carte épuisée exhausted"],["Capacités et cartes","Les Réactions peuvent-elles se jouer hors activation ?","Oui, dès que leur déclencheur arrive. Hors activation : une seule Réaction par déclencheur. Si les deux joueurs réagissent au même déclencheur, le détenteur du marqueur Premier joueur résout en premier.","réaction hors activation premier joueur"],["Capacités et cartes","Les Raptors cumulent-ils les bonus d’IMPACT (Malignant Creep, Evolution Chamber, Adrenal Overload) ?","Oui, ce sont des modificateurs de sources différentes : jusqu’à +3.","raptor impact adrenal overload malignant creep evolution chamber"],["Capacités et cartes","Bonus de vitesse : Accelerating Creep, Creep Speed, Wild Mutation, Glial Reconstitution se cumulent-ils ?","Les modificateurs de sources différentes se cumulent, sauf s’ils sont tous deux des BUFF. Accelerating Creep et Creep Speed (Queen) se cumulent avec le reste. Wild Mutation et Glial Reconstitution sont deux BUFF Speed : ils ne se cumulent pas entre eux.","vitesse speed creep wild mutation glial buff cumul"],["Capacités et cartes","Que veut dire cibler une Structure ?","Une capacité qui vise une zone ou l’unité elle-même peut affecter une Structure. Elle n’est exclue que si les conditions de ciblage, les mots-clés ou les restrictions de la capacité l’excluent.","structure cibler"],["Capacités et cartes","« Choisir » et « cibler », c’est différent ?","Non, ce sont des synonymes.","choisir cibler select target"],["Capacités et cartes","L’adversaire peut-il se placer sur un Faction Indicator (Ventral Sacs, Dust Off, Warp Conduit) ?","Oui. S’il bloque l’indicateur au point qu’on ne peut plus poser le modèle de tête à son contact, l’indicateur reste jusqu’à la fin du round puis est retiré sans déploiement.","faction indicator bloquer ventral sacs warp conduit"],["Capacités et cartes","Psionic Transfer avec un marqueur récupéré (Artefact Hunt) ?","Non.","adept psionic transfer artefact"],["Mots-clés","Comment résoudre PLACE (0) de Phase Prism (Artanis) ?","Artanis est placé au contact socle à socle d’une figurine de l’unité choisie.","phase prism artanis place 0"],["Mots-clés","PINPOINT permet-il de tirer en étant soi-même engagé ?","Non. Il permet seulement de tirer sur des ennemis engagés, pas de tirer en sortant d’un combat.","pinpoint engagé tir"],["Mots-clés","Peut-on retirer des dégâts déjà reçus ?","Oui. La réduction s’applique au total de dégâts de l’unité (anciens et nouveaux). Life Support peut retirer les 3 dégâts d’un Marauder qui en avait 2 et en reçoit 1.","dégâts réduction life support total"],["Mots-clés","PLACE retire-t-il un Creep Tumor ?","Non. Creep Removal ne se déclenche qu’à la fin d’un Move, Deploy, Run, Charge ou Disengage ennemi à 1\". PLACE n’en fait pas partie.","place creep tumor removal"],["Mots-clés","Tunneling Claws permet-il de traverser un Force Field ?","Non. Il fait traverser les unités, pas les décors, et un Force Field est un décor.","tunneling claws force field roach"],["Mots-clés","LOCKED IN : faut-il que le tireur ou la cible soit immobile ?","La cible doit avoir le statut STATIONARY.","locked in stationary"],["Mots-clés","Une unité de taille 3 placée par PLACE dans un Force Field le détruit-elle ?","Non. PLACE n’est pas un mouvement.","place force field taille 3"],["Mots-clés","INDIRECT FIRE contre une unité partiellement visible ?","Pas de jet d’Evade : au moins une figurine est visible, donc l’unité est dans la ligne de vue. Les figurines non visibles peuvent quand même être retirées.","indirect fire visible evade"],["Mots-clés","Les Raptors traversent-ils un Force Field ?","Non. Un Force Field interdit le passage aux unités de taille 2 ou moins, Raptors compris.","raptor force field"],["Mots-clés","Les « détections » à 6\" (Scanner Sweep, Oversight Mode, Surveillance) contre une unité HIDDEN ?","Elles visent un point de la table (un Faction Indicator avec une zone de 6\"), pas l’unité : la limite de 4\" du ciblage HIDDEN ne s’applique pas.","hidden détection scanner sweep surveillance"],["Mots-clés","Quand vérifie-t-on une condition « tant que à X\" » ?","Au début et à la fin de chaque action ou capacité. Si l’unité remplit les conditions, l’effet s’applique aussitôt.","while within tant que à portée"],["Mots-clés","Une Réaction REPEATABLE plusieurs fois dans la même activation ?","Non. Toujours une seule Réaction par activation ; REPEATABLE permet seulement de la rejouer dans d’autres activations du round. Hors activation : une fois par déclencheur.","repeatable réaction"],["Mots-clés","Guardian Shield et Spillover ?","Les tirs de Spillover sont des batchs séparés : Guardian Shield retire 1 dé à chaque batch qui vise une unité protégée.","guardian shield spillover"],["Mots-clés","PRECISION, SURGE, CRITICAL HIT s’appliquent par figurine ou par unité ?","Au batch entier : les dés des figurines qui utilisent le même profil sont regroupés. Les figurines ne comptent à part que pour la portée, la visibilité et les modificateurs individuels (comme −1 en LONG RANGE).","precision surge critical hit batch"],["Mots-clés","PRECISION ou CRITICAL HIT et Spillover ?","Les mots-clés de l’arme ne s’appliquent qu’au pool contre la cible principale. Les batchs de Spillover sont des attaques de base, sans modificateurs.","precision critical hit spillover"],["Mots-clés","PRECISION en mêlée contre plusieurs unités ?","Les attaques réparties forment un seul batch : tu répartis les effets comme tu veux, tout sur une cible ou partagés.","precision mêlée plusieurs unités"],["Mots-clés","Un MORPH qui baisse le supply donne-t-il des PV à l’adversaire ?","Oui. Toute baisse du supply actuel, MORPH compris, donne à l’adversaire autant de PV que de supply perdu.","morph pv supply"],["Mots-clés","Une unité MORPHED donne-t-elle des PV quand elle perd du supply ?","Oui, comme toute autre unité.","morphed pv supply"],["Mots-clés","Peut-on garder l’arme d’un Specialist (ex. AGG-12) en la passant à une autre figurine ?","Non. On ne peut ni transférer ni remplacer un Specialist pour garder son arme.","specialist agg-12 marine"],["Gabarits et Spillover","Gabarits de type Blast (Psionic Storm, Plague) sans cible principale ?","Le point sous le centre du gabarit est la cible principale. Il n’a pas de Combat Tags : le Spillover touche sans condition de tags. Les figurines touchées doivent être au même niveau d’élévation que ce point ; les volants comptent au niveau de leur socle.","blast template psionic storm plague gabarit"],["Gabarits et Spillover","Spillover : faut-il un Combat Tag commun avec la cible principale ?","Au moins un Combat Tag commun et le même niveau d’élévation. Zerglings et Roach partagent Ground : le gabarit passe de l’un à l’autre. Les Mutalisks ne sont pas touchés par un gabarit au sol, car les volants n’ont pas de niveau d’élévation pour les gabarits.","spillover combat tag élévation mutalisk"]]</script>
<script type="application/json" id="gl">[["ACCESS POINT","Part of a Terrain that connects different elevation levels. Models moving through an ACCESS POINT can change their elevation.","Partie d’un décor qui relie deux niveaux d’élévation. Les figurines qui passent par un ACCESS POINT peuvent changer d’élévation."],["ACTIVE PLAYER","The player whose turn it is to act.","Le joueur dont c’est le tour d’agir."],["ANTI-EVADE (X)","When resolving an attack with this weapon against Enemy Units, the target Unit suffers a -X Modifier to its Evade Roll for this attack (Part 8.7.4, Step 4).","Quand tu résous une attaque avec cette arme contre des unités ennemies, l’unité ciblée subit un modificateur −X à son jet d’Evade pour cette attaque (partie 8.7.4, étape 4)."],["ARMY SLOT","Army Slots determine how many and what types of Units may be included in an army. Each Army Slot has a specific type: Core, Elite, Support, Air, or Hero. Every Unit occupies a number of Army Slots of its designated type equal to its starting Supply Value. The Faction Card provides the initial pool of Army Slots. Additional Army Slots are unlocked by purchasing Tactical Cards with Vespene Gas during Army Building (Part 9.1.5). Unused Army Slots are lost – they cannot be converted, exchanged, or carried forward.","Les Army Slots fixent combien d’unités, et de quels types, une armée peut inclure. Chaque Army Slot a un type : Core, Elite, Support, Air ou Hero. Chaque unité occupe autant d’Army Slots de son type que sa valeur de Supply de départ. La Faction Card donne la réserve initiale d’Army Slots. Des Army Slots supplémentaires se débloquent en achetant des Tactical Cards avec du Vespene Gas pendant la construction d’armée (partie 9.1.5). Les Army Slots non utilisés sont perdus : ils ne peuvent être ni convertis, ni échangés, ni reportés."],["AVAILABLE SUPPLY","Available Supply is the remaining Supply capacity available for new deployments. It equals the current Supply Pool minus the Total Current Supply Value of all Friendly Units on the battlefield (Part 8.3.2). A Unit may only be deployed from Reserves if its Current Supply Value is less than or equal to the Available Supply. At no point may the Total Current Supply of a player’s on-table Units exceed the Supply Pool. Units Destroyed or reduced by casualties free up Available Supply for new arrivals. In the final Round of the game, the Supply Pool becomes unlimited, and the Available Supply restrictions are lifted.","Le supply disponible est la capacité de supply qui reste pour de nouveaux déploiements. Il est égal au Supply Pool actuel moins le supply actuel total de toutes les unités amies sur le champ de bataille (partie 8.3.2). Une unité ne peut se déployer depuis la réserve que si son supply actuel est inférieur ou égal au supply disponible. Le supply actuel total des unités d’un joueur sur la table ne peut jamais dépasser le Supply Pool. Les unités détruites ou réduites par des pertes libèrent du supply disponible pour de nouvelles arrivées. Au dernier round de la partie, le Supply Pool devient illimité et les restrictions de supply disponible sont levées."],["BLOCKING TERRAIN","Any terrain piece with an Effective Size of 1 or greater. Blocking Terrain obstructs Line of Sight according to the Cover rules (Part 7.1.1). Whether a model may move through that terrain is determined separately by the movement rules, terrain Size, ACCESS POINTS, Gap Clearance, and any relevant terrain keywords.","Tout décor dont la taille effective est de 1 ou plus. Un Blocking Terrain bloque la ligne de vue selon les règles de couvert (partie 7.1.1). La possibilité de traverser ce décor se règle à part, avec les règles de mouvement, la taille du décor, les ACCESS POINTS, le Gap Clearance et les mots-clés de terrain éventuels."],["BUFF [Characteristic] (X)","The Unit gains a bonus of X to the specified characteristic until the End of the Round.\n• Target Number characteristic (e.g. Armour, Hit): reduce the value by X (easier to roll).\n• Value characteristic (e.g. Speed, RoA): increase the value by X.","L’unité gagne un bonus de X à la caractéristique indiquée jusqu’à la fin du round.\n• Caractéristique à seuil (ex. Armour, Hit) : réduis la valeur de X (plus facile à réussir).\n• Caractéristique à valeur (ex. Speed, RoA) : augmente la valeur de X."],["BULKY","This weapon cannot be used to make a Ranged Attack while the Unit is currently Engaged (Part 8.7.3).","Cette arme ne peut pas servir pour une Ranged Attack tant que l’unité est engagée (partie 8.7.3)."],["BURROWED","• BURROWED is classified as a Status.\n• When a Unit gains BURROWED Status it also gains the HIDDEN STATUS.\n• At the Start of the Round BURROWED Units gain HIDDEN Status.\n• When BURROWED Status is removed, a Unit also loses HIDDEN Status.\n• Its Size is treated as 0 for all purposes.\n• Its Current Supply Value is treated as 0 for Disengage checks.\n• A BURROWED Unit cannot Control or Contest Mission Markers (overrides Parts 6.2 and 8.9.1).\n• While BURROWED, the Unit may only perform Deploy, Move, Disengage, Run, Hold and Close Ranks actions. Performing any of these (except Hold) immediately removes the BURROWED status.\n• BURROWED Units may use Special Abilities unless stated otherwise.\n• BURROWED Units may make an Evade Roll against every attack targeting them.\n• Other models may move through a BURROWED Unit’s models, provided they do not end Within the Engagement Range of the BURROWED Unit (overrides Part 8.5.3).\n• If a BURROWED Unit is Engaged at the start of the Combat Phase, it must be Activated but cannot perform a Close Combat Attack in its BURROWED state. The Unit may perform Close Ranks as its first step, which immediately removes the BURROWED status. Once the status is removed, the Unit completes the remaining steps of the Close Combat Attack normally. If the Unit does not or cannot perform Close Ranks, it does not attack. Enemy Units Engaged with a BURROWED Unit may attack it as normal regardless of its status.","• BURROWED est un statut.\n• Quand une unité gagne le statut BURROWED, elle gagne aussi le statut HIDDEN.\n• Au début du round, les unités BURROWED gagnent le statut HIDDEN.\n• Quand le statut BURROWED est retiré, l’unité perd aussi le statut HIDDEN.\n• Sa taille compte comme 0 pour tout.\n• Son supply actuel compte comme 0 pour les vérifications de Disengage.\n• Une unité BURROWED ne peut ni contrôler ni contester de marqueur de mission (prime sur les parties 6.2 et 8.9.1).\n• Tant qu’elle est BURROWED, l’unité ne peut faire que les actions Deploy, Move, Disengage, Run, Hold et Close Ranks. Faire l’une d’elles (sauf Hold) retire immédiatement le statut BURROWED.\n• Les unités BURROWED peuvent utiliser leurs capacités spéciales, sauf mention contraire.\n• Les unités BURROWED peuvent faire un jet d’Evade contre chaque attaque qui les vise.\n• D’autres figurines peuvent traverser les figurines d’une unité BURROWED, à condition de ne pas finir dans son Engagement Range (prime sur la partie 8.5.3).\n• Si une unité BURROWED est engagée au début de la phase de Combat, elle doit être activée mais ne peut pas faire de Close Combat Attack dans cet état. Elle peut faire Close Ranks comme première étape, ce qui retire immédiatement le statut BURROWED ; elle termine ensuite normalement les autres étapes de la Close Combat Attack. Si elle ne fait pas (ou ne peut pas faire) Close Ranks, elle n’attaque pas. Les unités ennemies engagées avec une unité BURROWED peuvent l’attaquer normalement, quel que soit son statut."],["BURST FIRE Y” (X)","When making a Ranged Attack against a target Within Y” of the attacking model, increase this weapon’s RoA by X for that attack.","Quand tu fais une Ranged Attack contre une cible à Y\" ou moins de la figurine qui attaque, augmente de X la RoA de cette arme pour cette attaque."],["COMBAT TAGS","Combat Tags are keywords printed on a Unit Card that identify a Unit’s physical nature and tactical class. Type Tags: Armoured, Biological, Light, Mechanical, Psionic, Flying, and Ground.\n• Targeting: Some weapons can fire only at specific Combat Tags (e.g., “Target: Flying”).\n• Surge: A weapon’s Surge efficiency triggers only when the target has the Combat Tag listed in the weapon’s Surge Type (Part 8.7.4).\n• Bonuses: Abilities such as ANTI-EVADE (X) or PIERCE (X) often apply only against specific Combat Tags. Note: The Ground Combat Tag and the GROUND LEVEL elevation (Part 8.5.3) are distinct concepts. A Flying Unit standing on the playmat is at GROUND LEVEL but does not have the Ground Combat Tag. Throughout these rules, Ground in bold always refers to the Combat Tag. GROUND LEVEL always refers to elevation.","Les Combat Tags sont des mots-clés imprimés sur la carte d’unité qui décrivent sa nature physique et sa classe tactique. Types : Armoured, Biological, Light, Mechanical, Psionic, Flying et Ground.\n• Ciblage : certaines armes ne peuvent tirer que sur certains Combat Tags (ex. « Target: Flying »).\n• Surge : l’efficacité de Surge d’une arme ne se déclenche que si la cible a le Combat Tag indiqué dans son Surge Type (partie 8.7.4).\n• Bonus : des capacités comme ANTI-EVADE (X) ou PIERCE (X) ne s’appliquent souvent qu’à certains Combat Tags.\nNote : le Combat Tag Ground et l’élévation GROUND LEVEL sont deux choses différentes. Une unité volante posée sur le tapis est au GROUND LEVEL mais n’a pas le Combat Tag Ground. Dans les règles, Ground en gras désigne toujours le Combat Tag, GROUND LEVEL désigne toujours l’élévation."],["CONCENTRATED FIRE (X)","Attacks with this weapon may remove no more than X models as casualties. Once X models have been removed, discard any remaining Total Damage. It is not recorded as a Damage Marker and does not carry over.","Les attaques avec cette arme ne peuvent pas retirer plus de X figurines. Une fois X figurines retirées, défausse le reste du total de dégâts : il n’est pas noté sur un marqueur de dégâts et n’est pas reporté."],["CONTROLLING PLAYER","The player who commands a specific Unit, model, or Token. They make all decisions and roll all dice. Certain abilities (e.g., Neural Parasite) can transfer control; the new controller then acts in every respect as though the Unit were their own.","Le joueur qui commande une unité, une figurine ou un jeton. Il prend toutes les décisions et lance tous les dés. Certaines capacités (ex. Neural Parasite) peuvent transférer le contrôle ; le nouveau contrôleur agit alors en tout point comme si l’unité était la sienne."],["CRITICAL HIT (X)","Move X dice from the Armour Pool directly to the Damage Pool, bypassing Armour. CRITICAL HIT can never move more dice than are in the Armour Pool.","Déplace X dés du pool d’armure directement vers le pool de dégâts, sans jet d’armure. CRITICAL HIT ne peut jamais déplacer plus de dés qu’il n’y en a dans le pool d’armure."],["CURRENT SUPPLY VALUE","The Current Supply Value of a Unit is its Supply Value at this moment, based on the number of models remaining in the Unit as shown on the Supply Profile (Part 6.1). Update the Current Supply Value immediately whenever a casualty reduces the model count into a lower bracket. The Current Supply Value is referenced when checking whether a Unit may be deployed from Reserves (Part 8.3.2), when determining Mission Marker Control (Part 8.9.1), when evaluating Tactical Mass for Disengage (Part 8.5.4), and when calculating Victory Points for Supply-based scoring conditions.","Le supply actuel d’une unité est sa valeur de Supply à cet instant, selon le nombre de figurines restantes indiqué sur son profil de supply (partie 6.1). Mets-le à jour dès qu’une perte fait passer l’effectif dans une tranche inférieure. Le supply actuel sert pour savoir si une unité peut se déployer depuis la réserve (partie 8.3.2), pour le contrôle des marqueurs de mission (partie 8.9.1), pour la Tactical Mass au Disengage (partie 8.5.4) et pour les points de victoire basés sur le supply."],["DEBUFF [Characteristic] (X)","The Unit suffers a penalty of X to the specified characteristic until the End of the Round.\n• Target Number characteristic: increase the value by X (harder to roll).\n• Value characteristic: decrease the value by X (minimum 0).","L’unité subit une pénalité de X à la caractéristique indiquée jusqu’à la fin du round.\n• Caractéristique à seuil : augmente la valeur de X (plus difficile à réussir).\n• Caractéristique à valeur : diminue la valeur de X (minimum 0)."],["DISPLACEMENT","The Leading Model may end a move overlapping this Token or Unit (overrides Part 7.3.1). If the Leading Model ends any Move, Deploy, Run, Charge, Disengage, Close Ranks or Special Ability move Overlapping this Token or model, the controlling player of the Leading Model immediately sets it in Base-to-Base contact with the Leading Model. If Base-to-Base is not possible, sets it as close as possible.","Le modèle de tête peut finir un déplacement en chevauchant ce jeton ou cette unité (prime sur la partie 7.3.1). Si le modèle de tête termine un Move, Deploy, Run, Charge, Disengage, Close Ranks ou déplacement de capacité spéciale en chevauchant ce jeton ou cette figurine, son joueur le place immédiatement au contact socle à socle du modèle de tête. Si ce n’est pas possible, aussi près que possible."],["DODGE (X)","When this Unit is targeted by an attack, reduce the number of dice moved from the Armour Pool to the Damage Pool by Surge or CRITICAL HIT by X (minimum 0). Apply during the Resolve Surge step.","Quand cette unité est visée par une attaque, réduis de X (minimum 0) le nombre de dés déplacés du pool d’armure vers le pool de dégâts par Surge ou CRITICAL HIT. S’applique pendant l’étape de résolution de Surge."],["EFFECTIVE SIZE","A model’s Effective Size is equal to its Size characteristic plus the Size of any terrain it is standing on (Part 7.1.2). A model at GROUND LEVEL has an Effective Size equal to its own Size characteristic only. A model on HIGH GROUND (Size 3+) or MID GROUND (Size 1–2) adds the terrain’s Size to its own. Terrain pieces set on elevated surfaces stack in the same way – a terrain piece’s Effective Size equals its own Size plus the Size of the terrain it stands on. Effective Size determines which terrain blocks Line of Sight through Full Cover and Direct Cover (Part 7.1.1). Flying models are treated as having an Effective Size higher than any terrain piece on the table for Cover purposes (Part 7.1.4).","La taille effective d’une figurine est égale à sa caractéristique Size plus la taille du décor sur lequel elle se tient (partie 7.1.2). Au GROUND LEVEL, elle est égale à sa seule Size. Sur HIGH GROUND (taille 3+) ou MID GROUND (taille 1–2), on ajoute la taille du décor. Les décors posés sur des surfaces surélevées s’additionnent de la même façon. La taille effective détermine quels décors bloquent la ligne de vue (couvert total et couvert direct, partie 7.1.1). Les figurines volantes comptent comme ayant une taille effective supérieure à tout décor de la table pour le couvert (partie 7.1.4)."],["ELEVATION LEVEL","Models can stand one of three elevations:\n• GROUND LEVEL: Standing directly on the playmat.\n• MID GROUND: Standing on horizontal terrain of Size 1 or 2.\n• HIGH GROUND: Standing on horizontal terrain of Size 3 or larger. The model stands on elevation if its base is at that elevation. If the model’s base is on multiple elevation levels, assume it is standing on the highest of those elevations.","Les figurines peuvent se tenir sur trois élévations :\n• GROUND LEVEL : directement sur le tapis.\n• MID GROUND : sur un décor horizontal de taille 1 ou 2.\n• HIGH GROUND : sur un décor horizontal de taille 3 ou plus.\nUne figurine est à une élévation si son socle y est. Si son socle repose sur plusieurs niveaux, elle est considérée sur le plus haut."],["ENEMY","All Units, Tokens, and cards belonging to the opponent are Enemies. In team games, all opposing players’ Units, Tokens, and cards are Enemies. A Unit may never target a Friendly Unit with an attack unless a rule explicitly states otherwise. Enemy is the opposite of Friendly and is referenced throughout the rules to determine valid targets, Engagement, and Mission Marker contests.","Toutes les unités, tous les jetons et toutes les cartes de l’adversaire sont ennemis. En partie à équipes, tout ce qui appartient aux joueurs adverses est ennemi. Une unité ne peut jamais viser une unité amie avec une attaque, sauf si une règle le dit explicitement. Ennemi est le contraire d’ami ; ce terme sert pour les cibles valides, l’engagement et la contestation des marqueurs."],["ENGAGED","A Ground Unit is Engaged when any of its models is Within 1” (Engagement Range) of any model in an Enemy Ground Unit, provided the following conditions are met (Part 7.2.1):\n• Combat Tags match: Ground models Engage only Ground models. Flying models cannot be Engaged by any model.\n• Terrain does not block: Size 2+ terrain between the models prevents Engagement, even if they are Within 1”. Models on HIGH GROUND cannot Engage models at GROUND LEVEL, and vice versa. When any model in a Unit is Engaged, the entire Unit is considered Engaged. An Engaged Unit cannot perform a standard Move – it must Disengage (Part 8.5.4) or Hold. Engaged Units are also subject to restrictions on Ranged Attacks (Part 8.7.3).","Une unité Ground est engagée quand l’une de ses figurines est à 1\" (Engagement Range) d’une figurine d’une unité Ground ennemie, si ces conditions sont remplies (partie 7.2.1) :\n• Combat Tags compatibles : les figurines Ground n’engagent que des figurines Ground. Les figurines volantes ne peuvent être engagées par aucune figurine.\n• Le terrain ne bloque pas : un décor de taille 2+ entre les figurines empêche l’engagement, même à 1\". Les figurines sur HIGH GROUND ne peuvent pas engager des figurines au GROUND LEVEL, et inversement.\nDès qu’une figurine d’une unité est engagée, toute l’unité est engagée. Une unité engagée ne peut pas faire de Move normal : elle doit faire Disengage (partie 8.5.4) ou Hold. Les unités engagées ont aussi des restrictions de Ranged Attack (partie 8.7.3)."],["ENGAGEMENT RANGE","The Engagement Range extends 1” horizontally from any model’s base. When two Enemy Ground models are Within each other’s Engagement Range, they are Engaged (Part 7.2). Engagement Range is measured horizontally from a top-down perspective, ignoring vertical height (Part 4.1). It is referenced when resolving Move restrictions (Part 8.5.3), Disengage (Part 8.5.4), Charge (Part 8.6.2), the Fighting Rank (Part 8.8.1), and PLACE effects. Melee weapons list E as their Range, indicating they may only strike targets Within the Engagement Range.","L’Engagement Range s’étend à 1\" à l’horizontale autour du socle d’une figurine. Quand deux figurines Ground ennemies sont chacune dans l’Engagement Range de l’autre, elles sont engagées (partie 7.2). On la mesure à l’horizontale, vue de dessus, sans tenir compte de la hauteur (partie 4.1). Elle sert pour les restrictions de Move (8.5.3), le Disengage (8.5.4), la Charge (8.6.2), le Fighting Rank (8.8.1) et les effets PLACE. Les armes de mêlée ont une portée « E » : elles ne frappent que des cibles dans l’Engagement Range."],["ENTRY EDGE","The table edge assigned to a player by the Deployment Card. Units enter the battlefield from this edge when deploying from Reserves.","Le bord de table attribué à un joueur par la Deployment Card. Les unités entrent sur le champ de bataille par ce bord quand elles se déploient depuis la réserve."],["FACTION TAGS","Faction Tags are keywords printed on Unit Cards, Tactical Cards, and Faction Cards that identify allegiance.\n• Race Tags: Terran, Zerg, Protoss.\n• Sub-Faction Tags: Specific broods or organisations, e.g., Kerrigan’s Swarm, Raynor’s Raiders.\n• Function: During Army Building, a player may include only Units and Tactical Cards whose Faction Tags all appear on the chosen Faction Card. If even one tag on the Unit or Tactical Card does not appear on the Faction Card, that card cannot be included. A Unit with fewer tags than the Faction Card is permitted – it only requires its own tags to be present (Part 9.1.2).","Les Faction Tags sont des mots-clés imprimés sur les cartes d’unité, Tactical Cards et Faction Cards qui indiquent l’allégeance.\n• Race : Terran, Zerg, Protoss.\n• Sous-faction : couvées ou organisations précises, ex. Kerrigan’s Swarm, Raynor’s Raiders.\n• Usage : pendant la construction d’armée, on ne peut inclure que des unités et Tactical Cards dont tous les Faction Tags figurent sur la Faction Card choisie. Si un seul tag manque sur la Faction Card, la carte est interdite. Une unité qui a moins de tags que la Faction Card est autorisée : seuls ses propres tags doivent y figurer (partie 9.1.2)."],["FIGHTING RANK","A model is in the Fighting Rank if it is Within the Engagement Range (1”) of an Enemy model. Models in the Fighting Rank may strike with their Combat Phase weapons. See Part 8.8.1, Step 2.","Une figurine est dans le Fighting Rank si elle est dans l’Engagement Range (1\") d’une figurine ennemie. Les figurines du Fighting Rank peuvent frapper avec leurs armes de phase de Combat. Voir partie 8.8.1, étape 2."],["FIRST PLAYER MARKER","A physical Token used to track which player has initiative. At the start of the game, the winner of the Roll-Off (Part 3.2) assigns the First Player Marker to either player for Round 1. The holder of the First Player Marker chooses which player activates first at the start of each Phase. The Marker changes hands in two ways: the first player to Pass during Phase 1 or Phase 2 takes the First Player Marker for the following Phase, and at the end of Phase 4 the Marker is awarded to the player with fewer Victory Points (Part 8.9.6). If Victory Points are tied, both players Roll-Off and the winner takes the Marker.","Jeton physique qui indique quel joueur a l’initiative. En début de partie, le vainqueur du roll-off (partie 3.2) donne le marqueur Premier joueur à l’un des deux joueurs pour le round 1. Son détenteur choisit quel joueur active en premier au début de chaque phase. Le marqueur change de main de deux façons : le premier joueur à passer en phase 1 ou 2 le prend pour la phase suivante, et à la fin de la phase 4 il revient au joueur qui a le moins de points de victoire (partie 8.9.6). En cas d’égalité de PV, les joueurs font un roll-off et le gagnant le prend."],["FLYING","Flying Units trade board control (no Mission Markers, no melee) for mobility and immunity to terrain.\n• A Flying Unit ignores all terrain for movement purposes. The Leading Model moves point-to-point, measuring horizontally. Other models may pass through a Flying model’s base as if it were not there, and vice versa.\n• A Flying Unit is never Engaged. Ground models cannot Engage Flying models, and Flying models cannot Engage other Flying models. A Flying Unit must end its movement at least 1” away from all Enemy Flying Units.\n• Flying model ignore the Full Cover rule. Direct Cover and the Elevation Dead Zone rules still apply. Assume that Flying Units’ Effective Size is higher than the Effective Size of any terrain piece on the table.\n• A Flying Unit does not benefit from HIGH GROUND Cover (Part 7.1.3).\n• A Flying Unit cannot Control or Contest Mission Markers (overrides Parts 6.2 and 8.9.1).\n• A Flying Unit cannot Charge or be Charged.\n• A Flying Unit cannot participate in the Combat Phase (Part 8.8).\n• A Flying Unit ignores elevation. It does not use Access Points. For Cover and Line of Sight purposes, treat a Flying Unit’s Effective Size as higher than the Effective Size of any terrain piece on the table (Part 7.1.4). Terrain does not contribute to a Flying model’s Effective Size.\n• A Flying Unit moving over Grass does not destroy the Grass terrain piece. If a Flying Unit ends on a Grass terrain piece, it is removed as normal.","Les unités volantes échangent le contrôle du terrain (pas de marqueurs de mission, pas de mêlée) contre la mobilité et l’immunité au terrain.\n• Une unité volante ignore tout le terrain pour ses déplacements. Le modèle de tête se déplace en ligne droite, mesuré à l’horizontale. Les autres figurines peuvent traverser le socle d’une figurine volante comme s’il n’existait pas, et inversement.\n• Une unité volante n’est jamais engagée. Les figurines Ground ne peuvent pas engager les volants, et les volants ne s’engagent pas entre eux. Une unité volante doit finir son déplacement à au moins 1\" de toute unité volante ennemie.\n• Les figurines volantes ignorent la règle de couvert total. Le couvert direct et la zone morte d’élévation s’appliquent toujours. Leur taille effective est considérée supérieure à celle de tout décor de la table.\n• Une unité volante ne bénéficie pas du couvert de HIGH GROUND (partie 7.1.3).\n• Une unité volante ne peut ni contrôler ni contester de marqueur de mission (prime sur les parties 6.2 et 8.9.1).\n• Une unité volante ne peut ni charger ni être chargée.\n• Une unité volante ne participe pas à la phase de Combat (partie 8.8).\n• Une unité volante ignore l’élévation et n’utilise pas les Access Points. Pour le couvert et la ligne de vue, sa taille effective est supérieure à celle de tout décor (partie 7.1.4). Le terrain ne s’ajoute pas à sa taille effective.\n• Une unité volante qui survole un décor Grass ne le détruit pas. Si elle finit sur un décor Grass, celui-ci est retiré normalement."],["FRIENDLY","All Units, Tokens, and cards belonging to the Controlling Player are Friendly to one another. In team games, all teammates’ Units, Tokens, and cards are also Friendly. A Unit’s own models are always Friendly to it. Friendly is the opposite of Enemy and is used throughout the rules to determine targeting restrictions, movement interactions, and ability eligibility.","Toutes les unités, tous les jetons et toutes les cartes du joueur qui les contrôle sont amis entre eux. En partie à équipes, ceux des coéquipiers sont aussi amis. Les figurines d’une unité lui sont toujours amies. Ami est le contraire d’ennemi ; ce terme sert pour les restrictions de ciblage, les interactions de mouvement et l’éligibilité des capacités."],["GRASS","A terrain piece with a Size of 2 that follows special rules. Unlike other Size 2 terrain, Grass does not block movement but does block Line of Sight, following the standard Cover rules (Part 7.1.1). Grass is destroyed by the passage of war. If a Leading Model’s path of travel passes through or any model of a Unit ends on a Grass terrain piece during any movement action (Move, Deploy, Run, Charge, Disengage or Close Ranks), that Grass terrain piece is immediately removed from the game. It does not return during Cleanup & Refresh and cannot be replaced by any means. A Flying Unit moving over Grass does not destroy the Grass terrain piece. Flying models pass above the terrain, not through it. If any model of a Flying Unit ends on a Grass terrain piece, it is removed as normal.","Décor de taille 2 avec des règles spéciales. Contrairement aux autres décors de taille 2, le Grass ne bloque pas le mouvement mais bloque la ligne de vue selon les règles de couvert normales (partie 7.1.1). Le Grass est détruit par le passage des combats : si le trajet d’un modèle de tête le traverse, ou si une figurine d’une unité finit dessus pendant une action de mouvement (Move, Deploy, Run, Charge, Disengage ou Close Ranks), il est immédiatement retiré de la partie. Il ne revient pas au nettoyage et ne peut être remplacé d’aucune façon. Une unité volante qui le survole ne le détruit pas : les volants passent au-dessus. Si une figurine volante finit dessus, il est retiré normalement."],["GROUND LEVEL","One of the elevation levels. Model is on the GROUND LEVEL when it is standing directly on the playmat. Models on GROUND LEVEL cannot Engage models on HIGH GROUND, and vice versa. Models on GROUND LEVEL can Engage models on MID GROUND only if both models are adjacent to the same ACCESS POINT connecting their respective elevations. A model at GROUND LEVEL has an Effective Size equal to its own Size characteristic only.","Un des niveaux d’élévation. Une figurine est au GROUND LEVEL quand elle se tient directement sur le tapis. Les figurines au GROUND LEVEL ne peuvent pas engager celles sur HIGH GROUND, et inversement. Elles ne peuvent engager celles sur MID GROUND que si les deux sont adjacentes au même ACCESS POINT reliant leurs élévations. Au GROUND LEVEL, la taille effective est égale à la seule caractéristique Size."],["HEAL (X)","Remove X points of accumulated Damage from the Unit (reduce its Damage Marker accordingly). HEAL cannot return Destroyed models – it only reduces existing Damage. See also: RESPAWN.","Retire X points de dégâts accumulés de l’unité (réduis son marqueur de dégâts d’autant). HEAL ne ramène pas les figurines détruites : il réduit seulement les dégâts existants. Voir aussi : RESPAWN."],["HIDDEN","This Unit cannot be selected as the target of a Ranged Attack or any LoS-requiring Special Ability unless the acting model is Within 4” of it. A HIDDEN Unit is immune to the IMPACT keyword. A HIDDEN Unit may make an Evade Roll against every attack targeting it. HIDDEN is classified as a Status.","Cette unité ne peut pas être choisie comme cible d’une Ranged Attack ni d’une capacité spéciale demandant une ligne de vue, sauf si la figurine qui agit est à 4\" d’elle. Une unité HIDDEN est immunisée au mot-clé IMPACT. Elle peut faire un jet d’Evade contre chaque attaque qui la vise. HIDDEN est un statut."],["HIGH GROUND","One of the elevation levels. Model is on the HIGH GROUND when standing on horizontal terrain of Size 3 or larger. Models on HIGH GROUND cannot Engage models on GROUND LEVEL, and vice versa. Models on HIGH GROUND can Engage models on MID GROUND only if both models are adjacent to the same ACCESS POINT connecting their respective elevations. A model on HIGH GROUND has an Effective Size equal to its own Size plus the terrain’s Size.","Un des niveaux d’élévation. Une figurine est sur HIGH GROUND quand elle se tient sur un décor horizontal de taille 3 ou plus. Les figurines sur HIGH GROUND ne peuvent pas engager celles au GROUND LEVEL, et inversement. Elles ne peuvent engager celles sur MID GROUND que si les deux sont adjacentes au même ACCESS POINT reliant leurs élévations. Sur HIGH GROUND, la taille effective est égale à sa Size plus la taille du décor."],["HITS X (Y)","The affected Unit suffers X automatic hits. Set X dice directly into the Armour Pool and proceed immediately to Armour Rolls (Part 8.7.4, Steps 3–4). Treat the Damage characteristic as Y. These hits do not generate Surge.","L’unité touchée subit X touches automatiques. Place X dés directement dans le pool d’armure et passe tout de suite aux jets d’armure (partie 8.7.4, étapes 3–4). La caractéristique Damage vaut Y. Ces touches ne génèrent pas de Surge."],["IMPACT (X) Y","Immediately after this Unit completes a successful Charge, check every model in the Fighting Rank or Supporting Rank. For each eligible model, generate X Impact Dice:\n• If the model is in the Fighting Rank or Supporting Rank against only one Enemy Unit, all X dice go to that Unit.\n• If the model is in the Fighting Rank or Supporting Rank against multiple Enemy Units, the controlling player may split the dice between those Units. Roll the allocated dice for each target Unit separately (this is the Impact Hit Roll). For each result of Y or higher, set 1 die into the target’s Armour Pool. Proceed immediately to Armour Rolls. These hits do not generate Surge and treat Damage as 1.","Juste après une charge réussie de cette unité, regarde chaque figurine du Fighting Rank ou du Supporting Rank. Chaque figurine éligible génère X dés d’Impact :\n• Si elle est dans le Fighting ou Supporting Rank contre une seule unité ennemie, les X dés vont à cette unité.\n• Si elle l’est contre plusieurs unités ennemies, son joueur peut répartir les dés entre elles.\nLance séparément les dés attribués à chaque unité ciblée (c’est le jet de touche d’Impact). Pour chaque résultat de Y ou plus, place 1 dé dans le pool d’armure de la cible, puis passe tout de suite aux jets d’armure. Ces touches ne génèrent pas de Surge et ont Damage 1."],["IMPASSABLE TERRAIN","A terrain piece is Impassable if it has no Access Point connecting it to an adjacent elevation level. Models cannot move through, onto, or across IMPASSABLE TERRAIN, and no model may end its movement overlapping it. Models can move through Terrain of Sizes 0 and 1.","Un décor est infranchissable s’il n’a aucun Access Point le reliant à un niveau d’élévation voisin. Les figurines ne peuvent ni le traverser, ni monter dessus, ni passer par-dessus, et aucune ne peut finir un déplacement en le chevauchant. Les figurines peuvent traverser les décors de taille 0 et 1."],["INDIRECT FIRE","Ranged Attacks with this weapon may ignore Line of Sight when selecting a target and resolving Damage. The target must still be Within Range. If the target is not within Line of Sight, it may make an Evade Roll against this attack.","Les Ranged Attacks avec cette arme peuvent ignorer la ligne de vue pour choisir la cible et résoudre les dégâts. La cible doit quand même être à portée. Si la cible n’est pas en ligne de vue, elle peut faire un jet d’Evade contre cette attaque."],["INSTANT","Enemy Units cannot declare or resolve Reaction abilities in response to attacks made with this weapon.","Les unités ennemies ne peuvent ni déclarer ni résoudre de capacités Reaction en réponse aux attaques faites avec cette arme."],["LEADING MODEL","The Leading Model is a temporary reference point used to execute a Unit’s movement. Whenever a Unit performs a Move, Deploy, Run, Charge, Disengage, Close Ranks, or any action that instructs the Unit to nominate a Leading Model, the Controlling Player selects one model in the Unit. Move the Leading Model first, measuring its exact path. Then set the remaining models in valid Coherency around the Leading Model’s new position (Part 4.4). The Leading Model nomination ends once the action resolves. The Leading Model determines the Unit’s Gap Clearance category and interacts with terrain restrictions (Part 4.6).","Le modèle de tête est un point de référence temporaire pour déplacer une unité. Chaque fois qu’une unité fait un Move, Deploy, Run, Charge, Disengage, Close Ranks, ou toute action qui demande de désigner un modèle de tête, son joueur choisit une figurine de l’unité. Déplace d’abord le modèle de tête en mesurant son trajet exact, puis place les autres figurines en cohésion valide autour de sa nouvelle position (partie 4.4). La désignation prend fin une fois l’action résolue. Le modèle de tête détermine la catégorie de Gap Clearance de l’unité et interagit avec les restrictions de terrain (partie 4.6)."],["LINE OF SIGHT (LoS)","Line of Sight determines what a model can see and, by extension, what it can target with attacks and abilities. All Line of Sight checks are resolved from a 2D topdown perspective, looking directly down at the battlefield from above. To determine if a model can see a target, trace an imaginary straight line from any part of the acting model’s base to any part of the target model’s base. Vertical height is never factored into the trace. If the trace does not pass through any Blocking Terrain (any terrain piece with an Effective Size of 1 or greater), the target is Visible. No further checks are required. If the trace passes through Blocking Terrain, the target is not automatically hidden. Apply the Cover rules (Part 7.1.1) to determine whether that terrain actually blocks the Line of Sight:\n• Full Cover: The terrain’s Effective Size is equal to or greater than the Effective Size of both the attacker and the target. Line of Sight is blocked.\n• Direct Cover: The trace passes through a terrain piece, and either the attacker or the target is Within 1” of that terrain, provided the terrain’s Effective Size is equal to or greater than the Effective Size of the model that is Within 1”. Line of Sight is blocked. Exception: If both the attacker and the target are Within 1” of the same terrain piece and Within 3” of each other, resolve Line of Sight normally.\n• Elevation Dead Zone: A model on HIGH GROUND (Size 3+) cannot see a model at GROUND LEVEL that is Within 1” of the base of the same terrain piece, and vice versa. The same Close Quarters exception applies. Each terrain piece is assessed independently. Terrain pieces do not combine their Effective Size or proximity. If no single terrain piece meets the requirements for Full Cover or Direct Cover, Line of Sight is not blocked, regardless of how many terrain pieces the trace passes through. A terrain piece’s footprint is defined by its physical base or outermost edges viewed from above. Gaps, windows, doorways, and open interiors within the footprint do block the Line of Sight unless players agree otherwise during Battlefield Setup (Part 7.1). Flying models ignore the Full Cover rule. Direct Cover and the Elevation Dead Zone still apply. Treat a Flying model’s Effective Size as higher than the Effective Size of any terrain piece on the table (Part 7.1.4). Line of Sight is mutual: if Model A can see Model B, Model B can see Model A through the same trace.","La ligne de vue détermine ce qu’une figurine voit et donc ce qu’elle peut viser avec ses attaques et capacités. Elle se vérifie toujours en 2D, vue de dessus. Pour savoir si une figurine voit une cible, trace une ligne droite imaginaire de n’importe quel point de son socle à n’importe quel point du socle de la cible. La hauteur n’entre jamais en compte. Si la ligne ne traverse aucun Blocking Terrain (décor de taille effective 1 ou plus), la cible est visible. Si elle en traverse un, la cible n’est pas forcément cachée : applique les règles de couvert (partie 7.1.1).\n• Couvert total : la taille effective du décor est ≥ à celle du tireur ET de la cible. La ligne de vue est bloquée.\n• Couvert direct : la ligne traverse un décor et le tireur ou la cible est à 1\" de ce décor, si la taille effective du décor est ≥ à celle de la figurine qui est à 1\". La ligne de vue est bloquée. Exception : si le tireur et la cible sont tous deux à 1\" du même décor et à 3\" l’un de l’autre, la ligne de vue se résout normalement.\n• Zone morte d’élévation : une figurine sur HIGH GROUND (taille 3+) ne voit pas une figurine au GROUND LEVEL située à 1\" du pied du même décor, et inversement. Même exception de corps à corps.\nChaque décor s’évalue seul : les décors n’additionnent ni leur taille ni leur proximité. Si aucun décor ne remplit à lui seul les conditions de couvert total ou direct, la ligne de vue n’est pas bloquée, quel que soit le nombre de décors traversés. L’emprise d’un décor est son socle ou ses bords extérieurs vus de dessus ; ouvertures, fenêtres, portes et intérieurs ouverts bloquent la ligne de vue, sauf accord des joueurs à la mise en place (partie 7.1). Les volants ignorent le couvert total ; le couvert direct et la zone morte s’appliquent. La ligne de vue est réciproque : si A voit B, B voit A par la même ligne."],["LOCKED IN (X)","When making a Ranged Attack with this weapon, add X to its RoA if the target Unit has Stationary Status.","Quand tu fais une Ranged Attack avec cette arme, ajoute X à sa RoA si l’unité ciblée a le statut Stationary."],["LONG RANGE (X)","The maximum Range of this weapon increases to X”. Measure each attacking model’s distance to the target individually:\n• Within normal profile Range: attack resolves normally.\n• Beyond profile Range but Within X”: the model suffers a -1 Modifier to its Hit roll. If a Batch contains models at both Standard and Long Range, generate the total dice but roll the two groups separately to account for different Hit Target Numbers.","La portée maximale de cette arme passe à X\". Mesure la distance de chaque figurine qui attaque séparément :\n• Dans la portée normale du profil : l’attaque se résout normalement.\n• Au-delà de la portée du profil mais à X\" ou moins : la figurine subit un modificateur −1 à son jet de touche.\nSi un batch contient des figurines aux deux distances, génère tous les dés mais lance les deux groupes séparément, car leurs seuils de touche diffèrent."],["MID GROUND","One of the elevation levels. Model is on the MID GROUND when standing on horizontal terrain of Size 1 or 2. Models on MID GROUND can Engage models on HIGH GROUND or GROUND LEVEL only if both models are adjacent to the same ACCESS POINT connecting their respective elevations. A model on MID GROUND has an Effective Size equal to its own Size plus the terrain’s Size.","Un des niveaux d’élévation. Une figurine est sur MID GROUND quand elle se tient sur un décor horizontal de taille 1 ou 2. Les figurines sur MID GROUND ne peuvent engager celles sur HIGH GROUND ou au GROUND LEVEL que si les deux sont adjacentes au même ACCESS POINT reliant leurs élévations. Sur MID GROUND, la taille effective est égale à sa Size plus la taille du décor."],["MISSION MARKERS","Numbered Markers are set on the battlefield during Setup at the coordinates shown on the Deployment Card. Each Marker is 32mm in diameter and has two sides: Activated or Deactivated. Markers 1 & 3 are Red, Markers 2 & 4 are Blue, and Marker 5 is Neutral. Mission Markers are the primary scoring mechanism. At the end of each Round, players determine Control of each Marker by comparing the Total Current Supply Value of their eligible contesting Units (Part 8.9.1). A Unit may Contest a Mission Marker only if it is on the battlefield, In Coherency, and has at least one model Within 3” with Line of Sight to the Marker on the same elevation. Flying Units and BURROWED Units cannot Contest or Control Mission Markers. Control is Sticky – once a player Controls a Marker, it remains under their control until the opponent reclaims it with a higher contesting Supply total. A tied result never transfers control.","Marqueurs numérotés placés sur le champ de bataille pendant la mise en place, aux coordonnées de la Deployment Card. Chacun mesure 32 mm de diamètre et a deux faces : Activated et Deactivated. Les marqueurs 1 et 3 sont rouges, 2 et 4 bleus, 5 neutre. Ils sont le principal moyen de marquer des points. À la fin de chaque round, on détermine le contrôle de chaque marqueur en comparant le supply actuel total des unités éligibles qui le contestent (partie 8.9.1). Une unité ne peut contester que si elle est sur le champ de bataille, en cohésion, et qu’au moins une figurine est à 3\" du marqueur avec ligne de vue et à la même élévation. Les unités volantes et BURROWED ne contestent ni ne contrôlent. Le contrôle est « collant » : une fois pris, il reste au joueur jusqu’à ce que l’adversaire le reprenne avec un total de supply supérieur. Une égalité ne transfère jamais le contrôle."],["MODIFIER","A Modifier adjusts the Target Number of a roll. Apply all Modifiers before rolling (Part 3.4).\n• +X Modifier: Makes the roll easier by reducing the Target Number by X.\n• -X Modifier: Makes the roll harder by increasing the Target Number by X. Modifiers from different named sources are cumulative unless otherwise stated. A Target Number can never be modified below 2+ or above 6+. Modifiers adjust the Target Number, not the dice result. A natural roll of 6 always succeeds, and a natural roll of 1 always fails, regardless of Modifiers (Part 3.6). A Modifier is distinct from a Fixed Addition (Part 3.5), which generates a value rather than adjusting a Target Number.","Un modificateur ajuste le seuil d’un jet. Applique tous les modificateurs avant de lancer (partie 3.4).\n• Modificateur +X : le jet est plus facile, le seuil baisse de X.\n• Modificateur −X : le jet est plus difficile, le seuil monte de X.\nLes modificateurs de sources nommées différentes se cumulent, sauf mention contraire. Un seuil ne peut jamais descendre sous 2+ ni monter au-delà de 6+. Les modificateurs changent le seuil, pas le résultat du dé. Un 6 naturel réussit toujours et un 1 naturel échoue toujours, quels que soient les modificateurs (partie 3.6). Un modificateur est différent d’un ajout fixe (partie 3.5), qui génère une valeur au lieu d’ajuster un seuil."],["MORPH (Unit Name) X","To perform this ability, the controlling player must have sufficient Available Supply. Set one (Name) model in Base-to-Base contact with a model from the active Unit, then remove X models from that Unit from the battlefield. The (Name) model forms a new Unit and cannot be set Within 1” of any Enemy Unit. Place an Activation Marker next to the new Unit; it cannot be Activated for the remainder of the Round.","Pour utiliser cette capacité, le joueur doit avoir assez de supply disponible. Place une figurine (Nom) au contact socle à socle d’une figurine de l’unité active, puis retire X figurines de cette unité du champ de bataille. La figurine (Nom) forme une nouvelle unité et ne peut pas être placée à 1\" d’une unité ennemie. Place un marqueur d’activation à côté de la nouvelle unité ; elle ne peut pas être activée jusqu’à la fin du round."],["NON-LETHAL DAMAGE (X)","The Unit suffers X points of Damage. Add this amount effectively to the Unit’s Damage Marker. Do not remove any models, even if Total Damage exceeds a model’s HP. If the Unit subsequently suffers standard Damage, the combined Total Damage triggers casualty removal normally.","L’unité subit X points de dégâts. Ajoute ce montant à son marqueur de dégâts, sans retirer de figurine, même si le total dépasse les PV d’une figurine. Si l’unité subit ensuite des dégâts normaux, le total cumulé déclenche le retrait des pertes normalement."],["ON CREEP","A Friendly or Enemy Ground Zerg Unit is considered to be ON CREEP while it is Within 6” of any Creep Tumor Token or any model designated as a Source of Creep. While satisfying this condition, the Unit gains the ON CREEP keyword. This allows the Unit to trigger specific Special Abilities or Upgrades that require this state.","Une unité Zerg Ground, amie ou ennemie, est ON CREEP tant qu’elle est à 6\" d’un jeton Creep Tumor ou d’une figurine désignée comme source de Creep. Tant que c’est le cas, elle gagne le mot-clé ON CREEP, ce qui lui permet de déclencher les capacités spéciales ou améliorations qui demandent cet état."],["PIERCE [TAG] X","When attacking a Unit with the specified Combat Tag, treat this weapon’s Damage characteristic as X.","Quand cette arme attaque une unité qui a le Combat Tag indiqué, sa caractéristique Damage vaut X."],["PINPOINT","Ranged Attacks with this weapon may target Engaged Enemy Units, ignoring the standard Engagement Status restriction (overrides Part 8.7.3, Step 1).","Les Ranged Attacks avec cette arme peuvent viser des unités ennemies engagées, en ignorant la restriction normale liée à l’engagement (prime sur la partie 8.7.3, étape 1)."],["PLACE (X)","Choose a Leading Model. Remove it and set it Wholly Within X” of its starting position. Then remove and replace all other models in the Unit, maintaining Coherency (Part 4.4). PLACE ignores Gap Clearance, and elevation requirements. The Leading Model is removed and set directly, not moved along a path. However, they must end in a legal position and not Within the Engagement Range of any enemy model. Models using the PLACE effect during the Assault Phase may be set Within the Engagement Range of Enemy models (the Unit becomes Engaged).","Choisis un modèle de tête. Retire-le et replace-le entièrement à X\" de sa position de départ. Retire puis replace ensuite toutes les autres figurines de l’unité en gardant la cohésion (partie 4.4). PLACE ignore le Gap Clearance et les contraintes d’élévation. Le modèle de tête est replacé directement, pas déplacé le long d’un trajet. Les figurines doivent cependant finir dans une position légale et hors de l’Engagement Range de toute figurine ennemie. En phase d’Assaut, les figurines qui utilisent PLACE peuvent être placées dans l’Engagement Range d’ennemis (l’unité devient engagée)."],["PRECISION (X)","After rolling to Hit, move up to X failed Attack Dice directly into the Armour Pool. Treat them as successful Hits for all purposes, including Surge.","Après le jet de touche, déplace jusqu’à X dés d’attaque ratés directement dans le pool d’armure. Ils comptent comme des touches réussies à tous points de vue, Surge compris."],["READY","The default state of a Tactical Card or Faction Card. A Ready card is face-up, its abilities are available, and it may be Exhausted to pay resource costs or activate its Special Abilities. All Tactical Cards and Faction Cards begin each Round in the Ready state. Cards that have been Exhausted are returned to Ready during Cleanup & Refresh (Part 8.9.5).","L’état normal d’une Tactical Card ou d’une Faction Card. Une carte prête est face visible, ses capacités sont disponibles et elle peut être épuisée pour payer un coût en ressources ou activer ses capacités spéciales. Toutes les Tactical Cards et Faction Cards commencent chaque round prêtes. Les cartes épuisées redeviennent prêtes au nettoyage (partie 8.9.5)."],["REPEATABLE","This ability is exempt from the Once Per Round limit (Part 2.7.1). It may be used multiple times per Round and per Activation, provided all Costs and trigger conditions are met each time.","Cette capacité échappe à la limite d’une fois par round (partie 2.7.1). Elle peut servir plusieurs fois par round et par activation, si tous les coûts et conditions de déclenchement sont remplis à chaque fois."],["RESERVES","A holding area off the battlefield where Units remain until they are deployed. All Units begin the game in Reserves. While in Reserves, a Unit:\n• Cannot be targeted by attacks or abilities unless an ability explicitly states it affects Units in Reserves.\n• Cannot use Active Abilities, Passive Abilities, or Reaction Abilities unless the ability explicitly states otherwise.\n• Cannot Control or Contest Mission Markers.\n• Does not contribute its Current Supply Value to the player’s Total Current Supply on the battlefield.\n• Retains all equipment, upgrades, and weapon selections assigned during Army Building.\n• A Unit leaves Reserves when it is deployed to the battlefield via a Deploy action (Part 8.5.5). Some rules may return a Unit to Reserves during play – see Part 8.5.5 for how Damage, effects, and Supply are handled. In the final Round of the game, all Units still in Reserves that are not deployed are treated as Destroyed for scoring purposes (Part 8.10).","Zone hors du champ de bataille où les unités attendent d’être déployées. Toutes les unités commencent la partie en réserve. En réserve, une unité :\n• ne peut pas être ciblée par des attaques ou des capacités, sauf si une capacité dit explicitement qu’elle touche les unités en réserve ;\n• ne peut utiliser ni capacités Active, ni Passive, ni Reaction, sauf mention contraire ;\n• ne peut ni contrôler ni contester de marqueur de mission ;\n• ne compte pas dans le supply actuel total du joueur sur le champ de bataille ;\n• garde tout son équipement, ses améliorations et ses choix d’armes de la construction d’armée.\n• Une unité quitte la réserve quand elle est déployée par une action Deploy (partie 8.5.5). Certaines règles peuvent la remettre en réserve en cours de partie : voir la partie 8.5.5 pour les dégâts, effets et supply. Au dernier round, toutes les unités encore en réserve et non déployées comptent comme détruites pour le score (partie 8.10)."],["RESPAWN (X)","Return up to X Destroyed models to this Unit.\n• The return cannot increase the Unit’s Current Supply Value. Do not return a model if doing so would push the Unit into a higher Supply bracket.\n• Set each returned model in Base-to-Base contact with an existing model in the Unit. Returned models cannot be set Within the Engagement Range of any Enemy Unit.\n• If a model cannot be set legally, it cannot be returned.","Ramène jusqu’à X figurines détruites dans cette unité.\n• Le retour ne peut pas augmenter le supply actuel de l’unité : ne ramène pas
