<!doctype html><html lang="fr"><head><meta charset="utf-8"><link rel="manifest" href="../manifest.webmanifest"><meta name="theme-color" content="#0e1319"><link rel="icon" type="image/svg+xml" href="../icons/icon.svg"><link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png"><link rel="apple-touch-icon" href="../icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="SC:TMG"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><script>try{if(localStorage.getItem('sctmg-skin')==='terran')document.documentElement.setAttribute('data-skin','terran')}catch(e){}</script><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Console de partie SC:TMG</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout : console de table — bandeau de partie collant (round, phase, supply, PV), puis onglets Phase / Armée / Attaque / Règles. */
:root{
  --bg:#e9edf1; --surface:#ffffff; --sunk:#f3f5f8; --ink:#141c25; --muted:#586574; --line:#d0d8e1;
  --accent:#a86200; --accent-ink:#ffffff; --race:#a8432a; --race-soft:#f6e6e1;
  --ok:#1f7a4d; --ok-soft:#e1f2e9; --warn:#9a6a00; --warn-soft:#fbf0d6; --bad:#b3261e; --bad-soft:#fbe3e1;
  --q:#2f5f8a; --q-soft:#e3edf6; --red:#c0362c; --blue:#2c6bc0;
  --f-display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --f-body:"Barlow","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1319; --surface:#161e27; --sunk:#111821; --ink:#e2e8ee; --muted:#93a1b0; --line:#2a3644;
  --accent:#f0a43c; --accent-ink:#1a1206; --race:#e47a58; --race-soft:#2c1c17;
  --ok:#5fcf95; --ok-soft:#14281e; --warn:#e8bb4f; --warn-soft:#2a2210; --bad:#ff8a80; --bad-soft:#2e1614;
  --q:#7fb3e0; --q-soft:#14222f; --red:#ff7a6e; --blue:#6fa8ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1319; --surface:#161e27; --sunk:#111821; --ink:#e2e8ee; --muted:#93a1b0; --line:#2a3644;
  --accent:#f0a43c; --accent-ink:#1a1206; --race:#e47a58; --race-soft:#2c1c17;
  --ok:#5fcf95; --ok-soft:#14281e; --warn:#e8bb4f; --warn-soft:#2a2210; --bad:#ff8a80; --bad-soft:#2e1614;
  --q:#7fb3e0; --q-soft:#14222f; --red:#ff7a6e; --blue:#6fa8ff; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:.01em}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.lbl{font-family:var(--f-display);font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}

/* ---------- bandeau ---------- */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.hud .wrap{padding-block:10px;display:flex;flex-direction:column;gap:10px}
.hud-top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto;min-width:0}
.brand h1{font-size:18px;font-weight:700}
.brand .tag{font-family:var(--f-mono);font-size:11px;color:var(--race);border:1px solid currentColor;border-radius:3px;padding:1px 5px}
.rounds{display:flex;gap:4px;align-items:center}
.rounds button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--sunk);font-family:var(--f-mono);font-size:13px;font-weight:700;color:var(--muted)}
.rounds button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.rounds button.done{color:var(--ink)}
.rounds button.final{border-style:dashed;border-color:var(--accent)}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.steps button{border:1px solid var(--line);background:var(--sunk);border-radius:4px;padding:6px 6px 5px;text-align:left;min-width:0}
.steps button .n{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.steps button .t{display:block;font-family:var(--f-display);font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps button.on{background:var(--race);border-color:var(--race);color:#fff}
.steps button.on .n{color:rgba(255,255,255,.8)}
.steps button.past{opacity:.6}
.gauges{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.g{display:flex;align-items:center;gap:8px;background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);padding:5px 10px}
.g .v{font-family:var(--f-mono);font-weight:700;font-size:16px}
.g .v small{font-size:11px;color:var(--muted);font-weight:500}
.g.bad{border-color:var(--bad);background:var(--bad-soft)}
.stp{display:inline-flex;align-items:center;gap:2px}
.stp button{width:24px;height:24px;border-radius:4px;border:1px solid var(--line);background:var(--surface);font-weight:700;line-height:1;padding:0}
.fpm{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.fpm button{border:0;background:var(--surface);padding:3px 8px;font-size:13px}
.fpm button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.next{margin-left:auto;white-space:nowrap;background:var(--ink);color:var(--surface);border:0;border-radius:var(--r);padding:8px 14px;font-family:var(--f-display);font-weight:600}

@media (max-width:700px){
  .hud{position:static}
  .hud .wrap{gap:8px}
  .gauges{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
  .g{flex:0 0 auto;padding:4px 8px}
  .steps button .t{font-size:12px}
  .brand h1{font-size:16px}
  .next{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:12;box-shadow:0 4px 16px rgba(0,0,0,.3)}
  .toast{bottom:calc(70px + env(safe-area-inset-bottom,0px))}
}
/* ---------- onglets ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-top:14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-family:var(--f-display);font-weight:600;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--race)}
main.wrap{padding-block:16px 60px}
.view{display:flex;flex-direction:column;gap:16px}

/* ---------- blocs ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel>h2{font-size:17px;margin-bottom:4px}
.panel>.sub{color:var(--muted);font-size:14px;margin:0 0 12px}
.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
.seq{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:s}
.seq li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;align-items:start;counter-increment:s}
.seq li::before{content:counter(s);font-family:var(--f-mono);font-size:12px;font-weight:700;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);border:1px solid var(--line)}
.seq li b{font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 11px;font-size:14px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--race);border-color:var(--race);color:#fff}
.btn.acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:1px 7px;border-radius:999px;border:1px solid var(--line);background:var(--sunk);white-space:nowrap}
.pill.ok{color:var(--ok);background:var(--ok-soft);border-color:transparent}
.pill.warn{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.pill.bad{color:var(--bad);background:var(--bad-soft);border-color:transparent}
.pill.q{color:var(--q);background:var(--q-soft);border-color:transparent}
.pill.race{color:var(--race);background:var(--race-soft);border-color:transparent}
.note{border-left:3px solid var(--accent);background:var(--sunk);padding:8px 12px;border-radius:0 var(--r) var(--r) 0;font-size:14px}
.note.tip{border-color:var(--ok)}
.note.warn{border-color:var(--bad)}
.note .lbl{display:block;margin-bottom:2px}

/* ---------- logigramme ---------- */
.unitpick{display:flex;flex-wrap:wrap;gap:6px}
.unitpick button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;border:1px solid var(--line);background:var(--sunk);border-radius:var(--r);padding:6px 10px;text-align:left;min-width:0}
.unitpick button .s{font-size:12px;color:var(--muted)}
.unitpick button.on{border-color:var(--race);background:var(--race-soft)}
.unitpick button.done{opacity:.5}
.flow{display:flex;flex-direction:column;margin-top:14px}
.fn{position:relative;padding-left:34px;padding-bottom:14px}
.fn::before{content:"";position:absolute;left:12px;top:26px;bottom:0;width:2px;background:var(--line)}
.fn:last-child::before{display:none}
.fn .ico{position:absolute;left:0;top:2px;width:26px;height:26px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:13px}
.fn.qn .ico{background:var(--q);color:var(--surface);transform:rotate(45deg);border-radius:4px;width:20px;height:20px;left:3px;top:5px}
.fn.qn .ico span{transform:rotate(-45deg)}
.fn .qt{font-family:var(--f-display);font-weight:600;font-size:15px}
.fn .qi{font-size:13px;color:var(--muted);margin-top:2px}
.fn .ans{margin-top:6px}
.fn .ans .pill{font-size:13px;padding:2px 9px}
.fn .opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.fn .opts button{border:1px solid var(--q);color:var(--q);background:var(--q-soft);border-radius:var(--r);padding:6px 12px;font-weight:600}
.fn.cur .qt{color:var(--q)}
.fn.leaf .ico{background:var(--race);color:#fff;border-radius:4px}
.leafcard{border:1px solid var(--race);border-radius:var(--r);background:var(--surface);overflow:hidden}
.leafcard header{background:var(--race);color:#fff;padding:8px 12px;font-family:var(--f-display);font-weight:700;letter-spacing:.03em}
.leafcard .bd{padding:12px;display:flex;flex-direction:column;gap:10px}
.leafcard ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.undo{background:none;border:0;color:var(--muted);font-size:12px;text-decoration:underline;padding:0;margin-left:6px}

/* ---------- capacités / cartes ---------- */
.ab{border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;background:var(--surface);display:flex;flex-direction:column;gap:4px}
.ab .h{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ab .h b{font-family:var(--f-display);font-weight:600}
.ab .tx{font-size:13.5px;color:var(--ink)}
.ab.used{opacity:.55}
.ab .src{font-size:12px;color:var(--muted)}
.ablist{display:flex;flex-direction:column;gap:6px}
.t-ACTIVE{color:var(--q);background:var(--q-soft);border-color:transparent}
.t-REACTION{color:var(--bad);background:var(--bad-soft);border-color:transparent}
.t-PASSIVE{color:var(--muted)}
.cost{font-family:var(--f-mono);font-size:12px;font-weight:700;padding:1px 6px;border-radius:3px;background:var(--accent);color:var(--accent-ink)}
.cost.free{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.card{border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;background:var(--surface);display:flex;flex-direction:column;gap:6px;min-width:0}
.card.ex{background:repeating-linear-gradient(135deg,var(--sunk) 0 6px,var(--surface) 6px 12px);opacity:.75}
.card .h{display:flex;justify-content:space-between;gap:6px;align-items:center}
.card .h b{font-family:var(--f-display);font-weight:600;min-width:0}
.res{font-family:var(--f-mono);font-weight:700;font-size:13px}

/* ---------- armée ---------- */
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
@media (max-width:420px){.units{grid-template-columns:minmax(0,1fr)}}
.unit{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);display:flex;flex-direction:column;min-width:0}
.unit.dead{opacity:.5}
.unit>header{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.unit>header .nm{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.unit>header h3{font-size:16px}
.unit .bd{padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:3px 9px;font-size:13px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--ink);color:var(--surface)}
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--line);border-radius:4px;overflow:hidden}
.stats div{text-align:center;padding:3px 2px;border-right:1px solid var(--line)}
.stats div:last-child{border-right:0}
.stats .lbl{font-size:10px;letter-spacing:.05em}
.stats .num{font-weight:700;font-size:14px}
.tw{overflow-x:auto}
table.wp{width:100%;border-collapse:collapse;font-size:13px}
table.wp th{font-family:var(--f-display);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:3px 5px;border-bottom:1px solid var(--line);white-space:nowrap}
table.wp td{padding:4px 5px;border-bottom:1px solid var(--line);vertical-align:top}
table.wp td.num{white-space:nowrap}
.kw{display:inline-block;font-size:11px;font-weight:600;border:1px dashed var(--muted);border-radius:3px;padding:0 4px;margin:1px 2px 1px 0;background:none;color:var(--ink);cursor:help}
details>summary{cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:14px}
details[open]>summary{margin-bottom:8px}

/* ---------- attaque ---------- */
.atk{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:860px){.atk{grid-template-columns:minmax(0,1fr)}}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld input,.fld select{border:1px solid var(--line);background:var(--sunk);border-radius:4px;padding:5px 7px;min-width:0;width:100%}
.fld input[type=checkbox]{width:auto}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:480px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.chk{display:inline-flex;align-items:center;gap:5px;font-size:13px;border:1px solid var(--line);border-radius:4px;padding:2px 7px;background:var(--sunk)}
.pipe{display:flex;flex-direction:column;gap:0}
.st{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;position:relative;padding-bottom:14px}
.st::before{content:"";position:absolute;left:16px;top:34px;bottom:0;width:2px;background:var(--line)}
.st:last-child::before{display:none}
.st .k{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;background:var(--sunk);border:2px solid var(--line)}
.st.on .k{border-color:var(--race);color:var(--race)}
.st.skip{opacity:.5}
.st h4{font-size:15px}
.st .bx{display:flex;flex-direction:column;gap:6px;min-width:0}
.pool{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:14px}
.pool .big{font-family:var(--f-mono);font-size:22px;font-weight:700}
.pool input{width:72px;border:1px solid var(--race);background:var(--surface);border-radius:4px;padding:4px 6px;font-family:var(--f-mono);font-weight:700}
.exp{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.result{border:2px solid var(--race);border-radius:var(--r);padding:12px;background:var(--race-soft);display:flex;flex-direction:column;gap:6px}
.result .big{font-family:var(--f-mono);font-size:26px;font-weight:700}

/* ---------- règles ---------- */
.gl{display:flex;flex-direction:column;gap:8px}
.gl .e{border-bottom:1px solid var(--line);padding-bottom:8px}
.gl .e b{font-family:var(--f-display)}
.gl .e p{margin:2px 0 0;font-size:14px;white-space:pre-line}
.gl .fr{font-size:13px;color:var(--muted);margin-top:4px}
input.search{border:1px solid var(--line);background:var(--sunk);border-radius:var(--r);padding:8px 10px;width:100%;max-width:420px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.tbl th{background:var(--sunk);font-family:var(--f-display);font-weight:600}
.pop{position:fixed;z-index:20;max-width:min(380px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--ink);border-radius:var(--r);padding:10px 12px;font-size:13.5px;box-shadow:0 8px 28px rgba(0,0,0,.25)}
.pop b{font-family:var(--f-display)}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:var(--r);font-size:14px;z-index:30;max-width:calc(100vw - 32px)}
textarea.paste{width:100%;min-height:90px;border:1px solid var(--line);background:var(--sunk);border-radius:var(--r);padding:8px;font-family:var(--f-mono);font-size:12px}
.mk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:6px 0}
.mk .id{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;color:#fff}
.mk .id.red{background:#b3261e}.mk .id.blue{background:#2f5f8a}.mk .id.neu{background:#6b7280}
.mk .ins{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.mk input{width:52px;border:1px solid var(--line);background:var(--sunk);border-radius:4px;padding:3px 5px;font-family:var(--f-mono)}

/* ---------- v2 ---------- */
.steps button .ts{display:none}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:520px){.grid2{grid-template-columns:minmax(0,1fr)}}
.mapbox{overflow-x:auto}
.mapbox svg{width:100%;max-width:640px;height:auto;display:block}
.mkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
@media (max-width:420px){.mkgrid{grid-template-columns:minmax(0,1fr)}}
.mkc{border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.mkc .chk{margin:2px 2px 0 0}
.mkid{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-family:var(--f-mono);font-weight:700;border:3px solid var(--ink);background:var(--surface)}
.mkid.red{border-color:var(--red)}.mkid.blue{border-color:var(--blue)}.mkid.neutral{border-color:var(--ink)}
table.cmp tr.best td{background:var(--ok-soft)}
.advice{border-color:var(--ok)}
.tips{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}

/* ---------- skin Terran (interface SC2) : activé par html[data-skin="terran"] ---------- */
:root[data-skin="terran"]{
  --bg:#030813; --surface:#08172f; --sunk:#06122a; --ink:#cfe6ff; --muted:#7fa6d0; --line:#1f63b5;
  --accent:#ffb23b; --accent-ink:#1a1204; --race:#46b4ff !important; --race-soft:#0a2145 !important;
  --ok:#7de08a; --ok-soft:#10261a; --warn:#ffb23b; --warn-soft:#2a2210; --bad:#ff7b47; --bad-soft:#2a1710;
  --q:#46b4ff; --q-soft:#0a2145; --red:#ff7b47; --blue:#6fa8ff;
  --r:4px; color-scheme:dark}
:root[data-skin="terran"] .pl{--zone:#3a2228;--zone-line:#a05a64;--terrain:#8a6a33;--terrain-ink:#fff7e6;--high:#1c3247;--me:#6fa8ff;--opp:#ef8a6c;--fly:#b493e6;--ground:#3a4654;--hint:#5fcf95;--tpl:#f0b84a}
:root[data-skin="terran"] body{background:radial-gradient(ellipse at 50% -5%,#0f2c58 0%,#07142b 45%,#030813 100%) fixed;color:var(--ink)}
:root[data-skin="terran"] body::before{background:#0b1f40}
:root[data-skin="terran"] h1,:root[data-skin="terran"] h2,:root[data-skin="terran"] h3,:root[data-skin="terran"] h4{text-transform:uppercase;letter-spacing:.08em}
:root[data-skin="terran"] .brand h1{color:#fff;text-shadow:0 0 12px #46b4ff}
:root[data-skin="terran"] .brand .tag{border-radius:2px;color:#46b4ff;border-color:#2a7fd6}
:root[data-skin="terran"] .lbl{letter-spacing:.18em;color:var(--muted)}
/* bandeau */
:root[data-skin="terran"] .hud{background:linear-gradient(180deg,#0b1f40 0%,#06132a 100%);border-bottom:1px solid #2a7fd6;box-shadow:0 4px 18px rgba(70,180,255,.18)}
:root[data-skin="terran"] .g{background:#08172f;border:1px solid #1f63b5;border-radius:4px;box-shadow:inset 0 0 12px rgba(70,180,255,.1)}
:root[data-skin="terran"] .g .v{color:#fff}
:root[data-skin="terran"] .g.bad{border-color:#ff7b47;background:#2a1710;box-shadow:0 0 10px rgba(255,123,71,.35)}
/* rounds : pastilles rondes lumineuses */
:root[data-skin="terran"] .rounds button{background:#06122a;border:2px solid #1f63b5;color:#7fa6d0}
:root[data-skin="terran"] .rounds button.done{color:#cfe6ff;border-color:#2a7fd6}
:root[data-skin="terran"] .rounds button.on{background:radial-gradient(circle,#1b5aa6 0%,#0a2145 100%);border-color:#46b4ff;color:#fff;box-shadow:0 0 14px 2px rgba(70,180,255,.55),inset 0 0 8px rgba(70,180,255,.4)}
:root[data-skin="terran"] .rounds button.final{border-style:dashed;border-color:#ffb23b;color:#ffd27a}
/* phases */
:root[data-skin="terran"] .steps button{background:#08172f;border:1px solid #2a7fd6;border-radius:3px;color:#cfe6ff}
:root[data-skin="terran"] .steps button.past{background:#06122a;border-color:#1f63b5;color:#7fa6d0;opacity:1}
:root[data-skin="terran"] .steps button.on{background:linear-gradient(180deg,#123b73 0%,#0a2145 100%);border-color:#46b4ff;color:#fff;box-shadow:0 0 12px 1px rgba(70,180,255,.45),inset 0 0 10px rgba(70,180,255,.2)}
:root[data-skin="terran"] .steps button.on .n{color:#9fc4ea}
/* boutons */
:root[data-skin="terran"] .btn{background:#08172f;border:1px solid #1f63b5;border-radius:4px;color:#cfe6ff}
:root[data-skin="terran"] .btn:hover{border-color:#46b4ff}
:root[data-skin="terran"] .btn.pri{background:linear-gradient(180deg,#123b73 0%,#0a2145 100%);border-color:#46b4ff;color:#fff;box-shadow:0 0 10px rgba(70,180,255,.4)}
:root[data-skin="terran"] .btn.acc,
:root[data-skin="terran"] .next{background:linear-gradient(180deg,#3a2508 0%,#1d1204 100%);border:1px solid #ffb23b;color:#ffd27a;text-transform:uppercase;letter-spacing:.14em;box-shadow:0 0 10px rgba(255,178,59,.4),inset 0 0 8px rgba(255,178,59,.2)}
:root[data-skin="terran"] .next{font-weight:700}
:root[data-skin="terran"] .btn.ghost{background:none}
:root[data-skin="terran"] .stp button,
:root[data-skin="terran"] .fpm button{background:#06122a;border-color:#1f63b5;color:#cfe6ff}
:root[data-skin="terran"] .fpm{border-color:#1f63b5}
:root[data-skin="terran"] .fpm button.on{background:#46b4ff;color:#04141c}
/* cartes et fenêtres */
:root[data-skin="terran"] .card{background:linear-gradient(180deg,#0c2347 0%,#06132a 100%);border:1px solid #1f63b5;box-shadow:inset 0 0 14px rgba(70,180,255,.1)}
:root[data-skin="terran"] .pop{background:linear-gradient(180deg,#0c2347 0%,#06132a 100%);border:1px solid #46b4ff;box-shadow:0 0 0 2px #050f21,0 0 0 3px #1b5aa6,0 0 22px rgba(70,180,255,.35)}
:root[data-skin="terran"] .pill{background:#06122a;border-color:#1f63b5}
/* navigation */
:root[data-skin="terran"] .tabs{border-bottom-color:#1b4a8a}
:root[data-skin="terran"] .tabs button.on{color:#fff;border-bottom-color:#46b4ff;text-shadow:0 0 10px #46b4ff}
:root[data-skin="terran"] #bnav{background:linear-gradient(180deg,#06122a 0%,#030813 100%);border-top:1px solid #1b4a8a}
:root[data-skin="terran"] #bnav button.on{color:#46b4ff;text-shadow:0 0 10px rgba(70,180,255,.7)}
/* bouton de skin : lumineux quand le skin Terran est actif */
:root[data-skin="terran"] .skinbtn{background:#08172f;border:1px solid #46b4ff;color:#46b4ff;box-shadow:0 0 10px rgba(70,180,255,.35)}

cations (Omega Worm, Roachling, Point Defense Drone, Pylon) : source (Faction Card ou unité), capacité et figurines nécessaires. Aucune valeur de jeu modifiée."},{"version":"2.1.7","date":"2026-09-28","notes":"keyword_rules : définition d'IMPACT(X) Y+ confirmée par l'utilisateur (points restants à préciser)."},{"version":"2.1.8","date":"2026-09-28","notes":"keyword_rules.IMPACT : texte officiel complet ; annotations impact_mod (Malignant Creep, Evolution Chamber / Extended Claws, Adrenal Overload des Raptors). Aucune valeur de jeu modifiée."},{"version":"2.1.9","date":"2026-09-28","notes":"keyword_rules.RESPAWN(X) : texte officiel (plafonné par le palier de Supply de l'unité). Aucune valeur de jeu modifiée."},{"version":"2.1.9","date":"2026-09-28","notes":"Roachling : 3 figurines invoquées exactement (confirmé par l'utilisateur)."},{"version":"2.2.0","date":"2026-09-28","notes":"Règle EVADE (texte officiel) ; annotations builder_effect : Tactical Cards Terran (Engineering Bay, Armory, Factory, Factory Tech Lab), Jim Raynor / Orders, Goliath / Target Lock, capacités donnant l'Evade (Combat Shield, Precognition, Prophetic Vision, Lurking). Aucune valeur de jeu modifiée."},{"version":"2.2.1","date":"2026-09-28","notes":"Evade : éligibilité uniquement via les règles qui l'accordent (confirmé). Annotations : Mutating Carapace (Kerrigan), Brood Instinct (Zerg Swarm), Hierarch's Stand (Artanis), Hallucination (Sentry), Indomitable (sans effet chiffrable)."},{"version":"2.2.2","date":"2026-09-28","notes":"Annotations : Barracks (Tech Lab) / Let's Have a Blast (ANTI-EVADE 1), Slugthrower et Grenades-Frag (Marine, Raynor's Raider, conditionnels à 8\"), Raynor's Raiders / Rapid Ingress (Point Defense Drone). Aucune valeur de jeu modifiée."},{"version":"2.3.0","date":"2026-09-28","notes":"Règles HIDDEN et INSTANT (textes officiels). Annotations builder_effect Protoss : Shielded (Improved Barrier, Shield Overcharge, Plasma Shields), réductions de dégâts (Dae'Uhl, Guardian Shield  Tactical Card Defiler Mound. Coûts de la table 09.10.2026. Zagara / Broodmother : amélioration imprimée mais absente de la table de coûts (non achetable). Familles v1.2. Aucune donnée existante modifiée."},{"version":"2.6.1","date":"2026-10-29","notes":"Zagara / Broodmother : coût 0 minerai (confirmé par l'utilisateur), amélioration désormais achetable. Vileling : profil de supply confirmé. Aucune autre donnée modifiée."},"2.6.2 : builder_effect weapon_set ajouté à Hydriodic Bile (Roach, Vile Roach, Corpser Roach) : Acid Saliva gagne Surge Type Light et S Dice D3+1 (texte de la carte inchangé)."]},"army_building_rules":{"engagement_scales":{"Skirmish":{"mineral_limit":1000,"gas_limit_percent":10,"battlefield":"36x36"},"Standard":{"mineral_limit":2000,"gas_limit_percent":10,"battlefield":"36x54"},"Grand_Offensive":{"mineral_limit":"2001+","gas_limit_percent":10,"battlefield":"36x72"}},"list_limits_note":"Seules limites officielles de liste : cap minéraux (selon l'Engagement Scale) et cap gas = 10% du cap minéraux. Aucune limite sur le nombre de Tactical Cards.","faction_eligibility":"Une carte dont les faction_tags incluent une sous-faction (ex. ['Protoss','Khalai']) n'est jouable qu'avec la Faction Card de cette sous-faction. Une carte avec seulement le tag de race est jouable avec toutes les Faction Cards de cette race.","army_slots":"Une unité occupe un nombre de slots de son army_slot égal à sa Supply Value d'achat. La Faction Card donne le pool initial (starting_army_slots), les Tactical Cards en ajoutent (grants_army_slots).","race_specific":{"ZERG":{"creep_card_requirement":"Le joueur DOIT sélectionner exactement une Creep Card et l'ajouter à sa liste, en payant son coût gas listé (règle ZERG_CREEP, présente sur toutes les Faction Cards Zerg)."}}},"keyword_rules":{"SHIELD / SHIELDED":"If a Shield value is present on a Unit Card, add it to the Hit Points (HP) of the first model. The Unit is Shielded. The Unit loses its Shielded Status when the Total Damage assigned to it exceeds its Shield value or when the first model in the Unit is removed. The Shielded Status is referenced by other abilities. Losing Shielded Status does not remove any remaining Hit Points, it only ends effects that require the Unit to be Shielded. Shielded Status cannot be restored by HEAL. [Builder : le Shield s'ajoute aux HP du premier modèle seulement.]","CONCENTRATED FIRE(X)":"Attacks with this weapon may remove no more than X models as casualties. Once X models have been removed, discard any remaining Total Damage. It is not recorded as a Damage Marker and does not carry over.","HITS X (Y)":"X touches de Y dégât(s) chacune (ex : Zeratul Shadow Strike HITS 4 (1) ; Ravager Corrosive Bile HITS 5 (1) par token ; Overcharged Nexus HITS 3 (1)).","BLAST TEMPLATE (BT)":"Gabarit centré sur un modèle de l'unité Primary (Target Point). Main target : dés = modèles affectés + modificateurs de RoA ; pas de jet de Surge, Surge Result = modèles affectés. Spillover : batch séparé par autre unité recouverte (amie ou ennemie) de même élévation et même Combat Tag, dés = modèles affectés, sans modificateur de RoA ni Surge. Voir section 3bis du document de méthodologie pour la règle complète.","PRECISION(X)":"Après le jet pour toucher, convertit jusqu'à X dés ratés en touches réussies.","CRITICAL HIT(X)":"Déplace X dés de l'Armour Pool vers la Damage Pool (contourne l'armure), plafonné au nombre de dés présents dans l'Armour Pool.","PIERCE [TAG](X)":"Contre une cible avec ce Combat Tag, la caractéristique Dmg de l'arme est remplacée par X.","ANTI-EVADE(X)":"-X en modificateur sur le jet d'Evade de la cible.","TOUGH(X)":"Transforme jusqu'à X échecs au jet d'Armure en réussites.","DODGE(X)":"Réduit de X (min 0) le nombre de dés qui passent de l'Armour Pool à la Damage Pool via Surge ou Critical Hit.","BUFF [Carac](X)":"Bonus de X à la caractéristique jusqu'à la fin du round. Les BUFF ne se cumulent pas entre eux.","SIDEARM":"When this Unit performs a Ranged Attack or Close Combat Attack, models equipped with this weapon may use it, ignoring the normal restriction of one weapon per model (Part 8.7.3). If a model is equipped with multiple SIDEARM weapons, it may use all of them in the same activation. Attacks made with each SIDEARM must be resolved in separate Batches. Because they are separate Batches, SIDEARM attacks may target a different Enemy Unit than the Unit's other weapons, subject to all standard target eligibility requirements. (Texte officiel fourni par l'utilisateur.)","BULKY":"Arme inutilisable en Ranged Attack si l'unité est Engaged.","SPEED X/Y":"X = vitesse de l'unité. Y = vitesse quand il ne reste qu'UNE seule figurine dans l'unité (après pertes). Une valeur unique (ex. 7) s'applique en permanence ; speed_last_model = null dans ce cas. (Confirmé par l'utilisateur.)","SPECIALIST":"A Unit may include only one model equipped with this weapon. Multiple upgrades configuring more than one instance of this weapon are not permitted (Part 9.1.7). [Builder : une upgrade SPECIALIST n'équipe qu'UNE figurine de l'unité ; deux SPECIALIST différents (ex. AGG-12 + Rocket Launcher) restent cumulables.] (Texte officiel fourni par l'utilisateur.)","builder_effect":"Annotations lues par le builder pour la création intelligente (pas des règles de jeu) : stim (PRECISION temporaire + NON-LETHAL DAMAGE), heal / damage_reduction (soin par figurine), heal_bonus, cost_reduction (réduction du coût en ressource), supply_pool_value. Ajoutées à partir du texte des cartes et des retours de l'utilisateur.","requires_upgrade":"Champ de base (pas un mot-clé de jeu) : l'upgrade ou l'arme n'est utilisable que si l'upgrade nommé est aussi pris.","IMPACT(X) Y+":"Immediately after this Unit completes a successful Charge, check every model in the Fighting Rank or Supporting Rank. For each eligible model, generate X Impact Dice: if the model is in the Fighting Rank or Supporting Rank against only one Enemy Unit, all X dice go to that Unit; if against multiple Enemy Units, the controlling player may split the dice between those Units. Roll the allocated dice for each target Unit separately (Impact Hit Roll). For each result of Y or higher, set 1 die into the target's Armour Pool. Proceed immediately to Armour Rolls. These hits do not generate Surge and treat Damage as 1. (Texte officiel fourni par l'utilisateur.)","RESPAWN(X)":"Return up to X Destroyed models to this Unit. The return cannot increase the Unit's Current Supply Value: do not return a model if doing so would push the Unit into a higher Supply bracket. Set each returned model in Base-to-Base contact with an existing model in the Unit. Returned models cannot be set Within the Engagement Range of any Enemy Unit. If a model cannot be set legally, it cannot be returned. (Texte officiel fourni par l'utilisateur.)","EVADE":"Damage Pool : each die remaining in this pool inflicts Damage equal to the weapon's Damage characteristic. If the target Unit is eligible for an Evade Roll, the defender rolls all dice in this pool against the Unit's Evade characteristic before Damage is applied. Each die that meets or exceeds the Evade value is a success and is discarded. Remaining dice inflict Damage as normal. (Texte officiel fourni par l'utilisateur.) Evade Roll: If eligible, each die result equal to or higher than the Evade characteristic is saved and discarded. (Texte officiel.) Aucune unité n'a droit à l'Evade par défaut : seules les règles qui écrivent « is eligible to make an Evade Roll » l'accordent (confirmé par l'utilisateur).","HIDDEN":"This Unit cannot be selected as the target of a Ranged Attack or any LoS-requiring Special Ability unless the acting model is Within 4\" of it. A HIDDEN Unit is immune to the IMPACT keyword. A HIDDEN Unit may make an Evade Roll against every attack targeting it. HIDDEN is classified as a Status. (Texte officiel fourni par l'utilisateur.)","INSTANT":"Enemy Units cannot declare or resolve Reaction abilities in response to attacks made with this weapon. (Texte officiel fourni par l'utilisateur.)"},"races":{"ZERG":{"resource":"BM","source_version":"1.1","notes":{"known_card_errata":["Roach et Corpser Roach: l'upgrade 'Glial Reconstitution' est imprimée avec un coût '1 CP' sur ces deux cartes précises, alors que CP est une ressource Terran exclusive. Coquille d'impression Archon confirmée par l'utilisateur (propriétaire physique des cartes). Traité comme '1 BM' dans cette base. Vile Roach affiche correctement '1 BM' sur la même upgrade."]},"faction_cards":{"Zerg_Swarm":{"race":"ZERG","faction_tags":["Zerg"],"unique":true,"resource":"BM","resource_generated":1,"starting_army_slots":{"CORE":3,"ELITE":1,"SUPPORT":1,"AIR":1},"abilities":{"BROOD_INSTINCT":{"type":"REACTION","phase":"ANY","text":"Use before a Friendly Unit makes an Evade Roll. Apply a +1 Modifier to that roll.","builder_effect":{"kind":"evade_mod","amount":1,"note":"Réaction gratuite (Exhaust) : +1 à un jet d'Evade déjà accordé."}},"ZERG_CREEP":{"type":"PASSIVE","phase":"ANY","text":"During Army Building, select exactly one Creep Card and add it to their Army List, paying its listed cost (if any)."},"RAPID_BURROWING":{"type":"ACTIVE","phase":"MOVEMENT","text":"Select one Friendly, Unengaged Ground Zerg Unit on the battlefield. That Unit gains the Burrowed Status, even if it has already been Activated this Round.","builder_effect":{"kind":"free_burrow","amount":1}}},"card_version":null},"Kerrigans_Swarm":{"race":"ZERG","faction_tags":["Zerg","Kerrigan's Swarm"],"unique":true,"resource":"BM","resource_generated":1,"starting_army_slots":{"CORE":3,"ELITE":2,"HERO":1},"abilities":{"WILD_MUTATION":{"type":"ACTIVE","phase":"ANY","text":"If the active unit is ON CREEP, the unit gains BUFF Speed(1) and its first used Weapon gains PRECISION(1)."},"ZERG_CREEP":{"type":"PASSIVE","phase":"ANY","text":"During Army Building, you must select exactly one Creep Card and add it to your Army List, paying its listed cost (if any)."},"OMEGA_NETWORK":{"type"
