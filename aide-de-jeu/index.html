         'Seules les unités <b>engagées</b> agissent, et elles <b>doivent</b> le faire. Les unités volantes ne sont jamais engagées.',
         'Séquence : Close Ranks (optionnel, 3") → rangs de combat → jets d’attaque → pertes (priorité des unités engagées).',
         'On ne passe que quand on n’a plus d’unité engagée à activer.'],
    tip:'Close Ranks est un déplacement de 3" que beaucoup de débutants oublient : avance ton modèle de tête pour mettre plus de figurines au contact. (Conseil d’Abathur)'},
  score:{goal:'Contrôler les marqueurs, marquer, nettoyer, déterminer l’initiative.', seq:['Le premier joueur lance chaque étape, dans l’ordre ci-dessous.']}
};

/* ================= arbres de décision ================= */
const rangedWeapons = u => weaponsOf(u).filter(w => w.phase === 'ASSAULT');
const hasCCw = u => weaponsOf(u).some(w => w.phase === 'COMBAT');
function chanceCharge(speed, dist, two){
  const need = Math.ceil(dist - speed - 1e-9);
  const p = need <= 1 ? 1 : need > 6 ? 0 : (7 - need) / 6;
  return two ? 1 - (1 - p) * (1 - p) : p;
}
function missionAction(){ const m = mission(); if (m.scoring_model === 'sabotage') return 'sabotage'; if (m.scoring_model === 'opp_2' && m.additional.length) return 'gather'; return null; }

function tree(u){
  const d = udef(u), fly = isFlying(d), ph = PH[S.phase].id, sp = d.stats.speed, spl = d.stats.speed_last_model;
  const spTxt = spl ? `${sp}" (${spl}" quand il ne reste qu’un modèle)` : sp + '"';
  const N = {};
  const A = (id, q, info, opts, auto, extra) => N[id] = Object.assign({id, q, info, opts, auto}, extra || {});
  const L = (id, o) => N[id] = Object.assign({id, leaf:true}, o);
  const moveSteps = fly ?
    ['Choisis un modèle de tête : il se déplace en ligne droite jusqu’à ' + spTxt + ', en ignorant terrain et figurines (vol).',
     'Il doit finir à au moins 1" de toute unité volante ennemie. Les volants ne sont jamais engagés.',
     'Replace les autres modèles en cohésion autour de lui.'] :
    ['Choisis un modèle de tête et déplace-le jusqu’à ' + spTxt + ' (mesure le chemin réel).',
     'Il ne traverse pas les décors de taille 2+, ni les figurines ennemies ou d’autres unités ; il change d’élévation seulement par un ACCESS POINT.',
     'Il ne peut pas finir à 1" (Engagement Range) d’une unité Ground ennemie.',
     'Replace les autres modèles en cohésion autour de lui : position légale, sur la table, pas à 1" d’un ennemi.'];
  if (u.loc === 'dead') { L('root', {title:'Unité détruite', steps:['Elle ne peut plus agir.']}); return N; }
  if (u.act[S.phase]) { L('root', {title:'Déjà activée cette phase', steps:['Chaque unité n’agit qu’une fois par phase. Choisis une autre unité ou passe.'], undo:true}); return N; }
  const cs = curSup(u);

  if (ph === 'MOVEMENT'){
    A('root', 'L’unité est-elle en réserve ?', null, [['Oui, en réserve','res'],['Non, sur la table','tab']], u.loc === 'res' ? 0 : 1);
    const av = avail(S.units);
    A('res', 'As-tu assez de supply pour la faire entrer ?', `Supply de l’unité : ${cs} · supply disponible : ${fmtSup(av)}${av === Infinity ? ' (dernier round : illimité)' : ''}`,
      [['Oui','resgo'],['Non','nosup']], (av === Infinity || cs <= av) ? 0 : 1);
    A('resgo', 'La faire entrer maintenant ?', S.round === 1 ? 'Conseil du livre : au round 1, déploie d’abord des unités bon marché pour contester les marqueurs et voir ce que fait l’adversaire ; tes unités chères arrivent mieux aux rounds 2 et 3.' : 'Une unité qui reste en réserve ne marque rien et ne protège rien. Au dernier round, celles qui y sont encore comptent comme détruites.',
      [['Oui, je déploie','deploy'],['Non, j’attends','wait']]);
    const depAb = abilitiesOf(u).filter(a => /nominated to deploy from Reserves/i.test(a.text || ''));
    L('deploy', {title:'Deploy', act:'deploy', steps:[
      'Vérifie que son supply actuel (' + cs + ') tient dans le supply disponible.',
      'Pose le modèle de tête au contact de ton Entry Edge, hors de la table, puis déplace-le jusqu’à ' + spTxt + ' avec les règles normales de Move.',
      'Replace le reste de l’unité en cohésion. Si ce n’est pas possible, tu ne peux pas déployer à cet endroit.',
      'L’unité ne peut pas finir dans la Zone of Influence adverse (6" depuis son Entry Edge).'],
      tip: depAb.length ? 'Rappel : ' + depAb.map(a => nm(a.key, a) + ' — ' + (fr(a.text) || a.text)).join(' · ') : null,
      warn:'Les capacités Active ne s’utilisent pas en réserve, sauf mention contraire. Utilise-les juste avant ou juste après l’action.'});
    L('wait', {title:'Rester en réserve', steps:['Ne l’active pas : choisis une autre unité ou passe ton tour.','Les unités restées en réserve au début de la phase de score du dernier round comptent comme détruites.']});
    L('nosup', {title:'Déploiement impossible', steps:['Il manque du supply. Les unités détruites ou affaiblies libèrent du supply.','Au dernier round, le supply est illimité : tout ce qui reste peut entrer.']});
    A('tab', 'L’unité est-elle engagée (une figurine à 1" d’une unité Ground ennemie) ?', fly ? 'Unité volante : jamais engagée.' : null,
      [['Oui, engagée','eng'],['Non','free']], fly ? 1 : (u.engaged ? 0 : undefined), {setEng:true});
    A('eng', 'Veux-tu te désengager ?', 'Si tu restes, l’unité combattra obligatoirement en phase 3.', [['Oui, je me retire','mass'],['Non, je reste au contact','holdeng']]);
    const engOpp = S.opp.units.filter(x => x.loc === 'table' && x.engaged).reduce((a, x) => a + curSup(x), 0);
    A('mass', `Ton supply actuel (${cs}) est-il supérieur au supply combiné des unités ennemies engagées avec toi ?`, `C’est la Tactical Mass. Si oui, aucune pénalité.${S.opp.units.length ? ` Supply total des unités adverses marquées « engagées » : ${engOpp}.` : ''}`, [['Oui','dismass'],['Non','dispen']]);
    const disSteps = ['Déplace l’unité avec les règles normales de Move (' + spTxt + ').',
      'Toute figurine qui ne peut pas finir strictement hors de l’Engagement Range de tous les ennemis est retirée (détruite).',
      'Si le modèle de tête lui-même n’y arrive pas, le désengagement échoue : l’unité ne bouge pas, le modèle de tête est retiré et l’activation se termine.'];
    L('dismass', {title:'Disengage (sans pénalité)', act:'dis0', steps:disSteps, tip:'Tactical Mass : tu pourras tirer ou charger en phase 2.'});
    L('dispen', {title:'Disengage (avec pénalité)', act:'dis1', steps:disSteps, warn:'Pénalité : pas de Ranged Attack ni de Charge à la prochaine phase d’Assaut. Vérifie si une capacité l’annule (ex. Tactical Retreat sur la carte de faction Terran).'});
    L('holdeng', {title:'Hold (au contact)', act:'hold', steps:['L’unité ne fait rien et reçoit son marqueur d’activation.','Une unité engagée ne peut pas faire de Move normal : c’est Disengage ou Hold.','Elle combattra en phase 3.']});
    A('free', 'Quel est l’objectif de l’unité ce round ?', null, [['Prendre ou tenir un marqueur','mvobj'],['Me rapprocher pour charger','mvch'],['Me cacher ou me mettre à couvert','mvcov'],['Je suis déjà bien placé','hold']]);
    L('mvobj', {title:'Move vers le marqueur', act:'move', steps:moveSteps, tip: fly ? 'Attention : une unité volante ne peut ni contester ni contrôler un marqueur.' : 'Pour contester : au moins une figurine à 3" du marqueur, en ligne de vue et à la même élévation, et l’unité en cohésion. C’est la somme du supply qui compte, pas le nombre de figurines.'});
    L('mvch', {title:'Move d’approche', act:'move', steps:moveSteps, tip:`Une charge porte à Speed + 1D6 : de ${sp+1}" à ${sp+6}", ${sp+3.5}" en moyenne. Finis ton Move à moins de ${sp+3}" de la cible pour avoir au moins 2 chances sur 3 (D6 ≥ 3).`});
    L('mvcov', {title:'Move à couvert', act:'move', steps:moveSteps, tip:'Couvert total : un décor dont la taille effective est ≥ à celle du tireur ET de la cible bloque la ligne de vue. Couvert direct : si tu es à 1" d’un décor de taille ≥ à la tienne et que la ligne de vue passe par ce décor, elle est bloquée.'});
    L('hold', {title:'Hold', act:'hold', steps:['L’unité ne fait rien et reçoit son marqueur d’activation.'], tip:'Une unité qui ne bouge pas garde le statut STATIONARY (certaines armes en profitent, voir LOCKED IN).'});
    return N;
  }

  if (ph === 'ASSAULT'){
    if (u.loc === 'res'){ L('root', {title:'En réserve', steps:['Les unités en réserve ne peuvent pas agir en phase d’Assaut.']}); return N; }
    const rw = rangedWeapons(u), nonBulky = rw.filter(w => !hasKw(w.keywords, 'BULKY'));
    const ground = !fly, cc = hasCCw(u), ma = missionAction();
    A('root', 'L’unité est-elle engagée ?', fly ? 'Unité volante : jamais engagée.' : null, [['Oui','eng'],['Non', ma ? 'mis' : 'free']], fly ? 1 : (u.engaged ? 0 : undefined), {setEng:true});
    A('eng', 'As-tu une arme de tir sans BULKY ?', nonBulky.length ? 'Armes possibles : ' + nonBulky.map(w => w.name).join(', ') : 'Aucune arme de tir utilisable au contact.', [['Oui','engshoot'],['Non','holdeng']], nonBulky.length ? 0 : 1);
    A('engshoot', 'Tirer sur une unité avec laquelle tu es engagé ?', 'Une unité engagée ne vise que les unités avec lesquelles elle est engagée. La cible pourra faire un jet d’Evade (cible engagée touchée au tir).', [['Oui, je tire','ranged'],['Non','holdeng']]);
    L('holdeng', {title:'Hold (au contact)', act:'hold', steps:['L’unité ne fait rien et reçoit son marqueur côté Assaut.','Elle combattra en phase 3.']});
    if (ma){
      A('mis', ma === 'gather' ? 'Mission : l’unité est-elle non engagée, à 3" d’un marqueur contrôlé neutre ou de la couleur adverse ?' : 'Mission : l’unité est-elle non engagée, à 3" d’un marqueur contrôlé ?',
        mission().additional[0], [['Oui','misgo'],['Non','free']]);
      A('misgo', ma === 'gather' ? 'Faire l’action Gather (+1 PV) au lieu d’une action normale ?' : 'Faire l’action Sabotage (niveau du marqueur ±1) au lieu d’une action normale ?', null, [['Oui','misact'],['Non, action normale','free']]);
      L('misact', ma === 'gather' ? {title:'Gather', act:'gather', steps:['L’unité ne tire pas, ne charge pas et ne court pas.','Tu gagnes 1 PV.']} :
        {title:'Sabotage', act:'sabotage', steps:['L’unité ne tire pas, ne charge pas et ne court pas.','Augmente ou diminue de 1 le niveau de Sabotage du marqueur (entre 1 et 3).','Chaque marqueur contrôlé neutre ou de couleur adverse rapporte son niveau de Sabotage en PV au score, à partir du round 2.'], sabotage:true});
    }
    if (u.penalty){
      A('free', 'Pénalité de désengagement : ni tir ni charge cette phase. Courir améliore-t-il ta position ?', 'Tu t’es désengagé sans Tactical Mass en phase 1.', [['Oui','run'],['Non','hold']]);
    } else {
      A('free', 'Une unité ennemie visible est-elle à portée d’une de tes armes de tir, avec le bon type de cible ?',
        rw.length ? rw.map(w => `${w.name} : ${w.rng}" · cible ${w.target}`).join(' — ') + '. La cible ne doit pas être engagée avec une autre unité (sauf PINPOINT).' : 'Cette unité n’a pas d’arme de tir.',
        [['Oui','shootq'],['Non','chq']], rw.length ? undefined : 1, {cmp:'ASSAULT'});
      A('shootq', 'Tirer ou charger ?', ground && cc ? 'Le tableau ci-dessous compare les dégâts attendus au tir et au corps à corps.' : null, [['Tirer','ranged'],['Charger','chq']], ground && cc ? undefined : 0, {cmp: ground && cc ? 'BOTH' : null});
      const two = abilitiesOf(u).some(a => /roll 2D6 instead of D6/i.test(a.text||''));
      A('chq', 'Une unité Ground ennemie est-elle à portée de charge ?', ground && cc ? `Portée = Speed ${sp}" + 1D6 → de ${sp+1}" à ${sp+6}". ${two ? 'Capacité qui lance 2D6 (garde le meilleur) disponible. ' : ''}Calcule tes chances ci-dessous.` : 'Seule une unité Ground avec une arme de corps à corps peut charger.',
        [['Oui','charge'],['Non','runq']], ground && cc ? undefined : 1, {calc: ground && cc ? {sp, two} : null});
      A('runq', 'Courir te rapproche-t-il d’un marqueur, d’une future charge ou d’un couvert ?', null, [['Oui','run'],['Non','hold']]);
    }
    L('ranged', {title:'Ranged Attack', act:'ranged', steps:[
      'Cible : au moins une figurine visible à portée, type de cible compatible (Ground / Flying / All). Une unité non engagée ne vise pas une unité engagée.',
      'Chaque figurine tire avec une arme. Toutes les figurines qui utilisent le même profil visent la même cible : c’est un « batch ».',
      'Déclare la cible d’un batch, résous-le entièrement, puis déclare le suivant.',
      'Seules les figurines à portée d’au moins une figurine visible de la cible lancent des dés.'],
      tip:'Résous d’abord le batch qui a le plus de chances d’achever une cible abîmée : si ça marche, le second batch peut viser une autre unité. (Conseil d’Abathur)', attack:'ranged', cmp:'ASSAULT'});
    const chAb = abilitiesOf(u).filter(a => /successful Charge/i.test(a.text || ''));
    L('charge', {title:'Charge', act:'charge', steps:[
      'Déclare toutes les cibles avant de lancer : uniquement des unités Ground. Pas besoin de ligne de vue.',
      'Choisis le modèle de tête et une figurine cible par unité visée.',
      `Lance 1D6 + Speed (${sp}") : c’est la distance de charge, mesurée sur le chemin réel.`,
      'Réussite si le modèle de tête peut finir entièrement dans cette distance, à 1" de CHAQUE cible déclarée, sans chevaucher, et pas à 1" d’une unité ennemie non déclarée.',
      'Place le modèle de tête au contact socle à socle si possible, puis les autres en cohésion. Priorité : socle à socle → à 1" des cibles → près du modèle de tête.',
      'Échec : l’unité ne bouge pas et son activation se termine.'],
      warn: chAb.length ? 'Après une charge réussie : ' + chAb.map(a => nm(a.key, a) + ' — ' + (fr(a.text) || a.text)).join(' · ') : null, charge:true, cmp:'COMBAT'});
    L('run', {title:'Run', act:'run', steps:moveSteps.concat(['L’unité doit être non engagée.'])});
    L('hold', {title:'Hold', act:'hold', steps:['L’unité ne fait rien. Retourne son marqueur côté Assaut.']});
    return N;
  }

  if (ph === 'COMBAT'){
    if (fly){ L('root', {title:'Unité volante', steps:['Les volants ne sont jamais engagés : ils ne participent pas à la phase de Combat.']}); return N; }
    if (u.loc !== 'table'){ L('root', {title:'Hors de la table', steps:['Seules les unités engagées agissent en phase 3.']}); return N; }
    A('root', 'L’unité est-elle engagée ?', null, [['Oui','cc'],['Non','none']], u.engaged ? 0 : undefined, {setEng:true});
    L('none', {title:'Pas d’action', steps:['Les unités non engagées ne peuvent pas agir en phase 3.']});
    L('cc', {title:'Close Combat Attack (obligatoire)', act:'cc', steps:[
      'Close Ranks (optionnel) : déplace le modèle de tête jusqu’à 3". Il doit finir plus près des unités avec lesquelles il est engagé, sans engager de nouvelle unité ennemie. Les figurines déjà socle à socle ne bougent pas.',
      'Replace les autres en cohésion, socle à socle avec l’ennemi si possible, sinon socle à socle avec une figurine amie à 1" de l’ennemi.',
      'Fighting Rank : figurines à 1" d’un ennemi. Supporting Rank : socle à socle avec une figurine amie du Fighting Rank. Ces figurines frappent.',
      'Utilise uniquement les armes de Combat de la carte (une seule au choix par figurine). Même séquence que le tir : Touche → Surge → Armure → Dégâts.',
      'Pas d’Evade au corps à corps, sauf si une capacité ou un mot-clé l’accorde.',
      'Engagé avec plusieurs unités : déclare avant de lancer quelle cible reçoit le dé de Surge (il ne se partage pas).',
      'Pertes : priorité 1 → 2 → 3 (voir onglet Attaque). Si plus aucune figurine n’est à 1" d’un ennemi, l’unité n’est plus engagée.'],
      attack:'combat', ccEnd:true, cmp:'COMBAT'});
    return N;
  }
  L('root', {title:'—', steps:[]}); return N;
}

function applyAct(u, kind, extra){
  u.act[S.phase] = true;
  const n = unitName(u);
  const LBL = {deploy:'Deploy', move:'Move', hold:'Hold', dis0:'Disengage (sans pénalité)', dis1:'Disengage (pénalité)', ranged:'Ranged Attack', run:'Run', charge:'Charge', cc:'Close Combat', gather:'Gather', sabotage:'Sabotage'};
  if (kind === 'deploy') u.loc = 'table';
  if (kind === 'dis0') { u.engaged = false; u.penalty = false; }
  if (kind === 'dis1') { u.engaged = false; u.penalty = true; }
  if (kind === 'hold' && S.phase === 2) S.stats.holdAssault++;
  if (kind === 'charge'){ if (extra === 'ok'){ u.engaged = true; S.stats.chargeOk++; } else S.stats.chargeKo++; }
  if (kind === 'cc' && extra === 'free') u.engaged = false;
  if (kind === 'gather'){ S.vp.me++; }
  if (kind === 'sabotage'){ const mk = S.markers.find(x => x.id === +extra.split(':')[0]); if (mk) mk.sab = Math.max(1, Math.min(3, mk.sab + +extra.split(':')[1])); }
  logA(n + ' : ' + LBL[kind] + (kind === 'charge' ? (extra === 'ok' ? ' réussie' : ' ratée') : '') + (kind === 'gather' ? ' (+1 PV)' : ''), 'act');
  U.flow = {}; save(); render();
  if (kind === 'charge' && extra === 'ok'){ const ab = abilitiesOf(u).filter(a => /successful Charge/i.test(a.text || '')); toast(ab.length ? 'Charge réussie : pense à ' + ab.map(a => nm(a.key, a)).join(', ') + ' !' : 'Charge réussie : ' + n + ' est engagée.'); }
  else toast(n + ' : activation enregistrée.');
}

/* ---- comparateur de cibles ---- */
function compareHTML(u, mode){
  const tg = S.opp.units.filter(x => x.loc === 'table');
  if (!tg.length) return `<div class="note small">Ajoute les unités adverses sur la table (onglet Armées) pour voir le comparateur de cibles.</div>`;
  const rows = [];
  const phases = mode === 'BOTH' ? ['ASSAULT','COMBAT'] : [mode];
  tg.forEach(t => phases.forEach(ph => {
    const td = udef(t);
    if (ph === 'COMBAT' && isFlying(td)) return;
    if (ph === 'ASSAULT' && !u.engaged && t.engaged && !weaponsOf(u).some(w => hasKw(w.keywords, 'PINPOINT'))) return;
    if (ph === 'ASSAULT' && u.engaged && !t.engaged) return;
    const v = bestVolley(u, t, ph); if (!v) return;
    rows.push({t, ph, v});
  }));
  const nw = weaponsOf(u).find(w => hasNearR(w) && phases.includes(w.phase));
  const lw = weaponsOf(u).find(w => hasLock(w) && phases.includes(w.phase)), lk = lw && lockOf(u) && findU(lockOf(u));
  const nearBox = (nw ? `<label class="chk" style="margin-top:8px"><input type="checkbox" id="nearT" ${U.near ? 'checked' : ''}> Cible à ${NEAR_R(nw)}" ou moins <span class="small muted">(${esc(nearTxt(nw))})</span></label>` : '')
    + (lw ? `<div class="small muted" style="margin-top:6px">Target Lock : ${lk ? `<b>${esc(unitName(lk))}</b> verrouillée (${esc(nearTxt(lw, 'lock'))})` : 'aucune unité verrouillée'} — à régler dans l’onglet Attaque.</div>` : '');
  if (!rows.length) return nearBox + '<div class="note small">Aucune cible compatible parmi les unités adverses sur la table.</div>';
  rows.sort((a, b) => b.v.supLost - a.v.supLost || b.v.kills - a.v.kills || b.v.dmg - a.v.dmg);
  return nearBox + `<div class="tw" style="margin-top:8px"><table class="wp cmp"><thead><tr><th>Cible</th>${mode === 'BOTH' ? '<th>Mode</th>' : ''}<th>Dégâts ≈</th><th>Fig. tuées ≈</th><th>Supply retiré ≈</th><th>Prochain palier</th></tr></thead><tbody>${
    rows.slice(0, 8).map((r, i) => `<tr class="${i === 0 ? 'best' : ''}"><td><b>${esc(unitName(r.t))}</b><br><span class="small muted">${esc(r.v.used.join(' + '))}</span></td>${mode === 'BOTH' ? `<td>${r.ph === 'COMBAT' ? 'Charge + CàC' : 'Tir'}</td>` : ''}
      <td class="num">${r1(r.v.dmg)}</td><td class="num">${r.v.kills} / ${r.t.alive}</td><td class="num">${r.v.supLost ? `<span class="pill ok">−${r.v.supLost} (≈ +${r.v.supLost} PV)</span>` : '0'}</td>
      <td class="small">${r.v.nd ? `encore ${r.v.nd.k} fig. → supply ${curSup(r.t)}→${r.v.nd.to}` : curSup(r.t) === 0 ? 'déjà à 0' : '—'}</td></tr>`).join('')
  }</tbody></table></div><p class="small muted" style="margin:4px 0 0">Estimation moyenne : toutes les figurines à portée et visibles, sans couvert ni capacités du défenseur. Tu vérifies la portée et la ligne de vue sur la table.</p>`;
}

function renderFlow(u){
  const N = tree(u), path = U.flow[u.id] || [];
  let id = 'root', i = 0, html = '';
  while (N[id] && !N[id].leaf){
    const n = N[id];
    let ans = path[i];
    const auto = ans == null && n.auto !== undefined;
    if (auto) ans = n.auto;
    const qhtml = `<div class="qt">${linkify(n.q)}</div>${n.info ? `<div class="qi">${linkify(n.info)}</div>` : ''}`;
    if (ans == null){
      html += `<div class="fn qn cur"><div class="ico"><span>?</span></div>${qhtml}
        ${n.calc ? chargeCalc(n.calc) : ''}${n.cmp ? compareHTML(u, n.cmp) : ''}
        <div class="opts">${n.opts.map((o, j) => `<button data-ans="${j}" data-depth="${i}" data-seteng="${n.setEng ? 1 : ''}">${esc(o[0])}</button>`).join('')}</div></div>`;
      return html;
    }
    html += `<div class="fn qn"><div class="ico"><span>?</span></div>${qhtml}
      <div class="ans"><span class="pill q">→ ${esc(n.opts[ans][0])}</span>${auto ? '<span class="muted small"> (déduit de l’état de l’unité)</span>' : `<button class="undo" data-back="${i}">changer</button>`}</div></div>`;
    id = n.opts[ans][1]; i++;
  }
  const l = N[id]; if (!l) return html;
  html += `<div class="fn leaf"><div class="ico">!</div><div class="leafcard"><header>Action : ${esc(l.title)}</header><div class="bd">
    <ol>${l.steps.map(s => `<li>${linkify(s)}</li>`).join('')}</ol>
    ${l.cmp ? compareHTML(u, l.cmp) : ''}
    ${l.tip ? `<div class="note tip"><span class="lbl">Conseil</span>${linkify(l.tip)}</div>` : ''}
    ${l.warn ? `<div class="note warn"><span class="lbl">Attention</span>${linkify(l.warn)}</div>` : ''}

/* ---- conseiller ---- */
function adviceHTML(){
  const ph = PH[S.phase].id, tips = [];
  if (ph === 'MOVEMENT'){
    const av = avail(S.units);
    const dep = S.units.filter(u => u.loc === 'res' && !u.act[1] && (av === Infinity || curSup(u) <= av));
    if (dep.length){
      const sorted = dep.slice().sort((a, b) => S.round === 1 ? curSup(a) - curSup(b) : curSup(b) - curSup(a));
      tips.push(`<b>Déploiement possible</b> (${fmtSup(av)} supply disponible) : ${sorted.map(u => esc(unitName(u)) + ' <span class="mono">' + curSup(u) + '</span>').join(', ')}. ${S.round === 1 ? 'Round 1 : commence par les moins chères.' : 'Les unités chères gagnent à arriver aux rounds 2 et 3.'}`);
    }
    const left = S.units.filter(u => u.loc !== 'dead' && !u.act[1]);
    if (!dep.length && left.every(u => u.loc === 'res')) tips.push('<b>Plus rien d’utile à activer</b> : passe maintenant pour prendre le marqueur Premier joueur de la phase d’Assaut.');
    if (!S.passed.opp && !S.passed.me && left.length <= 2 && left.length) tips.push('Il te reste peu d’unités à activer : si elles sont déjà bien placées, <b>passer en premier</b> te fait tirer en premier.');
  }
  if (ph === 'ASSAULT' || ph === 'COMBAT'){
    const mine = S.units.filter(u => u.loc === 'table' && !u.act[S.phase] && (ph === 'ASSAULT' || u.engaged));
    const best = [];
    mine.forEach(u => {
      let top = null;
      S.opp.units.filter(t => t.loc === 'table').forEach(t => {
        if (ph === 'ASSAULT' && ((!u.engaged && t.engaged) || (u.engaged && !t.engaged) || u.penalty)) return;
        const v = bestVolley(u, t, ph === 'COMBAT' ? 'COMBAT' : 'ASSAULT'); if (!v) return;
        if (!top || v.supLost > top.v.supLost || (v.supLost === top.v.supLost && v.kills > top.v.kills)) top = {t, v};
      });
      if (top) best.push({u, ...top});
    });
    best.sort((a, b) => b.v.supLost - a.v.supLost || b.v.kills - a.v.kills);
    if (best.length) tips.push('<b>Meilleures activations estimées</b> (si la cible est à portée et visible) :<ol style="margin:4px 0 0;padding-left:20px">' + best.slice(0, 3).map(b => `<li>${esc(unitName(b.u))} → ${esc(unitName(b.t))} : ≈ ${b.v.kills} fig.${b.v.supLost ? `, <b>−${b.v.supLost} supply (≈ +${b.v.supLost} PV)</b>` : ''}</li>`).join('') + '</ol>');
    const near = S.opp.units.filter(t => t.loc === 'table' && nextDrop(t) && nextDrop(t).k <= 2);
    if (near.length) tips.push('<b>Proches d’un palier de supply</b> : ' + near.map(t => `${esc(unitName(t))} (encore ${nextDrop(t).k} fig. → ${nextDrop(t).to})`).join(', ') + '. Les achever retire du supply, donc des PV et du poids sur les marqueurs.');
    if (!S.opp.units.length) tips.push('Ajoute l’armée adverse dans l’onglet Armées pour obtenir des suggestions de cibles.');
  }
  const mk = liveMarkers().filter(m => m.active || mission().scoring_model !== 'activated_round');
  if ((ph === 'MOVEMENT' || ph === 'ASSAULT') && mk.length){
    const lost = mk.filter(m => m.owner === 'opp').map(m => m.id), free = mk.filter(m => !m.owner).map(m => m.id);
    if (lost.length || free.length) tips.push(`<b>Marqueurs</b> : ${free.length ? 'neutres ' + free.join(', ') + '. ' : ''}${lost.length ? 'tenus par l’adversaire ' + lost.join(', ') + ' (il faut plus de supply que lui à 3" pour les reprendre).' : ''}`);
  }
  if (!tips.length) return '';
  return `<div class="panel advice"><h2>Conseiller</h2><ul class="tips">${tips.map(t => `<li>${t}</li>`).join('')}</ul></div>`;
}

function phaseAbilities(u){ const ph = PH[S.phase].id; return abilitiesOf(u).filter(a => a.phase === ph || a.phase === 'ANY'); }

      : `<p><span class="pill ok">${S.vp.me < S.vp.opp ? 'Tu prendras' : 'L’adversaire prendra'} le marqueur au round suivant</span></p>`}

  const nmQ = ['haut-gauche','haut-droit','bas-gauche','bas-droit'];
  return `<div class="panel"><h2>Quarts de table</h2><p class="sub">Supply des unités <b>entièrement</b> dans chaque quart. Une unité qui contrôle un marqueur compte +1. 1 PV par quart où tu as plus que l’adversaire.</p>
    <div class="grid4">${nmQ.map((n, i) => `<div class="fld"><span class="lbl">${i+1} · ${n}</span><div class="row small">Toi <input class="qin" type="number" min="0" data-q="me|${i}" value="${q.me[i]}"> Adv. <input class="qin" type="number" min="0" data-q="opp|${i}" value="${q.opp[i]}"></div></div>`).join('')}</div></div>`;
}
function renderOver(){
  const w = S.vp.me > S.vp.opp ? 'Victoire' : S.vp.me < S.vp.opp ? 'Défaite' : 'Égalité';
  return `<div class="panel"><h2>Partie terminée — ${w}</h2><p class="sub">Score final : <b class="mono">${S.vp.me}</b> contre <b class="mono">${S.vp.opp}</b>.</p>
    <div class="row"><button class="btn pri" data-tab="log">Voir le bilan</button><button class="btn" id="newGame">Nouvelle partie avec les mêmes listes</button></div></div>`;
}

/* ================= Plan de jeu (commun builder + aide de jeu) =================
   buildPlanHTML(ctx) → HTML. Tout est déduit des cartes (DB) et des règles du livre :
   aucune règle ou effet n'est inventé ; les recommandations sont des heuristiques signalées comme telles. */
var PLAN = (function(){
  const E = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const NM = (k, o) => (o && o.display_name) || String(k).replace(/_/g, ' ').replace(/\b([a-z])/g, m => m.toUpperCase());
  const ROLE = {'DAMAGE DEALER':'Dégâts', TANK:'Tank', TACTICIAN:'Tacticien', LIFESAVER:'Soutien'};
  const PHASE = {MOVEMENT:'Mouvement', ASSAULT:'Assaut', COMBAT:'Combat', ANY:'Toute phase', SCORING:'Score'};
  const TYPE = {ACTIVE:'Active', PASSIVE:'Passive', REACTION:'Réaction'};
  const DEFAULTS = {Skirmish:{start:3, inc:1, rounds:5}, Standard:{start:6, inc:2, rounds:5}, Grand_Offensive:{start:6, inc:2, rounds:5}};
  const SCALEFR = {Skirmish:'Skirmish', Standard:'Standard', Grand_Offensive:'Grand Offensive'};

  function supplyFor(def, n){ if (!n) return 0; const p = def.supply_profile || []; for (const b of p) if (n >= b.models_min && n <= b.models_max) return b.supply; return p.length ? p[p.length-1].supply : 0; }
  function weaponsOf(def, ups){
    const out = [];
    Object.entries(def.weapons || {}).forEach(([k, w]) => {
      if (w.requires_upgrade && !ups.includes(w.requires_upgrade)) return;
      const rep = ups.map(x => [x, (def.upgrades||{})[x]]).find(([x, up]) => up && up.weapon_replacement && up.for_weapon === k && !up.specialist);
      out.push(rep ? Object.assign({name: NM(rep[0], rep[1]), phase: rep[1].phase || w.phase}, rep[1].weapon_replacement) : Object.assign({name: NM(k)}, w));
    });
    ups.forEach(x => { const up = (def.upgrades||{})[x]; if (!up) return;
      if (up.weapon_replacement && up.specialist) out.push(Object.assign({name: NM(x, up), phase: up.phase || 'ASSAULT', one: true}, up.weapon_replacement));
      if (up.weapon_added) out.push(Object.assign({name: NM(x, up), phase: up.phase || 'ASSAULT', one: !!up.specialist}, up.weapon_added)); });
    return out;
  }
  function abilitiesOf(def, ups){
    const out = Object.entries(def.abilities || {}).map(([k, a]) => Object.assign({key:k, name: NM(k, a)}, a));
    ups.forEach(x => { const up = (def.upgrades||{})[x]; if (up && up.upgrade_kind === 'ABILITY') out.push({key:x, name: NM(x, up), type: up.type, phase: up.phase, cost: up.cost, text: up.text, builder_effect: up.builder_effect}); });
    return out;
  }
  const costN = a => a && a.cost ? Object.values(a.cost)[0] || 0 : 0;
  const isTpl = w => /\b(BT|FT)\b/.test(String(w.roa) + ' ' + String(w.s_dice));
  const kwHas = (w, k) => (w.keywords || []).some(x => String(x).toUpperCase().startsWith(k));
  const short = (t, n) => { t = String(t || '').replace(/\s+/g, ' ').trim(); if (t.length <= n) return t; const cut = t.slice(0, n); const i = Math.max(cut.lastIndexOf('. '), cut.lastIndexOf(' ')); return cut.slice(0, i > n * 0.6 ? i : n).replace(/[ ,;:.]+$/, '') + '…'; };

  /* ---------- analyse d'une unité ---------- */
  function profile(u){
    const d = u.def, ws = weaponsOf(d, u.upgrades), tags = d.combat_tags || [];
    const fly = tags.includes('Flying'), ranged = ws.filter(w => w.phase === 'ASSAULT'), melee = ws.filter(w => w.phase === 'COMBAT');
    const rng = Math.max(0, ...ranged.map(w => typeof w.rng === 'number' ? w.rng : 0));
    const aa = ranged.some(w => /^(all|flying)$/i.test(w.target || ''));
    const ag = ranged.some(w => /^(all|ground)$/i.test(w.target || ''));
    const surge = [...new Set(ranged.concat(melee).flatMap(w => [].concat(w.surge_type || [])).filter(Boolean))];
    const tpl = ranged.some(isTpl), pierce = ws.some(w => kwHas(w, 'PIERCE')), indirect = ws.some(w => kwHas(w, 'INDIRECT'));
    const canCharge = !fly && melee.some(w => (parseInt(w.roa, 10) || 0) >= 1);
    const roaMax = a => Math.max(0, ...a.map(w => parseInt(w.roa, 10) || 0));
    const meleeStrong = canCharge && (roaMax(melee) >= roaMax(ranged.filter(w => !isTpl(w))) || melee.some(w => w.surge_type || kwHas(w, 'PIERCE')));
    const sup = supplyFor(d, u.models), sp = d.stats.speed;
    return {u, d, ws, tags, fly, ranged, melee, rng, aa, ag, surge, tpl, pierce, indirect, canCharge, meleeStrong, sup, sp, role: d.combat_role, abs: abilitiesOf(d, u.upgrades)};
  }
  function strengths(p){
    const s = [];
    if (p.rng) s.push(`tir ${p.rng}"`);
    if (p.aa) s.push('anti-aérien');
    if (p.surge.length) s.push('Surge ' + p.surge.join('/'));
    if (p.tpl) s.push('gabarit');
    if (p.pierce) s.push('PIERCE');
    if (p.indirect) s.push('tir indirect');
    if (p.meleeStrong) s.push(`corps à corps (charge ${p.sp + 1}–${p.sp + 6}")`);
    if (p.fly) s.push('volant');
    return s;
  }
  function advice(p){
    const t = [];
    if (p.fly) t.push('Harcèle et chasse les cibles isolées. Un volant ne conteste ni ne contrôle les marqueurs.');
    else if (p.role === 'TANK') t.push('Tiens les marqueurs exposés et encaisse : son supply pèse lourd sur un marqueur.');
    else if (p.role === 'LIFESAVER') t.push('Reste près des unités qu’elle soutient ; évite la ligne de front.');
    else if (p.role === 'TACTICIAN') t.push('Joue-la pour ses capacités : place-la là où elles touchent le plus d’unités.');
    if (p.role === 'DAMAGE DEALER' || (!p.fly && p.role !== 'TANK')){
      if (p.rng >= 12 && !p.meleeStrong) t.push(`Reste à distance (portée ${p.rng}") derrière un couvert et tire chaque round.`);
      else if (p.rng && p.meleeStrong) t.push(`Tire en approche, puis charge quand la cible est à ${p.sp + 3}" ou moins (2 chances sur 3).`);
      else if (p.rng && p.rng < 12) t.push(`Portée courte (${p.rng}") : avance de couvert en couvert avant de tirer.`);
      else if (!p.rng && p.meleeStrong) t.push(`Avance à couvert et charge : finis ton Move à ${p.sp + 3}" de la cible pour 2 chances sur 3.`);
    }
    if (!p.fly && p.sup <= 1) t.push('Peu chère en supply : idéale pour contester un marqueur tôt.');
    if (p.tpl) t.push('Vise les unités groupées ou plusieurs unités serrées autour d’un marqueur (Spillover).');
    return t.join(' ');
  }

  /* ---------- ordre d'entrée ---------- */
  function deployment(P, M){
    const list = P.filter(p => !p.u.summoned).map(p => p);
    const left = list.slice(), rounds = [];
    let onTable = 0;
    for (let r = 1; r <= M.rounds; r++){
      const last = r === M.rounds, pool = last ? Infinity : M.start + (r - 1) * M.inc;
      let av = pool === Infinity ? Infinity : pool - onTable;
      const order = left.slice().sort((a, b) => r === 1
        ? (a.sup - b.sup) || ((a.fly ? 1 : 0) - (b.fly ? 1 : 0)) || (b.sp - a.sp)
        : (b.sup - a.sup) || ((a.fly ? 1 : 0) - (b.fly ? 1 : 0)));
      const ins = [];
      order.forEach(p => { if (p.sup <= av){ ins.push(p); av -= p.sup; onTable += p.sup; left.splice(left.indexOf(p), 1); } });
      let why = '';
      if (r === 1) why = ins.length ? 'Unités peu chères d’abord : contester les marqueurs tôt et voir ce que fait l’adversaire (conseil du livre).' : 'Supply trop faible : aucune unité n’entre au round 1.';
      else if (last) why = ins.length ? 'Dernier round : supply illimité, tout ce qui reste entre. Une unité encore en réserve au score compte comme détruite.' : 'Tout est déjà sur la table.';
      else if (!ins.length && !left.length) why = 'Toute l’armée est déjà sur la table : le supply en plus permet de remplacer les pertes (rien d’autre à faire entrer).';
      else why = ins.length ? `Le pool monte à ${pool} : place pour ${ins.map(p => p.u.name).slice(0, 2).join(' et ')}.` : `Pool ${pool} : rien ne rentre encore, garde la réserve ou attends des pertes.`;
      rounds.push({r, pool, ins, onTable, why});
    }
    return rounds;
  }

  /* ---------- rendu ---------- */
  function build(ctx){
    const T = ctx.cls || {}, tbl = T.table || 'pt', ul = T.list || 'pl-list';
    const fr = ctx.fr || (() => null);
    const P = ctx.units.map(profile);
    const M = ctx.mission;
    const res = ctx.resName || 'ressource', resTot = ctx.resTotal || 0;
    const secs = [];
    const H = (t, body) => secs.push(`<section class="plan-sec"><h3>${E(t)}</h3>${body}</section>`);

    /* en bref */
    const holders = P.filter(p => !p.fly && !p.u.summoned);
    const supTot = P.filter(p => !p.u.summoned).reduce((a, p) => a + p.sup, 0);
    H('En bref', `<ul class="${ul}">
      <li><b>Mission</b> : ${M.isDefault ? `valeurs par défaut ${E(SCALEFR[M.scale] || M.scale || '')} (supply ${M.start}, +${M.inc} par round, ${M.rounds} rounds). Renseigne ta Mission Card pour affiner.` : `${M.name ? E(M.name) + ' · ' : ''}supply ${M.start} au round 1, +${M.inc} par round, ${M.rounds} rounds.`}</li>
      <li><b>Armée</b> : ${P.length} unités, supply total ${supTot} · ${holders.length} unités au sol pour tenir les marqueurs.</li>
      <li><b>Ressource</b> : ${resTot} ${E(res)} par round (Faction Card + Tactical Cards).</li></ul>`);

    /* rôles */
    H('Rôle de chaque unité', `<table class="${tbl}"><thead><tr><th>Unité</th><th>Rôle</th><th>Atouts</th><th>Ce qu’elle doit faire</th></tr></thead><tbody>${
      P.map(p => `<tr><td><b>${E(p.u.name)}</b><br><i>${p.u.models} fig. · supply ${p.sup}${p.u.summoned ? ' · invoquée' : ''}</i></td><td>${E(ROLE[p.role] || p.role || '–')}</td><td>${E(strengths(p).join(' · ') || '–')}</td><td>${E(advice(p) || 'Polyvalente : adapte-la au besoin du round.')}</td></tr>`).join('')}</tbody></table>`);

    /* déploiement */
    const D = deployment(P, M);
    H('Ordre d’entrée en jeu', `<table class="${tbl}"><thead><tr><th>Round</th><th>Pool</th><th>Entrent</th><th>Pourquoi</th></tr></thead><tbody>${
      D.map(x => `<tr><td><b>${x.r}</b></td><td>${x.pool === Infinity ? '∞' : x.pool}</td><td>${x.ins.length ? x.ins.map(p => `${E(p.u.name)} <i>(${p.sup})</i>`).join(', ') : '–'}</td><td>${E(x.why)}</td></tr>`).join('')}</tbody></table>
      <p class="pl-note">Calcul sans pertes : chaque unité détruite libère du supply et permet d’entrer plus tôt. Les invocations n’entrent pas par ce plan.</p>`);

    /* capacités */
    const all = [];
    P.forEach(p => p.abs.forEach(a => all.push({src: p.u.name, a, p})));
    (ctx.cards || []).forEach(c => Object.entries(c.def.abilities || {}).forEach(([k, a]) => all.push({src: NM(c.key, c.def), a: Object.assign({key:k, name: NM(k, a)}, a), card: true})));
    const usable = all.filter(x => x.a.type && x.a.type !== 'PASSIVE');
    const passive = all.filter(x => x.a.type === 'PASSIVE');
    const byPh = {};
    usable.forEach(x => (byPh[x.a.phase || 'ANY'] = byPh[x.a.phase || 'ANY'] || []).push(x));
    const order = ['MOVEMENT', 'ASSAULT', 'COMBAT', 'ANY'].concat(Object.keys(byPh).filter(k => !['MOVEMENT','ASSAULT','COMBAT','ANY'].includes(k)));
    let capH = order.filter(k => byPh[k]).map(k => `<p class="pl-ph">${E(PHASE[k] || k)}</p><ul class="${ul}">${byPh[k].map(x => `<li><b>${E(x.a.name)}</b> <i>(${E(x.src)} · ${E(TYPE[x.a.type] || x.a.type)}${costN(x.a) ? ' · ' + costN(x.a) + ' ' + E(res) : ' · gratuite'})</i> — ${E(short(fr(x.a.text) || x.a.text, 170))}</li>`).join('')}</ul>`).join('');
    /* budget par round, d'après l'ordre d'entrée */
    const onAt = r => new Set(D.filter(x => x.r <= r).flatMap(x => x.ins.map(p => p.u.name)));
    const budget = D.map(x => { const on = onAt(x.r); const need = usable.filter(y => costN(y.a) > 0 && (y.card || on.has(y.src))).reduce((a, y) => a + costN(y.a), 0); return {r: x.r, need}; });
    const over = budget.filter(b => b.need > resTot);
    capH += `<p class="pl-ph">Budget de ${E(res)}</p><ul class="${ul}"><li>Tu génères <b>${resTot} ${E(res)}</b> par round. Toutes tes capacités payantes coûtent ${budget.map(b => `${b.need} au round ${b.r}`).join(', ')} si tu les utilises toutes une fois.</li>${
      over.length ? `<li><b>Tu ne pourras pas tout payer</b> ${over.length === budget.length ? 'à aucun round' : 'dès le round ' + over[0].r} : choisis chaque round les capacités des unités qui agissent vraiment (cible à portée, charge possible). Les moins chères d’abord : ${usable.filter(y => costN(y.a) > 0).sort((a, b) => costN(a.a) - costN(b.a)).slice(0, 4).map(y => E(y.a.name) + ' (' + costN(y.a) + ')').join(', ')}.</li>` : '<li>Ton budget couvre toutes tes capacités payantes : utilise-les chaque round, la ressource non dépensée est perdue au nettoyage.</li>'}</ul>`;
    if (passive.length) capH += `<p class="pl-ph">Toujours actives (rien à payer)</p><p>${passive.map(x => `${E(x.a.name)} <i>(${E(x.src)})</i>`).join(' · ')}</p>`;
    H('Capacités à utiliser', capH || '<p>Aucune capacité active dans la liste.</p>');

    /* associations */
    const syn = [];
    const names = P.map(p => ({p, words: [p.u.name, NM(p.u.key)].map(s => s.replace(/\s*\(.*\)$/, ''))}));
    all.forEach(x => {
      const t = String(x.a.text || '');
      names.forEach(n => { if (n.p.u.name === x.src) return; if (n.words.some(w => w.length > 3 && new RegExp('\\b' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + 's?\\b', 'i').test(t))) syn.push(`<b>${E(x.a.name)}</b> (${E(x.src)}) agit avec <b>${E(n.p.u.name)}</b>.`); });
      const fm = t.match(/Friendly ((?:[A-Z][a-z]+ )*?)(Biological|Mechanical|Light|Armoured|Psionic|Ground|Flying)\b/);
      if (fm){ const tag = fm[2], who = P.filter(p => p.u.name !== x.src && p.tags.includes(tag)).map(p => p.u.name); if (who.length) syn.push(`<b>${E(x.a.name)}</b> (${E(x.src)}) cible les unités amies ${E(tag)} : ${E(who.join(', '))}.`); }
    });
    const creepNeed = all.filter(x => !x.card && /ON CREEP/.test(x.a.text || ''));
    if (creepNeed.length && (ctx.creep || []).length) syn.push(`Creep : ${E([...new Set(creepNeed.map(x => x.src))].join(', '))} gagne(nt) des effets ON CREEP. Étends le creep vers les marqueurs et les zones de combat.`);
    H('Associations utiles', syn.length ? `<ul class="${ul}">${[...new Set(syn)].slice(0, 10).map(s => `<li>${s}</li>`).join('')}</ul>` : '<p>Pas d’association directe repérée entre les cartes de la liste.</p>');

    /* points faibles */
    const weak = [];
    if (!P.some(p => p.aa)) weak.push('Aucune arme ne touche les volants : face à une armée aérienne, tu subiras sans riposter. Couvre-toi avec le décor.');
    else if (P.filter(p => p.aa).length === 1) weak.push(`Une seule unité anti-aérienne (${E(P.find(p => p.aa).u.name)}) : protège-la, c’est elle qui gère les volants.`);
    if (holders.length < 3) weak.push(`Seulement ${holders.length} unité(s) au sol pour tenir les marqueurs : choisis 2 marqueurs à tenir plutôt que de te disperser.`);
    D.filter(x => x.r === M.rounds).forEach(x => x.ins.forEach(q => weak.push(`${E(q.u.name)} (supply ${q.sup}) n’entre qu’au dernier round sans pertes : envisage une unité moins chère, ou compte sur tes pertes pour la faire entrer plus tôt.`)));
    if (!P.some(p => p.meleeStrong)) weak.push('Pas d’unité de charge : tu subis le corps à corps sans pouvoir l’imposer. Garde tes distances.');
    const sg = new Set(P.flatMap(p => p.surge));
    if (!sg.has('Armoured')) weak.push('Pas de Surge contre Armoured : les cibles blindées encaisseront tes tirs.');
    if (!sg.has('Light')) weak.push('Pas de Surge contre Light : l’infanterie légère nombreuse sera longue à réduire.');
    if (Math.max(0, ...P.map(p => p.rng)) < 12 && P.some(p => p.rng)) weak.push('Portée courte (moins de 12") : avance à couvert pour ne pas te faire tirer dessus avant de pouvoir répondre.');
    if (creepNeed.length && !(ctx.creep || []).length) weak.push('Des capacités demandent ON CREEP mais aucune Creep Card n’est choisie.');
    H('Points faibles', weak.length ? `<ul class="${ul}">${weak.map(s => `<li>${s}</li>`).join('')}</ul>` : '<p>Pas de point faible évident d’après les cartes : la partie se jouera sur le placement.</p>');

    /* conseils */
    const tips = ['Passe tôt en phase de Mouvement quand tes unités clés sont placées : tu prends le marqueur Premier joueur et tires en premier à l’Assaut (conseil du livre).'];
    if (P.some(p => p.meleeStrong)) tips.push('En phase de Combat, n’oublie pas Close Ranks : 3" pour mettre plus de figurines au contact.');
    if (P.some(p => p.rng)) tips.push('Si une unité n’a ni cible ni charge, fais un Run plutôt qu’un Hold : elle se rapproche d’un marqueur ou d’une charge (conseil du livre).');
    if (P.some(p => p.tpl)) tips.push('Ton adversaire aussi peut grouper ses unités sur un marqueur : c’est là que tes gabarits rapportent le plus.');
    if (P.some(p => p.fly)) tips.push('Tes volants ne tiennent pas les marqueurs : garde du supply au sol sur chaque marqueur que tu veux gagner.');
    tips.push('C’est le supply total à 3" qui contrôle un marqueur, pas le nombre de figurines : une grosse unité peut tenir seule.');
    H('Conseils de partie', `<ul class="${ul}">${tips.slice(0, 5).map(s => `<li>${E(s)}</li>`).join('')}</ul>`);

    (ctx.extra || []).forEach(x => H(x.title, x.html));
    return `<div class="plan">${secs.join('')}<p class="pl-foot">Plan généré à partir des cartes de ta liste et des règles du livre. Ce sont des recommandations : adapte-les au terrain et à l’adversaire.</p></div>`;
  }
  /* blocs séparés (pour la pagination du PDF du builder) */
  function sections(ctx){ const h = build(ctx); const d = document.createElement('div'); d.innerHTML = h; return [...d.querySelectorAll('.plan-sec')].map(s => s.outerHTML); }
  return {build, sections, supplyFor, DEFAULTS, NM};
})();

/* ================= plan de jeu dans l'aide de jeu ================= */
function planOppSections(){
  const opp = S.opp.units.filter(u => u.loc !== 'dead'), mine = S.units.filter(u => u.loc !== 'dead');
  if (!opp.length) return [{title:'Face à l’armée adverse', html:'<p>Ajoute la liste adverse (onglet Partie ou Armées) pour obtenir les cibles prioritaires et les menaces.</p>'}];
  const cl = u => Object.assign({}, u, {engaged:false, loc:'table'});
  const better = (a, b) => !b || a.supLost > b.supLost || (a.supLost === b.supLost && (a.kills > b.kills || (a.kills === b.kills && a.dmg > b.dmg)));
  const best = (att, foes) => { let r = null;
    foes.forEach(t => ['ASSAULT','COMBAT'].forEach(ph => {
      if (ph === 'COMBAT' && (isFlying(udef(att)) || isFlying(udef(t)))) return;
      const v = bestVolley(cl(att), cl(t), ph); if (v && v.dmg > 0 && better(v, r && r.v)) r = {t, ph, v};
    })); return r; };
  const how = ph => ph === 'COMBAT' ? 'en charge' : 'au tir';
  const tg = mine.map(u => ({u, b: best(u, opp)})).filter(x => x.b);
  const th = opp.map(t => ({t, b: best(t, mine)})).filter(x => x.b).sort((a, b) => b.b.v.supLost - a.b.v.supLost || b.b.v.kills - a.b.v.kills || b.b.v.dmg - a.b.v.dmg);
  const out = [];
  out.push({title:'Cibles prioritaires', html: tg.length ? `<ul class="pl-list">${tg.map(x => `<li><b>${esc(unitName(x.u))}</b> → <b>${esc(unitName(x.b.t))}</b> ${how(x.b.ph)} : ≈ ${x.b.v.kills} fig. sur ${x.b.t.alive}${x.b.v.supLost ? `, <b>−${x.b.v.supLost} supply (≈ +${x.b.v.supLost} PV)</b>` : ''}.</li>`).join('')}</ul><p class="pl-note">Estimation moyenne (cible à portée et visible, sans couvert ni capacités du défenseur). L’onglet Attaque affine au cas par cas.</p>` : '<p>Aucune cible atteignable avec tes armes.</p>'});

/* ---- actions directes du mode simplifié ---- */
function simpleActions(u){
  const d = udef(u), fly = isFlying(d), ph = PH[S.phase].id, sp = d.stats.speed, cs = curSup(u);
  const A = [];   // {label, act, x, note, cls, pl}
  const info = t => A.push({info: t});
  if (u.loc === 'dead'){ info('Unité détruite : elle ne peut plus agir.'); return A; }
  if (ph === 'MOVEMENT'){
    if (u.loc === 'res'){
      const av = avail(S.units);
      if (av === Infinity || cs <= av) A.push({label:'Deploy', act:'deploy', note:`Entre par ton Entry Edge, jusqu’à ${sp}". Ne finit pas dans la Zone of Influence adverse. Supply ${cs} (disponible ${fmtSup(av)}).`, cls:'pri', pl:'deploiement'});
      else info(`Pas assez de supply pour entrer : ${cs} demandé, ${fmtSup(av)} disponible. Laisse-la en réserve.`);
      info('Ou ne l’active pas : elle reste en réserve.');
      return A;
    }
    if (u.engaged && !fly){
      const engOpp = S.opp.units.filter(x => x.loc === 'table' && x.engaged).reduce((a, x) => a + curSup(x), 0);
      A.push({label:'Disengage (Tactical Mass)', act:'dis0', note:`Si ton supply (${cs}) dépasse celui des ennemis engagés${S.opp.units.length ? ` (${engOpp} saisi)` : ''} : aucune pénalité.`, cls:'pri', pl:'disengage'});
      A.push({label:'Disengage (pénalité)', act:'dis1', note:'Sinon : ni tir ni charge à la prochaine phase d’Assaut. Les figurines qui ne sortent pas de 1" sont détruites.', pl:'disengage'});
      A.push({label:'Hold', act:'hold', note:'Rester au contact : l’unité combattra en phase 3.'});
      return A;
    }
    A.push({label:'Move', act:'move', note:`Modèle de tête jusqu’à ${sp}"${fly ? ' en ligne droite (vol)' : ''}, pas à 1" d’un ennemi Ground, puis le reste en cohésion.`, cls:'pri', pl:'mouvement'});
    A.push({label:'Hold', act:'hold', note:'Ne bouge pas (garde STATIONARY).'});
    return A;
  }
  if (ph === 'ASSAULT'){
    if (u.loc === 'res'){ info('En réserve : aucune action en phase d’Assaut.'); return A; }
    const rw = rangedWeapons(u), nonBulky = rw.filter(w => !hasKw(w.keywords, 'BULKY')), cc = hasCCw(u), ma = missionAction();
    if (u.engaged && !fly){
      if (nonBulky.length) A.push({label:'Ranged Attack', act:'ranged', note:'Uniquement sur les unités avec lesquelles tu es engagé (pas d’arme BULKY). La cible a droit à un Evade.', cls:'pri', pl:'ldv'});
      A.push({label:'Hold', act:'hold', note:'L’unité combattra en phase 3.'});
      return A;
    }
    if (ma === 'gather') A.push({label:'Gather (+1 PV)', act:'gather', note:'Mission : non engagée, à 3" d’un marqueur contrôlé neutre ou de couleur adverse. Ni tir, ni charge, ni Run.'});
    if (ma === 'sabotage') A.push({sabotage:true});
    if (u.penalty){
      info('Pénalité de désengagement : ni tir ni charge cette phase.');
    } else {
      if (rw.length) A.push({label:'Ranged Attack', act:'ranged', note:rw.map(w => `${w.name} ${w.rng}" (${w.target})`).join(' · ') + '. Cible visible, à portée, non engagée (sauf PINPOINT).', cls:'pri', pl:'ldv'});
      if (!fly && cc) A.push({charge:true, note:`Speed ${sp}" + 1D6 : de ${sp + 1}" à ${sp + 6}". Uniquement des unités Ground, pas besoin de ligne de vue.`});
    }
    A.push({label:'Run', act:'run', note:`Move normal jusqu’à ${sp}".`, pl:'mouvement'});
    A.push({label:'Hold', act:'hold', note:'Ne fait rien.'});
    return A;
  }
  if (ph === 'COMBAT'){
    if (fly){ info('Les volants ne participent jamais à la phase de Combat.'); return A; }
    if (!u.engaged){ info('Non engagée : pas d’action en phase de Combat.'); return A; }
    A.push({ccEnd:true, note:'Close Ranks (3", optionnel) → Fighting et Supporting Rank → jets → pertes. Obligatoire.'});
    return A;
  }
  return A;
}

/* ===== capacités à gabarit (Psionic Storm, Psionic Gale, Plague…) ===== */
function tplAbilities(){
  const au = AT.who === 'me' ? S.units.find(x => x.id === AT.au) : (AT.ao ? S.opp.units.find(x => x.id === AT.ao) : null);
  if (!au) return [];
  return abilitiesOf(au).filter(a => /Blast Template/i.test(a.text || '') && /roll (\d) dice/i.test(a.text || '')).map(a => {
    const t = a.text, base = +t.match(/roll (\d) dice/i)[1];
    const plague = /depending on the BM spent/i.test(t);
    const thr = plague ? null : +((t.match(/result of (\d)\+/i) || [])[1] || 4);
    const mod = abilitiesOf(au).some(b => /\+1 Modifier to the dice rolled for its Psionic Storm/i.test(b.text || '')) && curSup(au) === 2 && /Psionic Storm/i.test(nm(a.key, a)) ? 1 : 0;
    return {key:a.key, name:nm(a.key, a), base, thr, plague, mod, cost:costTxt(a), unit:au};
  });
}
function curAbility(){ const l = tplAbilities(); return l.find(x => x.key === AT.ak) || l[0] || null; }
function abSettings(){ const f = AT.f; f.cov = f.cov || 1; f.bm = f.bm || 1; f.abPh = f.abPh || 'ASSAULT'; return f; }
function abThreshold(a, f){ const t = a.plague ? ({1:5, 2:4, 3:3})[f.bm] : a.thr; return Math.max(2, t - (a.mod || 0) - (f.abMod || 0)); }
function abilityPanel(){

    <div class="grid3" style="margin-top:8px">${fld('cov', 'Fig. de la cible sous le gabarit', f.cov)}${fld('abMod', 'Modificateur au jet (+)', f.abMod || 0)}
    ${a.plague ? `<label class="fld"><span class="lbl">BM dépensés</span><select id="f_bm">${[1,2,3].map(v => opt(v, v + ' BM → ' + ({1:'5+',2:'4+',3:'3+'})[v], +f.bm === v)).join('')}</select></label>`

}
function abResolve(a, f, cov, td, alive, marker, got){
  const dice = a.base + cov, t = abThreshold(a, f), p = pOf(t), exp = dice * p;

/* ================= journal & bilan ================= */
function bilanPoints(){
  const st = S.stats, pts = [], good = [];
  const rounds = Math.max(1, S.round - (S.phase === 0 ? 1 : 0));
  if (st.passFirst.me < st.passFirst.opp) pts.push([3, 'Passe plus tôt', `L’adversaire a passé en premier ${st.passFirst.opp} fois, toi ${st.passFirst.me}. Passer tôt en Mouvement te donne le marqueur Premier joueur pour l’Assaut : tu tires avant lui.`]);
  else if (st.passFirst.me) good.push(`Tu as passé en premier ${st.passFirst.me} fois : bon réflexe pour prendre l’initiative.`);
  if (st.unusedRes >= 2) pts.push([st.unusedRes, 'Dépense tes ressources', `${st.unusedRes} ${RES()} n’ont pas été utilisés avant les nettoyages. Elles ne se gardent pas d’un round à l’autre : regarde les capacités Active de chaque phase.`]);
  else if (st.unusedRes === 0 && S.round > 1) good.push('Tu as utilisé toutes tes ressources : bien joué.');
  if (st.idleRes >= 1) pts.push([2 + st.idleRes, 'Fais entrer tes réserves', `À ${st.idleRes} fin(s) de phase de Mouvement, tu avais encore le supply pour déployer une unité (par ex. ${[...new Set(st.idleList)].join(', ')}). Une unité en réserve ne conteste rien et compte comme détruite au dernier round.`]);
  if (st.holdAssault >= 2) pts.push([st.holdAssault, 'Évite les Hold en Assaut', `${st.holdAssault} Hold en phase d’Assaut. Sans cible, un Run te rapproche d’un marqueur ou d’une charge pour le round suivant.`]);
  if (st.chargeKo >= 2 || (st.chargeKo && st.chargeKo >= st.chargeOk)) pts.push([2 + st.chargeKo, 'Prépare tes charges', `${st.chargeKo} charge(s) ratée(s) pour ${st.chargeOk} réussie(s). Une charge ratée fait perdre toute l’activation : finis ton Move à Speed + 3" de la cible ou moins, et utilise le calcul de chances du logigramme.`]);
  const lostMk = S.markers.filter(m => m.owner === 'opp').length, myMk = S.markers.filter(m => m.owner === 'me').length;
  if (lostMk > myMk) pts.push([3, 'Joue les marqueurs', `L’adversaire tient ${lostMk} marqueur(s), toi ${myMk}. C’est le supply total à 3" qui décide : une unité au supply élevé pèse plus qu’une nuée de figurines.`]);
  else if (myMk) good.push(`Tu tiens ${myMk} marqueur(s) contre ${lostMk}.`);
  const dMe = Object.values(S.destroyed.opp).reduce((a, b) => a + b, 0), dOpp = Object.values(S.destroyed.me).reduce((a, b) => a + b, 0);
  if (dOpp > dMe) pts.push([2 + dOpp - dMe, 'Protège ton supply', `Tu as perdu ${dOpp} supply et détruit ${dMe}. Le comparateur de cibles montre les unités adverses proches d’un palier de supply : les achever rapporte des PV.`]);
  else if (dMe) good.push(`Supply détruit : ${dMe} contre ${dOpp} perdus.`);
  const paid = new Map(); S.units.filter(u => u.loc !== 'res' || u.act).forEach(u => abilitiesOf(u).filter(a => costVal(a) > 0 && a.type !== 'PASSIVE').forEach(a => paid.set(nm(a.key, a), u)));
  const usedNames = new Set((S.spent || []).map(e => e.name)); const never = [...paid.keys()].filter(n => !usedNames.has(n));
  if (never.length && S.round > 1) pts.push([1 + never.length / 2, 'Pense à tes capacités payantes', `Jamais utilisées pour l’instant : ${never.slice(0, 5).join(', ')}${never.length > 5 ? '…' : ''}. Regarde-les au moment d’activer l’unité.`]);
  pts.sort((a, b) => b[0] - a[0]);
  return {pts:pts.slice(0, 3), good};
}
function renderLog(){
  const b = bilanPoints();
  const rounds = Object.keys(S.vpRound).map(Number).sort((a, x) => a - x);
  const maxV = Math.max(1, ...rounds.map(r => Math.max(S.vpRound[r].me, S.vpRound[r].opp)));
  const bar = (v, cls) => `<span class="bar ${cls}" style="width:${Math.max(2, v / maxV * 100)}%"></span>`;

}

function resTableHTML(){
  const sp = S.spent || []; if (!sp.length && !S.stats.unusedRes) return '';
  const rs = [...new Set(sp.map(e => e.r).concat(Object.keys(S.vpRound).map(Number)))].sort((a, b) => a - b);
  const cnt = {}; sp.forEach(e => cnt[e.name] = (cnt[e.name] || 0) + 1);
  const top = Object.entries(cnt).sort((a, b) => b[1] - a[1]).slice(0, 4);
  return `<h3 style="margin:14px 0 6px;font-size:15px">Ressources (${esc(RES())})</h3>

    <p class="small muted">Non dépensé avant les nettoyages : <b class="mono">${S.stats.unusedRes}</b>${top.length ? ' · le plus utilisé : ' + top.map(([n, c]) => esc(n) + ' ×' + c).join(', ') : ''}</p>`;

/* ================= déroulé ================= */
function cleanup(){
  const un = readyRes(); S.stats.unusedRes += un;
  S.cards.forEach(c => c.ready = true); S.used = {};
  S.units.concat(S.opp.units).forEach(u => { u.act = {}; u.penalty = false; });
  S.cleaned = true; logA('Nettoyage' + (un ? ` (${un} ${RES()} non dépensés)` : ''), 'sys');
}
function initiative(){
  if (S.vp.me < S.vp.opp) S.fpm = 'me'; else if (S.vp.opp < S.vp.me) S.fpm = 'opp'; else if (S.rollOff) S.fpm = S.rollOff;
  S.rollOff = null;
}
function nextStep(){
  if (S.over) return;
  if (S.phase === 1){
    const av = avail(S.units);
    const idle = S.units.filter(u => u.loc === 'res' && (av === Infinity || curSup(u) <= av)).sort((a, b) => curSup(a) - curSup(b));
    if (idle.length){ S.stats.idleRes++; S.stats.idleList.push(unitName(idle[0])); }
  }
  if (S.phase >= 1 && S.phase <= 2 && S.firstPass[S.phase]) S.fpm = S.firstPass[S.phase];
  if (S.phase < 4){ S.phase++; S.passed = {}; U.sel = null; U.flow = {}; logA('Phase ' + PH[S.phase].t, 'sys'); }
  else {
    if (!S.cleaned) cleanup();
    S.vpRound[S.round] = {me:S.vp.me, opp:S.vp.opp};
    if (S.round >= lastRound() || specialWin()){ S.over = true; logA(`Fin de partie : ${S.vp.me} – ${S.vp.opp}`, 'sys'); U.tab = 'log'; }
    else { initiative(); S.round++; S.phase = 0; S.cleaned = false; S.firstPass = {}; S.passed = {};
      S.markers.forEach(m => { m.me = []; m.opp = []; m.meAdj = 0; m.oppAdj = 0; m.gained = null; });
      S.quarters = null; logA('Début du round ' + S.round + ' (1er joueur : ' + (S.fpm === 'me' ? 'toi' : 'adversaire') + ')', 'sys'); }
  }
  save(); render(); window.scrollTo({top:0});
}
function readList(txt){
  let j; try { j = JSON.parse(txt); } catch(e){ toast('Ce texte n’est pas du JSON valide. Copie tout le contenu du fichier exporté.'); return null; }
  if (j.type !== 'sctmg-list' || !DB.races[j.race]){ toast('Ce fichier n’est pas une liste exportée du builder (type « sctmg-list » attendu).'); return null; }
  return j;
}
function loadMine(txt){ const j = readList(txt); if (!j) return; const opp = S.opp.list, setup = S.setup, ou = S.opp.units; fresh(j, opp, setup); S.opp.units = ou; save(); render(); toast('Ta liste est chargée : ' + S.units.length + ' unités, ' + S.cards.length + ' cartes.'); }

  if (id === 'aU'){ AT.au = t.value; AT.aw = null; prefillAtt(); render(); return; }
  if (id === 'aO'){ AT.ao = t.value; AT.aw = null; prefillAtt(); render(); return; }
  if (id === 'aK'){ AT.ak = t.value; AT.r = {}; render(); return; }
  if (id === 'f_bm' || id === 'f_abPh'){ readAtk(); renderPipe(); return; }
  if (id === 'aW'){ AT.aw = t.value; prefillAtt(); render(); return; }
  if (id === 'nearA'){ U.near = t.checked; saveU(); refreshNear(); render(); return; }
  if (id === 'lockSel'){ const au = attackerUnit(); S.lock = S.lock || {}; S.lock[lockSide(au)] = t.value || null; save(); refreshNear(); render(); return; }
  if (id === 'nearT'){ U.near = t.checked; saveU(); render(); return; }
  if (id === 'oR'){ AT.oRace = t.value; AT.oUnit = Object.keys(allUnitsOf(AT.oRace))[0]; AT.aw = null; prefillAtt(); render(); return; }
  if (id === 'oU'){ AT.oUnit = t.value; AT.aw = null; prefillAtt(); render(); return; }
  if (id === 'tR'){ AT.tRace = t.value; AT.tUnit = Object.keys(allUnitsOf(AT.tRace))[0]; prefillDef(); render(); return; }
  if (id === 'tU'){ AT.tUnit = t.value; prefillDef(); render(); return; }

  if (id === 'tM'){ AT.tm = t.value; prefillDef(); refreshNear(); render(); return; }
  if (U.tab === 'attack' && t.type === 'checkbox' && (id.startsWith('f_') || t.dataset.tag != null)){ readAtk(); renderPipe(); return; }
  if (t.dataset.payred){ const k = t.dataset.payred, i = PAY.red.indexOf(k); if (t.checked && i < 0) PAY.red.push(k); if (!t.checked && i >= 0) PAY.red.splice(i, 1); POP.stack = [{html:payHTML()}]; renderPop(); return; }
});
document.addEventListener('toggle', e => { if (e.target.id === 'cmpBox'){ U.cmpOpen = e.target.open; saveU(); } if (e.target.id === 'seqBox'){ U.seqOpen = e.target.open; saveU(); } }, true);

  if (t.id === 'chDist'){ U.chDist = +t.value; saveU(); const u = S.units.find(x => x.id === U.sel), d = udef(u), two = abilitiesOf(u).some(a => /roll 2D6 instead of D6/i.test(a.text||''));
    $('#chP').textContent = pct(chanceCharge(d.stats.speed, +t.value, false)); if ($('#chP2')) $('#chP2').textContent = pct(chanceCharge(d.stats.speed, +t.value, true)); return; }
  if (t.dataset.q){ const [sd, i] = t.dataset.q.split('|'); S.quarters[sd][+i] = Math.max(0, +t.value || 0); save(); clearTimeout(window._qT); window._qT = setTimeout(() => { if (!document.activeElement || !document.activeElement.dataset.q) render(); }, 250); return; }
  if (t.id === 'glq'){ U.q = t.value; saveU(); const pos = t.selectionStart; render(); const n = $('#glq'); n.focus(); n.setSelectionRange(pos, pos); return; }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePop(); });
addEventListener('resize', () => { if (pop && POP.stack.length) renderPop(); });

new MutationObserver(renderHud).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});

/* ================= skin (original / Terran SC2) ================= */
(function(){
  const root = document.documentElement, btn = document.getElementById('skinBtn');
  const KEY = 'sctmg-skin';
  function apply(on){
    if (on) root.setAttribute('data-skin', 'terran'); else root.removeAttribute('data-skin');
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    btn.textContent = on ? 'Skin original' : 'Skin Terran';
  }
  let on = false;
  try { on = localStorage.getItem(KEY) === 'terran'; } catch (e) {}
  apply(on);
  btn.addEventListener('click', () => {
    on = !on; apply(on);
    try { localStorage.setItem(KEY, on ? 'terran' : 'original'); } catch (e) {}
  });
})();
