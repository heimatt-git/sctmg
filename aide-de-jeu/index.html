affinity":"RED"},{"id":2,"x":42,"y":12,"affinity":"BLUE"},{"id":3,"x":42,"y":24,"affinity":"RED"},{"id":4,"x":12,"y":24,"affinity":"BLUE"},{"id":5,"x":27,"y":18,"affinity":"NEUTRAL"}],"edges":{"RED":[["T",0,18],["B",36,54]],"BLUE":[["T",36,54],["B",0,18]]},"level":"STANDARD"},{"name":"Abandoned Camp","size":[36,36],"entry":{"BLUE":["bord haut (36\")"],"RED":["bord bas (36\")"]},"markers":[{"id":1,"x":6,"y":18,"affinity":"RED"},{"id":2,"x":30,"y":18,"affinity":"BLUE"},{"id":5,"x":18,"y":18,"affinity":"NEUTRAL"}],"edges":{"BLUE":[["T",0,36]],"RED":[["B",0,36]]},"level":"SKIRMISH"},{"name":"Power Lines","size":[36,36],"level":"SKIRMISH","entry":{"BLUE":["bord gauche (36\")","moitié gauche du bord haut (0–18\")"],"RED":["bord droit (36\")","moitié droite du bord haut (18–36\")"]},"edges":{"BLUE":[["L",0,36],["T",0,18]],"RED":[["R",0,36],["T",18,36]]},"markers":[{"id":1,"x":24,"y":15,"affinity":"RED"},{"id":2,"x":12,"y":15,"affinity":"BLUE"},{"id":5,"x":18,"y":30,"affinity":"NEUTRAL"}],"source":"PDF officiel Protoss P2P W3 (v1.09.26)"}],"validated":"Validé par l'utilisateur le 28/10/2026 (One Bridge Too Close : marqueurs 1 et 2 à 9\", entrée aussi par la moitié du bord haut). Standard = 54×36, Skirmish = 36×36."}</script>
<script type="application/json" id="tr">{"Use before a Friendly Unit makes an Evade Roll. Apply a +1 Modifier to that roll.":"À utiliser avant qu’une unité amie fasse un jet d’Evade. Applique un modificateur +1 à ce jet.","During Army Building, select exactly one Creep Card and add it to their Army List, paying its listed cost (if any).":"Pendant la construction d’armée, choisis exactement une carte Creep et ajoute-la à ta liste en payant son coût (s’il y en a un).","Select one Friendly, Unengaged Ground Zerg Unit on the battlefield. That Unit gains the Burrowed Status, even if it has already been Activated this Round.":"Choisis une unité Zerg Ground amie, non engagée, sur le champ de bataille. Elle gagne le statut Burrowed, même si elle a déjà été activée ce round.","If the active unit is ON CREEP, the unit gains BUFF Speed(1) and its first used Weapon gains PRECISION(1).":"Si l’unité active est ON CREEP, elle gagne BUFF Speed(1) et sa première arme utilisée gagne PRECISION(1).","During Army Building, you must select exactly one Creep Card and add it to your Army List, paying its listed cost (if any).":"Pendant la construction d’armée, tu dois choisir exactement une carte Creep et l’ajouter à ta liste en payant son coût (s’il y en a un).","If there is no Friendly Omega Worm on the battlefield, set a Friendly Omega Worm Unit anywhere on GROUND LEVEL of the battlefield, more than 10\" away from any Enemy model. This Round, the Omega Worm is not eligible to use its Special Abilities (excluding Structure).":"S’il n’y a pas d’Omega Worm ami sur le champ de bataille, place une unité Omega Worm amie n’importe où au GROUND LEVEL, à plus de 10\" de toute figurine ennemie. Ce round, l’Omega Worm ne peut pas utiliser ses capacités spéciales (sauf Structure).","If the active Friendly Zerg Unit is ON CREEP, increase its Speed characteristic by 1.":"Si l’unité Zerg amie active est ON CREEP, augmente sa caractéristique Speed de 1.","Creep Tumor tokens have STAY IN PLAY and DISPLACEMENT.":"Les jetons Creep Tumor ont STAY IN PLAY et DISPLACEMENT.","If an Enemy Unit ends a Move, Deploy, Run, Charge or Disengage action Within 1\" of a Friendly Creep Tumor token, remove that token from the battlefield.":"Si une unité ennemie termine une action Move, Deploy, Run, Charge ou Disengage à 1\" d’un jeton Creep Tumor ami, retire ce jeton du champ de bataille.","If the active Friendly Zerg Unit declares a Charge action while ON CREEP, it gains +1 Modifier to IMPACT Hit Rolls.":"Si l’unité Zerg amie active déclare une Charge alors qu’elle est ON CREEP, elle gagne un modificateur +1 à ses jets de touche d’IMPACT.","The active Unit's first Close Combat Weapon used gains PRECISION(2).":"La première arme de corps à corps utilisée par l’unité active gagne PRECISION(2).","The active Zergling Unit Deploys from any table edge that is not a Player's Entry Edge. This action must end more than 10\" away from any Enemy model.":"L’unité de Zerglings active se déploie depuis n’importe quel bord de table qui n’est pas l’Entry Edge d’un joueur. L’action doit se terminer à plus de 10\" de toute figurine ennemie.","The active Ground Unit loses the Burrowed Status.":"L’unité Ground active perd le statut Burrowed.","The active Unit's first Ranged Weapon used gains PRECISION(1).":"La première arme de tir utilisée par l’unité active gagne PRECISION(1).","Use before a Friendly Unit makes an Armour Roll. That Unit gains TOUGH(1) for this roll.":"À utiliser avant qu’une unité amie fasse un jet d’armure. Elle gagne TOUGH(1) pour ce jet.","The active Unit gains a +1 Modifier to all IMPACT Hit Rolls.":"L’unité active gagne un modificateur +1 à tous ses jets de touche d’IMPACT.","The active, Unengaged Ground Unit gains the Burrowed Status.":"L’unité Ground active, non engagée, gagne le statut Burrowed.","Set a Creep Tumor token on the battlefield Within 6\" (Line of Sight is not required) of either a Friendly Entry Edge or an existing Friendly Creep Tumor token.":"Place un jeton Creep Tumor à 6\" (sans ligne de vue nécessaire) d’une Entry Edge amie ou d’un jeton Creep Tumor ami déjà en place.","The active Unit's Close Combat Weapons gain INSTANT.":"Les armes de corps à corps de l’unité active gagnent INSTANT.","Set a Faction Indicator anywhere on the battlefield. While Enemy Units are Within 6\" of this Faction Indicator, they lose HIDDEN Status.":"Place un Faction Indicator n’importe où sur le champ de bataille. Les unités ennemies à 6\" de ce Faction Indicator perdent le statut HIDDEN.","Use after a Friendly Unit rolls a D6 for Charge Distance. Roll an additional D6 and use the higher result to calculate the total Charge Distance.":"À utiliser après qu’une unité amie a lancé un D6 pour sa distance de charge. Lance un D6 supplémentaire et garde le meilleur résultat pour calculer la distance de charge totale.","Set a Faction Indicator anywhere on the battlefield more than 10\" away from any Enemy model. At the End of the Round, the controlling player may Deploy one Ground Unit from Reserves in base-to-base contact with this Faction Indicator.":"Place un Faction Indicator n’importe où sur le champ de bataille, à plus de 10\" de toute figurine ennemie. À la fin du round, le joueur qui le contrôle peut déployer une unité Ground depuis la réserve, au contact socle à socle de ce Faction Indicator.","The active Friendly non-Unique Biological Unit with a Size Characteristic of 1 resolves the RESPAWN(2) effect.":"L’unité Biological amie active, non Unique et de Size 1, résout l’effet RESPAWN(2).","The active Friendly Roach Unit performs MORPH (Ravager) 1.":"L’unité de Roachs amie active effectue MORPH (Ravager) 1.","This Unit's Horizontal Coherency is 4\".":"La cohésion horizontale de cette unité est de 4\".","When determining Charge Distance for this Unit, roll 2D6 instead of D6 and use the higher result to add to the Unit's Speed characteristic.":"Pour la distance de charge de cette unité, lance 2D6 au lieu d’un D6 et ajoute le meilleur résultat à sa caractéristique Speed.","Immediately after this Unit completes a successful Charge, resolve the IMPACT(1) 5+ effect.":"Juste après une charge réussie de cette unité, résous l’effet IMPACT(1) 5+.","When this Unit is nominated to deploy from Reserves, it may resolve the PLACE(18) effect from the controlling player's Entry Edge. No model may be set Within 10\" of any Enemy model. This Unit's Activation ends.":"Quand cette unité est désignée pour se déployer depuis la réserve, elle peut résoudre l’effet PLACE(18) depuis l’Entry Edge de son joueur. Aucune figurine ne peut être placée à 10\" d’une figurine ennemie. L’activation de cette unité se termine.","This Unit's Claws and Shredding Claws weapons gain PRECISION(2).":"Les armes Claws et Shredding Claws de cette unité gagnent PRECISION(2).","Resolve the RESPAWN(2) effect, or RESPAWN(3) if the Unit is ON CREEP.":"Résous l’effet RESPAWN(2), ou RESPAWN(3) si l’unité est ON CREEP.","This Unit can move through IMPASSABLE TERRAIN of Size 4 or less and change elevation without using ACCESS POINTS.":"Cette unité peut traverser les IMPASSABLE TERRAIN de Size 4 ou moins et changer d’élévation sans passer par un ACCESS POINT.","This Unit gains a +1 Modifier to all IMPACT Hit Rolls.":"Cette unité gagne un modificateur +1 à tous ses jets de touche d’IMPACT.","When determining Charge Distance for this Unit, add 2 to the Charge Distance.":"Pour la distance de charge de cette unité, ajoute 2 à la distance de charge.","Immediately after this Unit completes a successful Charge, resolve the IMPACT(2) 5+ effect.":"Juste après une charge réussie de cette unité, résous l’effet IMPACT(2) 5+.","If this Unit is Unengaged, it gains or loses the Burrowed Status.":"Si cette unité n’est pas engagée, elle gagne ou perd le statut Burrowed.","When this Unit becomes Activated, if it has the Burrowed Status, resolve the HEAL(2) effect.":"Quand cette unité est activée, si elle a le statut Burrowed, résous l’effet HEAL(2).","Immediately after this Unit completes a successful Charge, resolve the IMPACT(2) 4+ effect.":"Juste après une charge réussie de cette unité, résous l’effet IMPACT(2) 4+.","While this Unit has Burrowed Status, it may perform Move and Run actions without losing that status. May also move through other Units' bases.":"Tant que cette unité a le statut Burrowed, elle peut faire des actions Move et Run sans perdre ce statut. Elle peut aussi traverser les socles des autres unités.","This Unit gains BUFF Speed(1), or BUFF Speed(2) if the Unit is ON CREEP.":"Cette unité gagne BUFF Speed(1), ou BUFF Speed(2) si elle est ON CREEP.","This Unit's Acid Saliva weapon gains Surge Type: Light, and S Dice: D3+1.":"L’arme Acid Saliva de cette unité gagne Surge Type : Light et S Dice : D3+1.","If this Unit is not Engaged, it gains or loses the Burrowed Status.":"Si cette unité n’est pas engagée, elle gagne ou perd le statut Burrowed.","Use when an Enemy Unit Within 8\" of this Unit declares a Ranged Attack. Apply DEBUFF Hit(1) to each of that Unit's Ranged Weapons.":"À utiliser quand une unité ennemie à 8\" de cette unité déclare une Ranged Attack. Applique DEBUFF Hit(1) à chacune des armes de tir de cette unité ennemie.","Immediately after this Unit completes a successful Charge, resolve the IMPACT(1) 4+ effect.":"Juste après une charge réussie de cette unité, résous l’effet IMPACT(1) 4+.","Resolve the SUMMON (Roachling) effect.":"Résous l’effet SUMMON (Roachling).","Immediately after this Unit completes a successful Charge, resolve the IMPACT(3) 4+ effect.":"Juste après une charge réussie de cette unité, résous l’effet IMPACT(3) 4+.","Set a Ravager Burrow token Wholly Within 12\" of any model in this Unit. At the End of the Round, the controlling player may set all models of this Unit in Coherency, treating the Ravager Burrow token as the Leading Model. The Ravager Burrow token has DISPLACEMENT.":"Place un jeton Ravager Burrow entièrement à 12\" d’une figurine de cette unité. À la fin du round, le joueur qui la contrôle peut placer toutes les figurines de l’unité en cohésion, en prenant le jeton Ravager Burrow comme modèle de tête. Le jeton Ravager Burrow a DISPLACEMENT.","For each model in this Unit, set one Corrosive Bile token on the battlefield Within 14\" of that model. These tokens are not removed if this Unit is Destroyed. At the End of the Assault Phase, each Unit suffers HITS 5 (1) effect for each of this Unit's Corrosive Bile tokens it is Within 1\" of. Then, remove all of this Unit's Corrosive Bile tokens from the battlefield. If multiple effects trigger at the End of the Assault Phase, resolve them in the order specified in Part 8.9.4.":"Pour chaque figurine de cette unité, place un jeton Corrosive Bile sur le champ de bataille à 14\" de cette figurine. Ces jetons ne sont pas retirés si l’unité est détruite. À la fin de la phase d’Assaut, chaque unité subit l’effet HITS 5 (1) pour chaque jeton Corrosive Bile de cette unité à 1\" d’elle. Retire ensuite tous les jetons Corrosive Bile de cette unité. Si plusieurs effets se déclenchent à la fin de la phase d’Assaut, résous-les dans l’ordre indiqué en 8.9.4.","Increase the area of effect of this Unit's Corrosive Bile ability to 2\".":"La zone d’effet de la capacité Corrosive Bile de cette unité passe à 2\".","Before an Enemy Unit resolves an Armour Roll against the HITS effect generated by this Unit's Corrosive Bile ability, that Unit suffers DEBUFF Armour(1).":"Avant qu’une unité ennemie fasse un jet d’armure contre l’effet HITS de la capacité Corrosive Bile de cette unité, elle subit DEBUFF Armour(1).","When another Friendly Unit Within 10\" is the target of a Ranged Attack, after the attack is fully resolved, this Unit, if Unengaged, may perform a Move action Directly Towards the attacking Unit.":"Quand une autre unité amie à 10\" est la cible d’une Ranged Attack, une fois l’attaque entièrement résolue, cette unité, si elle n’est pas engagée, peut faire une action Move directement vers l’unité qui a attaqué.","This Unit gains TOUGH(1) on the first Armour Roll of each Activation.":"Cette unité gagne TOUGH(1) sur son premier jet d’armure de chaque activation.","If this Unit has Stationary Status, it is eligible to make an Evade Roll against the first Ranged Attack targeting it this Round. If ON CREEP, it gains +1 Modifier to this Evade Roll.":"Si cette unité a le statut Stationary, elle peut faire un jet d’Evade contre la première Ranged Attack qui la vise ce round. Si elle est ON CREEP, elle gagne un modificateur +1 à ce jet d’Evade.","When nominated to deploy from Reserves, may resolve PLACE(18) from the controlling player's Entry Edge. No model may be set Within 10\" of any Enemy model. This Unit's Activation ends.":"Quand elle est désignée pour se déployer depuis la réserve, elle peut résoudre PLACE(18) depuis l’Entry Edge de son joueur. Aucune figurine ne peut être placée à 10\" d’une figurine ennemie. L’activation de cette unité se termine.","This Unit's Needle Spines ranged weapon gains LONG RANGE (16\").":"L’arme de tir Needle Spines de cette unité gagne LONG RANGE (16\").","Set a Creep Tumor token in base-to-base contact with this Unit.":"Place un jeton Creep Tumor au contact socle à socle de cette unité.","Use when another Friendly Biological Unit (including a Structure) suffers Damage Within 4\". Reduce the Total Damage before allocation by 2.":"À utiliser quand une autre unité Biological amie (Structure comprise) subit des dégâts à 4\". Réduis de 2 le total de dégâts avant leur répartition.","Use when a Friendly Unit Within 4\" receives a DEBUFF. Remove all DEBUFFS from it.":"À utiliser quand une unité amie à 4\" reçoit un DEBUFF. Retire-lui tous ses DEBUFFS.","Once per Round, if there are at least 7 Friendly models Within 6\" of this Unit, it may resolve its Special Ability with the BM cost reduced by 1.":"Une fois par round, s’il y a au moins 7 figurines amies à 6\" de cette unité, elle peut résoudre sa capacité spéciale avec un coût en BM réduit de 1.","Immediately after this Unit completes a successful Charge, resolve the IMPACT(4) 3+ effect.":"Juste après une charge réussie de cette unité, résous l’effet IMPACT(4) 3+.","While this Unit is ON CREEP, increase this Unit's Speed characteristic by 2.":"Tant que cette unité est ON CREEP, augmente sa caractéristique Speed de 2.","Select another Friendly Unit Within 6\" (Line of Sight is not required). That Unit's Supply characteristic is increased by 1 for Controlling and Contesting Mission Markers and completing objectives.":"Choisis une autre unité amie à 6\" (sans ligne de vue nécessaire). Sa caractéristique Supply augmente de 1 pour contrôler et contester les marqueurs de mission et pour remplir les objectifs.","Treat this Unit's Supply characteristic as increased by 1 for Controlling and Contesting Mission Markers, completing objectives, and resolving Disengage checks.":"La caractéristique Supply de cette unité compte comme augmentée de 1 pour contrôler et contester les marqueurs de mission, remplir les objectifs et résoudre les vérifications de Disengage.","Select one Enemy Unit Within 12\". That Unit counts as Activated this Phase (set an Activation Marker next to it).":"Choisis une unité ennemie à 12\". Elle compte comme activée pendant cette phase (place un marqueur d’activation à côté).","Select one Enemy Unit Within 18\". This Unit is eligible to make an Evade Roll against all attacks made by the selected Enemy Unit, with a +2 Modifier applied to those Evade Rolls.":"Choisis une unité ennemie à 18\". Cette unité peut faire un jet d’Evade contre toutes les attaques de l’unité ennemie choisie, avec un modificateur +2 à ces jets.","If Unengaged, resolve the PLACE(6) effect.":"Si elle n’est pas engagée, résous l’effet PLACE(6).","Immediately after this Unit completes a successful Charge, resolve the IMPACT(4) 4+ effect.":"Juste après une charge réussie de cette unité, résous l’effet IMPACT(4) 4+.","This Unit cannot gain Burrowed Status.":"Cette unité ne peut pas gagner le statut Burrowed.","While Enemy Units are Within 6\" of this Unit, they lose HIDDEN Status.":"Les unités ennemies à 6\" de cette unité perdent le statut HIDDEN.","A Friendly or Enemy Ground Zerg Unit Within 6\" of this Unit, counts as being ON CREEP.":"Une unité Zerg Ground, amie ou ennemie, à 6\" de cette unité compte comme ON CREEP.","This Unit cannot be Activated in any Phase and cannot perform actions. Its Current Supply Value is treated as 0, and it can never Control or Contest Mission Markers, ignoring the standard Zero Supply Exception. This Unit cannot be a target of an ability, unless stated otherwise.":"Cette unité ne peut être activée dans aucune phase et ne peut faire aucune action. Son supply actuel compte comme 0 et elle ne peut jamais contrôler ni contester de marqueur de mission, sans tenir compte de l’exception habituelle des unités à supply 0. Elle ne peut pas être ciblée par une capacité, sauf mention contraire.","The base of the Omega Worm counts as an Entry Edge. Each Round, Friendly Units with a combined Supply cost of 2 or less may be Deployed via this Entry Edge. If a Friendly Leading model finishes a Move, Disengage, or Run action in base-to-base contact with the Omega Worm, the controlling player may remove that Unit from the battlefield and return it to Reserves.":"Le socle de l’Omega Worm compte comme une Entry Edge. À chaque round, des unités amies dont le coût de supply cumulé est de 2 ou moins peuvent être déployées par cette Entry Edge. Si un modèle de tête ami termine une action Move, Disengage ou Run au contact socle à socle de l’Omega Worm, son joueur peut retirer cette unité du champ de bataille et la remettre en réserve.","The active Unit ignores the Disengage penalty for the remainder of the Round.":"L’unité active ignore la pénalité de Disengage jusqu’à la fin du round.","Immediately claim the First Player Marker. No other player may claim the First Player Marker for the remainder of this Phase.":"Prends immédiatement le marqueur Premier joueur. Aucun autre joueur ne peut le prendre jusqu’à la fin de cette phase.","Set a Friendly Point Defence Drone Unit anywhere on the battlefield, more than 1\" away from any Enemy model. Remove this Unit at the End of the Round.":"Place une unité Point Defence Drone amie n’importe où sur le champ de bataille, à plus de 1\" de toute figurine ennemie. Retire cette unité à la fin du round.","The active Unit resolves the PLACE (12) effect. Models set by this effect cannot be set up Within the Engagement Range of any Enemy Unit. This resolves instead of performing a standard action.":"L’unité active résout l’effet PLACE (12). Les figurines placées par cet effet ne peuvent pas l’être dans l’Engagement Range d’une unité ennemie. Cela remplace une action normale.","Use before a Friendly Biological Unit makes an Armour Roll. That Unit gains TOUGH (1) for this roll.":"À utiliser avant qu’une unité Biological amie fasse un jet d’armure. Elle gagne TOUGH (1) pour ce jet.","The active Biological Unit's first Ranged Weapon used gains CRITICAL HIT (1).":"La première arme de tir utilisée par l’unité Biological active gagne CRITICAL HIT (1).","The active Mechanical Unit resolves the HEAL (2) effect.":"L’unité Mechanical active résout l’effet HEAL (2).","If the active Mechanical Unit has the Stationary Status, its first Ranged Weapon used gains PRECISION (2).":"Si l’unité Mechanical active a le statut Stationary, sa première arme de tir utilisée gagne PRECISION (2).","Select one table edge that is not a player's Entry Edge. Until the End of the Round, Enemy Units cannot Deploy from that edge.":"Choisis un bord de table qui n’est pas l’Entry Edge d’un joueur. Jusqu’à la fin du round, les unités ennemies ne peuvent pas se déployer par ce bord.","The active Unit's Supply Value is improved by 1 for Controlling and Contesting Mission Markers and completing objectives.":"La valeur de Supply de l’unité active est augmentée de 1 pour contrôler et contester les marqueurs de m , apply DEBUFF Range (4) to that Unit's Ranged Weapons. That Unit cannot benefit from LONG RANGE.":"Choisis une unité ennemie à 12\". Jusqu’à la fin du round, applique DEBUFF Range (4) à ses armes de tir. Cette unité ne peut pas bénéficier de LONG RANGE.","This Unit's Supply Value counts as 0 when calculating the Supply Pool.":"La valeur de Supply de cette unité compte comme 0 pour le calcul du Supply Pool.","Increase the Optical Flare special ability's Range to 16\".":"La portée de la capacité spéciale Optical Flare passe à 16\".","When this Unit resolves a Life Support or Medpack ability, treat it as having 1 additional model Within Range for calculating that ability's effects.":"Quand cette unité résout une capacité Life Support ou Medpack, considère qu’elle a une figurine de plus à portée pour calculer ses effets.","When this Unit is nominated to deploy from Reserves, it may resolve its Stimpack ability with the CP cost reduced by 1 (to a minimum of 0).":"Quand cette unité est désignée pour se déployer depuis la réserve, elle peut résoudre sa capacité Stimpack avec un coût réduit de 1 CP (minimum 0).","When this Unit is nominated to deploy from Reserves, it may resolve the PLACE (10) effect from another Friendly Unit. No model may be set Within 8\" of any Enemy model. This Unit's Activation ends.":"Quand cette unité est désignée pour se déployer depuis la réserve, elle peut résoudre l’effet PLACE (10) à partir d’une autre unité amie. Aucune figurine ne peut être placée à 8\" d’une figurine ennemie. L’activation de cette unité se termine.","When this Unit's Leading Model moves, it cannot pass through physical gaps smaller than 3\" wide, regardless of its size. If the Leading Model's path of travel passes through, or any model in this Unit ends its movement on a Size 0 or Size 1 Impassible Terrain piece (excluding Tokens) during any movement action, that terrain piece is immediately removed from the game.":"Quand le modèle de tête de cette unité se déplace, il ne  weapon is treated as a maximum of 1 for this attack.":"À utiliser quand cette unité est choisie comme cible d’une attaque. Si elle a le statut Shielded, la caractéristique Damage de l’arme qui attaque est limitée à 1 pour cette attaque.","Use before this Unit makes an Armour Roll. If this Unit has the Shielded Status, It gains TOUGH (2) for this roll.":"À utiliser avant que cette unité fasse un jet d’armure. Si elle a le statut Shielded, elle gagne TOUGH (2) pour ce jet.","While this Unit is Within 3\" of a Mission Marker, its Ranged Weapons gain CRITICAL HIT (1) when targeting an Enemy Unit that is also Within 3\" of that same Mission Marker.":"Tant que cette unité est à 3\" d’un marqueur de mission, ses armes de tir gagnent CRITICAL HIT (1) contre une unité ennemie qui est aussi à 3\" de ce même marqueur.","When this Unit makes a Ranged Attack, if the target Unit is more than 8\" away, the attacking weapons gain PRECISION (1).":"Quand cette unité fait une Ranged Attack sur une cible à plus de 8\", les armes qui attaquent gagnent PRECISION (1).","This Unit gains HIDDEN Status until it performs another action.":"Cette unité gagne le statut HIDDEN jusqu’à ce qu’elle fasse une autre action.","While Enemy Units are Within 6\" of this Unit's Shade token, they lose HIDDEN Status.":"Les unités ennemies à 6\" du jeton Shade de cette unité perdent le statut HIDDEN.","This Unit gains TOUGH (2) on the first Armour Roll each Round.":"Cette unité gagne TOUGH (2) sur son premier jet d’armure de chaque round.","This Unit performs a 2\" Move action. This does not count towards its action limit.":"Cette unité fait une action Move de 2\". Elle ne compte pas dans sa limite d’actions.","Immediately after this Unit completes a successful Charge, resolve the IMPACT (3) 4+ effect.":"Juste après une charge réussie de cette unité, résous l’effet IMPACT (3) 4+.","When this Unit makes a Close Combat Attack, and the target is Size 3 or larger, the weapon's Damage characteristic is treated as 2.":"Quand cette unité fait une Close Combat Attack contre une cible de Size 3 ou plus, la caractéristique Damage de l’arme compte comme 2.","This Unit is eligible to make an Evade roll against all attacks targeting it.":"Cette unité peut faire un jet d’Evade contre toutes les attaques qui la visent.","All Ranged Attacks targeting a Friendly Unit Within 4\" (Line of Sight is not required) are made with 1 fewer die in the Attack Pool.":"Toutes les Ranged Attacks qui visent une unité amie à 4\" (sans ligne de vue nécessaire) se font avec 1 dé de moins dans le pool d’attaque.","Set a Force Field token Within 8\" in an unoccupied space. Units of Size 2 or lower cannot move across Force Fields. Models of Size 3 or more can move over it, and it's then removed.":"Place un jeton Force Field à 8\", dans un espace libre. Les unités de Size 2 ou moins ne peuvent pas traverser les Force Fields. Les figurines de Size 3 ou plus peuvent passer dessus, et le jeton est alors retiré.","When an Enemy Unit declares a Ranged Attack against a Friendly Unit Within 4\", the targeted Friendly Unit is eligible to make an Evade Roll against that attack.":"Quand une unité ennemie déclare une Ranged Attack contre une unité amie à 4\", l’unité amie visée peut faire un jet d’Evade contre cette attaque.","When this Unit resolves IMPACT, each eligible model generates 1 additional IMPACT die.":"Quand cette unité résout IMPACT, chaque figurine éligible génère 1 dé d’IMPACT supplémentaire.","When this Unit is not Activated and receives Damage, the controlling player may count this Unit as Activated in this Phase (flip its Activation Marker) to reduce the Total Damage by 2.":"Quand cette unité n’est pas activée et subit des dégâts, son joueur peut la considérer comme activée pour cette phase (retourne son marqueur d’activation) pour réduire le total de dégâts de 2.","When this Unit makes a Close Combat Attack, if the target is Engaged with at least 1 other Friendly Unit, this Unit's Close Combat Weapon gains PRECISION (2).":"Quand cette unité fait une Close Combat Attack contre une cible engagée avec au moins 1 autre unité amie, son arme de corps à corps gagne PRECISION (2).","Resolve the PLACE (6) effect. Models set by this effect cannot be set up Within the Engagement Range of any Enemy Unit.":"Résous l’effet PLACE (6). Les figurines placées par cet effet ne peuvent pas l’être dans l’Engagement Range d’une unité ennemie.","When this Unit attacks an Enemy Unit that has already been Activated during this Phase, its Particle Disruptors gain INSTANT for that attack.":"Quand cette unité attaque une unité ennemie déjà activée pendant cette phase, ses Particle Disruptors gagnent INSTANT pour cette attaque.","After this Unit fully resolves an Action, it gains the HIDDEN Status.":"Quand cette unité a entièrement résolu une action, elle gagne le statut HIDDEN.","REPEATABLE. Use when this Unit is selected as the target of an attack. This Unit's Evade characteristic is treated as 4+ against this attack and cannot be modified.":"REPEATABLE. À utiliser quand cette unité est choisie comme cible d’une attaque. Sa caractéristique Evade compte comme 4+ contre cette attaque et ne peut pas être modifiée.","Target Enemy Unit on the battlefield. Whenever Zeratul makes a Close Combat Attack targeting the selected Unit, its weapon gains CRITICAL HIT (2).":"Désigne une unité ennemie sur le champ de bataille. Chaque fois que Zeratul fait une Close Combat Attack contre elle, son arme gagne CRITICAL HIT (2).","Set a Faction Indicator on the battlefield Within 8\" of this Unit. While Enemy Units are Within 2\" of this Faction Indicator they suffer DEBUFF Speed (2).":"Place un Faction Indicator sur le champ de bataille à 8\" de cette unité. Les unités ennemies à 2\" de ce Faction Indicator subissent DEBUFF Speed (2).","If Unengaged, resolve the PLACE (6) effect.":"Si elle n’est pas engagée, résous l’effet PLACE (6).","Immediately after this Unit completes a successful Charge, resolve the IMPACT (4) 4+ effect.":"Juste après une charge réussie de cette unité, résous l’effet IMPACT (4) 4+.","All Enemy Units Engaged with this Unit suffer HITS 4 (1).":"Toutes les unités ennemies engagées avec cette unité subissent HITS 4 (1).","Once per Round, when a Friendly Unit Within 4\" of this Pylon uses a Special Ability that costs Psionic Energy, that ability's PE cost is reduced by 1.":"Une fois par round, quand une unité amie à 4\" de ce Pylon utilise une capacité spéciale qui coûte de l’énergie psionique, son coût en PE est réduit de 1.","Once per Round, the controlling player may deploy a Ground Unit from Reserves using this Pylon base as the Entry Edge. This Unit's Activation ends.":"Une fois par round, le joueur qui le contrôle peut déployer une unité Ground depuis la réserve en utilisant le socle de ce Pylon comme Entry Edge. L’activation de cette unité se termine.","Select up to two of your Exhausted Tactical Cards. Return them to the Ready state.":"Choisis jusqu’à deux de tes Tactical Cards épuisées. Remets-les prêtes.","Instead of performing an action, select one other Friendly Biological Unit that has already been Activated this Phase. That Unit immediately performs one action available in the current Phase, then suffers NON-LETHAL DAMAGE (3).":"Au lieu de faire une action, choisis une autre unité Biological amie déjà activée pendant cette phase. Elle fait immédiatement une action possible dans la phase en cours, puis subit NON-LETHAL DAMAGE (3).","Once per Round, when a Friendly Support Unit activates a Special Ability that costs PE, resolve that ability with its PE cost reduced by 1 (to a minimum of 0). Do not Exhaust this card.":"Une fois par round, quand une unité Support amie active une capacité spéciale qui coûte des PE, résous-la avec un coût réduit de 1 PE (minimum 0). N’épuise pas cette carte.","Set two Force Wall tokens Wholly Within 8\" in an unoccupied space. Units of Size 2 or lower cannot move across the Force Wall. Models of Size 3 or more can move over it, and it's then removed.":"Place deux jetons Force Wall entièrement à 8\", dans un espace libre. Les unités de Size 2 ou moins ne peuvent pas traverser le Force Wall. Les figurines de Size 3 ou plus peuvent passer dessus, et il est alors retiré.","Target another Friendly Biological Unit Within 12\". Until the End of the Round, that Unit resolves its first Special Ability with the cost reduced by 1 (to a minimum of 0).":"Désigne une autre unité Biological amie à 12\". Jusqu’à la fin du round, elle résout sa première capacité spéciale avec un coût réduit de 1 (minimum 0).","Target two Enemy Units on the battlefield (Line of Sight is not required) and place a Faction Indicator next to each of them. During the next Assault Phase, if either of these Units ends its Activation while its Faction Indicator remains on the battlefield, you may Activate two Friendly Units consecutively. Remove both Faction Indicators after any Enemy Unit completes its Activation in the following Assault Phase.":"Désigne deux unités ennemies sur le champ de bataille (sans ligne de vue nécessaire) et place un Faction Indicator à côté de chacune. Pendant la phase d’Assaut suivante, si l’une d’elles termine son activation alors que son Faction Indicator est encore sur le champ de bataille, tu peux activer deux unités amies à la suite. Retire les deux Faction Indicators après qu’une unité ennemie a terminé son activation pendant cette phase d’Assaut.","Each Unit Within 2\" of one or more Friendly Force Wall tokens suffers 1 Damage.":"Chaque unité à 2\" d’un ou plusieurs jetons Force Wall amis subit 1 dégât.","Set each Friendly Force Wall token Wholly Within 6\" of its current position.":"Replace chaque jeton Force Wall ami entièrement à 6\" de sa position actuelle.","Use when the Current Supply Value of another Friendly Unit Within 8\" of this Unit is reduced. Return one Non-Unique Exhausted Tactical Card to the Ready state.":"À utiliser quand le supply actuel d’une autre unité amie à 8\" de cette unité diminue. Remets prête une Tactical Card non Unique épuisée.","Set a Psionic Storm token Within 10\" and Line of Sight of this Unit. This token is not removed if this Unit is Destroyed. At the End of each Phase, set a Psionic Storm Blast Template on the centre of this token. For each Unit that has at least one model whose base is partially covered by the template, roll 3 dice, plus 1 additional die for each model in that Unit whose base is partially covered. For each result of 4+, that Unit suffers an effect depending on the current Phase: Movement Phase: NON-LETHAL DAMAGE (1). Assault Phase: 1 Damage. If multiple effects trigger at the End of the Assault Phase, resolve them in the order specified in Part 8.9.4.":"Place un jeton Psionic Storm à 10\" et en ligne de vue de cette unité. Ce jeton n’est pas retiré si l’unité est détruite. À la fin de chaque phase, pose un Blast Template Psionic Storm au centre de ce jeton. Pour chaque unité dont au moins une figurine a son socle en partie recouvert par le gabarit, lance 3 dés, plus 1 dé par figurine de cette unité dont le socle est en partie recouvert. Pour chaque résultat de 4+, l’unité subit un effet qui dépend de la phase en cours : phase de Mouvement : NON-LETHAL DAMAGE (1) ; phase d’Assaut : 1 dégât. Si plusieurs effets se déclenchent à la fin de la phase d’Assaut, résous-les dans l’ordre indiqué en 8.9.4.","Target one Enemy Mechanical or Psionic Unit Within 8\". Until the End of the Round, after that Unit resolves an Active or Reaction Special Ability (excluding abilities granted by a Tactical Card or Faction Card), it suffers NON-LETHAL DAMAGE (3).":"Désigne une unité ennemie Mechanical ou Psionic à 8\". Jusqu’à la fin du round, chaque fois qu’elle résout une capacité spéciale Active ou Reaction (sauf celles données par une Tactical Card ou une Faction Card), elle subit ensuite NON-LETHAL DAMAGE (3).","Resolve the PLACE (6) effect.":"Résous l’effet PLACE (6).","While this Unit's Current Supply Value is 2, it gains the following effects: The first Special Ability resolved by this Unit each Round has its PE cost reduced by 1 (to a minimum of 0). Apply a +1 Modifier to the dice rolled for its Psionic Storm Special Ability.":"Tant que le supply actuel de cette unité est de 2, elle gagne ces effets : la première capacité spéciale qu’elle résout chaque round coûte 1 PE de moins (minimum 0) ; applique un modificateur +1 aux dés lancés pour sa capacité Psionic Storm.","Set a Psionic Storm token Within 10\" and Line of Sight of this Unit. This token is not removed if this Unit is Destroyed. At the End of each Phase, set a Psionic Storm Blast Template on the centre of this token. For each Unit that has at least one model whose base is partially covered by the template, roll 3 dice, plus 1 additional die for each model in that Unit whose base is partially covered. For each result of 5+, that Unit suffers an effect depending on the current Phase: Movement Phase: NON-LETHAL DAMAGE (1). Assault Phase: 1 Damage. If multiple effects trigger at the End of the Assault Phase, resolve them in the order specified in Part 8.9.4.":"Place un jeton Psionic Storm à 10\" et en ligne de vue de cette unité. Ce jeton n’est pas retiré si l’unité est détruite. À la fin de chaque phase, pose un Blast Template Psionic Storm au centre de ce jeton. Pour chaque unité dont au moins une figurine a son socle en partie recouvert par le gabarit, lance 3 dés, plus 1 dé par figurine de cette unité dont le socle est en partie recouvert. Pour chaque résultat de 5+, l’unité subit un effet qui dépend de la phase en cours : phase de Mouvement : NON-LETHAL DAMAGE (1) ; phase d’Assaut : 1 dégât. Si plusieurs effets se déclenchent à la fin de la phase d’Assaut, résous-les dans l’ordre indiqué en 8.9.4.","Target one Friendly Unit Within 12\". Until the End of the Round, that Unit is eligible to make an Evade Roll against any attacks targeting it.":"Désigne une unité amie à 12\". Jusqu’à la fin du round, elle peut faire un jet d’Evade contre toutes les attaques qui la visent.","Use when an Enemy Unit declares a Close Combat Attack against a Friendly Unit. That Friendly Unit becomes eligible to make an Evade Roll against that attack.":"À utiliser quand une unité ennemie déclare une Close Combat Attack contre une unité amie. Cette unité amie peut alors faire un jet d’Evade contre cette attaque.","If the active Unit contains more models than the combined number of models in all Engaged Enemy Units, its Close Combat Weapons gain INSTANT and PRECISION (4).":"Si l’unité active a plus de figurines que l’ensemble des unités ennemies engagées avec elle, ses armes de corps à corps gagnent INSTANT et PRECISION (4).","While a Friendly Zerg Unit is ON CREEP, it gains DODGE (1) against any attacks targeting it.":"Tant qu’une unité Zerg amie est ON CREEP, elle gagne DODGE (1) contre toutes les attaques qui la visent.","Set a Faction Indicator on the active Friendly Unit. At the end of the Assault Phase, all Biological Enemy Units Engaged with the marked Unit suffer NON-LETHAL DAMAGE (2).":"Place un Faction Indicator sur l’unité amie active. À la fin de la phase d’Assaut, toutes les unités ennemies Biological engagées avec l’unité marquée subissent NON-LETHAL DAMAGE (2).","The base of the Zagara counts as an Entry Edge. Each Round, Friendly Units with a combined Supply cost of 1 may be Deployed via this Entry Edge.":"Le socle de Zagara compte comme une Entry Edge. À chaque round, des unités amies dont le coût de supply cumulé est de 1 peuvent être déployées par cette Entry Edge.","Immediately after this Unit completes a successful Charge, resolve the IMPACT (6) 3+ effect.":"Juste après une charge réussie de cette unité, résous l’effet IMPACT (6) 3+.","Apply one of the following effects to all Friendly units (Line of Sight is not required). You cannot apply the effect chosen in the previous Game Round: Units of Size 1 gain a +1 Modifier to all IMPACT Rolls. All weapons of Size 2 Units gain CRITICAL HIT (1). Units of Size 3 or more gain TOUGH (1).":"Applique l’un des effets suivants à toutes les unités amies (sans ligne de vue nécessaire). Tu ne peux pas choisir l’effet appliqué au round précédent : les unités de Size 1 gagnent un modificateur +1 à tous leurs jets d’IMPACT ; toutes les armes des unités de Size 2 gagnent CRITICAL HIT (1) ; les unités de Size 3 ou plus gagnent TOUGH (1).","Resolve the RESPAWN (2) effect, or RESPAWN (3) if the Unit is ON CREEP.":"Résous l’effet RESPAWN (2), ou RESPAWN (3) si l’unité est ON CREEP.","When this Unit is nominated to deploy from the Reserves, it may resolve the PLACE (18) effect from the controlling player's Entry Edge. No model may be set Within 10\" of any Enemy model. This Unit's Activation ends.":"Quand cette unité est désignée pour se déployer depuis la réserve, elle peut résoudre l’effet PLACE (18) depuis l’Entry Edge de son joueur. Aucune figurine ne peut être placée à 10\" d’une figurine ennemie. L’activation de cette unité se termine.","Immediately after this Unit completes a successful Charge, resolve the IMPACT (1) 5+ effect.":"Juste après une charge réussie de cette unité, résous l’effet IMPACT (1) 5+.","After an Enemy Unit suffers Damage from this Unit, apply DEBUFF Hit (1) to each of that Unit's Weapons.":"Après qu’une unité ennemie a subi des dégâts de cette unité, applique DEBUFF Hit (1) à chacune de ses armes.","When this Unit resolves a Special Ability that costs BM, it can remove one model from a Friendly Unit Within 4\" to generate 1 BM to spend towards that ability's cost.":"Quand cette unité résout une capacité spéciale qui coûte des BM, elle peut retirer une figurine d’une unité amie à 4\" pour générer 1 BM à dépenser pour ce coût.","Set a Dark Swarm token in an unoccupied space Within 4\" and Line of Sight of this Unit. The Dark Swarm token has DISPLACEMENT.":"Place un jeton Dark Swarm dans un espace libre à 4\" et en ligne de vue de cette unité. Le jeton Dark Swarm a DISPLACEMENT.","REPEATABLE. Use when a Friendly Unit Within 4\" of a Friendly Dark Swarm token is selected as the target of an attack. If this Unit is Within 4\" of the same token, the Targeted Friendly Unit is eligible to make an Evade Roll against that attack. If the targeted Unit is a Size 1, it gains a +1 Modifier to this Evade Roll.":"REPEATABLE. À utiliser quand une unité amie à 4\" d’un jeton Dark Swarm ami est choisie comme cible d’une attaque. Si cette unité est à 4\" du même jeton, l’unité amie visée peut faire un jet d’Evade contre cette attaque. Si l’unité visée est de Size 1, elle gagne un modificateur +1 à ce jet d’Evade.","When this Unit is nominated to deploy from Reserves, it may resolve the PLACE (18) effect from the controlling player's Entry Edge. No model may be placed Within 10\" of any Enemy model. This Unit's Activation ends.":"Quand cette unité est désignée pour se déployer depuis la réserve, elle peut résoudre l’effet PLACE (18) depuis l’Entry Edge de son joueur. Aucune figurine ne peut être placée à 10\" d’une figurine ennemie. L’activation de cette unité se termine.","You may spend 1 to 3 BM to activate this ability. Set a Plague Blast Template Wholly Within 10\" and Line of Sight of this Unit. For each Unit that has at least one model whose base is partially covered by the template, roll 2 dice, plus 1 additional die for each model in that Unit whose base is partially covered. That Unit loses its HIDDEN Status, and, depending on the BM spent, it suffers NON-LETHAL DAMAGE (1) for: 1 BM: each result of 5+. 2 BM: each result of 4+. 3 BM: each result of 3+.":"Tu peux dépenser de 1 à 3 BM pour activer cette capacité. Place un Blast Template Plague entièrement à 10\" et en ligne de vue de cette unité. Pour chaque unité dont au moins une figurine a son socle en partie recouvert, lance 2 dés, plus 1 dé par figurine de cette unité dont le socle est en partie recouvert. L’unité perd le statut HIDDEN et, selon les BM dépensés, subit NON-LETHAL DAMAGE (1) pour : 1 BM, chaque résultat de 5+ ; 2 BM, chaque résultat de 4+ ; 3 BM, chaque résultat de 3+.","This Unit cannot gain the BURROWED Status, cannot be returned to Reserves, and is immune to the IMPACT keyword.":"Cette unité ne peut pas gagner le statut BURROWED, ne peut pas être remise en réserve et est immunisée au mot-clé IMPACT.","While Enemy Units are Within 6\" of this Unit, they lose the HIDDEN Status.":"Les unités ennemies à 6\" de cette unité perdent le statut HIDDEN.","A Friendly or Enemy Ground Zerg Unit Within 6\" of this Unit counts as being ON CREEP.":"Une unité Zerg Ground, amie ou ennemie, à 6\" de cette unité compte comme ON CREEP.","Set a Bile Bomb token on the battlefield Within 24\" of this Unit. When this Unit resolves a Ranged Attack using the Bile Bomb weapon profile this Round, it may choose to ignore the weapon's standard Range characteristic. If it does, it may target an Enemy Unit that is Within 3\" of that token (Line of Sight is not required), ignoring the HIDDEN Status. After the attack is fully resolved, remove the Bile Bomb token from the battlefield. When the Bile Bomb token is about to be removed, set a Creep Tumor token in base-to-base contact with it. The Bile Bomb token has DISPLACEMENT.":"Place un jeton Bile Bomb sur le champ de bataille à 24\" de cette unité. Quand cette unité fait une Ranged Attack avec le profil Bile Bomb ce round, elle peut ignorer la portée normale de l’arme. Dans ce cas, elle peut viser une unité ennemie à 3\" de ce jeton (sans ligne de vue nécessaire), en ignorant le statut HIDDEN. Une fois l’attaque entièrement résolue, retire le jeton Bile Bomb. Juste avant de le retirer, place un jeton Creep Tumor au contact socle à socle de lui. Le jeton Bile Bomb a DISPLACEMENT.","Set a Friendly Sabotage Drone Unit Within 12\" of a Friendly Unit, more than 1\" away from any Enemy model. Remove this Unit at the End of the Round.":"Place une unité Sabotage Drone amie à 12\" d’une unité amie, à plus de 1\" de toute figurine ennemie. Retire cette unité à la fin du round.","Target an Enemy Unit on the battlefield. When a Friendly Unit makes an Attack targeting that Unit, its first Melee or Ranged Weapon used gains CRITICAL HIT (1) and PRECISION (1).":"Désigne une unité ennemie sur le champ de bataille. Quand une unité amie fait une attaque contre elle, sa première arme de mêlée ou de tir utilisée gagne CRITICAL HIT (1) et PRECISION (1).","Use before a Friendly Mechanical Unit makes an Armour Roll. That Unit gains DODGE (2) for this roll.":"À utiliser avant qu’une unité Mechanical amie fasse un jet d’armure. Elle gagne DODGE (2) pour ce jet.","During Army Building, your army cannot include both the Nova Assault Mode Unit and the Nova Stealth Mode Unit.":"Pendant la construction d’armée, ton armée ne peut pas contenir à la fois l’unité Nova Assault Mode et l’unité Nova Stealth Mode.","This Unit gains BUFF Speed (2). Additionally, all its Weapons gain PRECISION (2).":"Cette unité gagne BUFF Speed (2). De plus, toutes ses armes gagnent PRECISION (2).","Resolve the SUMMON (Holo Decoy) effect. Then, Holo Decoy may immediately perform a Move action.":"Résous l’effet SUMMON (Holo Decoy). Holo Decoy peut ensuite faire immédiatement une action Move.","After this Unit fully resolves a Ranged Attack with its C-20A Canister Rifle, if the target Enemy Unit was Destroyed or its Current Supply Value was reduced, the active player may return one of their Exhausted non-Unique Tactical Cards to its Ready state.":"Après que cette unité a entièrement résolu une Ranged Attack avec son C-20A Canister Rifle, si l’unité ennemie visée a été détruite ou si son supply actuel a diminué, le joueur actif peut remettre prête une de ses Tactical Cards non Unique épuisées.","Once Per Game. While this Unit is Unengaged and has the Stationary Status, when it makes a Ranged Attack with its C-20A Canister Rifle, treat that weapon's Damage characteristic as 3, and it gains CONCENTRATED FIRE (1).":"Une fois par partie. Tant que cette unité est non engagée et a le statut Stationary, quand elle fait une Ranged Attack avec son C-20A Canister Rifle, la caractéristique Damage de cette arme vaut 3 et elle gagne CONCENTRATED FIRE (1).","This Unit gains BUFF Speed (3). Additionally, its Quad K12 and all Close Combat Weapons gain PRECISION (2).":"Cette unité gagne BUFF Speed (3). De plus, son Quad K12 et toutes ses armes de corps à corps gagnent PRECISION (2).","This Unit's first Attack in the game with its Quad K12 gains PIERCE Armoured (3).":"La première attaque de la partie de cette unité avec son Quad K12 gagne PIERCE Armoured (3).","When an Enemy declares a Charge against a Friendly Unit Within 8\", that Enemy gains DEBUFF Speed (3).":"Quand un ennemi déclare une Charge contre une unité amie à 8\", cet ennemi subit DEBUFF Speed (3).","Set a Friendly Auto-Turret Unit Within 6\", and not Within the Engagement Range of any Enemy Unit.":"Place une unité Auto-Turret amie à 6\", hors de l’Engagement Range de toute unité ennemie.","Select one Enemy Unit Within 12\". Apply DEBUFF Armour (1).":"Choisis une unité ennemie à 12\". Applique-lui DEBUFF Armour (1).","This Unit may resolve its first Special Ability with the CP cost reduced by 1 if it targets the closest Enemy Unit.":"Cette unité peut résoudre sa première capacité spéciale avec un coût réduit de 1 CP si elle vise l’unité ennemie la plus proche.","When this Unit is nominated to deploy from Reserves, it may Deploy from any table edge that is not a player's Entry Edge. This Unit cannot be set Within 8\" of any Enemy model.":"Quand cette unité est désignée pour se déployer depuis la réserve, elle peut se déployer depuis n’importe quel bord de table qui n’est pas l’Entry Edge d’un joueur. Elle ne peut pas être placée à 8\" d’une figurine ennemie.","Select one Enemy Unit Within 12\". At the End of the Assault Phase, if that Enemy Unit has the Stationary Status or it is Within 8\" of this Unit, it suffers HITS 4 (2). If that Unit is Engaged, it is eligible to make an Evade Roll against these hits.":"Choisis une unité ennemie à 12\". À la fin de la phase d’Assaut, si cette unité a le statut Stationary ou est à 8\" de cette unité, elle subit HITS 4 (2). Si elle est engagée, elle peut faire un jet d’Evade contre ces touches.","The Gauss Cannon of the Auto-Turret set by this Unit gains Surge Type: Light and S-Dice: D3+1.":"Le Gauss Cannon de l’Auto-Turret placée par cette unité gagne Surge Type : Light et S Dice : D3+1.","Remove this Unit at the End of the Round.":"Retire cette unité à la fin du round.","This Unit is never Engaged. It cannot Engage Enemy Units, cannot be Engaged by Enemy Units and cannot perform a Charge Action. This Unit cannot be the target of an ability, unless stated otherwise. It can never Control or Contest Mission Markers.":"Cette unité n’est jamais engagée. Elle ne peut pas engager d’unités ennemies, ne peut pas être engagée par elles et ne peut pas faire de Charge. Elle ne peut pas être ciblée par une capacité, sauf mention contraire. Elle ne peut jamais contrôler ni contester de marqueur de mission.","At the End of the Round, you can set a Friendly Nova Stealth Mode or Nova Assault Mode in Coherency with this Unit.":"À la fin du round, tu peux placer une Nova Stealth Mode ou une Nova Assault Mode amie en cohésion avec cette unité.","All Weapons of Friendly Units targeting an Enemy Unit Within 4\" of this Unit gain PRECISION (1).":"Toutes les armes des unités amies qui visent une unité ennemie à 4\" de cette unité gagnent PRECISION (1).","Use when an Enemy Unit ends its Activation Within 8\" of this Unit. This Unit immediately performs a Ranged Attack against that Enemy Unit.":"À utiliser quand une unité ennemie termine son activation à 8\" de cette unité. Cette unité fait immédiatement une Ranged Attack contre cette unité ennemie.","At the End of the Assault Phase, target each Unit Within 3\" of this Unit (including Units with the Structure ability) suffers HITS 5 (1). If an affected Unit has the Structure ability, that Unit suffers an additional HITS 5 (1).":"À la fin de la phase d’Assaut, chaque unité à 3\" de cette unité (y compris celles qui ont la capacité Structure) subit HITS 5 (1). Une unité touchée qui a la capacité Structure subit HITS 5 (1) supplémentaires."}</script>

/* effets d’arme : permanents (ex. Hydriodic Bile), à distance (Grenades - Frag, Slugthrower : à 8") ou contre une cible verrouillée (Target Lock) */
function nearFx(u, wkey){
  const d = udef(u), out = [];

  src.forEach(([k, a]) => { const be = a.builder_effect || {}; if (!/^weapon_(set|kw|mod)$/.test(be.kind || '') || be.weapon !== wkey) return;

const NEAR_R = w => (w.near || []).reduce((a, x) => x.r ? Math.min(a, x.r) : a, 99);

function fxApply(o, x){ if (x.set) Object.assign(o, x.set); if (x.kw && !o.keywords.includes(x.kw)) o.keywords.push(x.kw); }

  if (!w || !(w.near || []).length) return w;

}
const fxTxt = x => [x.set && x.set.surge_type ? 'Surge Type ' + [].concat(x.set.surge_type).join(', ') : '', x.set && x.set.s_dice ? 'S Dice ' + x.set.s_dice : '', x.kw ? x.kw.replace(/\(/, ' (') : ''].filter(Boolean).join(', ');
const nearTxt = (w, kind) => (w.near || []).filter(x => kind === 'lock' ? x.lock : x.r).map(x => `${x.src} : ${fxTxt(x)}`).join(' ; ');

function weaponsOf(u){

function setAlive(u, n){
  n = Math.max(0, Math.min(u.start, n));
  const before = u.loc === 'table' ? curSup(u) : 0;
  u.alive = n;
  if (!n){ u.loc = 'dead'; u.engaged = false; }
  else if (u.loc === 'dead') u.loc = 'table';
  const after = u.loc === 'table' ? curSup(u) : 0;
  const lost = before - after, side = u.side === 'o' ? 'opp' : 'me';
  if (lost > 0) S.destroyed[side][S.round] = (S.destroyed[side][S.round] || 0) + lost;
  if (lost < 0) S.destroyed[side][S.round] = Math.max(0, (S.destroyed[side][S.round] || 0) + lost);
  return lost;
}

/* ================= espérance de dégâts ================= */
const tn = v => { const m = String(v).match(/(\d)\+/); return m ? +m[1] : null; };
const pOf = t => t == null ? 0 : Math.max(0, Math.min(1, (7 - t) / 6));
const expDie = s => { if (!s) return 0; s = String(s).toUpperCase().replace(/\s/g,''); const m = s.match(/^(\d*)D(\d)([+-]\d+)?$/); if (m){ const n = +(m[1]||1), f = +m[2]; return n * (f + 1) / 2 + (+(m[3]||0)); } return +s || 0; };
const r1 = x => Math.round(x * 10) / 10;
const pct = p => Math.round(p * 100) + ' %';
function surgeMatch(w, tags){ const st = [].concat(w.surge_type||[]).map(s => String(s).toLowerCase()); return st.some(s => tags.map(t => t.toLowerCase()).includes(s)); }
function canTarget(w, td){ const t = String(w.target||'').toLowerCase(), fly = isFlying(td); return t === 'all' || (t === 'flying' ? fly : t === 'ground' ? !fly : true); }
const isTpl = w => /\b(BT|FT)\b/.test(String(w.roa) + ' ' + String(w.s_dice));
const tplMod = w => { const m = String(w.roa).match(/[+-]\s*(\d+)/); return m ? +(m[0].replace(/\s/g,'')) : 0; };
const tplAff = alive => Math.max(1, Math.min(alive, (typeof AT !== 'undefined' && AT.f && AT.f.aff) || 3));
function expectDice(w, n, td, opt={}){
  const kws = w.keywords || [], tags = td.combat_tags || [];
  if (isTpl(w)){ const aff = opt.aff || 1; w = Object.assign({}, w, {roa: 1, s_dice: surgeMatch(w, tags) ? String(aff) : null}); n = Math.max(0, aff + tplMod(arguments[0]) + (opt.extra || 0)); }
  const dice = n * (w.roa || 0) + (isTpl(arguments[0]) ? 0 : (opt.extra || 0));
  const pH = pOf(tn(w.hit));
  let hits = dice * pH;
  const prec = kwNum(kws, 'PRECISION'); if (prec) hits += Math.min(prec, dice - hits);
  let moved = w.s_dice && surgeMatch(w, tags) ? Math.min(expDie(w.s_dice), hits) : 0;
  const crit = kwNum(kws, 'CRITICAL HIT'); if (crit) moved += Math.min(crit, hits - moved);
  const fails = (hits - moved) * (1 - pOf(tn(td.stats.armour)));
  let dd = moved + fails;
  if (opt.evade){ const ev = tn(td.stats.evade); if (ev != null){ const t = ev + kwNum(kws, 'ANTI-EVADE'); if (t <= 6) dd *= (1 - pOf(t)); } }
  let dm = w.dmg || 1;
  kws.forEach(k => { const m = String(k).toUpperCase().match(/PIERCE\s*\[?\s*([A-Z]+)\s*\]?\s*\(?(\d+)\)?/); if (m && tags.map(t => t.toUpperCase()).includes(m[1])) dm = +m[2]; });
  return dd * dm;
}
function killsFrom(td, alive, marker, dmg, conc){
  let left = dmg + (marker || 0), k = 0;
  const first = td.stats.hp + (td.stats.shield || 0);
  while (k < alive && (!conc || k < conc)){ const hp = k === 0 ? first : td.stats.hp; if (left >= hp){ left -= hp; k++; } else break; }
  return {k, left};
}
/* meilleure combinaison d'armes d'une unité contre une cible (estimation) */
function bestVolley(att, tgt, phase){
  const ws = weaponsOf(att).filter(w => w.phase === phase).map(w => { if (!w.near) return w; const lk = hasLock(w) && lockOf(att) === tgt.id, nr = hasNearR(w) && !!U.near;
    return Object.assign(applyNear(w, nr, lk), {name: w.name + (nr ? ` (à ${NEAR_R(w)}" ou moins)` : '') + (lk ? ' (Target Lock)' : '')}); }), td = udef(tgt);
  const ok = ws.filter(w => canTarget(w, td) && !(phase === 'ASSAULT' && att.engaged && hasKw(w.keywords, 'BULKY')));
  if (!ok.length) return null;
  const evade = phase === 'ASSAULT' ? !!tgt.engaged : false;
  const side = ok.filter(w => hasKw(w.keywords, 'SIDEARM'));
  const main = ok.filter(w => !hasKw(w.keywords, 'SIDEARM'));
  const n = w => hasKw(w.keywords, 'SPECIALIST') || w.specialist ? 1 : att.alive;
  let best = null;
  const aff = tplAff(tgt.alive);
  (main.length ? main : [null]).forEach(m => {
    let dmg = 0; const used = [];
    if (m){ dmg += expectDice(m, n(m), td, {evade, aff}); used.push(m.name + (isTpl(m) ? ` (gabarit, ${aff} fig.)` : '')); }
    side.forEach(s => { dmg += expectDice(s, n(s), td, {evade, aff}); used.push(s.name); });
    if (!best || dmg > best.dmg) best = {dmg, used, conc: m ? kwNum(m.keywords, 'CONCENTRATED FIRE') : 0};
  });
  const kf = killsFrom(td, tgt.alive, tgt.dmg, best.dmg, best.conc);
  const supBefore = curSup(tgt), supAfter = supplyFor(td, tgt.alive - kf.k);
  return Object.assign(best, {kills:kf.k, supLost:supBefore - supAfter, nd:nextDrop(tgt)});
}

Object.entries(CORE_TERMS).forEach(([k, [name, part, txt]]) => { KW[k] = Object.assign(KW[k] || {}, {name, frg:txt, part}); });
const KW_BASES = []; // [base, key]
Object.entries(KW).forEach(([k, e]) => { if (CORE_TERMS[k]) return; const b = normKw(e.name); if (b && /^[A-Z][A-Z \-]*$/.test(b) && !KW_SKIP.has(b)) KW_BASES.push([b, b]); });
const KW_ALIAS = [ // formes non majuscules → clé du glossaire
  ['Engagement Range','ENGAGEMENT RANGE'],['Leading Model','LEADING MODEL'],['modèle de tête','LEADING MODEL'],['Zone of Influence','ZONE OF INFLUENCE'],
  ['Tactical Mass','TACTICAL MASS'],['Fighting Rank','FIGHTING RANK'],['Supporting Rank','SUPPORTING RANK'],['Entry Edge','ENTRY EDGE'],['Entry Edges','ENTRY EDGE'],
  ['Line of Sight','LINE OF SIGHT'],['ligne de vue','LINE OF SIGHT'],['supply disponible','AVAILABLE SUPPLY'],['Available Supply','AVAILABLE SUPPLY'],
  ['supply actuel','CURRENT SUPPLY VALUE'],['Current Supply Value','CURRENT SUPPLY VALUE'],['Spillover','SPILLOVER'],['Mission Markers?','MISSION MARKERS'],
  ['Burrowed','BURROWED'],['Hidden','HIDDEN'],['Stationary','STATIONARY'],['Shielded','SHIELDED'],['Reserves','RESERVES'],['First Player Marker','FIRST PLAYER MARKER'],['marqueur Premier joueur','FIRST PLAYER MARKER'],
  ['Deploy','DEPLOY',1],['Move','MOVE',1],['Disengage','DISENGAGE',1],['Hold','HOLD',1],['Run','RUN',1],['Charges?','CHARGE'],['Ranged Attacks?','RANGED ATTACK'],['Close Combat Attacks?','CLOSE COMBAT ATTACK'],['Close Ranks','CLOSE RANKS'],
  ['passer','PASS',1],['Passer','PASS',1],['passe','PASS',1],['Supply Pool','SUPPLY POOL'],['Surge','SURGE',1],['jets? d’armure','ARMOUR ROLL'],['Armour Rolls?','ARMOUR ROLL'],['Evade','EVADE',1],['batch','BATCH'],['batchs','BATCH'],['marqueurs? de dégâts','DAMAGE MARKER'],['Damage Markers?','DAMAGE MARKER']
].filter(([, k]) => KW[k]);
KW_BASES.sort((a, b) => b[0].length - a[0].length);
const KW_RE = new RegExp(
  KW_BASES.map(([b]) => '\\b' + reEsc(b) + (KW_WORD.has(b) ? '(?:\\s?\\[?[A-Z][A-Za-z]+\\]?)?' : '') + '(?:\\s?\\d+["”]?(?=\\s?\\())?(?:\\s?\\([^()\\n]{1,16}\\))?' + (b === 'IMPACT' ? '(?:\\s\\d\\+)?' : b === 'HITS' ? '(?:\\s\\d+\\s\\(\\d+\\))?' : b === 'MORPH' ? '(?:\\s\\d+)?' : '') + '(?![A-Za-z])').join('|')
  + '|' + KW_ALIAS.map(([a, , cs]) => '\\b' + (cs ? a : a.replace(/^(\w)/, (m) => '[' + m.toUpperCase() + m.toLowerCase() + ']')) + '(?![\\wÀ-ÿ’])').join('|'), 'g');
function kwKeyOf(m){
  for (const [a, k, cs] of KW_ALIAS) if (new RegExp('^' + a + '$', cs ? '' : 'i').test(m)) return k;
  for (const [b, k] of KW_BASES) if (m.startsWith(b)) return k;
  return null;
}
/* texte brut → HTML avec mots-clés cliquables */
function linkify(txt){
  txt = String(txt ?? ''); let out = '', last = 0;
  txt.replace(KW_RE, (m, ...rest) => { const i = rest[rest.length - 2]; const k = kwKeyOf(m); if (!k) return m;
    out += esc(txt.slice(last, i)) + `<button class="kwl" data-kw="${esc(m)}" data-key="${esc(k)}">${esc(m)}</button>`; last = i + m.length; return m; });
  return out + esc(txt.slice(last));
}
/* valeurs X / Y dans le mot-clé écrit sur la carte */
function kwParams(m, key){
  const name = (KW[key] || {}).name || '';
  const par = (m.match(/\(([^()]*)\)/) || [])[1], parN = par && /^\s*\d+/.test(par) ? parseInt(par, 10) : null;
  const lead = (m.slice(key.length).match(/^\s?(\d+)/) || [])[1], trail = (m.match(/\s(\d)\+$/) || [])[1] || (m.match(/\)\s(\d+)$/) || [])[1];
  const word = (m.slice(key.length).match(/^\s?\[?([A-Za-z]+)\]?/) || [])[1];
  const p = {};
  if (/^IMPACT/.test(name)){ if (parN != null) p.X = parN; if (trail) p.Y = +trail; }
  else if (/^HITS/.test(name)){ if (lead) p.X = +lead; if (parN != null) p.Y = parN; }
  else if (/^BURST FIRE/.test(name)){ if (lead) p.Y = +lead; if (parN != null) p.X = parN; }
  else if (/^MORPH|^SUMMON/.test(name)){ if (par) p.Nom = par; if (trail) p.X = +trail; }
  else if (/^PIERCE|^BUFF|^DEBUFF/.test(name)){ if (word && !/^\d/.test(word)) p[/^PIERCE/.test(name) ? 'Tag' : 'Caractéristique'] = word; if (parN != null) p.X = parN; }
  else if (parN != null) p.X = parN;
  return p;
}
const KW_STEP = {PRECISION:'Résolution d’une attaque, étape 2 : jet de touche.', 'LONG RANGE':'Résolution d’une attaque, étape 2 : −1 pour toucher au-delà de la portée normale.', 'BURST FIRE':'Résolution d’une attaque, étape 2 : RoA augmentée.', 'LOCKED IN':'Résolution d’une attaque, étape 2 : RoA augmentée contre une cible Stationary.',
  'CRITICAL HIT':'Résolution d’une attaque, étape 3 : avec la Surge, avant le jet d’armure.', DODGE:'Résolution d’une attaque, étape 3 : réduit la Surge et les CRITICAL HIT.', TOUGH:'Résolution d’une attaque, étape 4 : jet d’armure.',
  'ANTI-EVADE':'Résolution d’une attaque, étape 5 : jet d’Evade.', HIDDEN:'Ciblage (étape 1) et jet d’Evade (étape 5).', PIERCE:'Résolution d’une attaque, étape 6 : dégâts.', 'CONCENTRATED FIRE':'Résolution d’une attaque, étape 6 : pertes.',
  INSTANT:'Résolution d’une attaque, étape 1 : pas de réaction possible.', PINPOINT:'Résolution d’une attaque, étape 1 : choix de la cible.', 'INDIRECT FIRE':'Résolution d’une attaque, étape 1 : choix de la cible.', BULKY:'Résolution d’une attaque, étape 1 : interdit si l’unité est engagée.',
  SIDEARM:'Phase d’Assaut ou de Combat : batch séparé en plus de l’arme principale.', IMPACT:'Phase d’Assaut : juste après une charge réussie.', 'HITS':'Va directement au jet d’armure.', SPECIALIST:'Construction d’armée.'};
function subst(t, p){ let s = t; if (p.X != null) s = s.replace(/\bX\b/g, p.X); if (p.Y != null) s = s.replace(/\bY\b/g, p.Y); return s; }

const KW_PL = {'ENGAGEMENT RANGE':'engagement', ENGAGED:'engagement', UNENGAGED:'engagement', CHARGE:'charge', IMPACT:'charge', 'DEVASTATING CHARGE':'charge',
  'CLOSE RANKS':'combat', 'CLOSE COMBAT ATTACK':'combat', 'FIGHTING RANK':'combat', 'SUPPORTING RANK':'combat', 'DAMAGE MARKER':'pertes',
  'BLAST TEMPLATE':'gabarits', 'FLAMER TEMPLATE':'gabarits', SPILLOVER:'gabarits', 'MISSION MARKERS':'marqueurs', 'MISSION MARKER':'marqueurs',

  'LINE OF SIGHT':'ldv', 'HIGH GROUND':'ldv', 'DIRECT COVER':'ldv', 'FULL COVER':'ldv', 'CLOSE QUARTERS':'ldv'};
const plFor = key => { const k = normKw(key || ''); if (KW_PL[k]) return KW_PL[k]; if (/^(BT|FT)\b|TEMPLATE/.test(k)) return 'gabarits'; return null; };
const plBtn = id => id ? `<button class="btn small plbtn" data-pl="${id}">Voir le schéma : ${esc(PLX.name(id))}</button>` : '';
function kwPanelHTML(m, key){

function renderPop(){
  closePop(true);
  const top = POP.stack[POP.stack.length - 1]; if (!top) return;
  const el = document.createElement('div');
  el.className = 'pop ' + (isPhone() ? 'sheet' : '');
  el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Règle ' + top.m);
  el.innerHTML = `<div class="poptools">${POP.stack.length > 1 ? '<button class="btn ghost small" id="popBack">← Retour</button>' : '<span></span>'}<button class="btn ghost small" id="popClose" aria-label="Fermer">✕</button></div>
    <div class="popbody">${top.html || kwPanelHTML(top.m, top.key)}</div>`;
  if (isPhone()){ const bd = document.createElement('div'); bd.className = 'backdrop'; bd.id = 'popBd'; document.body.appendChild(bd); }
  document.body.appendChild(el); pop = el;
  if (!isPhone() && POP.anchor && document.body.contains(POP.anchor) && !top.html){
    const r = POP.anchor.getBoundingClientRect(), w = el.offsetWidth, h = el.offsetHeight;
    el.style.left = Math.min(Math.max(16, r.left), innerWidth - w - 16) + 'px';
    let y = r.bottom + 6; if (y + h > innerHeight - 10) y = Math.max(10, r.top - h - 6); el.style.top = y + 'px';
  } else if (!isPhone()){ el.classList.add('center'); }
}
let pop;
function openKw(el){
  const m = el.dataset.kw, key = el.dataset.key || normKw(m) || m;
  const inPop = !!el.closest('.pop');
  if (!inPop){ POP.stack = []; POP.anchor = el; }
  POP.stack.push({m, key: KW[key] ? key : (kwDef(m) ? normKw(kwDef(m).name) : key)});

function openSheet(html){ POP.stack = [{html}]; POP.anchor = null; renderPop(); }
function closePop(keep){ if (pop){ pop.remove(); pop = null; } const bd = $('#popBd'); if (bd) bd.remove(); if (!keep) POP.stack = []; }

/* mots-clés dans tout le texte affiché (y compris les textes HTML des phases) */
const KW_NOLINK = 'BUTTON,SELECT,OPTION,TEXTAREA,INPUT,SCRIPT,STYLE,LABEL,SVG,.kwl,.pop,.nolink';
function linkifyDOM(root){
  if (!root) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode: n => {
    const p = n.parentElement; if (!p || p.closest(KW_NOLINK)) return NodeFilter.FILTER_REJECT;
    KW_RE.lastIndex = 0; return KW_RE.test(n.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT; }});
  const list = []; while (w.nextNode()) list.push(w.currentNode);
  list.forEach(n => { KW_RE.lastIndex = 0; const t = document.createElement('template'); t.innerHTML = linkify(n.nodeValue); n.replaceWith(t.content); });
}

/* ================= paiement des capacités ================= */
const PAY = {holder:null, key:null, sel:[], red:[]};
const usedOf = (h, k) => S.used[h + ':' + k];
const holderName = h => { const u = findU(h); if (u) return unitName(u); const c = S.cards.find(x => x.id === h); return c ? nm(c.key, cardDef(c)) : ''; };
const RED_RE = /(cost (is )?reduced by 1|with (its|the) (CP|BM|PE) cost reduced by 1|(PE|CP|BM) cost is reduced by 1)/i;
function reducers(a, holder){ // capacités de ta liste qui peuvent réduire un coût
  const out = [];
  S.units.filter(u => u.loc === 'table').forEach(u => abilitiesOf(u).forEach(r => { if (RED_RE.test(r.text||'') && !(u.id === holder && r.key === a.key)) out.push({h:u.id, key:r.key, name:nm(r.key, r), src:unitName(u), text:r.text}); }));
  S.cards.forEach(c => cardAbilities(c).forEach(r => { if (RED_RE.test(r.text||'')) out.push({h:c.id, key:r.key, name:nm(r.key, r), src:nm(c.key, cardDef(c)), text:r.text}); }));
  return out.filter(r => !usedOf(r.h, r.key));
}
function startUse(holder, a){
  const n = costVal(a), rep = /REPEATABLE/.test(a.text||'');
  if (usedOf(holder, a.key) && !rep){ toast('Déjà utilisée ce round par cette unité.'); return; }
  if (a.card){ const c = S.cards.find(x => x.id === a.card); if (!c.ready){ toast('Cette carte est déjà épuisée ce round.'); return; } }
  if (n <= 0 && !a.card){ recordUse(holder, a, [], 0, []); return; }
  PAY.holder = holder; PAY.key = a.key; PAY.sel = a.card ? [a.card] : []; PAY.red = [];
  openSheet(payHTML());
}
function payHTML(){
  const [holder, a] = ABREG[PAY.holder + '|' + PAY.key];
  const n = costVal(a), res = RES(), red = reducers(a, holder);
  const eff = Math.max(0, n - PAY.red.length);
  const own = a.card;
  const pick = S.cards.filter(c => c.id !== own && (cardDef(c).resource_generated || 0) > 0);
  const sum = PAY.sel.filter(id => id !== own).reduce((s, id) => s + (cardDef(S.cards.find(c => c.id === id)).resource_generated || 0), 0);
  const ok = sum >= eff;
  return `<div class="paysheet"><h3>${esc(nm(a.key, a))}</h3><p class="small muted">${esc(holderName(holder))}${own ? ' · capacité de carte : la carte est épuisée' : ''}</p>
    ${n ? `<div class="row"><span class="lbl">Coût</span><span class="cost">${n} ${esc(res)}</span>${PAY.red.length ? `<span class="pill ok">réduit à ${eff}</span>` : ''}<span class="small muted">sélectionné : <b class="mono">${sum}</b> / ${eff}</span></div>` : ''}
    ${eff ? `<p class="small" style="margin:8px 0 4px">Touche les cartes que tu retournes sur la table :</p>
    <div class="paycards">${pick.map(c => { const d = cardDef(c), on = PAY.sel.includes(c.id), why = !c.ready ? spentFor(c.id) : '';
      return `<button class="paycard ${on ? 'on' : ''}" data-paysel="${c.id}" ${c.ready ? '' : 'disabled'}><b>${esc(nm(c.key, d))}</b><span class="res">+${d.resource_generated} ${esc(res)}</span><span class="small">${c.ready ? (on ? 'à épuiser' : 'prête') : 'épuisée' + (why ? ' · ' + esc(why) : '')}</span></button>`; }).join('') || '<p class="muted">Aucune carte ne fournit cette ressource.</p>'}</div>` : ''}
    ${red.length && n ? `<div style="margin-top:10px"><span class="lbl">Réductions possibles (une fois par round)</span>${red.map(r => `<label class="chk redrow"><input type="checkbox" data-payred="${esc(r.h + '|' + r.key)}" ${PAY.red.includes(r.h + '|' + r.key) ? 'checked' : ''}> <span><b>${esc(r.name)}</b> (${esc(r.src)}) : ${esc(fr(r.text) || r.text)}</span></label>`).join('')}<p class="small muted">Coche seulement si la condition de la réduction est remplie.</p></div>` : ''}
    ${sum > eff && eff ? '<p class="small" style="color:var(--warn)">L’excédent est perdu : rien ne se garde pour une autre capacité.</p>' : ''}
    <div class="row" style="margin-top:12px"><button class="btn pri" id="payGo" ${ok ? '' : 'disabled'}>${eff ? `Payer ${eff} ${esc(res)} et utiliser` : 'Utiliser'}</button><button class="btn ghost" id="popClose2">Annuler</button></div>
    ${!ok && pick.filter(c => c.ready).reduce((s, c) => s + (cardDef(c).resource_generated||0), 0) < eff ? `<p class="small" style="color:var(--bad)">Pas assez de ${esc(res)} prêts pour payer.</p>` : ''}</div>`;
}
function spentFor(cid){ const e = (S.spent || []).find(x => x.cards.includes(cid)); return e ? e.name + (e.who ? ' (' + e.who + ')' : '') : ''; }
function recordUse(holder, a, cards, amount, red){
  cards.forEach(id => { const c = S.cards.find(x => x.id === id); if (c) c.ready = false; });
  red.forEach(rk => { const [h, k] = rk.split('|'); S.used[h + ':' + k] = {n:1, red:true, r:S.round}; });
  const k = holder + ':' + a.key, prev = S.used[k];
  S.used[k] = {n:(prev && prev.n || 0) + 1, amt:amount, r:S.round, paid:amount > 0};
  const who = findU(holder) ? unitName(findU(holder)) : '';
  S.spent = S.spent || [];
  S.spent.push({id:Date.now().toString(36) + Math.random().toString(36).slice(2, 5), r:S.round, p:S.phase, holder, key:a.key, name:nm(a.key, a), who, cards, amount, red});
  logA((who ? who + ' : ' : '') + nm(a.key, a) + (amount ? ` (−${amount} ${RES()} : ${cards.map(id => nm(S.cards.find(c => c.id === id).key, cardDef(S.cards.find(c => c.id === id)))).join(', ')})` : ''), 'ab');
  save(); closePop(); render();
  toast(nm(a.key, a) + (amount ? ` : −${amount} ${RES()}` : ' utilisée') + '.');
}
function confirmPay(){
  const [holder, a] = ABREG[PAY.holder + '|' + PAY.key];
  const eff = Math.max(0, costVal(a) - PAY.red.length);
  const cards = PAY.sel.slice();
  const amount = cards.filter(id => id !== a.card).reduce((s, id) => s + (cardDef(S.cards.find(c => c.id === id)).resource_generated || 0), 0);
  recordUse(holder, a, cards, Math.min(amount, eff) || (a.card ? 0 : 0), PAY.red.slice());
}
function refund(id){
  const i = (S.spent || []).findIndex(x => x.id === id); if (i < 0) return;
  const e = S.spent[i];
  e.cards.forEach(cid => { const c = S.cards.find(x => x.id === cid); if (c) c.ready = true; });
  (e.red || []).forEach(rk => { const [h, k] = rk.split('|'); delete S.used[h + ':' + k]; });
  const k = e.holder + ':' + e.key; if (S.used[k]){ S.used[k].n--; if (S.used[k].n <= 0) delete S.used[k]; }
  S.spent.splice(i, 1); logA('Annulé : ' + e.name + (e.who ? ' (' + e.who + ')' : ''), 'ab'); save();
}

function mapSVG(opts={}){
  const d = deploy(), [W, H] = d.size, sc = 10, pad = 14;
  const vw = W * sc + pad * 2, vh = H * sc + pad * 2;
  const X = v => pad + v * sc, Y = v => pad + v * sc;
  let g = `<rect x="${X(0)}" y="${Y(0)}" width="${W*sc}" height="${H*sc}" fill="var(--sunk)" stroke="var(--line)"/>`;
  for (let i = 6; i < W; i += 6) g += `<line x1="${X(i)}" y1="${Y(0)}" x2="${X(i)}" y2="${Y(H)}" stroke="var(--line)" stroke-width="0.6"/>`;
  for (let i = 6; i < H; i += 6) g += `<line x1="${X(0)}" y1="${Y(i)}" x2="${X(W)}" y2="${Y(i)}" stroke="var(--line)" stroke-width="0.6"/>`;
  if (mission().scoring_model === 'quarters') g += `<line x1="${X(W/2)}" y1="${Y(0)}" x2="${X(W/2)}" y2="${Y(H)}" stroke="var(--muted)" stroke-dasharray="5 4"/><line x1="${X(0)}" y1="${Y(H/2)}" x2="${X(W)}" y2="${Y(H/2)}" stroke="var(--muted)" stroke-dasharray="5 4"/>`;
  const colV = c => c === 'RED' ? 'var(--red)' : 'var(--blue)';
  Object.entries(d.edges).forEach(([c, segs]) => segs.forEach(([s, a, b]) => {
    const z = 6 * sc; let r, l;
    if (s === 'T'){ r = [X(a), Y(0), (b-a)*sc, z]; l = [X(a), Y(0), X(b), Y(0)]; }
    if (s === 'B'){ r = [X(a), Y(H)-z, (b-a)*sc, z]; l = [X(a), Y(H), X(b), Y(H)]; }
    if (s === 'L'){ r = [X(0), Y(a), z, (b-a)*sc]; l = [X(0), Y(a), X(0), Y(b)]; }
    if (s === 'R'){ r = [X(W)-z, Y(a), z, (b-a)*sc]; l = [X(W), Y(a), X(W), Y(b)]; }
    g += `<rect x="${r[0]}" y="${r[1]}" width="${r[2]}" height="${r[3]}" fill="${colV(c)}" opacity="0.13"/>`;
    g += `<line x1="${l[0]}" y1="${l[1]}" x2="${l[2]}" y2="${l[3]}" stroke="${colV(c)}" stroke-width="6" stroke-linecap="square"/>`;
  }));
  (opts.markers || S.markers).forEach(m => {
    const c = m.aff === 'NEUTRAL' ? 'var(--ink)' : colV(m.aff);
    const own = m.owner === 'me' ? 'var(--ok)' : m.owner === 'opp' ? 'var(--bad)' : null;
    g += `<g opacity="${m.removed ? 0.3 : m.active ? 1 : 0.55}">${own ? `<circle cx="${X(m.x)}" cy="${Y(m.y)}" r="20" fill="none" stroke="${own}" stroke-width="4"/>` : ''}
      <circle cx="${X(m.x)}" cy="${Y(m.y)}" r="14" fill="var(--surface)" stroke="${c}" stroke-width="3" ${m.active ? '' : 'stroke-dasharray="4 3"'}/>
      <text x="${X(m.x)}" y="${Y(m.y)+5}" text-anchor="middle" font-family="var(--f-mono)" font-weight="700" font-size="14" fill="var(--ink)">${m.id}</text></g>`;
  });
  const lab = (t, x, y, a) => `<text x="${x}" y="${y}" text-anchor="${a||'middle'}" font-size="10" fill="var(--muted)" font-family="var(--f-mono)">${t}</text>`;
  g += lab(W + '"', X(W/2), pad - 3) + lab(H + '"', pad - 3, Y(H/2), 'end');
  return `<div class="mapbox"><svg viewBox="0 0 ${vw} ${vh}" role="img" aria-label="Plan de table ${esc(d.name)}">${g}</svg></div>`;
}

function missionText(m){

  if (S.round >= 2 && S.round <= 4) return {pool:[1,2,5]}; return null;
}

/* ---- score ---- */
function computeScore(){
  const m = mission(), r = S.round, lines = [], add = {me:0, opp:0};
  const put = (side, v, t) => { if (v){ add[side] += v; lines.push([side, v, t]); } };
  const dMe = S.destroyed.opp[r] || 0, dOpp = S.destroyed.me[r] || 0;
  let resMe = 0, resOpp = 0;
  if (r >= lastRound()){ resMe = S.opp.units.filter(u => u.loc === 'res').reduce((a, u) => a + curSup(u), 0); resOpp = S.units.filter(u => u.loc === 'res').reduce((a, u) => a + curSup(u), 0); }
  put('me', dMe + resMe, 'Supply adverse détruit ce round' + (resMe ? ` (dont ${resMe} resté en réserve au dernier round)` : ''));
  put('opp', dOpp + resOpp, 'Ton supply détruit ce round' + (resOpp ? ` (dont ${resOpp} resté en réserve au dernier round)` : ''));
  const lm = liveMarkers(), from2 = r >= 2;
  const colOf = (mk, side) => mk.aff === 'NEUTRAL' ? 'N' : (mk.aff === (side === 'me' ? myCol() : oppCol()) ? 'OWN' : 'OPP');
  const sm = m.scoring_model;
  ['me','opp'].forEach(side => {
    const mine = lm.filter(x => x.owner === side);
    if (sm === 'colour_1_2' && from2) mine.forEach(x => put(side, colOf(x, side) === 'OPP' ? 2 : 1, `Marqueur ${x.id} (${colOf(x, side) === 'OPP' ? 'couleur adverse' : colOf(x, side) === 'N' ? 'neutre' : 'ta couleur'})`));
    if (sm === 'opp_2' && from2) mine.filter(x => colOf(x, side) === 'OPP').forEach(x => put(side, 2, `Marqueur ${x.id} (couleur adverse)`));
    if (sm === 'sabotage' && from2) mine.filter(x => colOf(x, side) !== 'OWN').forEach(x => put(side, x.sab, `Marqueur ${x.id} (Sabotage ${x.sab})`));
    if (sm === 'frontlines' && from2) mine.forEach(x => put(side, 1 + (x.gained === side ? 2 : 0), `Marqueur ${x.id}${x.gained === side ? ' (repris à l’adversaire ce round : +2)' : ''}`));
    if (sm === 'activated_round' && (m.level === 'STANDARD' || from2)) mine.filter(x => x.active && x.actRound).forEach(x => put(side, x.actRound, `Marqueur ${x.id} activé au round ${x.actRound} (puis retiré)`));
    if (sm === 'quarters'){ const q = (S.quarters || {})[side] || [0,0,0,0], o = (S.quarters || {})[side === 'me' ? 'opp' : 'me'] || [0,0,0,0];
      q.forEach((v, i) => { if (v > o[i]) put(side, 1, `Quart ${i+1} (${v} contre ${o[i]})`); });
      if (mine.find(x => x.id === 5)) put(side, 2, 'Marqueur 5 contrôlé'); }
  });
  const manual = sm === 'claim';
  return {add, lines, manual};
}
function applyControl(){
  const sum = (ids, adj, arr) => ids.reduce((a, id) => { const u = arr.find(x => x.id === id); return a + (u && u.loc === 'table' ? curSup(u) : 0); }, 0) + (adj || 0);
  liveMarkers().forEach(mk => {
    const a = sum(mk.me, mk.meAdj, S.units), b = sum(mk.opp, mk.oppAdj, S.opp.units);
    mk.prev = mk.owner; mk.gained = null;
    if (a > b) mk.owner = 'me'; else if (b > a) mk.owner = 'opp';
    if (mk.prev === 'opp' && mk.owner === 'me') mk.gained = 'me';
    if (mk.prev === 'me' && mk.owner === 'opp') mk.gained = 'opp';
  });
  logA('Contrôle : ' + liveMarkers().map(x => x.id + '→' + (x.owner === 'me' ? 'toi' : x.owner === 'opp' ? 'adv.' : '—')).join(', '), 'score');
}
function specialWin(){ const t = mission().special_win_lead; if (!t) return null; const d = S.vp.me - S.vp.opp; return Math.abs(d) >= t ? (d > 0 ? 'me' : 'opp') : null; }
