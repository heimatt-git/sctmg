<script>
(function(){
"use strict";
const DB=JSON.parse(document.getElementById('db').textContent);
const RACES=['ZERG','TERRAN','PROTOSS'];
const RLABEL={ZERG:'Zerg',TERRAN:'Terran',PROTOSS:'Protoss'};
const SLOTS=['CORE','ELITE','SUPPORT','AIR','HERO'];
const SLOTFR={CORE:'Core',ELITE:'Élite',SUPPORT:'Support',AIR:'Air',HERO:'Héros'};
const SCALEFR={Skirmish:'Skirmish',Standard:'Standard',Grand_Offensive:'Grand Offensive'};
const NAMES={Swarmling_Zergling:'Swarmling (Zergling)',Raptor_Zergling:'Raptor (Zergling)',Kerrigan_Swarm_Raptor_Zergling:'Raptor de Kerrigan (Zergling)',Raynors_Raiders_Marine:"Raynor's Raiders (Marine)",Spawning_Pool_Six_Pool:'Spawning Pool (Six Pool)',Kerrigans_Swarm:"Kerrigan's Swarm",Raynors_Raiders:"Raynor's Raiders",Terran_Armed_Forces:'Terran Armed Forces'};
const FAM=DB.model_families;
const famOf={};Object.entries(FAM.families).forEach(([f,o])=>o.members.forEach(m=>famOf[m]=f));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nm=(k,o)=>(o&&o.display_name)||NAMES[k]||k.replace(/_/g,' ');
const WN={C_14_RIFLE:'C-14 Rifle',QUAD_K12:'Quad K12'};
const abName=(k,o)=>(o&&o.display_name)||WN[k]||k.split('_').map(w=>w.charAt(0)+w.slice(1).toLowerCase()).join(' ');
const cap=s=>s.charAt(0)+s.slice(1).toLowerCase();

/* ---------- state ---------- */
const LS='sctmg-builder-v1';
function defaultState(){
  const lists={};RACES.forEach(r=>lists[r]={units:[],tactical:[],creep:null});
  lists.ZERG={example:true,creep:'Accelerating_Creep',tactical:['Spawning_Pool','Hydralisk_Den','Hatchery'],
    units:[{uid:1,key:'Zergling',comp:1,up:['Adrenal_Glands']},{uid:2,key:'Roach',comp:0,up:[]},{uid:3,key:'Ravager',comp:0,up:[]},{uid:4,key:'Hydralisk',comp:1,up:[]},{uid:5,key:'Queen',comp:0,up:[]}]};
  return {race:'ZERG',view:'list',faction:{ZERG:'Zerg_Swarm',TERRAN:'Terran_Armed_Forces',PROTOSS:'Daelaam'},
    scale:'Skirmish',custom:3000,mission:{r1:null,inc:null},mode:'proxy',lists,collection:{units:{}},nextUid:100};
}
function load(){try{const s=JSON.parse(localStorage.getItem(LS));if(s&&s.lists&&s.collection){const d=defaultState();return Object.assign(d,s,{faction:Object.assign(d.faction,s.faction),mission:Object.assign(d.mission,s.mission||{})});}}catch(e){}return defaultState();}
function save(){try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}}
let state=load();
const openSheets=new Set();

/* ---------- rules engine ---------- */
function limitOf(){const sc=DB.army_building_rules.engagement_scales[state.scale];return typeof sc.mineral_limit==='number'?sc.mineral_limit:Math.max(2001,Math.round(+state.custom)||2001);}
const poolKey=k=>state.mode==='proxy'&&famOf[k]?famOf[k]:k;
const isFav=k=>!!(state.collection.favorites&&state.collection.favorites[k]);
const summonsOf=race=>{const R=DB.races[race];return [...Object.entries(R.summoned_units||{}),...Object.entries(R.summoned_structures||{})].filter(([k,s])=>s.summoned_from).map(([k,s])=>({k,s,src:s.summoned_from}));};
const activeSummons=(race,fk,L)=>summonsOf(race).filter(x=>x.src.faction_card===fk||(x.src.unit&&[x.src.unit,...(x.src.alt_units||[])].some(un=>L.units.some(e=>e.key===un))));
function srcTxt(race,x){const R=DB.races[race];return x.src.faction_card?`Faction Card ${nm(x.src.faction_card,R.faction_cards[x.src.faction_card])} (${abName(x.src.ability)})`:`${[x.src.unit,...(x.src.alt_units||[])].map(un=>nm(un,R.units[un])).join(' / ')} (${abName(x.src.ability)})`;}
function poolLabel(p,R){return FAM.families[p]?'famille '+cap(p):nm(p,R.units[p]);}
function colActive(race){
  const R=DB.races[race],C=state.collection;
  return [...Object.keys(R.units),...summonsOf(race).map(x=>x.k)].some(k=>(C.units[k]||0)>0);
}
function ownedPools(race){const R=DB.races[race],o={};Object.keys(R.units).forEach(k=>{const p=poolKey(k);o[p]=(o[p]||0)+(state.collection.units[k]||0);});return o;}

function compute(){
  const race=state.race,R=DB.races[race],L=state.lists[race],fk=state.faction[race],F=R.faction_cards[fk];
  const lim=limitOf(),gasCap=Math.floor(lim*DB.army_building_rules.engagement_scales.Standard.gas_limit_percent/100);
  const elig=tags=>tags.every(t=>F.faction_tags.includes(t));
  const issues=[];let min=0,gas=0,res=F.resource_generated||0,pool=0;const poolNotes=[];
  const avail={},used={};SLOTS.forEach(s=>{avail[s]=F.starting_army_slots[s]||0;used[s]=0;});
  const rows=[];
  L.units.forEach(e=>{const u=R.units[e.key];if(!u)return;const c=u.composition_options[e.comp]||u.composition_options[0];
    let upc=0;e.up.forEach(k=>{const up=u.upgrades[k];if(up)upc+=(up.mineral_cost||{})[String(c.models)]||0;});
    const cost=c.mineral_cost+upc;min+=cost;used[u.army_slot]=(used[u.army_slot]||0)+c.supply_value;
    let sp=c.supply_value,spBy=null;e.up.forEach(k=>{const be=u.upgrades[k]&&u.upgrades[k].builder_effect;if(be&&be.supply_pool_value!=null){sp=be.supply_pool_value;spBy=k;}});
    pool+=sp;if(spBy)poolNotes.push(`${nm(e.key,u)} compte ${sp} au lieu de ${c.supply_value} (${abName(spBy,u.upgrades[spBy])})`);
    rows.push({e,u,c,cost,upc,sp,spBy});});
  L.tactical.forEach(k=>{const t=R.tactical_cards[k];if(!t)return;gas+=t.gas_cost;res+=t.resource_generated||0;
    Object.entries(t.grants_army_slots||{}).forEach(([s,n])=>avail[s]=(avail[s]||0)+n);});
  const creep=L.creep&&R.creep_cards[L.creep];if(creep)gas+=creep.gas_cost||0;
  const fname=nm(fk,F);
  if(min>lim)issues.push(['err',`Minéraux dépassés : ${min} pour ${lim} autorisés. Retirez ${min-lim} minéraux d'unités ou d'upgrades.`]);
  if(gas>gasCap)issues.push(['err',`Gas dépassé : ${gas} pour ${gasCap} autorisés (10 % du plafond minéraux). Retirez une Tactical Card${race==='ZERG'?' ou prenez une Creep Card moins chère':''}.`]);
  SLOTS.forEach(s=>{if(used[s]>avail[s])issues.push(['err',`Slots ${SLOTFR[s]} : ${used[s]} occupés pour ${avail[s]} disponibles. Ajoutez une Tactical Card qui donne des slots ${SLOTFR[s]}, ou retirez une unité.`]);});
  if(Object.keys(R.creep_cards).length&&!creep)issues.push(['err','Une Creep Card est obligatoire pour les Zerg : choisissez-en une dans la liste.']);
  if(creep&&!elig(creep.faction_tags))issues.push(['err',`${nm(L.creep,creep)} n'est pas jouable avec ${fname}.`]);
  rows.forEach(r=>{if(!elig(r.u.faction_tags))issues.push(['err',`${nm(r.e.key,r.u)} n'est pas jouable avec ${fname} : unité réservée à ${r.u.faction_tags.filter(t=>t!==RLABEL[race]).join(', ')}.`]);});
  L.tactical.forEach(k=>{const t=R.tactical_cards[k];if(t&&!elig(t.faction_tags))issues.push(['err',`${nm(k,t)} n'est pas jouable avec ${fname}.`]);});
  const uc={};rows.forEach(r=>uc[r.e.key]=(uc[r.e.key]||0)+1);
  Object.entries(uc).forEach(([k,n])=>{if(n>1&&R.units[k].unique)issues.push(['err',`${nm(k,R.units[k])} est Unique : une seule unité autorisée dans la liste.`]);});
  Object.keys(uc).forEach(k=>(R.units[k].exclusive_with||[]).forEach(x=>{if(uc[x]&&k<x)issues.push(['err',`${nm(k,R.units[k])} et ${nm(x,R.units[x])} ne peuvent pas être dans la même armée (Battle Preparation).`]);}));
  const tc={};L.tactical.forEach(k=>tc[k]=(tc[k]||0)+1);
  Object.entries(tc).forEach(([k,n])=>{const t=R.tactical_cards[k];if(t&&n>1&&t.unique)issues.push(['err',`${nm(k,t)} est Unique : une seule copie autorisée.`]);});
  // collection
  const active=colActive(race),own=ownedPools(race),use={};
  rows.forEach(r=>{const p=poolKey(r.e.key);use[p]=(use[p]||0)+r.c.models;});
  if(active){
    Object.entries(use).forEach(([p,n])=>{const o=own[p]||0;if(n>o)issues.push(['warn',`Collection : ${n} figurine${n>1?'s':''} ${poolLabel(p,R)} nécessaire${n>1?'s':''}, vous en avez ${o}.`]);});
    activeSummons(race,fk,L).forEach(x=>{const o=state.collection.units[x.k]||0,n=x.src.models_needed||1;if(o<n)issues.push(['warn',`Collection : ${n>1?(x.src.exact?'':'jusqu\'à ')+n+' figurines':'1 figurine'} ${nm(x.k,x.s)} pour ${srcTxt(race,x)}, vous en avez ${o}.`]);});
  }
  return {race,R,L,F,fk,lim,gasCap,min,gas,res,avail,used,rows,issues,elig,active,own,use,tc,pool,poolNotes};
}

/* ---------- rendering helpers ---------- */
const resName=r=>DB.races[r].resource;
function costTxt(cost){if(!cost)return '';return Object.entries(cost).map(([k,v])=>`${v} ${k}`).join(' + ');}
function wRow(n,w,label){
  const rng=w.rng==='E'?'E':(w.rng+'"');const surge=Array.isArray(w.surge_type)?w.surge_type.join(', '):(w.surge_type||'–');
  return `<tr><td>${esc(label||abName(n))}</td><td>${w.phase?esc(cap(w.phase)):''}</td><td class="num">${esc(rng)}</td><td>${esc(w.target)}</td><td class="num">${esc(w.roa)}</td><td class="num">${esc(w.hit)}</td><td>${esc(surge)}</td><td class="num">${esc(w.s_dice||'–')}</td><td class="num">${esc(w.dmg)}</td><td class="kw">${(w.keywords||[]).length?w.keywords.map(x=>linkify(x)).join(', '):'–'}</td></tr>`;
}
function wTable(rows){return `<div class="tbl-wrap"><table><thead><tr><th>Arme</th><th>Phase</th><th>Rng</th><th>Cible</th><th>RoA</th><th>Hit</th><th>Surge</th><th>S Dice</th><th>Dmg</th><th>Mots-clés</th></tr></thead><tbody>${rows}</tbody></table></div>`;}
function abilList(abs,race){
  return `<ul class="abil">${Object.entries(abs||{}).map(([k,a])=>{
    let body=txtB(a.text||'');
    if(a.options)body+=`<ul>${a.options.map(o=>`<li><span class="num">${esc(costTxt(o.cost))}</span> : ${esc(o.effect)}</li>`).join('')}</ul>`;
    return `<li><span class="an">${esc(abName(k,a))}</span><span class="ty ${esc(a.type)}">${esc(a.type)}</span><span class="ph">${esc(cap(a.phase||''))}${a.restriction?' · '+esc(a.restriction):''}</span>${a.cost?`<span class="co">${esc(costTxt(a.cost))}</span>`:''}${body}</li>`;}).join('')}</ul>`;
}
function unitSheet(u,race){
  const s=u.stats;const sp=s.speed==null?'–':(s.speed_last_model!=null?`${s.speed}/${s.speed_last_model}`:s.speed);
  const st=[s.shield?['Shield',s.shield]:null,['Vitesse',sp],['Armure',s.armour],['Evade',s.evade],['PV',s.hp],['Size',s.size]].filter(Boolean);
  const sup=(u.supply_profile||[]).map(p=>`${p.models_min===p.models_max?p.models_min:p.models_min+'–'+p.models_max} fig. → ${p.supply}`).join(' · ');
  const ws=Object.entries(u.weapons||{}).map(([k,w])=>wRow(k,w)).join('');
  return `<div class="sheet">
    <div class="stats">${st.map(([l,v])=>`<div><b>${esc(v)}</b><span>${l}</span></div>`).join('')}</div>
    <div class="tags">${esc(u.combat_tags.join(', '))} · socle ${esc(typeof u.base_mm==='number'?u.base_mm+' mm':'de vol')} · supply restant : ${esc(sup)}${s.speed_last_model!=null?` · vitesse ${s.speed_last_model} quand il ne reste qu'une figurine`:''}</div>
    ${ws?wTable(ws):''}
    ${abilList(u.abilities,race)}
  </div>`;
}
function grantsTxt(g){return Object.entries(g||{}).map(([s,n])=>`+${n} ${SLOTFR[s]}`).join(', ');}

function missionRounds(n){const m=state.mission;if(m.r1==null)return null;const out=[];for(let i=0;i<n;i++)out.push(m.r1+i*(m.inc||0));return out;}
function missionTxt(){const r=missionRounds(5);return r?r.map((v,i)=>`T${i+1} ${v}`).join(' · '):'non renseigné';}
function missionChips(pool){const r=missionRounds(5);if(!r)return '<span class="tags">Saisissez les valeurs de votre carte de mission pour voir le supply utilisable à chaque tour.</span>';
  return r.map((v,i)=>`<span class="slot ${v>=pool?'full':''}" title="${v>=pool?'Couvre tout le Supply Pool de la liste':''}"><b>T${i+1}</b>${v}</span>`).join('')+`<span class="tags">Encadré : le supply du tour couvre tout le Supply Pool de la liste (${pool}).</span>`;}

/* ---------- création intelligente ---------- */
const SDICE={'D3':2,'D3+1':3,'D6':3.5,'BT':2};
const ROLES=['DAMAGE DEALER','TANK','LIFESAVER','TACTICIAN'];
const tn=s=>{const m=/^(\d)\+$/.exec(String(s||''));return m?+m[1]:null;};
const pOk=t=>t?Math.max(0,Math.min(1,(7-t)/6)):0;
function kwN(kws,name){for(const k of kws||[]){const m=new RegExp('^'+name+'\\s*\\(?\\s*(\\d+)').exec(k);if(m)return +m[1];}return 0;}
function kwPierce(kws,tags){for(const k of kws||[]){const m=/^PIERCE\s+(\w+)\s*\(?\s*(\d+)/.exec(k);if(m&&tags.includes(m[1]))return +m[2];}return null;}
const hasKw=(w,k)=>(w.keywords||[]).some(x=>x.startsWith(k));
function canTarget(w,t){const fly=t.combat_tags.includes('Flying');return w.target==='All'||(w.target==='Flying'?fly:!fly);}
function roaOf(w){if(typeof w.roa==='number')return w.roa;const m=/^BT\s*\+\s*(\d+)/.exec(String(w.roa));return m?2+(+m[1]):(String(w.roa)==='BT'?2:0);}
/* dégâts attendus d'UN modèle avec l'arme w contre une figurine type de l'unité t (approximation documentée) */
function wVs(w,t,xp,xae,xc){
  if(!canTarget(w,t))return 0;
  const roa=roaOf(w),p=pOk(tn(w.hit));let hits=Math.min(roa,roa*p+kwN(w.keywords,'PRECISION')+(xp||0));
  const st=Array.isArray(w.surge_type)?w.surge_type:(w.surge_type?[w.surge_type]:[]);
  let moved=st.some(x=>t.combat_tags.includes(x))?Math.min(SDICE[w.s_dice]||0,hits):0;
  moved=Math.min(hits,moved+kwN(w.keywords,'CRITICAL HIT')+(xc||0));
  const fail=1-pOk(tn(t.stats.armour));const dmg=kwPierce(w.keywords,t.combat_tags)??(+w.dmg||0);
  let e=(moved+(hits-moved)*fail)*dmg;
  if(t._ev){const ae=kwN(w.keywords,'ANTI-EVADE')+(xae||0);const pe=pOk(Math.min(7,t._ev.tn+ae));e*=1-pe*t._ev.cov;}
  if(hasKw(w,'INSTANT'))e*=1+0.08*(t._r||0);
  const cf=kwN(w.keywords,'CONCENTRATED FIRE');if(cf)e=Math.min(e,cf*(t.stats.hp||1));
  return e;
}
/* armes effectives d'une unité selon ses upgrades */
function loadout(u,models,ups){
  const base=Object.entries(u.weapons||{}).filter(([k,w])=>!w.requires_upgrade||ups.includes(w.requires_upgrade)).map(([k,w])=>({k,w}));let spec=[],added=[];const repl={};
  ups.forEach(k=>{const up=u.upgrades[k];if(!up)return;
    if(up.weapon_replacement){if(up.specialist)spec.push({k:up.for_weapon,spec:true,w:{...up.weapon_replacement,phase:up.phase||'ASSAULT'}});else repl[up.for_weapon]={...up.weapon_replacement,phase:up.phase||(u.weapons[up.for_weapon]||{}).phase};}
    if(up.weapon_added)added.push({w:{...up.weapon_added,phase:'ASSAULT'},n:up.specialist?1:models});});
  const std=base.map(b=>({k:b.k,w:repl[b.k]||b.w}));
  return {std,spec,added,models};
}
function offVs(u,lo,t,st){
  const ph=(arr,phase)=>arr.filter(x=>(x.w.phase||'ASSAULT')===phase);
  const match=x=>st&&!x.spec&&((st.weapons||[]).includes(x.k)||(st.close_combat&&x.w.phase==='COMBAT')||(st.phase&&(x.w.phase||'ASSAULT')===st.phase)||(st.ae&&!st.weapons&&!st.phase&&(x.w.phase||'ASSAULT')==='ASSAULT'));
  const xp=x=>match(x)?(st.precision||0):0,xa=x=>match(x)?(st.ae||0):0,xcr=x=>match(x)?(st.crit||0):0;
  const ds=effOf(u,'dmg_equals_target_size');
  const W=x=>{let w=ds&&(ds.weapons||[]).includes(x.k)?{...x.w,dmg:Math.max(1,+t.stats.size||1)}:x.w;
    if(match(x)){if(st.roa)w={...w,roa:roaOf(w)+st.roa};if(st.vsSize&&(+t.stats.size||0)>=st.vsSize)w={...w,dmg:st.dmg};if(st.instant)w={...w,keywords:[...(w.keywords||[]),'INSTANT']};}return w;};
  const best=(arr)=>arr.filter(x=>!hasKw(x.w,'SIDEARM')).reduce((m,x)=>Math.max(m,wVs(W(x),t,xp(x),xa(x),xcr(x))),0);
  const side=(arr)=>arr.filter(x=>hasKw(x.w,'SIDEARM')).reduce((s,x)=>s+wVs(W(x),t,xp(x),xa(x),xcr(x)),0);
  const A=ph(lo.std,'ASSAULT'),C=ph(lo.std,'COMBAT');
  const normal=lo.models-lo.spec.length;
  let as=Math.max(0,normal)*(best(A)+side(A));
  lo.spec.forEach(s=>{const arr=A.filter(x=>x.k!==s.k).concat(ph([s],'ASSAULT'));as+=best(arr)+side(arr);});
  lo.added.forEach(a=>as+=a.n*wVs(a.w,t,0));
  const cc=lo.models*(best(C)+side(C));
  return as+0.7*cc;
}
function oppProfile(oppRace,oppFac){

    [...Object.values(u.abilities||{}).map(a=>[a.builder_effect,1]),...Object.values(u.upgrades||{}).map(a=>[a.builder_effect,0.5])].forEach(([b,wt])=>{if(!b||(b.kind!=='evade'&&b.kind!=='hidden'))return;const base=b.fixed||tn(u.stats.evade);if(!base)return;
      const tv=Math.max(2,base-(b.mod||0));const c=(b.kind==='hidden'?b.uptime:b.coverage)*wt*(b.paid?0.7:1);if(c>cov){cov=c;tnv=tv;}});
    return cov?{...u,_ev:{cov,tn:tnv}}:u;});

  units.forEach(u=>{Object.values(u.abilities||{}).forEach(a=>txt.push(a.text||''));Object.values(u.upgrades||{}).forEach(a=>txt.push(a.text||''));});
  Object.values(R.tactical_cards).filter(c=>ok(c.faction_tags)).forEach(c=>Object.values(c.abilities).forEach(a=>txt.push(a.text||'')));

  let nr=0;const cnt=o=>Object.values(o.abilities||{}).forEach(a=>{if(a.type==='REACTION')nr++;});units.forEach(cnt);(F?[F]:Object.values(R.faction_cards)).forEach(cnt);Object.values(R.tactical_cards).filter(c=>ok(c.faction_tags)).forEach(cnt);
  const r=Math.min(1,nr/6);units.forEach(u=>u._r=r);
  const reserves=txt.some(s=>/from Reserves/i.test(s));const detect=txt.some(s=>/lose\s+HIDDEN Status/i.test(s));
  return {units,hidden,weps,race:oppRace,fac:oppFac,react:r,reserves,detect};
}
function unitOff(u,models,ups,prof,st){const lo=loadout(u,models,ups);return prof.units.reduce((s,t)=>s+offVs(u,lo,t,st),0)/Math.max(1,prof.units.length);}
const effOf=(o,kind)=>{for(const a of Object.values(o.abilities||{}))if(a.builder_effect&&a.builder_effect.kind===kind)return a.builder_effect;return null;};
const stimOf=u=>effOf(u,'stim');const healOf=u=>effOf(u,'heal');
const upEff=(u,ups,kind)=>ups.map(k=>u.upgrades[k]&&u.upgrades[k].builder_effect).filter(e=>e&&e.kind===kind);
/* synergies Stimpack / soins / réductions de coût, calculées depuis les annotations builder_effect */
const allEff=o=>Object.values(o.abilities||{}).map(a=>a.builder_effect).filter(Boolean);
const onCreep=u=>[...Object.values(u.abilities||{}),...Object.values(u.upgrades||{})].some(a=>/ON CREEP/.test(a.text||''));
function synergy(R,F,L,res){
  let stimN=0,healCap=0,healN=0,other=0,red=0,demand=0,creepSrc=0,freeBurrow=0,detect=false,regenN=0;
  const cards=[F,...L.tactical.map(k=>R.tactical_cards[k]).filter(Boolean),...(L.creep&&R.creep_cards[L.creep]?[R.creep_cards[L.creep]]:[])];
  cards.forEach(c=>allEff(c).forEach(b=>{if(b.kind==='creep_source'){creepSrc+=b.weight||1;if(b.detection)detect=true;}if(b.kind==='free_burrow')freeBurrow+=b.amount||1;}));
  const totalModels=L.units.reduce((s,e)=>s+R.units[e.key].composition_options[e.comp].models,0);
  const used=[];
  L.units.forEach(e=>{const u=R.units[e.key],c=u.composition_options[e.comp];let counted=false;
    if(stimOf(u)){stimN++;demand+=1;counted=true;}
    const h=healOf(u);if(h){healN++;demand+=1;counted=true;healCap+=c.models*(h.per_model||1)+upEff(u,e.up,'heal_bonus').reduce((s,x)=>s+(x.models||0),0);}

      if(b.kind==='creep_source')creepSrc+=b.weight||1;

  const supportPaid=L.units.some(e=>{const u=R.units[e.key];return u.army_slot==='SUPPORT'&&paysRes(u);});

}
/* valeur des capacités annotées d'une unité (avant couverture en ressource) */
/* IMPACT(X) Y+ : X dés par figurine en Fighting/Supporting Rank, touche sur Y+, jet d'armure, Dmg 1, pas de Surge.
   Estimation : toutes les figurines jusqu'à 6, puis la moitié au-delà ; pondéré ×0,5 (la charge doit réussir). */
function impactOf(u){for(const a of Object.values(u.abilities||{})){const m=/IMPACT\s*\((\d+)\)\s*(\d)\+/.exec(a.text||'');if(m)return {x:+m[1],y:+m[2]};}return null;}
function impactVal(u,models,prof,mod,xd){const im0=impactOf(u);if(!im0)return 0;const im={x:im0.x+(xd||0),y:im0.y};
  const elig=models<=6?models:6+(models-6)*0.5;const p=pOk(Math.max(2,im.y-(mod||0)));
  const avgFail=prof.units.reduce((s,t)=>s+(1-pOk(tn(t.stats.armour))),0)/Math.max(1,prof.units.length);
  return elig*im.x*p*avgFail*0.5;}
/* RESPAWN(X) ne peut pas faire monter l'unité de palier de Supply : efficacité moyenne sur les tailles possibles après pertes */
function respawnEff(u,X,maxM){const prof=u.supply_profile||[];if(!prof.length||maxM<2||!X)return 1;
  const bracketMax=n=>{const b=prof.find(p=>n>=p.models_min&&n<=p.models_max);return b?Math.min(b.models_max,maxM):maxM;};
  let s=0;for(let n=1;n<maxM;n++)s+=Math.min(X,bracketMax(n)-n,maxM-n)/X;return s/(maxM-1);}
function bestWeaponDmg(u,e){let d=1;Object.values(u.weapons||{}).forEach(w=>{if((w.phase||'ASSAULT')==='ASSAULT')d=Math.max(d,+w.dmg||1);});return d;}
function evadeMult(u,e,cov,extraMod,extraGrant){let m=1;const ev=[...allEff(u),...upEff(u,e.up,'evade')].filter(b=>b.kind==='evade');if(extraGrant)ev.push(extraGrant);
  ev.forEach(b=>{const base=b.fixed||tn(u.stats.evade);if(!base)return;const p=pOk(Math.max(2,base-(b.mod||0)-(extraMod||0)));const k=b.coverage*(b.paid?cov:1);m*=1/Math.max(0.2,1-p*k);});return m;}
function unitSyn(R,u,e,c,prof,creepLevel,L){
  let off=0,ehp=0;const notes=[];const failSelf=Math.max(0.17,1-pOk(tn(u.stats.armour)));
  allEff(u).forEach(b=>{
    if(b.kind==='hits_ability'){
      const deb=upEff(u,e.up,'hits_armour_debuff').reduce((s,x)=>s+(x.amount||0),0);const area=upEff(u,e.up,'hits_area').reduce((m,x)=>m*(x.mult||1),1);
      const avgFail=prof.units.reduce((s,t)=>s+Math.min(1,1-pOk(tn(t.stats.armour))+deb/6),0)/Math.max(1,prof.units.length);
      const v=b.hits*b.dmg*(b.per_model?c.models:1)*avgFail*area*(b.melee?0.7:1);off+=v;notes.push(`${abName(Object.keys(u.abilities).find(k=>u.abilities[k].builder_effect===b)||'')} +${v.toFixed(1)} dégâts`);}

      if(surplus>=ob.reactivate_cost){const v=best*0.5;off+=v;synNotes.push(`Orders : réactivation (+${v.toFixed(1)})`);}
      else if(surplus>=ob.crit_cost){const f=prof.units.reduce((s,x)=>s+pOk(tn(x.stats.armour)),0)/Math.max(1,prof.units.length);const v=ob.crit*f*Math.max(...bio.map(q=>bestWeaponDmg(q.u,q.e)));off+=v;synNotes.push(`Orders : CRITICAL HIT(2) (+${v.toFixed(1)})`);}
      else synNotes.push('Orders : pas assez de CP');});
    cd.L.tactical.forEach(k=>{const t=R.tactical_cards[k];allEff(t).forEach(b=>{if(b.kind==='respawn_card'){const best=cd.L.units.map(e=>R.units[e.key]).filter(u=>!u.unique&&u.combat_tags.includes('Biological')&&u.stats.size===1);
      if(best.length){const bu=cd.L.units.find(e=>R.units[e.key]===best[0]);const u=best[0];const mx=u.composition_options[bu?bu.comp:0].models;const m=b.models*respawnEff(u,b.models,mx);ehp+=m*u.stats.hp*2/Math.max(0.17,1-pOk(tn(u.stats.armour)));synNotes.push(`${nm(k,t)} : Respawn ${+m.toFixed(1)} fig.`);}}});});
    const need=sy.demand;
    const gas=cd.L.tactical.reduce((s,k)=>s+R.tactical_cards[k].gas_cost,0)+(cd.L.creep?R.creep_cards[cd.L.creep].gas_cost||0:0);
    const eligRoles=new Set(Object.values(R.units).filter(u=>u.faction_tags.every(t=>F.faction_tags.includes(t))).map(u=>u.combat_role));
    const missing=opts.roles.filter(r=>eligRoles.has(r)&&!roles.has(r));
    const budgetOk=cd.spent>=lim*opts.minPct/100;
    if(!budgetOk||missing.length)return;
    refO=Math.max(refO,off);refE=Math.max(refE,ehp);
    out.push({...cd,off,ehp,det,need,res,gas,roles:[...roles],per,sy,synNotes:[...new Set(synNotes)]});
  });
  out.forEach(x=>{const dm=prof.hidden?(x.det?1.1:0.9):1;x.sO=refO?x.off/refO:0;x.sE=refE?x.ehp/refE:0;x.resR=x.sy.cov;
    x.redB=opts.roles.includes('LIFESAVER')?Math.min(0.06,0.03*x.sy.red):0;x.creepB=Math.min(0.08,0.02*x.sy.onCreepN*x.sy.creepLevel);x.distinct=new Set(x.L.tactical).size;x.dups=x.L.tactical.length-x.distinct;x.divB=divMode==='allow'?0:Math.min(0.08,0.012*x.distinct)-0.03*x.dups;x.favIn=new Set(x.per.filter(p=>p.fav).map(p=>p.e.key)).size;x.favB=favMode==='prefer'?Math.min(0.15,0.04*x.favIn):0;x.score=(0.6*x.sO+0.4*x.sE)*dm+0.05*x.resR+x.redB+x.creepB+x.favB+x.divB;x.dm=dm;});
  out.sort((a,b)=>favMode==='force'?(b.favIn-a.favIn)||(b.score-a.score):b.score-a.score);
  // diversité : pas deux listes avec exactement les mêmes unités
  const pick=[],us=new Set();for(const x of out){const s=x.fk+'|'+x.L.units.map(e=>e.key+':'+e.comp).sort().join(',');if(us.has(s))continue;us.add(s);pick.push(x);if(pick.length>=5)break;}
  const top=pick[0]?pick[0].score:1;pick.forEach(x=>x.pct=Math.round(x.score/top*100));
  return {lists:pick,built,valid:out.length,prof,lim,gasCap,race,colUsed:useCol,favN:favs.size,favMode};
}

let genRes=null,genBusy=false;
function genOpts(){const g=state.gen||(state.gen={});const race=state.race;
  if(!g.opp)g.opp=RACES.find(r=>r!==race);
  if(!g.roles)g.roles=['DAMAGE DEALER','TANK'];if(!g.favMode)g.favMode='prefer';if(!g.divMode)g.divMode='prefer';if(g.minPct==null)g.minPct=95;if(g.useCol==null)g.useCol=true;if(g.allFac==null)g.allFac=false;
  if(g.oppFac&&!DB.races[g.opp].faction_cards[g.oppFac])g.oppFac='';return g;}

    ${(()=>{const nf=Object.keys(R.units).filter(isFav).length;return `<label class="field"><span>Unités favorites ★ (${nf})</span><select id="g-fav" data-act="gen" data-v="favMode" ${nf?'':'disabled'}><option value="prefer" ${g.favMode==='prefer'?'selected':''}>Privilégier</option><option value="force" ${g.favMode==='force'?'selected':''}>Inclure en priorité</option><option value="ignore" ${g.favMode==='ignore'?'selected':''}>Ignorer</option></select></label>`;})()}

        ${x.sy.creepSrc||x.sy.onCreepN?`<div class="tags">Creep : ${+x.sy.creepSrc.toFixed(1)} source${x.sy.creepSrc>1?'s':''} (couverture ${Math.round(x.sy.creepLevel*100)} %), ${x.sy.onCreepN} élément${x.sy.onCreepN>1?'s':''} avec bonus ON CREEP${x.creepB?` · bonus +${Math.round(x.creepB*100)} %`:''}</div>`:''}
        ${x.sy.stimN?`<div class="tags">Stimpack : ${x.sy.stimN} unité${x.sy.stimN>1?'s':''}, dégâts auto-infligés ${+x.sy.selfDmg.toFixed(1)} PV/round, soins ${+x.sy.healed.toFixed(1)} PV/round${x.sy.sustain<1?` (compensés à ${Math.round(x.sy.sustain*100)} %)`:' (compensés)'}</div>`:''}
      </div></div>
      <ul class="tac-list">${x.L.creep?`<li><span class="nm">${esc(nm(x.L.creep,R.creep_cards[x.L.creep]))}</span><span class="tags">Creep</span></li>`:''}${x.L.tactical.map(k=>`<li><span class="nm">${esc(nm(k,R.tactical_cards[k]))}</span><span class="num">${R.tactical_cards[k].gas_cost} gas</span></li>`).join('')}</ul>
      <ul class="tac-list">${x.per.slice().sort((a,b)=>b.o-a.o).map(p=>`<li><span class="nm">${p.fav?'<span class="star on" aria-label="favorite">★</span> ':''}${esc(nm(p.e.key,p.u))} ×${p.c.models}${p.e.up.length?`<br><span class="tags">${esc(p.e.up.map(k=>abName(k,p.u.upgrades[k])).join(', '))}</span>`:''}</span><span class="tags">${esc(p.u.combat_role.split(' ').map(cap).join(' '))}</span></li>`).join('')}</ul>
      <div class="fc"><button class="btn primary" data-act="gen-load" data-v="${i}">Charger dans la liste</button></div></article>`;}).join('')+`</div>`;
  return h;

function scoreRow(l,v,t){return `<div class="srow" title="${esc(t)}"><span class="lbl">${l}</span><div class="bar"><i style="width:${Math.round(v*100)}%"></i></div><span class="num">${Math.round(v*100)}</span></div>`;}
function runGen(){if(genBusy)return;genBusy=true;render();
  setTimeout(()=>{try{const g=genOpts();genRes=generate({opp:g.opp,oppFac:g.oppFac,allFac:g.allFac,minPct:g.minPct,roles:g.roles,useCol:g.useCol,favMode:g.favMode,divMode:g.divMode});}catch(e){genRes=null;console.error(e);}genBusy=false;render();},30);}
function loadGen(i){const x=genRes&&genRes.lists[i];if(!x)return;const race=genRes.race;
  state.faction[race]=x.fk;state.lists[race]={units:x.L.units.map(e=>({uid:state.nextUid++,key:e.key,comp:e.comp,up:e.up.slice()})),tactical:x.L.tactical.slice(),creep:x.L.creep};

/* ---------- main render ---------- */
function render(){renderHeader();if(state.view!=='list')lastC=null;document.getElementById('main').innerHTML=state.view==='list'?renderList():state.view==='gen'?renderGen():renderCollection();save();updateBudget();applyHd();}

/* ---------- mutations ---------- */
const curList=()=>state.lists[state.race];
function touch(){curList().example=false;}
function findUnit(uid){return curList().units.find(e=>e.uid===+uid);}

document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]');if(!b||b.tagName==='SELECT'||b.tagName==='INPUT')return;
  const a=b.dataset.act,v=b.dataset.v,L=curList();
  if(a==='tac-info'){openTac(b.dataset.k);return;}
  if(a==='plan'){openPlan();return;}
  switch(a){
    case 'race':if(topEl().classList.contains('compact')&&v===state.race){toggleHd();return;}state.race=v;break;
    case 'view':state.view=v;break;
    case 'add-unit':L.units.push({uid:state.nextUid++,key:v,comp:0,up:[]});touch();break;
    case 'add-tac':L.tactical.push(v);touch();break;
    case 'rm-tac':L.tactical.splice(+v,1);touch();break;
    case 'rm-unit':L.units=L.units.filter(e=>e.uid!==+b.dataset.uid);openSheets.delete(+b.dataset.uid);touch();break;
    case 'sheet':{const u=+b.dataset.uid;openSheets.has(u)?openSheets.delete(u):openSheets.add(u);break;}
    case 'clear':
      if(!b.dataset.armed){b.dataset.armed='1';b.textContent='Confirmer : tout retirer';setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent='Vider la liste';}},3500);return;}
      // fallthrough
    case 'clear-now':state.lists[state.race]={units:[],tactical:[],creep:null};openSheets.clear();break;
    case 'fiche':openFiche();return;
    case 'recap':openExport('Récapitulatif de la liste','Texte à coller dans un message ou un document.',recapText(),null);return;
    case 'export-list':openExport('Exporter la liste',"Gardez ce fichier pour recharger la liste plus tard avec « Importer ». Si le téléchargement ne démarre pas, copiez le texte dans un fichier .json.",JSON.stringify(listFile(),null,2),`liste-${state.race.toLowerCase()}.json`);return;
    case 'export-col':openExport('Exporter ma collection',"Ce fichier est votre sauvegarde de référence : le navigateur garde une copie automatique, mais elle peut être effacée. Si le téléchargement ne démarre pas, copiez le texte dans un fichier .json.",JSON.stringify(colFile(),null,2),'collection-sctmg.json');return;
    case 'import':openImport();return;
    case 'fav':{const f=state.collection.favorites||(state.collection.favorites={});if(f[v])delete f[v];else f[v]=true;break;}
    case 'gen-run':runGen();return;
    case 'gen-load':loadGen(+v);return;
    case 'col-step':{const bag=state.collection.units;const n=setCol(b.dataset.t,b.dataset.v,(bag[b.dataset.v]||0)+(+b.dataset.d));const inp=document.getElementById(`col-${b.dataset.t}-${b.dataset.v}`);if(inp)inp.value=n;refreshColTotals();return;}
    default:return;
  }
  render();
});
document.addEventListener('change',ev=>{
  const t=ev.target,a=t.dataset&&t.dataset.act;if(!a)return;const L=curList();
  switch(a){
    case 'faction':state.faction[state.race]=t.value;break;
    case 'scale':state.scale=t.value;break;
    case 'custom':state.custom=Math.max(2001,Math.round(+t.value)||2001);break;
    case 'mis':{const raw=String(t.value).replace(/[^0-9]/g,'');state.mission[t.dataset.v]=raw===''?null:Math.min(99,+raw);break;}
    case 'creep':L.creep=t.value||null;touch();break;
    case 'comp':{const e=findUnit(t.dataset.uid);if(e){e.comp=+t.value;touch();}break;}
    case 'up':{const e=findUnit(t.dataset.uid);if(!e)return;const u=DB.races[state.race].units[e.key],k=t.dataset.v;
      if(t.checked){if(!e.up.includes(k))e.up.push(k);}else e.up=e.up.filter(x=>x!==k&&(u.upgrades[x]||{}).requires_upgrade!==k);touch();break;}
    case 'mode':state.mode=t.value;break;
    case 'gen':{const g=genOpts(),k=t.dataset.v;if(k==='useCol')g.useCol=t.checked;else if(k==='allFac')g.allFac=t.value==='1';else if(k==='minPct')g.minPct=+t.value;else{g[k]=t.value;if(k==='opp')g.oppFac='';}break;}
    case 'gen-role':{const g=genOpts();g.roles=t.checked?[...new Set([...g.roles,t.dataset.v])]:g.roles.filter(r=>r!==t.dataset.v);break;}
    case 'col':{const n=setCol(t.dataset.t,t.dataset.v,+String(t.value).replace(/[^0-9]/g,''));t.value=n;refreshColTotals();return;}
    default:return;
  }

});

function listFile(){const L=curList(),R=DB.races[state.race];return {type:'sctmg-list',format_version:1,database_version:DB.metadata.database_version,saved:new Date().toISOString(),race:state.race,faction:state.faction[state.race],scale:state.scale,mineral_limit:limitOf(),mission:{round1:state.mission.r1,per_round:state.mission.inc},creep:L.creep,tactical:L.tactical.slice(),units:L.units.map(e=>{const u=R.units[e.key];return {key:e.key,models:(u.composition_options[e.comp]||u.composition_options[0]).models,upgrades:e.up.slice()};})};}
function colFile(){return {type:'sctmg-collection',format_version:1,families_version:FAM.version,database_version:DB.metadata.database_version,saved:new Date().toISOString(),mode:state.mode,units:state.collection.units,favorites:Object.keys(state.collection.favorites||{})};}
function recapText(){
  const c=compute(),{R,L,F,race}=c;const lines=[];
  lines.push(`StarCraft TMG · ${RLABEL[race]} · ${nm(c.fk,F)} · ${SCALEFR[state.scale]||state.scale} ${c.lim}`);
  lines.push(`Minéraux ${c.min}/${c.lim} · Gas ${c.gas}/${c.gasCap}`);
  lines.push(`Ressource : ${c.res} ${resName(race)} par round (cartes)`);
  lines.push(state.mission.r1!=null?`Supply par tour (mission) : ${state.mission.r1} au tour 1, +${state.mission.inc||0} par tour suivant (${missionTxt()})`:'Supply par tour (mission) : non renseigné');
  lines.push(`Supply Pool : ${c.pool}${c.poolNotes.length?' ('+c.poolNotes.join(' ; ')+')':''}`);
  lines.push(`Slots : ${SLOTS.filter(s=>c.avail[s]||c.used[s]).map(s=>`${SLOTFR[s]} ${c.used[s]}/${c.avail[s]}`).join(', ')}`);
  if(L.creep&&R.creep_cards[L.creep])lines.push(`Creep Card : ${nm(L.creep,R.creep_cards[L.creep])} (${R.creep_cards[L.creep].gas_cost} gas)`);
  {const sm=activeSummons(race,c.fk,L);if(sm.length)lines.push(`Invocations : ${sm.map(x=>nm(x.k,x.s)+' (via '+srcTxt(race,x)+')').join(', ')}`);}
  lines.push(`Tactical Cards : ${L.tactical.map(k=>`${nm(k,R.tactical_cards[k])} (${R.tactical_cards[k].gas_cost})`).join(', ')||'aucune'}`);
  lines.push('Unités :');
  c.rows.forEach(r=>lines.push(`- ${nm(r.e.key,r.u)} ×${r.c.models} [${SLOTFR[r.u.army_slot]}, supply ${r.c.supply_value}] ${r.cost} min${r.e.up.length?' · '+r.e.up.map(k=>abName(k,r.u.upgrades[k])+(r.u.upgrades[k].specialist?' (1 fig.)':'')).join(', '):''}`));
  const errs=c.issues.filter(i=>i[0]==='err');lines.push(errs.length?`⚠ ${errs.length} problème(s) de règles`:'Liste légale');
  return lines.join('\n');
}
function importData(txt){
  let d;try{d=JSON.parse(txt);}catch(e){return ['err',"Ce texte n'est pas un JSON valide. Vérifiez que tout le contenu du fichier a été collé."];}
  if(d&&d.type==='sctmg-collection'){
    const clean=o=>{const r={};Object.entries(o||{}).forEach(([k,v])=>{const n=Math.max(0,Math.round(+v)||0);if(n)r[k]=n;});return r;};

function ficheHost(){let h=document.getElementById('fiche-host');if(!h){h=document.createElement('div');h.id='fiche-host';h.style.cssText='position:fixed;left:-10000px;top:0;z-index:-1';document.body.appendChild(h);
  const st=document.createElement('style');st.textContent=FICHE_CSS;document.head.appendChild(st);}return h;}
function fichePage(blocks,acc,small){const d=document.createElement('div');d.className='fiche'+(small?' small':'');d.style.setProperty('--fa',acc);d.innerHTML=blocks.map(x=>`<div class="blk">${x}</div>`).join('');return d;}
/* découpe en pages A4 (680 × 962 px, ratio A4) : mesure réelle page par page ; un bloc trop haut pour une page est scindé entre ses capacités */
const PAGE_H=962;
function fichePaginate(blocks,acc,small){const host=ficheHost();host.innerHTML='';const pages=[];let cur=[];
  const page=fichePage([],acc,small);host.appendChild(page);
  const fits=()=>page.offsetHeight<=PAGE_H-36;
  const queue=blocks.slice();
  while(queue.length){const b=queue.shift();const w=document.createElement('div');w.className='blk';w.innerHTML=b;page.appendChild(w);
    if(fits()){cur.push(b);continue;}
    page.removeChild(w);
    if(cur.length){pages.push(cur);cur=[];page.innerHTML='';queue.unshift(b);continue;}
    // bloc seul trop haut : le scinder
    const parts=splitBlock(b,page);if(parts){queue.unshift(...parts);continue;}
    cur.push(b);pages.push(cur);cur=[];page.innerHTML='';}
  if(cur.length)pages.push(cur);host.innerHTML='';return pages;}
function splitBlock(b,page){const w=document.createElement('div');w.className='blk';w.innerHTML=b;const lis=[...w.querySelectorAll('ul.ab > li, .cc > p')];if(lis.length<2)return null;
  const title=(w.querySelector('h3')||w.querySelector('.cch b')||{}).textContent||'';
  page.appendChild(w);const rest=[];
  while(page.offsetHeight>PAGE_H-36&&lis.length>1){const li=lis.pop();rest.unshift(li.outerHTML);li.remove();}
  const first=w.innerHTML;page.removeChild(w);if(!rest.length)return null;
  const cont=`<div class="ub"><div class="uh"><h3>${esc(title.replace(/\s+/g,' ').trim())} <span>(suite)</span></h3></div><ul class="ab">${rest.map(x=>x.startsWith('<p')?x.replace(/^<p/,'<li').replace(/<\/p>$/,'</li>'):x).join('')}</ul></div>`;
  return [first,cont];}
async function ficheCanvas(blocks,acc,small){return domToCanvas(fichePage(blocks,acc,small));}
async function exportFiche(kind,mode,opts){opts=opts||{};
  const {blocks,acc,race}=ficheBlocks(mode,opts);const sm=!!opts.small;const base=`liste-${race.toLowerCase()}-${mode==='detail'?'aide-de-jeu':'resume'}`;
  if(kind==='png'){const cv=await ficheCanvas(blocks,acc,sm);const blob=await new Promise(r=>cv.toBlob(r,'image/png'));return saveBlob(base+'.png',blob);}
  const pages=fichePaginate(blocks,acc,sm);const cvs=[];
  for(const pg of pages){const el=fichePage(pg,acc,sm);el.style.height=PAGE_H+'px';cvs.push(await domToCanvas(el));}
  return saveBlob(base+'.pdf',buildPdf(cvs));
}

function ficheOpts(){return {compactCards:document.getElementById('fopt-cards').checked,small:document.getElementById('fopt-small').checked,plan:document.getElementById('fopt-plan').checked};}
function renderFichePreview(){const mode=document.querySelector('input[name="fmode"]:checked').value;const o=ficheOpts();document.getElementById('fov-opts').hidden=mode!=='detail';
  const {blocks,acc}=ficheBlocks(mode,o);const pv=document.getElementById('fov-prev');pv.innerHTML='';ficheHost();const pg=fichePage(blocks,acc,mode==='detail'&&o.small);pv.appendChild(pg);
  if(mode==='detail'){const n=fichePaginate(blocks,acc,o.small).length;document.getElementById('fov-pages').textContent=`${n} page${n>1?'s':''} A4`;}
  document.getElementById('fov-msg').textContent='';document.getElementById('fov-msg').className='msg';}

  try{const o=ficheOpts();await exportFiche(kind,mode,mode==='detail'?o:{plan:o.plan});m.className='msg ok';m.textContent=kind==='pdf'?'PDF prêt.':'Image prête.';}
  catch(e){const c=e&&e.code;m.className='msg '+(c==='declined'?'warn':'err');
    m.textContent=c==='declined'?'Enregistrement annulé.':c==='rate_limited'?'Une demande est déjà ouverte, réessayez dans un instant.':'Export impossible ici. Réessayez, ou utilisez « Copier le récap ».';}

/* ---------- bandeau repliable, barre de budget ----------
   Ordinateur : bouton ▴/▾ (mémorisé) + masquage du bandeau au défilement.
   Téléphone : tout en haut, bandeau déplié ; dès qu'on défile, bandeau replié fixé en haut + barre de budget, sans va-et-vient. */
const HDK='sctmg-builder-hd', isPhone=()=>matchMedia('(max-width:700px)').matches;
let hdCompact=(()=>{try{const v=localStorage.getItem(HDK);if(v)return v==='1';}catch(e){}return false;})();
let lastC=null, lastPhone=isPhone(), floatOn=false, manualOpen=false, topCompact=false;
function topEl(){return document.querySelector('.top');}
function isCompact(){return isPhone()?(floatOn?!manualOpen:topCompact):hdCompact;}
function applyHd(){const t=topEl(),b=document.getElementById('hdTog');if(!t||!b)return;const c=isCompact();
  t.classList.toggle('compact',c);t.classList.toggle('floating',isPhone()&&floatOn);
  b.textContent=c?'▾':'▴';b.setAttribute('aria-expanded',c?'false':'true');b.setAttribute('aria-label',c?'Afficher tout le bandeau':'Réduire le bandeau');b.title=b.getAttribute('aria-label');syncHd();}
function toggleHd(){if(isPhone()){if(floatOn)manualOpen=!manualOpen;else topCompact=!topCompact;}
  else{hdCompact=!hdCompact;try{localStorage.setItem(HDK,hdCompact?'1':'0');}catch(e){}topEl().classList.remove('hid');}applyHd();}
function setFloat(on){const t=topEl(),sp=document.getElementById('hdSpacer');if(!t||on===floatOn)return;
  if(sp)sp.style.height=on?(t.offsetHeight+(parseFloat(getComputedStyle(t.parentElement).rowGap)||0))+'px':'0px';floatOn=on;manualOpen=false;topCompact=false;applyHd();}
function syncHd(){const t=topEl();if(!t)return;const h=t.classList.contains('hid')?0:Math.max(0,t.getBoundingClientRect().bottom);
  document.documentElement.style.setProperty('--hdH',h+'px');syncBudget();}
function syncBudget(){const bd=document.getElementById('budget'),st=document.querySelector('.strip');if(!bd)return;
  if(state.view!=='list'||!st||!lastC){bd.hidden=true;return;}
  if(isPhone()){bd.hidden=!floatOn;return;}
  const hdH=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hdH'))||0;
  const ref=st.querySelector('.cell')||st;bd.hidden=!(ref.getBoundingClientRect().bottom<hdH+4);}
function updateBudget(){const bd=document.getElementById('budget');if(!bd)return;const c=lastC;if(state.view!=='list'||!c){bd.hidden=true;return;}
  const errs=c.issues.filter(i=>i[0]==='err').length,warns=c.issues.filter(i=>i[0]==='warn').length;
  const st=errs?`<span class="pill err">${errs} problème${errs>1?'s':''}</span>`:warns?`<span class="pill warn">Légale</span>`:`<span class="pill ok">Légale</span>`;
  const m=(l,u,lim)=>`<span class="bud-m"><span class="lbl">${l}</span><b class="${u>lim?'over':''}">${u}</b>/${lim}<span class="bar ${u>lim?'over':''}"><i style="width:${Math.min(100,lim?u/lim*100:0)}%"></i></span></span>`;
  const slots=SLOTS.filter(s=>c.avail[s]||c.used[s]).map(s=>`<span class="slot ${c.used[s]>c.avail[s]?'over':c.used[s]===c.avail[s]?'full':''}"><b>${SLOTFR[s]}</b>${c.used[s]}/${c.avail[s]}</span>`).join('');
  bd.innerHTML=`<button class="in" type="button" id="budJump" aria-label="Budget de la liste : afficher le détail">${m('Min.',c.min,c.lim)}${m('Gas',c.gas,c.gasCap)}<span class="slots">${slots}</span><span class="bud-m"><span class="lbl">Supply</span><b>${c.pool}</b></span>${st}</button>`;
  syncBudget();}
function actionsHTML(btns){return isPhone()?`<details class="actmenu"><summary class="btn">Actions ▾</summary><div class="actlist">${btns}</div></details>`:btns;}
let lastY=scrollY,ticking=false;
addEventListener('scroll',()=>{if(ticking)return;ticking=true;requestAnimationFrame(()=>{ticking=false;const y=scrollY,t=topEl();if(!t)return;
  if(isPhone()){t.classList.remove('hid');const want=floatOn?y>4:y>16;
    if(want!==floatOn)setFloat(want);else if(floatOn&&manualOpen&&Math.abs(y-lastY)>10){manualOpen=false;applyHd();}}
  else{if(y>lastY+6&&y>90)t.classList.add('hid');else if(y<lastY-6||y<40)t.classList.remove('hid');}
  lastY=y;syncHd();});},{passive:true});
addEventListener('resize',()=>{const p=isPhone();if(p!==lastPhone){lastPhone=p;const sp=document.getElementById('hdSpacer');if(sp)sp.style.height='0px';floatOn=false;manualOpen=false;topCompact=false;topEl().classList.remove('hid');render();}syncHd();});
document.addEventListener('transitionend',e=>{if(e.target===topEl())syncHd();});
document.addEventListener('click',e=>{
  if(e.target.closest('#hdTog')){toggleHd();return;}
  if(e.target.closest('#budJump')){const s=document.querySelector('.strip');if(s){const hdH=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hdH'))||0;scrollTo({top:Math.max(0,scrollY+s.getBoundingClientRect().top-hdH-8),behavior:'smooth'});}return;}
  const a=e.target.closest('.actmenu [data-act]');if(a&&a.dataset.act!=='clear'){const d=a.closest('details');if(d)d.open=false;}
  if(!e.target.closest('.actmenu'))document.querySelectorAll('details.actmenu[open]').forEach(d=>d.open=false);
},true);

/* ================= Plan de jeu (commun builder + aide de jeu) =================
   buildPlanHTML(ctx) → HTML. Tout est déduit des cartes (DB) et des règles du livre :
   aucune règle ou effet n'est inventé ; les recommandations sont des heuristiques signalées comme telles. */
var PLAN = (function(){
  const E = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const NM = (k, o) => (o && o.display_name) || String(k).replace(/_/g, ' ').replace(/\b([a-z])/g, m => m.toUpperCase());
  const ROLE = {'DAMAGE DEALER':'Dégâts', TANK:'Tank', TACTICIAN:'Tacticien', LIFESAVER:'Soutien'};
  const PHASE = {MOVEMENT:'Mouvement', ASSAULT:'Assaut', COMBAT:'Combat', ANY:'Toute phase', SCORING:'Score'};
  const TYPE = {ACTIVE:'Active', PASSIVE:'Passive', REACTION:'Réaction'};
  const DEFAULTS = {Skirmish:{start:3, inc:1, rounds:5}, Standard:{start:6, inc:2, rounds:5}, Grand_Offensive:{start:6, inc:2, rounds:5}};
  const SCALEFR = {Skirmish:'Skirmish', Standard:'Standard', Grand_Offensive:'Grand Offensive'};

  function supplyFor(def, n){ if (!n) return 0; const p = def.supply_profile || []; for (const b of p) if (n >= b.models_min && n <= b.models_max) return b.supply; return p.length ? p[p.length-1].supply : 0; }
  function weaponsOf(def, ups){
    const out = [];
    Object.entries(def.weapons || {}).forEach(([k, w]) => {
      if (w.requires_upgrade && !ups.includes(w.requires_upgrade)) return;
      const rep = ups.map(x => [x, (def.upgrades||{})[x]]).find(([x, up]) => up && up.weapon_replacement && up.for_weapon === k && !up.specialist);
      out.push(rep ? Object.assign({name: NM(rep[0], rep[1]), phase: rep[1].phase || w.phase}, rep[1].weapon_replacement) : Object.assign({name: NM(k)}, w));
    });
    ups.forEach(x => { const up = (def.upgrades||{})[x]; if (!up) return;
      if (up.weapon_replacement && up.specialist) out.push(Object.assign({name: NM(x, up), phase: up.phase || 'ASSAULT', one: true}, up.weapon_replacement));
      if (up.weapon_added) out.push(Object.assign({name: NM(x, up), phase: up.phase || 'ASSAULT', one: !!up.specialist}, up.weapon_added)); });
    return out;
  }
  function abilitiesOf(def, ups){
    const out = Object.entries(def.abilities || {}).map(([k, a]) => Object.assign({key:k, name: NM(k, a)}, a));
    ups.forEach(x => { const up = (def.upgrades||{})[x]; if (up && up.upgrade_kind === 'ABILITY') out.push({key:x, name: NM(x, up), type: up.type, phase: up.phase, cost: up.cost, text: up.text, builder_effect: up.builder_effect}); });
    return out;
  }
  const costN = a => a && a.cost ? Object.values(a.cost)[0] || 0 : 0;
  const isTpl = w => /\b(BT|FT)\b/.test(String(w.roa) + ' ' + String(w.s_dice));
  const kwHas = (w, k) => (w.keywords || []).some(x => String(x).toUpperCase().startsWith(k));
  const short = (t, n) => { t = String(t || '').replace(/\s+/g, ' ').trim(); if (t.length <= n) return t; const cut = t.slice(0, n); const i = Math.max(cut.lastIndexOf('. '), cut.lastIndexOf(' ')); return cut.slice(0, i > n * 0.6 ? i : n).replace(/[ ,;:.]+$/, '') + '…'; };

  /* ---------- analyse d'une unité ---------- */
  function profile(u){
    const d = u.def, ws = weaponsOf(d, u.upgrades), tags = d.combat_tags || [];
    const fly = tags.includes('Flying'), ranged = ws.filter(w => w.phase === 'ASSAULT'), melee = ws.filter(w => w.phase === 'COMBAT');
    const rng = Math.max(0, ...ranged.map(w => typeof w.rng === 'number' ? w.rng : 0));
    const aa = ranged.some(w => /^(all|flying)$/i.test(w.target || ''));
    const ag = ranged.some(w => /^(all|ground)$/i.test(w.target || ''));
    const surge = [...new Set(ranged.concat(melee).flatMap(w => [].concat(w.surge_type || [])).filter(Boolean))];
    const tpl = ranged.some(isTpl), pierce = ws.some(w => kwHas(w, 'PIERCE')), indirect = ws.some(w => kwHas(w, 'INDIRECT'));
    const canCharge = !fly && melee.some(w => (parseInt(w.roa, 10) || 0) >= 1);
    const roaMax = a => Math.max(0, ...a.map(w => parseInt(w.roa, 10) || 0));
    const meleeStrong = canCharge && (roaMax(melee) >= roaMax(ranged.filter(w => !isTpl(w))) || melee.some(w => w.surge_type || kwHas(w, 'PIERCE')));
    const sup = supplyFor(d, u.models), sp = d.stats.speed;
    return {u, d, ws, tags, fly, ranged, melee, rng, aa, ag, surge, tpl, pierce, indirect, canCharge, meleeStrong, sup, sp, role: d.combat_role, abs: abilitiesOf(d, u.upgrades)};
  }
  function strengths(p){
    const s = [];
    if (p.rng) s.push(`tir ${p.rng}"`);
    if (p.aa) s.push('anti-aérien');
    if (p.surge.length) s.push('Surge ' + p.surge.join('/'));
    if (p.tpl) s.push('gabarit');
    if (p.pierce) s.push('PIERCE');
    if (p.indirect) s.push('tir indirect');
    if (p.meleeStrong) s.push(`corps à corps (charge ${p.sp + 1}–${p.sp + 6}")`);
    if (p.fly) s.push('volant');
    return s;
  }
  function advice(p){
    const t = [];
    if (p.fly) t.push('Harcèle et chasse les cibles isolées. Un volant ne conteste ni ne contrôle les marqueurs.');
    else if (p.role === 'TANK') t.push('Tiens les marqueurs exposés et encaisse : son supply pèse lourd sur un marqueur.');
    else if (p.role === 'LIFESAVER') t.push('Reste près des unités qu’elle soutient ; évite la ligne de front.');
    else if (p.role === 'TACTICIAN') t.push('Joue-la pour ses capacités : place-la là où elles touchent le plus d’unités.');
    if (p.role === 'DAMAGE DEALER' || (!p.fly && p.role !== 'TANK')){
      if (p.rng >= 12 && !p.meleeStrong) t.push(`Reste à distance (portée ${p.rng}") derrière un couvert et tire chaque round.`);
      else if (p.rng && p.meleeStrong) t.push(`Tire en approche, puis charge quand la cible est à ${p.sp + 3}" ou moins (2 chances sur 3).`);
      else if (p.rng && p.rng < 12) t.push(`Portée courte (${p.rng}") : avance de couvert en couvert avant de tirer.`);
      else if (!p.rng && p.meleeStrong) t.push(`Avance à couvert et charge : finis ton Move à ${p.sp + 3}" de la cible pour 2 chances sur 3.`);
    }
    if (!p.fly && p.sup <= 1) t.push('Peu chère en supply : idéale pour contester un marqueur tôt.');
    if (p.tpl) t.push('Vise les unités groupées ou plusieurs unités serrées autour d’un marqueur (Spillover).');
    return t.join(' ');
  }

  /* ---------- ordre d'entrée ---------- */
  function deployment(P, M){
    const list = P.filter(p => !p.u.summoned).map(p => p);
    const left = list.slice(), rounds = [];
    let onTable = 0;
    for (let r = 1; r <= M.rounds; r++){
      const last = r === M.rounds, pool = last ? Infinity : M.start + (r - 1) * M.inc;
      let av = pool === Infinity ? Infinity : pool - onTable;
      const order = left.slice().sort((a, b) => r === 1
        ? (a.sup - b.sup) || ((a.fly ? 1 : 0) - (b.fly ? 1 : 0)) || (b.sp - a.sp)
        : (b.sup - a.sup) || ((a.fly ? 1 : 0) - (b.fly ? 1 : 0)));
      const ins = [];
      order.forEach(p => { if (p.sup <= av){ ins.push(p); av -= p.sup; onTable += p.sup; left.splice(left.indexOf(p), 1); } });
      let why = '';
      if (r === 1) why = ins.length ? 'Unités peu chères d’abord : contester les marqueurs tôt et voir ce que fait l’adversaire (conseil du livre).' : 'Supply trop faible : aucune unité n’entre au round 1.';
      else if (last) why = ins.length ? 'Dernier round : supply illimité, tout ce qui reste entre. Une unité encore en réserve au score compte comme détruite.' : 'Tout est déjà sur la table.';
      else if (!ins.length && !left.length) why = 'Toute l’armée est déjà sur la table : le supply en plus permet de remplacer les pertes (rien d’autre à faire entrer).';
      else why = ins.length ? `Le supply monte à ${pool} : place pour ${ins.map(p => p.u.name).slice(0, 2).join(' et ')}.` : `Supply ${pool} : rien ne rentre encore, garde la réserve ou attends des pertes.`;
      rounds.push({r, pool, ins, onTable, why});
    }
    return rounds;
  }

  /* ---------- rendu ---------- */
  function build(ctx){
    const T = ctx.cls || {}, tbl = T.table || 'pt', ul = T.list || 'pl-list';
    const fr = ctx.fr || (() => null);
    const P = ctx.units.map(profile);
    const M = ctx.mission;
    const res = ctx.resName || 'ressource', resTot = ctx.resTotal || 0;
    const secs = [];
    const H = (t, body) => secs.push(`<section class="plan-sec"><h3>${E(t)}</h3>${body}</section>`);

    /* en bref */
    const holders = P.filter(p => !p.fly && !p.u.summoned);
    const supTot = P.filter(p => !p.u.summoned).reduce((a, p) => a + p.sup, 0);
    H('En bref', `<ul class="${ul}">
      <li><b>Mission</b> : ${M.isDefault ? `valeurs par défaut ${E(SCALEFR[M.scale] || M.scale || '')} (supply ${M.start}, +${M.inc} par round, ${M.rounds} rounds). Renseigne ta Mission Card pour affiner.` : `${M.name ? E(M.name) + ' · ' : ''}supply ${M.start} au round 1, +${M.inc} par round, ${M.rounds} rounds.`}</li>
      <li><b>Armée</b> : ${P.length} unités, supply total ${supTot} · ${holders.length} unités au sol pour tenir les marqueurs.</li>
      <li><b>Ressource</b> : ${resTot} ${E(res)} par round (Faction Card + Tactical Cards).</li></ul>`);

    /* rôles */
    H('Rôle de chaque unité', `<table class="${tbl}"><thead><tr><th>Unité</th><th>Rôle</th><th>Atouts</th><th>Ce qu’elle doit faire</th></tr></thead><tbody>${
      P.map(p => `<tr><td><b>${E(p.u.name)}</b><br><i>${p.u.models} fig. · supply ${p.sup}${p.u.summoned ? ' · invoquée' : ''}</i></td><td>${E(ROLE[p.role] || p.role || '–')}</td><td>${E(strengths(p).join(' · ') || '–')}</td><td>${E(advice(p) || 'Polyvalente : adapte-la au besoin du round.')}</td></tr>`).join('')}</tbody></table>`);

    /* déploiement */
    const D = deployment(P, M);
    H('Ordre d’entrée en jeu', `<table class="${tbl}"><thead><tr><th style="width:11%">Round</th><th style="width:19%">Supply disponible</th><th>Entrent</th><th>Pourquoi</th></tr></thead><tbody>${
      D.map(x => `<tr><td data-l="Round "><b>${x.r}</b></td><td data-l="Supply disponible : ">${x.pool === Infinity ? 'illimité' : x.pool}</td><td data-l="Entrent : ">${x.ins.length ? x.ins.map(p => `${E(p.u.name)} <i>(${p.sup})</i>`).join(', ') : 'aucune'}</td><td>${E(x.why)}</td></tr>`).join('')}</tbody></table>
      <p class="pl-note">Calcul sans pertes : chaque unité détruite libère du supply et permet d’entrer plus tôt. Les invocations n’entrent pas par ce plan.</p>`);

    /* capacités */
    const all = [];
    P.forEach(p => p.abs.forEach(a => all.push({src: p.u.name, a, p})));
    (ctx.cards || []).forEach(c => Object.entries(c.def.abilities || {}).forEach(([k, a]) => all.push({src: NM(c.key, c.def), a: Object.assign({key:k, name: NM(k, a)}, a), card: true})));
    const usable = all.filter(x => x.a.type && x.a.type !== 'PASSIVE');
    const passive = all.filter(x => x.a.type === 'PASSIVE');
    const byPh = {};
    usable.forEach(x => (byPh[x.a.phase || 'ANY'] = byPh[x.a.phase || 'ANY'] || []).push(x));
    const order = ['MOVEMENT', 'ASSAULT', 'COMBAT', 'ANY'].concat(Object.keys(byPh).filter(k => !['MOVEMENT','ASSAULT','COMBAT','ANY'].includes(k)));
    let capH = order.filter(k => byPh[k]).map(k => `<p class="pl-ph">${E(PHASE[k] || k)}</p><ul class="${ul}">${byPh[k].map(x => `<li><b>${E(x.a.name)}</b> <i>(${E(x.src)} · ${E(TYPE[x.a.type] || x.a.type)}${costN(x.a) ? ' · ' + costN(x.a) + ' ' + E(res) : ' · gratuite'})</i> — ${E(short(fr(x.a.text) || x.a.text, 170))}</li>`).join('')}</ul>`).join('');
    /* budget par round, d'après l'ordre d'entrée */
    const onAt = r => new Set(D.filter(x => x.r <= r).flatMap(x => x.ins.map(p => p.u.name)));
    const budget = D.map(x => { const on = onAt(x.r); const need = usable.filter(y => costN(y.a) > 0 && (y.card || on.has(y.src))).reduce((a, y) => a + costN(y.a), 0); return {r: x.r, need}; });
    const over = budget.filter(b => b.need > resTot);
    capH += `<p class="pl-ph">Budget de ${E(res)}</p><ul class="${ul}"><li>Tu génères <b>${resTot} ${E(res)}</b> par round. Toutes tes capacités payantes coûtent ${budget.map(b => `${b.need} au round ${b.r}`).join(', ')} si tu les utilises toutes une fois.</li>${
      over.length ? `<li><b>Tu ne pourras pas tout payer</b> ${over.length === budget.length ? 'à aucun round' : 'dès le round ' + over[0].r} : choisis chaque round les capacités des unités qui agissent vraiment (cible à portée, charge possible). Les moins chères d’abord : ${usable.filter(y => costN(y.a) > 0).sort((a, b) => costN(a.a) - costN(b.a)).slice(0, 4).map(y => E(y.a.name) + ' (' + costN(y.a) + ')').join(', ')}.</li>` : '<li>Ton budget couvre toutes tes capacités payantes : utilise-les chaque round, la ressource non dépensée est perdue au nettoyage.</li>'}</ul>`;
    if (passive.length) capH += `<p class="pl-ph">Toujours actives (rien à payer)</p><p>${passive.map(x => `${E(x.a.name)} <i>(${E(x.src)})</i>`).join(' · ')}</p>`;
    H('Capacités à utiliser', capH || '<p>Aucune capacité active dans la liste.</p>');

    /* associations */
    const syn = [];
    const names = P.map(p => ({p, words: [p.u.name, NM(p.u.key)].map(s => s.replace(/\s*\(.*\)$/, ''))}));
    all.forEach(x => {
      const t = String(x.a.text || '');
      names.forEach(n => { if (n.p.u.name === x.src) return; if (n.words.some(w => w.length > 3 && new RegExp('\\b' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + 's?\\b', 'i').test(t))) syn.push(`<b>${E(x.a.name)}</b> (${E(x.src)}) agit avec <b>${E(n.p.u.name)}</b>.`); });
      const fm = t.match(/Friendly ((?:[A-Z][a-z]+ )*?)(Biological|Mechanical|Light|Armoured|Psionic|Ground|Flying)\b/);
      if (fm){ const tag = fm[2], who = P.filter(p => p.u.name !== x.src && p.tags.includes(tag)).map(p => p.u.name); if (who.length) syn.push(`<b>${E(x.a.name)}</b> (${E(x.src)}) cible les unités amies ${E(tag)} : ${E(who.join(', '))}.`); }
    });
    const creepNeed = all.filter(x => !x.card && /ON CREEP/.test(x.a.text || ''));
    if (creepNeed.length && (ctx.creep || []).length) syn.push(`Creep : ${E([...new Set(creepNeed.map(x => x.src))].join(', '))} gagne(nt) des effets ON CREEP. Étends le creep vers les marqueurs et les zones de combat.`);
    H('Associations utiles', syn.length ? `<ul class="${ul}">${[...new Set(syn)].slice(0, 10).map(s => `<li>${s}</li>`).join('')}</ul>` : '<p>Pas d’association directe repérée entre les cartes de la liste.</p>');

    /* points faibles */
    const weak = [];
    if (!P.some(p => p.aa)) weak.push('Aucune arme ne touche les volants : face à une armée aérienne, tu subiras sans riposter. Couvre-toi avec le décor.');
    else if (P.filter(p => p.aa).length === 1) weak.push(`Une seule unité anti-aérienne (${E(P.find(p => p.aa).u.name)}) : protège-la, c’est elle qui gère les volants.`);
    if (holders.length < 3) weak.push(`Seulement ${holders.length} unité(s) au sol pour tenir les marqueurs : choisis 2 marqueurs à tenir plutôt que de te disperser.`);
    D.filter(x => x.r === M.rounds).forEach(x => x.ins.forEach(q => weak.push(`${E(q.u.name)} (supply ${q.sup}) n’entre qu’au dernier round sans pertes : envisage une unité moins chère, ou compte sur tes pertes pour la faire entrer plus tôt.`)));
    if (!P.some(p => p.meleeStrong)) weak.push('Pas d’unité de charge : tu subis le corps à corps sans pouvoir l’imposer. Garde tes distances.');
    const sg = new Set(P.flatMap(p => p.surge));
    if (!sg.has('Armoured')) weak.push('Pas de Surge contre Armoured : les cibles blindées encaisseront tes tirs.');
    if (!sg.has('Light')) weak.push('Pas de Surge contre Light : l’infanterie légère nombreuse sera longue à réduire.');
    if (Math.max(0, ...P.map(p => p.rng)) < 12 && P.some(p => p.rng)) weak.push('Portée courte (moins de 12") : avance à couvert pour ne pas te faire tirer dessus avant de pouvoir répondre.');
    if (creepNeed.length && !(ctx.creep || []).length) weak.push('Des capacités demandent ON CREEP mais aucune Creep Card n’est choisie.');
    H('Points faibles', weak.length ? `<ul class="${ul}">${weak.map(s => `<li>${s}</li>`).join('')}</ul>` : '<p>Pas de point faible évident d’après les cartes : la partie se jouera sur le placement.</p>');

    /* conseils */
    const tips = ['Passe tôt en phase de Mouvement quand tes unités clés sont placées : tu prends le marqueur Premier joueur et tires en premier à l’Assaut (conseil du livre).'];
    if (P.some(p => p.meleeStrong)) tips.push('En phase de Combat, n’oublie pas Close Ranks : 3" pour mettre plus de figurines au contact.');
    if (P.some(p => p.rng)) tips.push('Si une unité n’a ni cible ni charge, fais un Run plutôt qu’un Hold : elle se rapproche d’un marqueur ou d’une charge (conseil du livre).');
    if (P.some(p => p.tpl)) tips.push('Ton adversaire aussi peut grouper ses unités sur un marqueur : c’est là que tes gabarits rapportent le plus.');
    if (P.some(p => p.fly)) tips.push('Tes volants ne tiennent pas les marqueurs : garde du supply au sol sur chaque marqueur que tu veux gagner.');
    tips.push('C’est le supply total à 3" qui contrôle un marqueur, pas le nombre de figurines : une grosse unité peut tenir seule.');
    H('Conseils de partie', `<ul class="${ul}">${tips.slice(0, 5).map(s => `<li>${E(s)}</li>`).join('')}</ul>`);

    (ctx.extra || []).forEach(x => H(x.title, x.html));
    return `<div class="plan">${secs.join('')}<p class="pl-foot">Plan généré à partir des cartes de ta liste et des règles du livre. Ce sont des recommandations : adapte-les au terrain et à l’adversaire.</p></div>`;
  }
  /* blocs séparés (pour la pagination du PDF du builder) */
  function sections(ctx){ const h = build(ctx); const d = document.createElement('div'); d.innerHTML = h; return [...d.querySelectorAll('.plan-sec')].map(s => s.outerHTML); }
  return {build, sections, supplyFor, DEFAULTS, NM};
})();

function planCtx(cls){const c=compute(),{R,L,F,race}=c;const cnt={};
  const units=c.rows.map(r=>{const n=nm(r.e.key,r.u);cnt[n]=(cnt[n]||0)+1;return {key:r.e.key,def:r.u,models:r.c.models,upgrades:r.e.up.slice(),name:n};});
  const seen={};units.forEach(u=>{if(cnt[u.name]>1){seen[u.name]=(seen[u.name]||0)+1;u.name+=' #'+seen[u.name];}});
  const creep=L.creep&&R.creep_cards[L.creep]?[{key:L.creep,def:R.creep_cards[L.creep]}]:[];
  const cards=[{key:c.fk,def:F}].concat(L.tactical.map(k=>({key:k,def:R.tactical_cards[k]})).filter(x=>x.def)).concat(creep);
  const D=PLAN.DEFAULTS[state.scale]||PLAN.DEFAULTS.Standard;const m=state.mission;
  const mission=m.r1!=null?{start:m.r1,inc:m.inc||0,rounds:D.rounds,isDefault:false,scale:state.scale}:Object.assign({isDefault:true,scale:state.scale},D);
  return {units,cards,creep,mission,resName:resName(race),resTotal:c.res,fr:t=>TR_ALL[t]||null,cls};}
const pov=document.getElementById('pov');
function openPlan(){const c=compute();if(!c.rows.length){document.getElementById('pov-body').innerHTML='<p class="tags">Ajoute des unités à ta liste pour obtenir un plan de jeu.</p>';}
  else document.getElementById('pov-body').innerHTML=PLAN.build(planCtx());
  document.getElementById('pov-title').textContent='Plan de jeu · '+RLABEL[state.race];pov.hidden=false;document.getElementById('pov-close').focus();}
document.getElementById('pov-close').onclick=()=>{pov.hidden=true;};
pov.addEventListener('click',e=>{if(e.target===pov)pov.hidden=true;});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!pov.hidden)pov.hidden=true;});


/* ================= mots-clés cliquables + traductions (fiches d'unité) ================= */
const GL=[["ACCESS POINT","Part of a Terrain that connects different elevation levels. Models moving through an ACCESS POINT can change their elevation.","Partie d’un décor qui relie deux niveaux d’élévation. Les figurines qui passent par un ACCESS POINT peuvent changer d’élévation."],["ACTIVE PLAYER","The player whose turn it is to act.","Le joueur dont c’est le tour d’agir."],["ANTI-EVADE (X)","When resolving an attack with this weapon against Enemy Units, the target Unit suffers a -X Modifier to its Evade Roll for this attack (Part 8.7.4, Step 4).","Quand tu résous une attaque avec cette arme contre des unités ennemies, l’unité ciblée subit un modificateur −X à son jet d’Evade pour cette attaque (partie 8.7.4, étape 4)."],["ARMY SLOT","Army Slots determine how many and what types of Units may be included in an army. Each Army Slot has a specific type: Core, Elite, Support, Air, or Hero. Every Unit occupies a number of Army Slots of its designated type equal to its starting Supply Value. The Faction Card provides the initial pool of Army Slots. Additional Army Slots are unlocked by purchasing Tactical Cards with Vespene Gas during Army Building (Part 9.1.5). Unused Army Slots are lost – they cannot be converted, exchanged, or carried forward.","Les Army Slots fixent combien d’unités, et de quels types, une armée peut inclure. Chaque Army Slot a un type : Core, Elite, Support, Air ou Hero. Chaque unité occupe autant d’Army Slots de son type que sa valeur de Supply de départ. La Faction Card donne la réserve initiale d’Army Slots. Des Army Slots supplémentaires se débloquent en achetant des Tactical Cards avec du Vespene Gas pendant la construction d’armée (partie 9.1.5). Les Army Slots non utilisés sont perdus : ils ne peuvent être ni convertis, ni échangés, ni reportés."],["AVAILABLE SUPPLY","Available Supply is the remaining Supply capacity available for new deployments. It equals the current Supply Pool minus the Total Current Supply Value of all Friendly Units on the battlefield (Part 8.3.2). A Unit may only be deployed from Reserves if its Current Supply Value is less than or equal to the Available Supply. At no point may the Total Current Supply of a player’s on-table Units exceed the Supply Pool. Units Destroyed or reduced by casualties free up Available Supply for new arrivals. In the final Round of the game, the Supply Pool becomes unlimited, and the Available Supply restrictions are lifted.","Le supply disponible est la capacité de supply qui reste pour de nouveaux déploiements. Il est égal au Supply Pool actuel moins le supply actuel total de toutes les unités amies sur le champ de bataille (partie 8.3.2). Une unité ne peut se déployer depuis la réserve que si son supply actuel est inférieur ou égal au supply disponible. Le supply actuel total des unités d’un joueur sur la table ne peut jamais dépasser le Supply Pool. Les unités détruites ou réduites par des pertes libèrent du supply disponible pour de nouvelles arrivées. Au dernier round de la partie, le Supply Pool devient illimité et les restrictions de supply disponible sont levées."],["BLOCKING TERRAIN","Any terrain piece with an Effective Size of 1 or greater. Blocking Terrain obstructs Line of Sight according to the Cover rules (Part 7.1.1). Whether a model may move through that terrain is determined separately by the movement rules, terrain Size, ACCESS POINTS, Gap Clearance, and any relevant terrain keywords.","Tout décor dont la taille effective est de 1 ou plus. Un Blocking Terrain bloque la ligne de vue selon les règles de couvert (partie 7.1.1). La possibilité de traverser ce décor se règle à part, avec les règles de mouvement, la taille du décor, les ACCESS POINTS, le Gap Clearance et les mots-clés de terrain éventuels."],["BUFF [Characteristic] (X)","The Unit gains a bonus of X to the specified characteristic until the End of the Round.\n• Target Number characteristic (e.g. Armour, Hit): reduce the value by X (easier to roll).\n• Value characteristic (e.g. Speed, RoA): increase the value by X.","L’unité gagne un bonus de X à la caractéristique indiquée jusqu’à la fin du round.\n• Caractéristique à seuil (ex. Armour, Hit) : réduis la valeur de X (plus facile à réussir).\n• Caractéristique à valeur (ex. Speed, RoA) : augmente la valeur de X."],["BULKY","This weapon cannot be used to make a Ranged Attack while the Unit is currently Engaged (Part 8.7.3).","Cette arme ne peut pas servir pour une Ranged Attack tant que l’unité est engagée (partie 8.7.3)."],["BURROWED","• BURROWED is classified as a Status.\n• When a Unit gains BURROWED Status it also gains the HIDDEN STATUS.\n• At the Start of the Round BURROWED Units gain HIDDEN Status.\n• When BURROWED Status is removed, a Unit also loses HIDDEN Status.\n• Its Size is treated as 0 for all purposes.\n• Its Current Supply Value is treated as 0 for Disengage checks.\n• A BURROWED Unit cannot Control or Contest Mission Markers (overrides Parts 6.2 and 8.9.1).\n• While BURROWED, the Unit may only perform Deploy, Move, Disengage, Run, Hold and Close Ranks actions. Performing any of these (except Hold) immediately removes the BURROWED status.\n• BURROWED Units may use Special Abilities unless stated otherwise.\n• BURROWED Units may make an Evade Roll against every attack targeting them.\n• Other models may move through a BURROWED Unit’s models, provided they do not end Within the Engagement Range of the BURROWED Unit (overrides Part 8.5.3).\n• If a BURROWED Unit is Engaged at the start of the Combat Phase, it must be Activated but cannot perform a Close Combat Attack in its BURROWED state. The Unit may perform Close Ranks as its first step, which immediately removes the BURROWED status. Once the status is removed, the Unit completes the remaining steps of the Close Combat Attack normally. If the Unit does not or cannot perform Close Ranks, it does not attack. Enemy Units Engaged with a BURROWED Unit may attack it as normal regardless of its status.","• BURROWED est un statut.\n• Quand une unité gagne le statut BURROWED, elle gagne aussi le statut HIDDEN.\n• Au début du round, les unités BURROWED gagnent le statut HIDDEN.\n• Quand le statut BURROWED est retiré, l’unité perd aussi le statut HIDDEN.\n• Sa taille compte comme 0 pour tout.\n• Son supply actuel compte comme 0 pour les vérifications de Disengage.\n• Une unité BURROWED ne peut ni contrôler ni contester de marqueur de mission (prime sur les parties 6.2 et 8.9.1).\n• Tant qu’elle est BURROWED, l’unité ne peut faire que les actions Deploy, Move, Disengage, Run, Hold et Close Ranks. Faire l’une d’elles (sauf Hold) retire immédiatement le statut BURROWED.\n• Les unités BURROWED peuvent utiliser leurs capacités spéciales, sauf mention contraire.\n• Les unités BURROWED peuvent faire un jet d’Evade contre chaque attaque qui les vise.\n• D’autres figurines peuvent traverser les figurines d’une unité BURROWED, à condition de ne pas finir dans son Engagement Range (prime sur la partie 8.5.3).\n• Si une unité BURROWED est engagée au début de la phase de Combat, elle doit être activée mais ne peut pas faire de Close Combat Attack dans cet état. Elle peut faire Close Ranks comme première étape, ce qui retire immédiatement le statut BURROWED ; elle termine ensuite normalement les autres étapes de la Close Combat Attack. Si elle ne fait pas (ou ne peut pas faire) Close Ranks, elle n’attaque pas. Les unités ennemies engagées avec une unité BURROWED peuvent l’attaquer normalement, quel que soit son statut."],["BURST FIRE Y” (X)","When making a Ranged Attack against a target Within Y” of the attacking model, increase this weapon’s RoA by X for that attack.","Quand tu fais une Ranged Attack contre une cible à Y\" ou moins de la figurine qui attaque, augmente de X la RoA de cette arme pour cette attaque."],["COMBAT TAGS","Combat Tags are keywords printed on a Unit Card that identify a Unit’s physical nature and tactical class. Type Tags: Armoured, Biological, Light, Mechanical, Psionic, Flying, and Ground.\n• Targeting: Some weapons can fire only at specific Combat Tags (e.g., “Target: Flying”).\n• Surge: A weapon’s Surge efficiency triggers only when the target has the Combat Tag listed in the weapon’s Surge Type (Part 8.7.4).\n• Bonuses: Abilities such as ANTI-EVADE (X) or PIERCE (X) often apply only against specific Combat Tags. Note: The Ground Combat Tag and the GROUND LEVEL elevation (Part 8.5.3) are distinct concepts. A Flying Unit standing on the playmat is at GROUND LEVEL but does not have the Ground Combat Tag. Throughout these rules, Ground in bold always refers to the Combat Tag. GROUND LEVEL always refers to elevation.","Les Combat Tags sont des mots-clés imprimés sur la carte d’unité qui décrivent sa nature physique et sa classe tactique. Types : Armoured, Biological, Light, Mechanical, Psionic, Flying et Ground.\n• Ciblage : certaines armes ne peuvent tirer que sur certains Combat Tags (ex. « Target: Flying »).\n• Surge : l’efficacité de Surge d’une arme ne se déclenche que si la cible a le Combat Tag indiqué dans son Surge Type (partie 8.7.4).\n• Bonus : des capacités comme ANTI-EVADE (X) ou PIERCE (X) ne s’appliquent souvent qu’à certains Combat Tags.\nNote : le Combat Tag Ground et l’élévation GROUND LEVEL sont deux choses différentes. Une unité volante posée sur le tapis est au GROUND LEVEL mais n’a pas le Combat Tag Ground. Dans les règles, Ground en gras désigne toujours le Combat Tag, GROUND LEVEL désigne toujours l’élévation."],["CONCENTRATED FIRE (X)","Attacks with this weapon may remove no more than X models as casualties. Once X models have been removed, discard any remaining Total Damage. It is not recorded as a Damage Marker and does not carry over.","Les attaques avec cette arme ne peuvent pas retirer plus de X figurines. Une fois X figurines retirées, défausse le reste du total de dégâts : il n’est pas noté sur un marqueur de dégâts et n’est pas reporté."],["CONTROLLING PLAYER","The player who commands a specific Unit, model, or Token. They make all decisions and roll all dice. Certain abilities (e.g., Neural Parasite) can transfer control; the new controller then acts in every respect as though the Unit were their own.","Le joueur qui commande une unité, une figurine ou un jeton. Il prend toutes les décisions et lance tous les dés. Certaines capacités (ex. Neural Parasite) peuvent transférer le contrôle ; le nouveau contrôleur agit alors en tout point comme si l’unité était la sienne."],["CRITICAL HIT (X)","Move X dice from the Armour Pool directly to the Damage Pool, bypassing Armour. CRITICAL HIT can never move more dice than are in the Armour Pool.","Déplace X dés du pool d’armure directement vers le pool de dégâts, sans jet d’armure. CRITICAL HIT ne peut jamais déplacer plus de dés qu’il n’y en a dans le pool d’armure."],["CURRENT SUPPLY VALUE","The Current Supply Value of a Unit is its Supply Value at this moment, based on the number of models remaining in the Unit as shown on the Supply Profile (Part 6.1). Update the Current Supply Value immediately whenever a casualty reduces the model count into a lower bracket. The Current Supply Value is referenced when checking whether a Unit may be deployed from Reserves (Part 8.3.2), when determining Mission Marker Control (Part 8.9.1), when evaluating Tactical Mass for Disengage (Part 8.5.4), and when calculating Victory Points for Supply-based scoring conditions.","Le supply actuel d’une unité est sa valeur de Supply à cet instant, selon le nombre de figurines restantes indiqué sur son profil de supply (partie 6.1). Mets-le à jour dès qu’une perte fait passer l’effectif dans une tranche inférieure. Le supply actuel sert pour savoir si une unité peut se déployer depuis la réserve (partie 8.3.2), pour le contrôle des marqueurs de mission (partie 8.9.1), pour la Tactical Mass au Disengage (partie 8.5.4) et pour les points de victoire basés sur le supply."],["DEBUFF [Characteristic] (X)","The Unit suffers a penalty of X to the specified characteristic until the End of the Round.\n• Target Number characteristic: increase the value by X (harder to roll).\n• Value characteristic: decrease the value by X (minimum 0).","L’unité subit une pénalité de X à la caractéristique indiquée jusqu’à la fin du round.\n• Caractéristique à seuil : augmente la valeur de X (plus difficile à réussir).\n• Caractéristique à valeur : diminue la valeur de X (minimum 0)."],["DISPLACEMENT","The Leading Model may end a move overlapping this Token or Unit (overrides Part 7.3.1). If the Leading Model ends any Move, Deploy, Run, Charge, Disengage, Close Ranks or Special Ability move Overlapping this Token or model, the controlling player of the Leading Model immediately sets it in Base-to-Base contact with the Leading Model. If Base-to-Base is not possible, sets it as close as possible.","Le modèle de tête peut finir un déplacement en chevauchant ce jeton ou cette unité (prime sur la partie 7.3.1). Si le modèle de tête termine un Move, Deploy, Run, Charge, Disengage, Close Ranks ou déplacement de capacité spéciale en chevauchant ce jeton ou cette figurine, son joueur le place immédiatement au contact socle à socle du modèle de tête. Si ce n’est pas possible, aussi près que possible."],["DODGE (X)","When this Unit is targeted by an attack, reduce the number of dice moved from the Armour Pool to the Damage Pool by Surge or CRITICAL HIT by X (minimum 0). Apply during the Resolve Surge step.","Quand cette unité est visée par une attaque, réduis de X (minimum 0) le nombre de dés déplacés du pool d’armure vers le pool de dégâts par Surge ou CRITICAL HIT. S’applique pendant l’étape de résolution de Surge."],["EFFECTIVE SIZE","A model’s Effective Size is equal to its Size characteristic plus the Size of any terrain it is standing on (Part 7.1.2). A model at GROUND LEVEL has an Effective Size equal to its own Size characteristic only. A model on HIGH GROUND (Size 3+) or MID GROUND (Size 1–2) adds the terrain’s Size to its own. Terrain pieces set on elevated surfaces stack in the same way – a terrain piece’s Effective Size equals its own Size plus the Size of the terrain it stands on. Effective Size determines which terrain blocks Line of Sight through Full Cover and Direct Cover (Part 7.1.1). Flying models are treated as having an Effective Size higher than any terrain piece on the table for Cover purposes (Part 7.1.4).","La taille effective d’une figurine est égale à sa caractéristique Size plus la taille du décor sur lequel elle se tient (partie 7.1.2). Au GROUND LEVEL, elle est égale à sa seule Size. Sur HIGH GROUND (taille 3+) ou MID GROUND (taille 1–2), on ajoute la taille du décor. Les décors posés sur des surfaces surélevées s’additionnent de la même façon. La taille effective détermine quels décors bloquent la ligne de vue (couvert total et couvert direct, partie 7.1.1). Les figurines volantes comptent comme ayant une taille effective supérieure à tout décor de la table pour le couvert (partie 7.1.4)."],["ELEVATION LEVEL","Models can stand one of three elevations:\n• GROUND LEVEL: Standing directly on the playmat.\n• MID GROUND: Standing on horizontal terrain of Size 1 or 2.\n• HIGH GROUND: Standing on horizontal terrain of Size 3 or larger. The model stands on elevation if its base is at that elevation. If the model’s base is on multiple elevation levels, assume it is standing on the highest of those elevations.","Les figurines peuvent se tenir sur trois élévations :\n• GROUND LEVEL : directement sur le tapis.\n• MID GROUND : sur un décor horizontal de taille 1 ou 2.\n• HIGH GROUND : sur un décor horizontal de taille 3 ou plus.\nUne figurine est à une élévation si son socle y est. Si son socle repose sur plusieurs niveaux, elle est considérée sur le plus haut."],["ENEMY","All Units, Tokens, and cards belonging to the opponent are Enemies. In team games, all opposing players’ Units, Tokens, and cards are Enemies. A Unit may never target a Friendly Unit with an attack unless a rule explicitly sta
