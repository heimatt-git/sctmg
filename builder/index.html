tes otherwise. Enemy is the opposite of Friendly and is referenced throughout the rules to determine valid targets, Engagement, and Mission Marker contests.","Toutes les unités, tous les jetons et toutes les cartes de l’adversaire sont ennemis. En partie à équipes, tout ce qui appartient aux joueurs adverses est ennemi. Une unité ne peut jamais viser une unité amie avec une attaque, sauf si une règle le dit explicitement. Ennemi est le contraire d’ami ; ce terme sert pour les cibles valides, l’engagement et la contestation des marqueurs."],["ENGAGED","A Ground Unit is Engaged when any of its models is Within 1” (Engagement Range) of any model in an Enemy Ground Unit, provided the following conditions are met (Part 7.2.1):\n• Combat Tags match: Ground models Engage only Ground models. Flying models cannot be Engaged by any model.\n• Terrain does not block: Size 2+ terrain between the models prevents Engagement, even if they are Within 1”. Models on HIGH GROUND cannot Engage models at GROUND LEVEL, and vice versa. When any model in a Unit is Engaged, the entire Unit is considered Engaged. An Engaged Unit cannot perform a standard Move – it must Disengage (Part 8.5.4) or Hold. Engaged Units are also subject to restrictions on Ranged Attacks (Part 8.7.3).","Une unité Ground est engagée quand l’une de ses figurines est à 1\" (Engagement Range) d’une figurine d’une unité Ground ennemie, si ces conditions sont remplies (partie 7.2.1) :\n• Combat Tags compatibles : les figurines Ground n’engagent que des figurines Ground. Les figurines volantes ne peuvent être engagées par aucune figurine.\n• Le terrain ne bloque pas : un décor de taille 2+ entre les figurines empêche l’engagement, même à 1\". Les figurines sur HIGH GROUND ne peuvent pas engager des figurines au GROUND LEVEL, et inversement.\nDès qu’une figurine d’une unité est engagée, toute l’unité est engagée. Une unité engagée ne peut pas faire de Move normal : elle doit faire Disengage (partie 8.5.4) ou Hold. Les unités engagées ont aussi des restrictions de Ranged Attack (partie 8.7.3)."],["ENGAGEMENT RANGE","The Engagement Range extends 1” horizontally from any model’s base. When two Enemy Ground models are Within each other’s Engagement Range, they are Engaged (Part 7.2). Engagement Range is measured horizontally from a top-down perspective, ignoring vertical height (Part 4.1). It is referenced when resolving Move restrictions (Part 8.5.3), Disengage (Part 8.5.4), Charge (Part 8.6.2), the Fighting Rank (Part 8.8.1), and PLACE effects. Melee weapons list E as their Range, indicating they may only strike targets Within the Engagement Range.","L’Engagement Range s’étend à 1\" à l’horizontale autour du socle d’une figurine. Quand deux figurines Ground ennemies sont chacune dans l’Engagement Range de l’autre, elles sont engagées (partie 7.2). On la mesure à l’horizontale, vue de dessus, sans tenir compte de la hauteur (partie 4.1). Elle sert pour les restrictions de Move (8.5.3), le Disengage (8.5.4), la Charge (8.6.2), le Fighting Rank (8.8.1) et les effets PLACE. Les armes de mêlée ont une portée « E » : elles ne frappent que des cibles dans l’Engagement Range."],["ENTRY EDGE","The table edge assigned to a player by the Deployment Card. Units enter the battlefield from this edge when deploying from Reserves.","Le bord de table attribué à un joueur par la Deployment Card. Les unités entrent sur le champ de bataille par ce bord quand elles se déploient depuis la réserve."],["FACTION TAGS","Faction Tags are keywords printed on Unit Cards, Tactical Cards, and Faction Cards that identify allegiance.\n• Race Tags: Terran, Zerg, Protoss.\n• Sub-Faction Tags: Specific broods or organisations, e.g., Kerrigan’s Swarm, Raynor’s Raiders.\n• Function: During Army Building, a player may include only Units and Tactical Cards whose Faction Tags all appear on the chosen Faction Card. If even one tag on the Unit or Tactical Card does not appear on the Faction Card, that card cannot be included. A Unit with fewer tags than the Faction Card is permitted – it only requires its own tags to be present (Part 9.1.2).","Les Faction Tags sont des mots-clés imprimés sur les cartes d’unité, Tactical Cards et Faction Cards qui indiquent l’allégeance.\n• Race : Terran, Zerg, Protoss.\n• Sous-faction : couvées ou organisations précises, ex. Kerrigan’s Swarm, Raynor’s Raiders.\n• Usage : pendant la construction d’armée, on ne peut inclure que des unités et Tactical Cards dont tous les Faction Tags figurent sur la Faction Card choisie. Si un seul tag manque sur la Faction Card, la carte est interdite. Une unité qui a moins de tags que la Faction Card est autorisée : seuls ses propres tags doivent y figurer (partie 9.1.2)."],["FIGHTING RANK","A model is in the Fighting Rank if it is Within the Engagement Range (1”) of an Enemy model. Models in the Fighting Rank may strike with their Combat Phase weapons. See Part 8.8.1, Step 2.","Une figurine est dans le Fighting Rank si elle est dans l’Engagement Range (1\") d’une figurine ennemie. Les figurines du Fighting Rank peuvent frapper avec leurs armes de phase de Combat. Voir partie 8.8.1, étape 2."],["FIRST PLAYER MARKER","A physical Token used to track which player has initiative. At the start of the game, the winner of the Roll-Off (Part 3.2) assigns the First Player Marker to either player for Round 1. The holder of the First Player Marker chooses which player activates first at the start of each Phase. The Marker changes hands in two ways: the first player to Pass during Phase 1 or Phase 2 takes the First Player Marker for the following Phase, and at the end of Phase 4 the Marker is awarded to the player with fewer Victory Points (Part 8.9.6). If Victory Points are tied, both players Roll-Off and the winner takes the Marker.","Jeton physique qui indique quel joueur a l’initiative. En début de partie, le vainqueur du roll-off (partie 3.2) donne le marqueur Premier joueur à l’un des deux joueurs pour le round 1. Son détenteur choisit quel joueur active en premier au début de chaque phase. Le marqueur change de main de deux façons : le premier joueur à passer en phase 1 ou 2 le prend pour la phase suivante, et à la fin de la phase 4 il revient au joueur qui a le moins de points de victoire (partie 8.9.6). En cas d’égalité de PV, les joueurs font un roll-off et le gagnant le prend."],["FLYING","Flying Units trade board control (no Mission Markers, no melee) for mobility and immunity to terrain.\n• A Flying Unit ignores all terrain for movement purposes. The Leading Model moves point-to-point, measuring horizontally. Other models may pass through a Flying model’s base as if it were not there, and vice versa.\n• A Flying Unit is never Engaged. Ground models cannot Engage Flying models, and Flying models cannot Engage other Flying models. A Flying Unit must end its movement at least 1” away from all Enemy Flying Units.\n• Flying model ignore the Full Cover rule. Direct Cover and the Elevation Dead Zone rules still apply. Assume that Flying Units’ Effective Size is higher than the Effective Size of any terrain piece on the table.\n• A Flying Unit does not benefit from HIGH GROUND Cover (Part 7.1.3).\n• A Flying Unit cannot Control or Contest Mission Markers (overrides Parts 6.2 and 8.9.1).\n• A Flying Unit cannot Charge or be Charged.\n• A Flying Unit cannot participate in the Combat Phase (Part 8.8).\n• A Flying Unit ignores elevation. It does not use Access Points. For Cover and Line of Sight purposes, treat a Flying Unit’s Effective Size as higher than the Effective Size of any terrain piece on the table (Part 7.1.4). Terrain does not contribute to a Flying model’s Effective Size.\n• A Flying Unit moving over Grass does not destroy the Grass terrain piece. If a Flying Unit ends on a Grass terrain piece, it is removed as normal.","Les unités volantes échangent le contrôle du terrain (pas de marqueurs de mission, pas de mêlée) contre la mobilité et l’immunité au terrain.\n• Une unité volante ignore tout le terrain pour ses déplacements. Le modèle de tête se déplace en ligne droite, mesuré à l’horizontale. Les autres figurines peuvent traverser le socle d’une figurine volante comme s’il n’existait pas, et inversement.\n• Une unité volante n’est jamais engagée. Les figurines Ground ne peuvent pas engager les volants, et les volants ne s’engagent pas entre eux. Une unité volante doit finir son déplacement à au moins 1\" de toute unité volante ennemie.\n• Les figurines volantes ignorent la règle de couvert total. Le couvert direct et la zone morte d’élévation s’appliquent toujours. Leur taille effective est considérée supérieure à celle de tout décor de la table.\n• Une unité volante ne bénéficie pas du couvert de HIGH GROUND (partie 7.1.3).\n• Une unité volante ne peut ni contrôler ni contester de marqueur de mission (prime sur les parties 6.2 et 8.9.1).\n• Une unité volante ne peut ni charger ni être chargée.\n• Une unité volante ne participe pas à la phase de Combat (partie 8.8).\n• Une unité volante ignore l’élévation et n’utilise pas les Access Points. Pour le couvert et la ligne de vue, sa taille effective est supérieure à celle de tout décor (partie 7.1.4). Le terrain ne s’ajoute pas à sa taille effective.\n• Une unité volante qui survole un décor Grass ne le détruit pas. Si elle finit sur un décor Grass, celui-ci est retiré normalement."],["FRIENDLY","All Units, Tokens, and cards belonging to the Controlling Player are Friendly to one another. In team games, all teammates’ Units, Tokens, and cards are also Friendly. A Unit’s own models are always Friendly to it. Friendly is the opposite of Enemy and is used throughout the rules to determine targeting restrictions, movement interactions, and ability eligibility.","Toutes les unités, tous les jetons et toutes les cartes du joueur qui les contrôle sont amis entre eux. En partie à équipes, ceux des coéquipiers sont aussi amis. Les figurines d’une unité lui sont toujours amies. Ami est le contraire d’ennemi ; ce terme sert pour les restrictions de ciblage, les interactions de mouvement et l’éligibilité des capacités."],["GRASS","A terrain piece with a Size of 2 that follows special rules. Unlike other Size 2 terrain, Grass does not block movement but does block Line of Sight, following the standard Cover rules (Part 7.1.1). Grass is destroyed by the passage of war. If a Leading Model’s path of travel passes through or any model of a Unit ends on a Grass terrain piece during any movement action (Move, Deploy, Run, Charge, Disengage or Close Ranks), that Grass terrain piece is immediately removed from the game. It does not return during Cleanup & Refresh and cannot be replaced by any means. A Flying Unit moving over Grass does not destroy the Grass terrain piece. Flying models pass above the terrain, not through it. If any model of a Flying Unit ends on a Grass terrain piece, it is removed as normal.","Décor de taille 2 avec des règles spéciales. Contrairement aux autres décors de taille 2, le Grass ne bloque pas le mouvement mais bloque la ligne de vue selon les règles de couvert normales (partie 7.1.1). Le Grass est détruit par le passage des combats : si le trajet d’un modèle de tête le traverse, ou si une figurine d’une unité finit dessus pendant une action de mouvement (Move, Deploy, Run, Charge, Disengage ou Close Ranks), il est immédiatement retiré de la partie. Il ne revient pas au nettoyage et ne peut être remplacé d’aucune façon. Une unité volante qui le survole ne le détruit pas : les volants passent au-dessus. Si une figurine volante finit dessus, il est retiré normalement."],["GROUND LEVEL","One of the elevation levels. Model is on the GROUND LEVEL when it is standing directly on the playmat. Models on GROUND LEVEL cannot Engage models on HIGH GROUND, and vice versa. Models on GROUND LEVEL can Engage models on MID GROUND only if both models are adjacent to the same ACCESS POINT connecting their respective elevations. A model at GROUND LEVEL has an Effective Size equal to its own Size characteristic only.","Un des niveaux d’élévation. Une figurine est au GROUND LEVEL quand elle se tient directement sur le tapis. Les figurines au GROUND LEVEL ne peuvent pas engager celles sur HIGH GROUND, et inversement. Elles ne peuvent engager celles sur MID GROUND que si les deux sont adjacentes au même ACCESS POINT reliant leurs élévations. Au GROUND LEVEL, la taille effective est égale à la seule caractéristique Size."],["HEAL (X)","Remove X points of accumulated Damage from the Unit (reduce its Damage Marker accordingly). HEAL cannot return Destroyed models – it only reduces existing Damage. See also: RESPAWN.","Retire X points de dégâts accumulés de l’unité (réduis son marqueur de dégâts d’autant). HEAL ne ramène pas les figurines détruites : il réduit seulement les dégâts existants. Voir aussi : RESPAWN."],["HIDDEN","This Unit cannot be selected as the target of a Ranged Attack or any LoS-requiring Special Ability unless the acting model is Within 4” of it. A HIDDEN Unit is immune to the IMPACT keyword. A HIDDEN Unit may make an Evade Roll against every attack targeting it. HIDDEN is classified as a Status.","Cette unité ne peut pas être choisie comme cible d’une Ranged Attack ni d’une capacité spéciale demandant une ligne de vue, sauf si la figurine qui agit est à 4\" d’elle. Une unité HIDDEN est immunisée au mot-clé IMPACT. Elle peut faire un jet d’Evade contre chaque attaque qui la vise. HIDDEN est un statut."],["HIGH GROUND","One of the elevation levels. Model is on the HIGH GROUND when standing on horizontal terrain of Size 3 or larger. Models on HIGH GROUND cannot Engage models on GROUND LEVEL, and vice versa. Models on HIGH GROUND can Engage models on MID GROUND only if both models are adjacent to the same ACCESS POINT connecting their respective elevations. A model on HIGH GROUND has an Effective Size equal to its own Size plus the terrain’s Size.","Un des niveaux d’élévation. Une figurine est sur HIGH GROUND quand elle se tient sur un décor horizontal de taille 3 ou plus. Les figurines sur HIGH GROUND ne peuvent pas engager celles au GROUND LEVEL, et inversement. Elles ne peuvent engager celles sur MID GROUND que si les deux sont adjacentes au même ACCESS POINT reliant leurs élévations. Sur HIGH GROUND, la taille effective est égale à sa Size plus la taille du décor."],["HITS X (Y)","The affected Unit suffers X automatic hits. Set X dice directly into the Armour Pool and proceed immediately to Armour Rolls (Part 8.7.4, Steps 3–4). Treat the Damage characteristic as Y. These hits do not generate Surge.","L’unité touchée subit X touches automatiques. Place X dés directement dans le pool d’armure et passe tout de suite aux jets d’armure (partie 8.7.4, étapes 3–4). La caractéristique Damage vaut Y. Ces touches ne génèrent pas de Surge."],["IMPACT (X) Y","Immediately after this Unit completes a successful Charge, check every model in the Fighting Rank or Supporting Rank. For each eligible model, generate X Impact Dice:\n• If the model is in the Fighting Rank or Supporting Rank against only one Enemy Unit, all X dice go to that Unit.\n• If the model is in the Fighting Rank or Supporting Rank against multiple Enemy Units, the controlling player may split the dice between those Units. Roll the allocated dice for each target Unit separately (this is the Impact Hit Roll). For each result of Y or higher, set 1 die into the target’s Armour Pool. Proceed immediately to Armour Rolls. These hits do not generate Surge and treat Damage as 1.","Juste après une charge réussie de cette unité, regarde chaque figurine du Fighting Rank ou du Supporting Rank. Chaque figurine éligible génère X dés d’Impact :\n• Si elle est dans le Fighting ou Supporting Rank contre une seule unité ennemie, les X dés vont à cette unité.\n• Si elle l’est contre plusieurs unités ennemies, son joueur peut répartir les dés entre elles.\nLance séparément les dés attribués à chaque unité ciblée (c’est le jet de touche d’Impact). Pour chaque résultat de Y ou plus, place 1 dé dans le pool d’armure de la cible, puis passe tout de suite aux jets d’armure. Ces touches ne génèrent pas de Surge et ont Damage 1."],["IMPASSABLE TERRAIN","A terrain piece is Impassable if it has no Access Point connecting it to an adjacent elevation level. Models cannot move through, onto, or across IMPASSABLE TERRAIN, and no model may end its movement overlapping it. Models can move through Terrain of Sizes 0 and 1.","Un décor est infranchissable s’il n’a aucun Access Point le reliant à un niveau d’élévation voisin. Les figurines ne peuvent ni le traverser, ni monter dessus, ni passer par-dessus, et aucune ne peut finir un déplacement en le chevauchant. Les figurines peuvent traverser les décors de taille 0 et 1."],["INDIRECT FIRE","Ranged Attacks with this weapon may ignore Line of Sight when selecting a target and resolving Damage. The target must still be Within Range. If the target is not within Line of Sight, it may make an Evade Roll against this attack.","Les Ranged Attacks avec cette arme peuvent ignorer la ligne de vue pour choisir la cible et résoudre les dégâts. La cible doit quand même être à portée. Si la cible n’est pas en ligne de vue, elle peut faire un jet d’Evade contre cette attaque."],["INSTANT","Enemy Units cannot declare or resolve Reaction abilities in response to attacks made with this weapon.","Les unités ennemies ne peuvent ni déclarer ni résoudre de capacités Reaction en réponse aux attaques faites avec cette arme."],["LEADING MODEL","The Leading Model is a temporary reference point used to execute a Unit’s movement. Whenever a Unit performs a Move, Deploy, Run, Charge, Disengage, Close Ranks, or any action that instructs the Unit to nominate a Leading Model, the Controlling Player selects one model in the Unit. Move the Leading Model first, measuring its exact path. Then set the remaining models in valid Coherency around the Leading Model’s new position (Part 4.4). The Leading Model nomination ends once the action resolves. The Leading Model determines the Unit’s Gap Clearance category and interacts with terrain restrictions (Part 4.6).","Le modèle de tête est un point de référence temporaire pour déplacer une unité. Chaque fois qu’une unité fait un Move, Deploy, Run, Charge, Disengage, Close Ranks, ou toute action qui demande de désigner un modèle de tête, son joueur choisit une figurine de l’unité. Déplace d’abord le modèle de tête en mesurant son trajet exact, puis place les autres figurines en cohésion valide autour de sa nouvelle position (partie 4.4). La désignation prend fin une fois l’action résolue. Le modèle de tête détermine la catégorie de Gap Clearance de l’unité et interagit avec les restrictions de terrain (partie 4.6)."],["LINE OF SIGHT (LoS)","Line of Sight determines what a model can see and, by extension, what it can target with attacks and abilities. All Line of Sight checks are resolved from a 2D topdown perspective, looking directly down at the battlefield from above. To determine if a model can see a target, trace an imaginary straight line from any part of the acting model’s base to any part of the target model’s base. Vertical height is never factored into the trace. If the trace does not pass through any Blocking Terrain (any terrain piece with an Effective Size of 1 or greater), the target is Visible. No further checks are required. If the trace passes through Blocking Terrain, the target is not automatically hidden. Apply the Cover rules (Part 7.1.1) to determine whether that terrain actually blocks the Line of Sight:\n• Full Cover: The terrain’s Effective Size is equal to or greater than the Effective Size of both the attacker and the target. Line of Sight is blocked.\n• Direct Cover: The trace passes through a terrain piece, and either the attacker or the target is Within 1” of that terrain, provided the terrain’s Effective Size is equal to or greater than the Effective Size of the model that is Within 1”. Line of Sight is blocked. Exception: If both the attacker and the target are Within 1” of the same terrain piece and Within 3” of each other, resolve Line of Sight normally.\n• Elevation Dead Zone: A model on HIGH GROUND (Size 3+) cannot see a model at GROUND LEVEL that is Within 1” of the base of the same terrain piece, and vice versa. The same Close Quarters exception applies. Each terrain piece is assessed independently. Terrain pieces do not combine their Effective Size or proximity. If no single terrain piece meets the requirements for Full Cover or Direct Cover, Line of Sight is not blocked, regardless of how many terrain pieces the trace passes through. A terrain piece’s footprint is defined by its physical base or outermost edges viewed from above. Gaps, windows, doorways, and open interiors within the footprint do block the Line of Sight unless players agree otherwise during Battlefield Setup (Part 7.1). Flying models ignore the Full Cover rule. Direct Cover and the Elevation Dead Zone still apply. Treat a Flying model’s Effective Size as higher than the Effective Size of any terrain piece on the table (Part 7.1.4). Line of Sight is mutual: if Model A can see Model B, Model B can see Model A through the same trace.","La ligne de vue détermine ce qu’une figurine voit et donc ce qu’elle peut viser avec ses attaques et capacités. Elle se vérifie toujours en 2D, vue de dessus. Pour savoir si une figurine voit une cible, trace une ligne droite imaginaire de n’importe quel point de son socle à n’importe quel point du socle de la cible. La hauteur n’entre jamais en compte. Si la ligne ne traverse aucun Blocking Terrain (décor de taille effective 1 ou plus), la cible est visible. Si elle en traverse un, la cible n’est pas forcément cachée : applique les règles de couvert (partie 7.1.1).\n• Couvert total : la taille effective du décor est ≥ à celle du tireur ET de la cible. La ligne de vue est bloquée.\n• Couvert direct : la ligne traverse un décor et le tireur ou la cible est à 1\" de ce décor, si la taille effective du décor est ≥ à celle de la figurine qui est à 1\". La ligne de vue est bloquée. Exception : si le tireur et la cible sont tous deux à 1\" du même décor et à 3\" l’un de l’autre, la ligne de vue se résout normalement.\n• Zone morte d’élévation : une figurine sur HIGH GROUND (taille 3+) ne voit pas une figurine au GROUND LEVEL située à 1\" du pied du même décor, et inversement. Même exception de corps à corps.\nChaque décor s’évalue seul : les décors n’additionnent ni leur taille ni leur proximité. Si aucun décor ne remplit à lui seul les conditions de couvert total ou direct, la ligne de vue n’est pas bloquée, quel que soit le nombre de décors traversés. L’emprise d’un décor est son socle ou ses bords extérieurs vus de dessus ; ouvertures, fenêtres, portes et intérieurs ouverts bloquent la ligne de vue, sauf accord des joueurs à la mise en place (partie 7.1). Les volants ignorent le couvert total ; le couvert direct et la zone morte s’appliquent. La ligne de vue est réciproque : si A voit B, B voit A par la même ligne."],["LOCKED IN (X)","When making a Ranged Attack with this weapon, add X to its RoA if the target Unit has Stationary Status.","Quand tu fais une Ranged Attack avec cette arme, ajoute X à sa RoA si l’unité ciblée a le statut Stationary."],["LONG RANGE (X)","The maximum Range of this weapon increases to X”. Measure each attacking model’s distance to the target individually:\n• Within normal profile Range: attack resolves normally.\n• Beyond profile Range but Within X”: the model suffers a -1 Modifier to its Hit roll. If a Batch contains models at both Standard and Long Range, generate the total dice but roll the two groups separately to account for different Hit Target Numbers.","La portée maximale de cette arme passe à X\". Mesure la distance de chaque figurine qui attaque séparément :\n• Dans la portée normale du profil : l’attaque se résout normalement.\n• Au-delà de la portée du profil mais à X\" ou moins : la figurine subit un modificateur −1 à son jet de touche.\nSi un batch contient des figurines aux deux distances, génère tous les dés mais lance les deux groupes séparément, car leurs seuils de touche diffèrent."],["MID GROUND","One of the elevation levels. Model is on the MID GROUND when standing on horizontal terrain of Size 1 or 2. Models on MID GROUND can Engage models on HIGH GROUND or GROUND LEVEL only if both models are adjacent to the same ACCESS POINT connecting their respective elevations. A model on MID GROUND has an Effective Size equal to its own Size plus the terrain’s Size.","Un des niveaux d’élévation. Une figurine est sur MID GROUND quand elle se tient sur un décor horizontal de taille 1 ou 2. Les figurines sur MID GROUND ne peuvent engager celles sur HIGH GROUND ou au GROUND LEVEL que si les deux sont adjacentes au même ACCESS POINT reliant leurs élévations. Sur MID GROUND, la taille effective est égale à sa Size plus la taille du décor."],["MISSION MARKERS","Numbered Markers are set on the battlefield during Setup at the coordinates shown on the Deployment Card. Each Marker is 32mm in diameter and has two sides: Activated or Deactivated. Markers 1 & 3 are Red, Markers 2 & 4 are Blue, and Marker 5 is Neutral. Mission Markers are the primary scoring mechanism. At the end of each Round, players determine Control of each Marker by comparing the Total Current Supply Value of their eligible contesting Units (Part 8.9.1). A Unit may Contest a Mission Marker only if it is on the battlefield, In Coherency, and has at least one model Within 3” with Line of Sight to the Marker on the same elevation. Flying Units and BURROWED Units cannot Contest or Control Mission Markers. Control is Sticky – once a player Controls a Marker, it remains under their control until the opponent reclaims it with a higher contesting Supply total. A tied result never transfers control.","Marqueurs numérotés placés sur le champ de bataille pendant la mise en place, aux coordonnées de la Deployment Card. Chacun mesure 32 mm de diamètre et a deux faces : Activated et Deactivated. Les marqueurs 1 et 3 sont rouges, 2 et 4 bleus, 5 neutre. Ils sont le principal moyen de marquer des points. À la fin de chaque round, on détermine le contrôle de chaque marqueur en comparant le supply actuel total des unités éligibles qui le contestent (partie 8.9.1). Une unité ne peut contester que si elle est sur le champ de bataille, en cohésion, et qu’au moins une figurine est à 3\" du marqueur avec ligne de vue et à la même élévation. Les unités volantes et BURROWED ne contestent ni ne contrôlent. Le contrôle est « collant » : une fois pris, il reste au joueur jusqu’à ce que l’adversaire le reprenne avec un total de supply supérieur. Une égalité ne transfère jamais le contrôle."],["MODIFIER","A Modifier adjusts the Target Number of a roll. Apply all Modifiers before rolling (Part 3.4).\n• +X Modifier: Makes the roll easier by reducing the Target Number by X.\n• -X Modifier: Makes the roll harder by increasing the Target Number by X. Modifiers from different named sources are cumulative unless otherwise stated. A Target Number can never be modified below 2+ or above 6+. Modifiers adjust the Target Number, not the dice result. A natural roll of 6 always succeeds, and a natural roll of 1 always fails, regardless of Modifiers (Part 3.6). A Modifier is distinct from a Fixed Addition (Part 3.5), which generates a value rather than adjusting a Target Number.","Un modificateur ajuste le seuil d’un jet. Applique tous les modificateurs avant de lancer (partie 3.4).\n• Modificateur +X : le jet est plus facile, le seuil baisse de X.\n• Modificateur −X : le jet est plus difficile, le seuil monte de X.\nLes modificateurs de sources nommées différentes se cumulent, sauf mention contraire. Un seuil ne peut jamais descendre sous 2+ ni monter au-delà de 6+. Les modificateurs changent le seuil, pas le résultat du dé. Un 6 naturel réussit toujours et un 1 naturel échoue toujours, quels que soient les modificateurs (partie 3.6). Un modificateur est différent d’un ajout fixe (partie 3.5), qui génère une valeur au lieu d’ajuster un seuil."],["MORPH (Unit Name) X","To perform this ability, the controlling player must have sufficient Available Supply. Set one (Name) model in Base-to-Base contact with a model from the active Unit, then remove X models from that Unit from the battlefield. The (Name) model forms a new Unit and cannot be set Within 1” of any Enemy Unit. Place an Activation Marker next to the new Unit; it cannot be Activated for the remainder of the Round.","Pour utiliser cette capacité, le joueur doit avoir assez de supply disponible. Place une figurine (Nom) au contact socle à socle d’une figurine de l’unité active, puis retire X figurines de cette unité du champ de bataille. La figurine (Nom) forme une nouvelle unité et ne peut pas être placée à 1\" d’une unité ennemie. Place un marqueur d’activation à côté de la nouvelle unité ; elle ne peut pas être activée jusqu’à la fin du round."],["NON-LETHAL DAMAGE (X)","The Unit suffers X points of Damage. Add this amount effectively to the Unit’s Damage Marker. Do not remove any models, even if Total Damage exceeds a model’s HP. If the Unit subsequently suffers standard Damage, the combined Total Damage triggers casualty removal normally.","L’unité subit X points de dégâts. Ajoute ce montant à son marqueur de dégâts, sans retirer de figurine, même si le total dépasse les PV d’une figurine. Si l’unité subit ensuite des dégâts normaux, le total cumulé déclenche le retrait des pertes normalement."],["ON CREEP","A Friendly or Enemy Ground Zerg Unit is considered to be ON CREEP while it is Within 6” of any Creep Tumor Token or any model designated as a Source of Creep. While satisfying this condition, the Unit gains the ON CREEP keyword. This allows the Unit to trigger specific Special Abilities or Upgrades that require this state.","Une unité Zerg Ground, amie ou ennemie, est ON CREEP tant qu’elle est à 6\" d’un jeton Creep Tumor ou d’une figurine désignée comme source de Creep. Tant que c’est le cas, elle gagne le mot-clé ON CREEP, ce qui lui permet de déclencher les capacités spéciales ou améliorations qui demandent cet état."],["PIERCE [TAG] X","When attacking a Unit with the specified Combat Tag, treat this weapon’s Damage characteristic as X.","Quand cette arme attaque une unité qui a le Combat Tag indiqué, sa caractéristique Damage vaut X."],["PINPOINT","Ranged Attacks with this weapon may target Engaged Enemy Units, ignoring the standard Engagement Status restriction (overrides Part 8.7.3, Step 1).","Les Ranged Attacks avec cette arme peuvent viser des unités ennemies engagées, en ignorant la restriction normale liée à l’engagement (prime sur la partie 8.7.3, étape 1)."],["PLACE (X)","Choose a Leading Model. Remove it and set it Wholly Within X” of its starting position. Then remove and replace all other models in the Unit, maintaining Coherency (Part 4.4). PLACE ignores Gap Clearance, and elevation requirements. The Leading Model is removed and set directly, not moved along a path. However, they must end in a legal position and not Within the Engagement Range of any enemy model. Models using the PLACE effect during the Assault Phase may be set Within the Engagement Range of Enemy models (the Unit becomes Engaged).","Choisis un modèle de tête. Retire-le et replace-le entièrement à X\" de sa position de départ. Retire puis replace ensuite toutes les autres figurines de l’unité en gardant la cohésion (partie 4.4). PLACE ignore le Gap Clearance et les contraintes d’élévation. Le modèle de tête est replacé directement, pas déplacé le long d’un trajet. Les figurines doivent cependant finir dans une position légale et hors de l’Engagement Range de toute figurine ennemie. En phase d’Assaut, les figurines qui utilisent PLACE peuvent être placées dans l’Engagement Range d’ennemis (l’unité devient engagée)."],["PRECISION (X)","After rolling to Hit, move up to X failed Attack Dice directly into the Armour Pool. Treat them as successful Hits for all purposes, including Surge.","Après le jet de touche, déplace jusqu’à X dés d’attaque ratés directement dans le pool d’armure. Ils comptent comme des touches réussies à tous points de vue, Surge compris."],["READY","The default state of a Tactical Card or Faction Card. A Ready card is face-up, its abilities are available, and it may be Exhausted to pay resource costs or activate its Special Abilities. All Tactical Cards and Faction Cards begin each Round in the Ready state. Cards that have been Exhausted are returned to Ready during Cleanup & Refresh (Part 8.9.5).","L’état normal d’une Tactical Card ou d’une Faction Card. Une carte prête est face visible, ses capacités sont disponibles et elle peut être épuisée pour payer un coût en ressources ou activer ses capacités spéciales. Toutes les Tactical Cards et Faction Cards commencent chaque round prêtes. Les cartes épuisées redeviennent prêtes au nettoyage (partie 8.9.5)."],["REPEATABLE","This ability is exempt from the Once Per Round limit (Part 2.7.1). It may be used multiple times per Round and per Activation, provided all Costs and trigger conditions are met each time.","Cette capacité échappe à la limite d’une fois par round (partie 2.7.1). Elle peut servir plusieurs fois par round et par activation, si tous les coûts et conditions de déclenchement sont remplis à chaque fois."],["RESERVES","A holding area off the battlefield where Units remain until they are deployed. All Units begin the game in Reserves. While in Reserves, a Unit:\n• Cannot be targeted by attacks or abilities unless an ability explicitly states it affects Units in Reserves.\n• Cannot use Active Abilities, Passive Abilities, or Reaction Abilities unless the ability explicitly states otherwise.\n• Cannot Control or Contest Mission Markers.\n• Does not contribute its Current Supply Value to the player’s Total Current Supply on the battlefield.\n• Retains all equipment, upgrades, and weapon selections assigned during Army Building.\n• A Unit leaves Reserves when it is deployed to the battlefield via a Deploy action (Part 8.5.5). Some rules may return a Unit to Reserves during play – see Part 8.5.5 for how Damage, effects, and Supply are handled. In the final Round of the game, all Units still in Reserves that are not deployed are treated as Destroyed for scoring purposes (Part 8.10).","Zone hors du champ de bataille où les unités attendent d’être déployées. Toutes les unités commencent la partie en réserve. En réserve, une unité :\n• ne peut pas être ciblée par des attaques ou des capacités, sauf si une capacité dit explicitement qu’elle touche les unités en réserve ;\n• ne peut utiliser ni capacités Active, ni Passive, ni Reaction, sauf mention contraire ;\n• ne peut ni contrôler ni contester de marqueur de mission ;\n• ne compte pas dans le supply actuel total du joueur sur le champ de bataille ;\n• garde tout son équipement, ses améliorations et ses choix d’armes de la construction d’armée.\n• Une unité quitte la réserve quand elle est déployée par une action Deploy (partie 8.5.5). Certaines règles peuvent la remettre en réserve en cours de partie : voir la partie 8.5.5 pour les dégâts, effets et supply. Au dernier round, toutes les unités encore en réserve et non déployées comptent comme détruites pour le score (partie 8.10)."],["RESPAWN (X)","Return up to X Destroyed models to this Unit.\n• The return cannot increase the Unit’s Current Supply Value. Do not return a model if doing so would push the Unit into a higher Supply bracket.\n• Set each returned model in Base-to-Base contact with an existing model in the Unit. Returned models cannot be set Within the Engagement Range of any Enemy Unit.\n• If a model cannot be set legally, it cannot be returned.","Ramène jusqu’à X figurines détruites dans cette unité.\n• Le retour ne peut pas augmenter le supply actuel de l’unité : ne ramène pas une figurine si cela la ferait passer dans une tranche de supply supérieure.\n• Place chaque figurine ramenée au contact socle à socle d’une figurine existante de l’unité. Elle ne peut pas être placée dans l’Engagement Range d’une unité ennemie.\n• Si une figurine ne peut pas être placée légalement, elle ne revient pas."],["SHIELDED","If a Shield value is present on a Unit Card, add it to the Hit Points (HP) of the first model. The Unit is Shielded. The Unit loses its Shielded Status when the Total Damage assigned to it exceeds its Shield value or when the first model in the Unit is removed. The Shielded Status is referenced by other abilities. Losing Shielded Status does not remove any remaining Hit Points, it only ends effects that require the Unit to be Shielded. Shielded Status cannot be restored by HEAL.","Si la carte d’unité indique une valeur de Shield, ajoute-la aux PV de la première figurine. L’unité est alors Shielded. Elle perd ce statut quand le total de dégâts qui lui est attribué dépasse sa valeur de Shield, ou quand sa première figurine est retirée. D’autres capacités font référence au statut Shielded. Le perdre ne retire pas les PV restants : cela met seulement fin aux effets qui demandent ce statut. HEAL ne rend pas le statut Shielded."],["SIDEARM","When this Unit performs a Ranged Attack or Close Combat Attack, models equipped with this weapon may use it, ignoring the normal restriction of one weapon per model (Part 8.7.3). If a model is equipped with multiple SIDEARM weapons, it may use all of them in the same activation. Attacks made with each SIDEARM must be resolved in separate Batches. Because they are separate Batches, SIDEARM attacks may target a different Enemy Unit than the Unit’s other weapons, subject to all standard target eligibility requirements.","Quand cette unité fait une Ranged Attack ou une Close Combat Attack, les figurines équipées de cette arme peuvent s’en servir en plus, en ignorant la limite d’une arme par figurine (partie 8.7.3). Une figurine qui a plusieurs armes SIDEARM peut toutes les utiliser dans la même activation. Chaque SIDEARM se résout dans un batch séparé ; ses attaques peuvent donc viser une autre unité ennemie que les autres armes de l’unité, en respectant les conditions normales de ciblage."],["SIEGE MODE","While a Unit has the SIEGE MODE Status, apply the following rules:\n• This Unit cannot perform the Move, Disengage, Run, Charge or Close Ranks actions.\n• Weapons profile with Siege Mode Status can only be used while this unit has SIEGE MODE Status.\n• While this unit has Siege Mode Status any other weapons can’t be used.\n• When this Unit is returned to Reserves, it loses the SIEGE MODE Status.","Tant qu’une unité a le statut SIEGE MODE, applique ces règles :\n• Elle ne peut pas faire les actions Move, Disengage, Run, Charge ni Close Ranks.\n• Les profils d’arme marqués Siege Mode ne s’utilisent que tant qu’elle a ce statut.\n• Tant qu’elle a ce statut, ses autres armes ne peuvent pas être utilisées.\n• Quand elle retourne en réserve, elle perd le statut SIEGE MODE."],["SPECIAL ABILITY","A Special Ability is any named ability printed on a Unit Card, Tactical Card, or Faction Card. Every Special Ability falls into one of three categories: Active Ability, Passive Ability, or Reaction Ability (Part 2.7).\n• Active Abilities require the Unit to be Activated and are triggered immediately before or after an action. Each named Active Ability may be used once per Round per Unit unless it has the REPEATABLE keyword.\n• Passive Abilities are always in effect as long as the Unit is on the battlefield.\n• Reaction Abilities fire in response to a specific trigger. Each player may resolve only one Reaction per Activation, and each named Reaction Ability may be used only once per Round per Unit. All three types are inactive while the Unit is in Reserves unless the ability explicitly states otherwise. A Unit cannot be affected by multiple instances of the same-named Special Ability simultaneously.","Une capacité spéciale est toute capacité nommée imprimée sur une carte d’unité, une Tactical Card ou une Faction Card. Elle appartient à l’une de trois catégories : Active, Passive ou Reaction (partie 2.7).\n• Les capacités Active demandent que l’unité soit activée et se déclenchent juste avant ou juste après une action. Chacune s’utilise une fois par round et par unité, sauf REPEATABLE.\n• Les capacités Passive sont toujours actives tant que l’unité est sur le champ de bataille.\n• Les capacités Reaction se déclenchent en réponse à un événement précis. Chaque joueur ne résout qu’une réaction par activation, et chaque réaction nommée ne sert qu’une fois par round et par unité.\nLes trois types sont inactifs tant que l’unité est en réserve, sauf mention contraire. Une unité ne peut pas subir en même temps plusieurs exemplaires d’une même capacité nommée."],["SPECIALIST","A Unit may include only one model equipped with this weapon. Multiple upgrades configuring more than one instance of this weapon are not permitted (Part 9.1.7).","Une unité ne peut avoir qu’une seule figurine équipée de cette arme. Les améliorations qui donneraient plus d’un exemplaire de cette arme sont interdites (partie 9.1.7)."],["SPILLOVER","Additional hits generated by a Template Weapon that strike models outside the Primary target Unit. When a Blast Template (BT) or Flamer Template (FT) covers models belonging to Units other than the Primary target, those models are resolved as Spillover. Each affected Unit is resolved as a separate Batch. Spillover Batches do not apply Rate of Attack modifiers and do not generate Surge. Spillover may affect both Friendly and Enemy Units. See Part 8.7.6 for the full Template Weapon procedure.","Touches supplémentaires générées par une arme à gabarit sur des figurines hors de l’unité ciblée principale. Quand un Blast Template (BT) ou un Flamer Template (FT) recouvre des figurines d’autres unités que la cible principale, elles sont résolues en Spillover. Chaque unité touchée est un batch séparé. Les batchs de Spillover n’appliquent pas les modificateurs de RoA et ne génèrent pas de Surge. Le Spillover peut toucher des unités amies comme ennemies. Voir partie 8.7.6 pour la procédure complète."],["STATIONARY","At the Start of the Round, all Units gain this Status. A Unit immediately loses this Status if any model in this Unit moves, is moved, or is PLACED for any reason.","Au début du round, toutes les unités gagnent ce statut. Une unité le perd immédiatement si l’une de ses figurines se déplace, est déplacée ou est replacée (PLACE) pour une raison quelconque."],["STATUS","A category of keyword representing a temporary or persistent operational mode, condition, or statistic modifier affecting a Unit (e.g. BURROWED, SIEGE MODE). Unless stated otherwise, Statuses aren’t removed during the Scoring and Cleanup Phase. They stay on the Unit until they are removed by other means. A Unit’s active Status is visually tracked using Status Markers set next to the Unit:\n• Modes: Use Plastic Markers to track operational shifts (e.g. SIEGE MODE, BURROWED). Those Status Markers have STAY IN PLAY.\n• Other Statuses: Use Markers to track other effects affecting the Unit. Positive effects are tracked with Buff Markers (Blue), and negative effects are tracked with Debuff Markers (Red). Those Status Markers have STAY IN PLAY.","Catégorie de mot-clé qui représente un mode, un état ou un modificateur de caractéristique, temporaire ou durable, qui affecte une unité (ex. BURROWED, SIEGE MODE). Sauf mention contraire, les statuts ne sont pas retirés pendant la phase de score et de nettoyage : ils restent sur l’unité jusqu’à ce qu’autre chose les retire. On les suit avec des marqueurs de statut posés à côté de l’unité :\n• Modes : marqueurs en plastique pour les changements de mode (ex. SIEGE MODE, BURROWED). Ces marqueurs ont STAY IN PLAY.\n• Autres statuts : marqueurs pour les autres effets. Les effets positifs se suivent avec des marqueurs Buff (bleus), les négatifs avec des marqueurs Debuff (rouges). Ces marqueurs ont STAY IN PLAY."],["STAY IN PLAY","This Token, Marker or Ability Effect persists through Cleanup & Refresh (overrides Part 8.9.5). It remains until a specific condition removes it (e.g. destroyed or duration expires).","Ce jeton, marqueur ou effet de capacité reste en place au nettoyage (prime sur la partie 8.9.5). Il reste jusqu’à ce qu’une condition précise le retire (ex. détruit ou durée écoulée)."],["SUMMON (Unit Name)","Set the Leading Model of the named Unit in Base-to-Base contact with the Parent Unit. Set remaining models In Coherency. Models cannot be set Within the Engagement Range of any Enemy Unit. Set an Activation Marker next to the summoned Unit – it cannot be Activated during the Phase in which it was summoned. In subsequent Phases, this Unit must be Activated immediately after its Parent Unit’s activation ends, before the opponent’s next activation. The Summoned Unit cannot be set Within the opponent’s Zone of Influence. The player must have sufficient Available Supply. If the Unit’s Current Supply Value would cause Total Current Supply to exceed the Supply Pool, it cannot be Summoned. If the Parent is not present on the battlefield, this Unit can be Activated normally.","Place le modèle de tête de l’unité nommée au contact socle à socle de l’unité mère, puis les autres figurines en cohésion. Aucune figurine ne peut être placée dans l’Engagement Range d’une unité ennemie. Place un marqueur d’activation à côté de l’unité invoquée : elle ne peut pas être activée pendant la phase où elle est invoquée. Dans les phases suivantes, elle doit être activée juste après la fin de l’activation de son unité mère, avant la prochaine activation adverse. L’unité invoquée ne peut pas être placée dans la Zone of Influence adverse. Il faut assez de supply disponible : si son supply actuel faisait dépasser le Supply Pool, elle ne peut pas être invoquée. Si l’unité mère n’est pas sur le champ de bataille, l’unité invoquée s’active normalement."],["SUPPLY VALUE","The Supply Value of a Unit is the value shown on the Unit Card’s Supply Profile corresponding to the Unit’s current model count. A Unit’s starting Supply Value is determined during Army Building by the Composition Option selected (Part 9.1.6) and defines how many Army Slots the Unit occupies. Supply Value is a dynamic characteristic – as casualties reduce the model count into a lower bracket on the Supply Profile, the Supply Value decreases. Update immediately when a casualty moves the Unit into a lower bracket. Supply is used for Deployment, Mission Marker Control, Tactical Mass, and scoring.","La valeur de Supply d’une unité est celle indiquée sur le profil de supply de sa carte pour son nombre actuel de figurines. Sa valeur de départ est fixée à la construction d’armée par l’option de composition choisie (partie 9.1.6) et détermine combien d’Army Slots elle occupe. C’est une caractéristique dynamique : quand les pertes font passer l’effectif dans une tranche inférieure, la valeur baisse, immédiatement. Le supply sert au déploiement, au contrôle des marqueurs, à la Tactical Mass et au score."],["SUPPORTING RANK","A model is in the Supporting Rank if it is in Base-to-Base contact with a Friendly model from the same Unit that is in the Fighting Rank, but is not itself Within the Engagement Range of an Enemy model. Models in the Supporting Rank may strike with their Combat Phase weapons as though they were in the fight. See Part 8.8.1, Step 2.","Une figurine est dans le Supporting Rank si elle est au contact socle à socle d’une figurine amie de la même unité qui est dans le Fighting Rank, sans être elle-même dans l’Engagement Range d’une figurine ennemie. Les figurines du Supporting Rank peuvent frapper avec leurs armes de phase de Combat comme si elles étaient au contact. Voir partie 8.8.1, étape 2."],["TACTICAL MASS","A Unit has Tactical Mass when its Current Supply Value exceeds the Combined Current Supply Value of all Enemy Units it is Engaged with. A Unit with Tactical Mass ignores the Disengage penalty (Part 8.5.4): it may Ranged Attack and Charge normally in the following Assault Phase after Disengaging.","Une unité a la Tactical Mass quand son supply actuel dépasse le supply actuel cumulé de toutes les unités ennemies avec lesquelles elle est engagée. Une unité qui a la Tactical Mass ignore la pénalité de Disengage (partie 8.5.4) : après s’être désengagée, elle peut faire une Ranged Attack ou une Charge normalement à la phase d’Assaut suivante."],["TOUGH (X)","When this Unit resolves an Armour Roll, change up to X failed results into successes. Treat them as meeting or exceeding the Armour characteristic – discard them without moving to the Damage Pool.","Quand cette unité fait un jet d’armure, change jusqu’à X échecs en réussites. Ils comptent comme ayant atteint la caractéristique Armour : défausse-les sans les mettre dans le pool de dégâts."],["UNENGAGED","A Ground Unit is Unengaged when none of its models is Within 1” of any Enemy Ground model, or when terrain restrictions (Part 7.2.1) prevent valid Engagement despite proximity. Flying Units are always Unengaged. An Unengaged Unit may perform a standard Move, Run, Ranged Attack, or Charge without restriction. Only Unengaged Units may be selected to perform a Move action (Part 8.5.2).","Une unité Ground est non engagée quand aucune de ses figurines n’est à 1\" d’une figurine Ground ennemie, ou quand le terrain (partie 7.2.1) empêche un engagement valide malgré la proximité. Les unités volantes sont toujours non engagées. Une unité non engagée peut faire Move, Run, Ranged Attack ou Charge sans restriction. Seules les unités non engagées peuvent faire une action Move (partie 8.5.2)."],["VISIBLE","A model is Visible to another model if a valid Line of Sight trace can be drawn between them (Part 7.1). If the trace does not pass through any Blocking Terrain, the target is Visible without further checks. If the trace passes through Blocking Terrain, apply the Cover rules (Part 7.1.1) – the target remains Visible unless Full Cover or Direct Cover blocks the Line of Sight. A model with the HIDDEN keyword is not Visible to any model more than 4” away, regardless of Line of Sight.","Une figurine est visible par une autre si on peut tracer entre elles une ligne de vue valide (partie 7.1). Si la ligne ne traverse aucun Blocking Terrain, la cible est visible sans autre vérification. Si elle en traverse, applique les règles de couvert (partie 7.1.1) : la cible reste visible sauf si un couvert total ou direct bloque la ligne de vue. Une figurine HIDDEN n’est visible par aucune figurine à plus de 4\", quelle que soit la ligne de vue."],["WHOLLY WITHIN","A model is Wholly Within a distance only if its entire base sits inside that range - no part of the base may extend beyond the edge. A Unit is Wholly Within a distance only if every model in the Unit satisfies this condition. Wholly Within is a stricter requirement than Within and is used for Coherency checks (Part 4.4), certain ability areas of effect, and Mission Marker eligibility. When a rule specifies Wholly Within, partial overlap is not sufficient.","Une figurine est entièrement à une distance seulement si tout son socle est dans cette zone : aucune partie du socle ne dépasse. Une unité est entièrement à une distance seulement si chacune de ses figurines l’est. C’est plus strict que « à » (Within) ; cela sert pour la cohésion (partie 4.4), certaines zones d’effet et l’éligibilité aux marqueurs. Quand une règle dit Wholly Within, un chevauchement partiel ne suffit pas."],["WITHIN","A model is Within a distance if any part of its base touches or crosses into that range. A Unit is Within a distance if at least one model in the Unit meets this condition. Within is a less restrictive requirement than Wholly Within. When a rule specifies Within without the word “Wholly,” partial overlap is sufficient.","Une figurine est à une distance si une partie de son socle touche ou entre dans cette zone. Une unité est à une distance si au moins une de ses figurines l’est. C’est moins strict que « entièrement à » (Wholly Within). Quand une règle dit Within sans « Wholly », un chevauchement partiel suffit."],["ZONE OF INFLUENCE","A restricted area of the battlefield extending 6” inward from a player’s Entry Edge, as defined by the Deployment Card. Where the Entry Edge does not run the full length of a table edge, the Zone of Influence is marked using Zone of Influence Markers set at the corners of the Entry Edge. Units arriving from Reserves cannot end their deployment Within the opponent’s Zone of Influence. This restriction applies to all forms of arrival - whether by standard deployment, transport, or SUMMON (Part 8.3.3). The Zone of Influence does not affect Units already on the battlefield. It does not restrict movement, block Line of Sight, or interact with any other rule once a Unit has completed its arrival.","Zone du champ de bataille qui s’étend à 6\" vers l’intérieur depuis l’Entry Edge d’un joueur, selon la Deployment Card. Si l’Entry Edge ne couvre pas tout le bord de table, la zone est délimitée par des marqueurs Zone of Influence posés aux coins de l’Entry Edge. Les unités qui arrivent de la réserve ne peuvent pas finir leur déploiement dans la Zone of Influence adverse, quel que soit leur mode d’arrivée : déploiement normal, transport ou SUMMON (partie 8.3.3). La Zone of Influence n’affecte pas les unités déjà sur le champ de bataille : elle ne limite pas le mouvement, ne bloque pas la ligne de vue et n’interagit avec aucune autre règle une fois l’arrivée terminée."]];
const normKw = s => String(s).toUpperCase().replace(/\[.*?\]/g,' ').replace(/\(.*?\)/g,' ')
  .replace(/\d+(\.\d+)?\s*["”]?/g,' ').replace(/\b[XY]\b["”+]?/g,' ').replace(/[+"”]/g,' ').replace(/\s+/g,' ').trim();
const KW = {};
GL.forEach(([k, t, f]) => { KW[normKw(k)] = Object.assign(KW[normKw(k)] || {}, {name:k, en:t, frg:f}); });
Object.entries(DB.keyword_rules || {}).forEach(([k, t]) => {
  if (k === 'builder_effect' || k === 'requires_upgrade') return;
  k.split(' / ').forEach(p => { const n = normKw(p); KW[n] = Object.assign(KW[n] || {name:p}, {note:t}); });
});
function kwDef(kw){ let n = normKw(kw); while (n){ if (KW[n]) return KW[n]; const i = n.lastIndexOf(' '); if (i < 0) break; n = n.slice(0, i); } return null; }
const KW_SKIP = new Set(['ENEMY','FRIENDLY','WITHIN','WHOLLY WITHIN','READY','STATUS','SPECIAL ABILITY','ACTIVE PLAYER','CONTROLLING PLAYER','VISIBLE','MODIFIER','COMBAT TAGS','FACTION TAGS','ARMY SLOT','SUPPLY VALUE','ELEVATION LEVEL','EFFECTIVE SIZE','BLOCKING TERRAIN']);
const KW_WORD = new Set(['BUFF','DEBUFF','PIERCE']);           // suivis d’un mot (Speed, ARMOURED…)
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const KW_BASES = []; // [base, key]
Object.entries(KW).forEach(([k, e]) => { const b = normKw(e.name); if (b && /^[A-Z][A-Z \-]*$/.test(b) && !KW_SKIP.has(b)) KW_BASES.push([b, b]); });
const KW_ALIAS = [ // formes non majuscules → clé du glossaire
  ['Engagement Range','ENGAGEMENT RANGE'],['Leading Model','LEADING MODEL'],['modèle de tête','LEADING MODEL'],['Zone of Influence','ZONE OF INFLUENCE'],
  ['Tactical Mass','TACTICAL MASS'],['Fighting Rank','FIGHTING RANK'],['Supporting Rank','SUPPORTING RANK'],['Entry Edge','ENTRY EDGE'],['Entry Edges','ENTRY EDGE'],
  ['Line of Sight','LINE OF SIGHT'],['ligne de vue','LINE OF SIGHT'],['supply disponible','AVAILABLE SUPPLY'],['Available Supply','AVAILABLE SUPPLY'],
  ['supply actuel','CURRENT SUPPLY VALUE'],['Current Supply Value','CURRENT SUPPLY VALUE'],['Spillover','SPILLOVER'],['Mission Markers?','MISSION MARKERS'],
  ['Burrowed','BURROWED'],['Hidden','HIDDEN'],['Stationary','STATIONARY'],['Shielded','SHIELDED'],['Reserves','RESERVES'],['First Player Marker','FIRST PLAYER MARKER'],['marqueur Premier joueur','FIRST PLAYER MARKER'],
  ['Deploy','DEPLOY',1],['Move','MOVE',1],['Disengage','DISENGAGE',1],['Hold','HOLD',1],['Run','RUN',1],['Charges?','CHARGE'],['Ranged Attacks?','RANGED ATTACK'],['Close Combat Attacks?','CLOSE COMBAT ATTACK'],['Close Ranks','CLOSE RANKS'],
  ['passer','PASS',1],['Passer','PASS',1],['passe','PASS',1],['Supply Pool','SUPPLY POOL'],['Surge','SURGE',1],['jets? d’armure','ARMOUR ROLL'],['Armour Rolls?','ARMOUR ROLL'],['Evade','EVADE',1],['batch','BATCH'],['batchs','BATCH'],['marqueurs? de dégâts','DAMAGE MARKER'],['Damage Markers?','DAMAGE MARKER']
].filter(([, k]) => KW[k]);
KW_BASES.sort((a, b) => b[0].length - a[0].length);
const KW_RE = new RegExp(
  KW_BASES.map(([b]) => '\\b' + reEsc(b) + (KW_WORD.has(b) ? '(?:\\s?\\[?[A-Z][A-Za-z]+\\]?)?' : '') + '(?:\\s?\\d+["”]?(?=\\s?\\())?(?:\\s?\\([^()\\n]{1,16}\\))?' + (b === 'IMPACT' ? '(?:\\s\\d\\+)?' : b === 'HITS' ? '(?:\\s\\d+\\s\\(\\d+\\))?' : b === 'MORPH' ? '(?:\\s\\d+)?' : '') + '(?![A-Za-z])').join('|')
  + '|' + KW_ALIAS.map(([a, , cs]) => '\\b' + (cs ? a : a.replace(/^(\w)/, (m) => '[' + m.toUpperCase() + m.toLowerCase() + ']')) + '(?![\\wÀ-ÿ’])').join('|'), 'g');
function kwKeyOf(m){
  for (const [a, k, cs] of KW_ALIAS) if (new RegExp('^' + a + '$', cs ? '' : 'i').test(m)) return k;
  for (const [b, k] of KW_BASES) if (m.startsWith(b)) return k;
  return null;
}
/* texte brut → HTML avec mots-clés cliquables */
function linkify(txt){
  txt = String(txt ?? ''); let out = '', last = 0;
  txt.replace(KW_RE, (m, ...rest) => { const i = rest[rest.length - 2]; const k = kwKeyOf(m); if (!k) return m;
    out += esc(txt.slice(last, i)) + `<button class="kwl" data-kw="${esc(m)}" data-key="${esc(k)}">${esc(m)}</button>`; last = i + m.length; return m; });
  return out + esc(txt.slice(last));
}

function kwParams(m, key){
  const name = (KW[key] || {}).name || '';
  const par = (m.match(/\(([^()]*)\)/) || [])[1], parN = par && /^\s*\d+/.test(par) ? parseInt(par, 10) : null;
  const lead = (m.slice(key.length).match(/^\s?(\d+)/) || [])[1], trail = (m.match(/\s(\d)\+$/) || [])[1] || (m.match(/\)\s(\d+)$/) || [])[1];
  const word = (m.slice(key.length).match(/^\s?\[?([A-Za-z]+)\]?/) || [])[1];
  const p = {};
  if (/^IMPACT/.test(name)){ if (parN != null) p.X = parN; if (trail) p.Y = +trail; }
  else if (/^HITS/.test(name)){ if (lead) p.X = +lead; if (parN != null) p.Y = parN; }
  else if (/^BURST FIRE/.test(name)){ if (lead) p.Y = +lead; if (parN != null) p.X = parN; }
  else if (/^MORPH|^SUMMON/.test(name)){ if (par) p.Nom = par; if (trail) p.X = +trail; }
  else if (/^PIERCE|^BUFF|^DEBUFF/.test(name)){ if (word && !/^\d/.test(word)) p[/^PIERCE/.test(name) ? 'Tag' : 'Caractéristique'] = word; if (parN != null) p.X = parN; }
  else if (parN != null) p.X = parN;
  return p;
}

  if(up.text&&!up.weapon_replacement&&!up.weapon_added){const pre=up.requires_upgrade?`<p class="tags">Nécessite ${esc(abName(up.requires_upgrade))}.</p>`:'';return pre+txtB(up.text);}

const kov=document.getElementById('kov');

    if(d.note) h+=`<p class="tags" style="margin-top:6px">Note de la base : ${esc(d.note)}</p>`; }
  document.getElementById('kov-body').innerHTML=h; kov.hidden=false; document.getElementById('kov-close').focus(); }
