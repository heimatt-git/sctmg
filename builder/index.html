ger Burrow entièrement à 12\" d’une figurine de cette unité. À la fin du round, le joueur qui la contrôle peut placer toutes les figurines de l’unité en cohésion, en prenant le jeton Ravager Burrow comme modèle de tête. Le jeton Ravager Burrow a DISPLACEMENT.", "For each model in this Unit, set one Corrosive Bile token on the battlefield Within 14\" of that model. These tokens are not removed if this Unit is Destroyed. At the End of the Assault Phase, each Unit suffers HITS 5 (1) effect for each of this Unit's Corrosive Bile tokens it is Within 1\" of. Then, remove all of this Unit's Corrosive Bile tokens from the battlefield. If multiple effects trigger at the End of the Assault Phase, resolve them in the order specified in Part 8.9.4.": "Pour chaque figurine de cette unité, place un jeton Corrosive Bile sur le champ de bataille à 14\" de cette figurine. Ces jetons ne sont pas retirés si l’unité est détruite. À la fin de la phase d’Assaut, chaque unité subit l’effet HITS 5 (1) pour chaque jeton Corrosive Bile de cette unité à 1\" d’elle. Retire ensuite tous les jetons Corrosive Bile de cette unité. Si plusieurs effets se déclenchent à la fin de la phase d’Assaut, résous-les dans l’ordre indiqué en 8.9.4.", "Increase the area of effect of this Unit's Corrosive Bile ability to 2\".": "La zone d’effet de la capacité Corrosive Bile de cette unité passe à 2\".", "Before an Enemy Unit resolves an Armour Roll against the HITS effect generated by this Unit's Corrosive Bile ability, that Unit suffers DEBUFF Armour(1).": "Avant qu’une unité ennemie fasse un jet d’armure contre l’effet HITS de la capacité Corrosive Bile de cette unité, elle subit DEBUFF Armour(1).", "When another Friendly Unit Within 10\" is the target of a Ranged Attack, after the attack is fully resolved, this Unit, if Unengaged, may perform a Move action Directly Towards the attacking Unit.": "Quand une autre unité amie à 10\" est la cible d’une Ranged Attack, une fois l’attaque entièrement résolue, cette unité, si elle n’est pas engagée, peut faire une action Move directement vers l’unité qui a attaqué.", "This Unit gains TOUGH(1) on the first Armour Roll of each Activation.": "Cette unité gagne TOUGH(1) sur son premier jet d’armure de chaque activation.", "If this Unit has Stationary Status, it is eligible to make an Evade Roll against the first Ranged Attack targeting it this Round. If ON CREEP, it gains +1 Modifier to this Evade Roll.": "Si cette unité a le statut Stationary, elle peut faire un jet d’Evade contre la première Ranged Attack qui la vise ce round. Si elle est ON CREEP, elle gagne un modificateur +1 à ce jet d’Evade.", "When nominated to deploy from Reserves, may resolve PLACE(18) from the controlling player's Entry Edge. No model may be set Within 10\" of any Enemy model. This Unit's Activation ends.": "Quand elle est désignée pour se déployer depuis la réserve, elle peut résoudre PLACE(18) depuis l’Entry Edge de son joueur. Aucune figurine ne peut être placée à 10\" d’une figurine ennemie. L’activation de cette unité se termine.", "This Unit's Needle Spines ranged weapon gains LONG RANGE (16\").": "L’arme de tir Needle Spines de cette unité gagne LONG RANGE (16\").", "Set a Creep Tumor token in base-to-base contact with this Unit.": "Place un jeton Creep Tumor au contact socle à socle de cette unité.", "Use when another Friendly Biological Unit (including a Structure) suffers Damage Within 4\". Reduce the Total Damage before allocation by 2.": "À utiliser quand une autre unité Biological amie (Structure comprise) subit des dégâts à 4\". Réduis de 2 le total de dégâts avant leur répartition.", "Use when a Friendly Unit Within 4\" receives a DEBUFF. Remove all DEBUFFS from it.": "À utiliser quand une unité amie à 4\" reçoit un DEBUFF. Retire-lui tous ses DEBUFFS.", "Once per Round, if there are at least 7 Friendly models Within 6\" of this Unit, it may resolve its Special Ability with the BM cost reduced by 1.": "Une fois par round, s’il y a au moins 7 figurines amies à 6\" de cette unité, elle peut résoudre sa capacité spéciale avec un coût en BM réduit de 1.", "Immediately after this Unit completes a successful Charge, resolve the IMPACT(4) 3+ effect.": "Juste après une charge réussie de cette unité, résous l’effet IMPACT(4) 3+.", "While this Unit is ON CREEP, increase this Unit's Speed characteristic by 2.": "Tant que cette unité est ON CREEP, augmente sa caractéristique Speed de 2.", "Select another Friendly Unit Within 6\" (Line of Sight is not required). That Unit's Supply characteristic is increased by 1 for Controlling and Contesting Mission Markers and completing objectives.": "Choisis une autre unité amie à 6\" (sans ligne de vue nécessaire). Sa caractéristique Supply augmente de 1 pour contrôler et contester les marqueurs de mission et pour remplir les objectifs.", "Treat this Unit's Supply characteristic as increased by 1 for Controlling and Contesting Mission Markers, completing objectives, and resolving Disengage checks.": "La caractéristique Supply de cette unité compte comme augmentée de 1 pour contrôler et contester les marqueurs de mission, remplir les objectifs et résoudre les vérifications de Disengage.", "Select one Enemy Unit Within 12\". That Unit counts as Activated this Phase (set an Activation Marker next to it).": "Choisis une unité ennemie à 12\". Elle compte comme activée pendant cette phase (place un marqueur d’activation à côté).", "Select one Enemy Unit Within 18\". This Unit is eligible to make an Evade Roll against all attacks made by the selected Enemy Unit, with a +2 Modifier applied to those Evade Rolls.": "Choisis une unité ennemie à 18\". Cette unité peut faire un jet d’Evade contre toutes les attaques de l’unité ennemie choisie, avec un modificateur +2 à ces jets.", "If Unengaged, resolve the PLACE(6) effect.": "Si elle n’est pas engagée, résous l’effet PLACE(6).", "Immediately after this Unit completes a successful Charge, resolve the IMPACT(4) 4+ effect.": "Juste après une charge réussie de cette unité, résous l’effet IMPACT(4) 4+.", "This Unit cannot gain Burrowed Status.": "Cette unité ne peut pas gagner le statut Burrowed.", "While Enemy Units are Within 6\" of this Unit, they lose HIDDEN Status.": "Les unités ennemies à 6\" de cette unité perdent le statut HIDDEN.", "A Friendly or Enemy Ground Zerg Unit Within 6\" of this Unit, counts as being ON CREEP.": "Une unité Zerg Ground, amie ou ennemie, à 6\" de cette unité compte comme ON CREEP.", "This Unit cannot be Activated in any Phase and cannot perform actions. Its Current Supply Value is treated as 0, and it can never Control or Contest Mission Markers, ignoring the standard Zero Supply Exception. This Unit cannot be a target of an ability, unless stated otherwise.": "Cette unité ne peut être activée dans aucune phase et ne peut faire aucune action. Son supply actuel compte comme 0 et elle ne peut jamais contrôler ni contester de marqueur de mission, sans tenir compte de l’exception habituelle des unités à supply 0. Elle ne peut pas être ciblée par une capacité, sauf mention contraire.", "The base of the Omega Worm counts as an Entry Edge. Each Round, Friendly Units with a combined Supply cost of 2 or less may be Deployed via this Entry Edge. If a Friendly Leading model finishes a Move, Disengage, or Run action in base-to-base contact with the Omega Worm, the controlling player may remove that Unit from the battlefield and return it to Reserves.": "Le socle de l’Omega Worm compte comme une Entry Edge. À chaque round, des unités amies dont le coût de supply cumulé est de 2 ou moins peuvent être déployées par cette Entry Edge. Si un modèle de tête ami termine une action Move, Disengage ou Run au contact socle à socle de l’Omega Worm, son joueur peut retirer cette unité du champ de bataille et la remettre en réserve.", "The active Unit ignores the Disengage penalty for the remainder of the Round.": "L’unité active ignore la pénalité de Disengage jusqu’à la fin du round.", "Immediately claim the First Player Marker. No other player may claim the First Player Marker for the remainder of this Phase.": "Prends immédiatement le marqueur Premier joueur. Aucun autre joueur ne peut le prendre jusqu’à la fin de cette phase.", "Set a Friendly Point Defence Drone Unit anywhere on the battlefield, more than 1\" away from any Enemy model. Remove this Unit at the End of the Round.": "Place une unité Point Defence Drone amie n’importe où sur le champ de bataille, à plus de 1\" de toute figurine ennemie. Retire cette unité à la fin du round.", "The active Unit resolves the PLACE (12) effect. Models set by this effect cannot be set up Within the Engagement Range of any Enemy Unit. This resolves instead of performing a standard action.": "L’unité active résout l’effet PLACE (12). Les figurines placées par cet effet ne peuvent pas l’être dans l’Engagement Range d’une unité ennemie. Cela remplace une action normale.", "Use before a Friendly Biological Unit makes an Armour Roll. That Unit gains TOUGH (1) for this roll.": "À utiliser avant qu’une unité Biological amie fasse un jet d’armure. Elle gagne TOUGH (1) pour ce jet.", "The active Biological Unit's first Ranged Weapon used gains CRITICAL HIT (1).": "La première arme de tir utilisée par l’unité Biological active gagne CRITICAL HIT (1).", "The active Mechanical Unit resolves the HEAL (2) effect.": "L’unité Mechanical active résout l’effet HEAL (2).", "If the active Mechanical Unit has the Stationary Status, its first Ranged Weapon used gains PRECISION (2).": "Si l’unité Mechanical active a le statut Stationary, sa première arme de tir utilisée gagne PRECISION (2).", "Select one table edge that is not a player's Entry Edge. Until the End of the Round, Enemy Units cannot Deploy from that edge.": "Choisis un bord de table qui n’est pas l’Entry Edge d’un joueur. Jusqu’à la fin du round, les unités ennemies ne peuvent pas se déployer par ce bord.", "The active Unit's Supply Value is improved by 1 for Controlling and Contesting Mission Markers and completing objectives.": "La valeur de Supply de l’unité active est augmentée de 1 pour contrôler et contester les marqueurs de mission et pour remplir les objectifs.", "The active Biological Unit performs a 2\" Move action. This does not count towards its action limit.": "L’unité Biological active fait une action Move de 2\". Elle ne compte pas dans sa limite d’actions.", "The active Biological Unit Deploys from any table edge that is not a player's Entry Edge. No model may be placed Within 10\" of any Enemy model. This ability cannot be used if another Friendly Biological Unit has already been Deployed this Round.": "L’unité Biological active se déploie depuis n’importe quel bord de table qui n’est pas l’Entry Edge d’un joueur. Aucune figurine ne peut être placée à 10\" d’une figurine ennemie. Impossible si une autre unité Biological amie s’est déjà déployée ce round.", "The active Biological Unit's first Ranged Weapon used gains ANTI-EVADE (1).": "La première arme de tir utilisée par l’unité Biological active gagne ANTI-EVADE (1).", "Use before a Friendly Mechanical Unit makes an Armour Roll. That Unit gains TOUGH (1) for this roll.": "À utiliser avant qu’une unité Mechanical amie fasse un jet d’armure. Elle gagne TOUGH (1) pour ce jet.", "The active Mechanical Unit's first Ranged Weapon used gains CRITICAL HIT (1).": "La première arme de tir utilisée par l’unité Mechanical active gagne CRITICAL HIT (1).", "Once per Round, when a Friendly Support Unit activates a Special Ability that costs CP, resolve that ability with its CP cost reduced by 1 (to a minimum of 0). Do not Exhaust this card.": "Une fois par round, quand une unité Support amie active une capacité spéciale qui coûte des CP, résous-la avec un coût réduit de 1 CP (minimum 0). N’épuise pas cette carte.", "The active, Unengaged Ground Unit is returned to Reserves instead of performing an action.": "L’unité Ground active, non engagée, retourne en réserve au lieu de faire une action.", "Select one Enemy Unit Within 12\". Whenever a Friendly Goliath Unit targets that enemy with an Autocannon, that weapon gains Surge Type: Light, Armoured, and S Dice: D3+1.": "Choisis une unité ennemie à 12\". Chaque fois qu’une unité de Goliaths amie vise cet ennemi avec un Autocannon, cette arme gagne Surge Type : Light, Armoured et S Dice : D3+1.", "While Engaged, this Unit may target and be targeted by Unengaged Enemy Units. In both cases, the defending Unit gains an Evade Roll against those attacks.": "Quand elle est engagée, cette unité peut viser des unités ennemies non engagées et être visée par elles. Dans les deux cas, l’unité qui défend a droit à un jet d’Evade contre ces attaques.", "This Unit's Autocannon and Underbelly Machine Gun weapons gain PRECISION(1).": "Les armes Autocannon et Underbelly Machine Gun de cette unité gagnent PRECISION(1).", "The Supply Value of all Friendly Units Within 8\" of this Unit cannot be reduced below 1 for Contesting Mission Markers and completing objectives.": "La valeur de Supply des unités amies à 8\" de cette unité ne peut pas descendre sous 1 pour contester les marqueurs de mission et remplir les objectifs.", "Select another Friendly Biological Unit Within 8\", spend CP and apply one of the following effects:": "Choisis une autre unité Biological amie à 8\", dépense des CP et applique l’un des effets suivants :", "This Unit suffers NON-LETHAL DAMAGE (2). This Unit gains BUFF Speed (3). Additionally, its C-14 Rifle and all Close Combat Weapons gain PRECISION (3).": "Cette unité subit NON-LETHAL DAMAGE (2). Elle gagne BUFF Speed (3). De plus, son C-14 Rifle et toutes ses armes de corps à corps gagnent PRECISION (3).", "This Unit is always eligible to make an Evade Roll against any Close Combat Attack targeting it and any Damage from an Enemy Special Ability.": "Cette unité peut toujours faire un jet d’Evade contre toute Close Combat Attack qui la vise et contre tout dégât d’une capacité spéciale ennemie.", "When this Unit makes a Ranged Attack with a C-14 Rifle and the target is Within 8\", that weapon gains ANTI-EVADE (1).": "Quand cette unité fait une Ranged Attack avec un C-14 Rifle sur une cible à 8\", cette arme gagne ANTI-EVADE (1).", "When this Unit makes a Ranged Attack with a C-14 Rifle and the target is Within 8\", that weapon's S Dice is replaced by D6.": "Quand cette unité fait une Ranged Attack avec un C-14 Rifle sur une cible à 8\", le S Dice de cette arme devient D6.", "This Unit suffers NON-LETHAL DAMAGE (2). This Unit gains BUFF Speed (3). Additionally, its Quad K12 and all Close Combat Weapons gain PRECISION (2).": "Cette unité subit NON-LETHAL DAMAGE (2). Elle gagne BUFF Speed (3). De plus, son Quad K12 et toutes ses armes de corps à corps gagnent PRECISION (2).", "When an Enemy declares a Charge against a Friendly Unit Within 8\", that Enemy gains DEBUFF Speed (2).": "Quand un ennemi déclare une Charge contre une unité amie à 8\", cet ennemi subit DEBUFF Speed (2).", "While this Unit is Within 3\" of a Mission Marker, its Armour characteristic is increased by 1.": "Tant que cette unité est à 3\" d’un marqueur de mission, sa caractéristique Armour est améliorée de 1.", "Increase this Unit's Hit Points characteristic by 1.": "Augmente de 1 la caractéristique Hit Points de cette unité.", "This Unit's Quad K12 weapon gains LONG RANGE (16\").": "L’arme Quad K12 de cette unité gagne LONG RANGE (16\").", "Use when another Friendly Biological Unit suffers Damage Within 4\". Reduce the Total Damage before allocation by 1 for each model in this Unit that is Within 4\" of the damaged Unit.": "À utiliser quand une autre unité Biological amie subit des dégâts à 4\". Réduis le total de dégâts avant répartition de 1 par figurine de cette unité à 4\" de l’unité touchée.", "Select another Friendly Biological Unit Within 4\". Resolve the HEAL (X) effect for the targeted Unit, where X is the number of models in this Unit that are Within 4\" of the target Unit.": "Choisis une autre unité Biological amie à 4\". Résous pour elle l’effet HEAL (X), X étant le nombre de figurines de cette unité à 4\" de la cible.", "Select one Enemy Unit Within 12\". Until the End of the Round, apply DEBUFF Range (4) to that Unit's Ranged Weapons. That Unit cannot benefit from LONG RANGE.": "Choisis une unité ennemie à 12\". Jusqu’à la fin du round, applique DEBUFF Range (4) à ses armes de tir. Cette unité ne peut pas bénéficier de LONG RANGE.", "This Unit's Supply Value counts as 0 when calculating the Supply Pool.": "La valeur de Supply de cette unité compte comme 0 pour le calcul du Supply Pool.", "Increase the Optical Flare special ability's Range to 16\".": "La portée de la capacité spéciale Optical Flare passe à 16\".", "When this Unit resolves a Life Support or Medpack ability, treat it as having 1 additional model Within Range for calculating that ability's effects.": "Quand cette unité résout une capacité Life Support ou Medpack, considère qu’elle a une figurine de plus à portée pour calculer ses effets.", "When this Unit is nominated to deploy from Reserves, it may resolve its Stimpack ability with the CP cost reduced by 1 (to a minimum of 0).": "Quand cette unité est désignée pour se déployer depuis la réserve, elle peut résoudre sa capacité Stimpack avec un coût réduit de 1 CP (minimum 0).", "When this Unit is nominated to deploy from Reserves, it may resolve the PLACE (10) effect from another Friendly Unit. No model may be set Within 8\" of any Enemy model. This Unit's Activation ends.": "Quand cette unité est désignée pour se déployer depuis la réserve, elle peut résoudre l’effet PLACE (10) à partir d’une autre unité amie. Aucune figurine ne peut être placée à 8\" d’une figurine ennemie. L’activation de cette unité se termine.", "When this Unit's Leading Model moves, it cannot pass through physical gaps smaller than 3\" wide, regardless of its size. If the Leading Model's path of travel passes through, or any model in this Unit ends its movement on a Size 0 or Size 1 Impassible Terrain piece (excluding Tokens) during any movement action, that terrain piece is immediately removed from the game.": "Quand le modèle de tête de cette unité se déplace, il ne peut pas passer par des ouvertures de moins de 3\" de large, quelle que soit sa taille. Si son trajet traverse un élément d’Impassable Terrain de Size 0 ou 1 (hors jetons), ou si une figurine de l’unité termine un déplacement dessus, cet élément est immédiatement retiré de la partie.", "When this Unit resolves an Armour Roll, it gains TOUGH (1), provided it does not currently have the SIEGE MODE Status.": "Quand cette unité fait un jet d’armure, elle gagne TOUGH (1), à condition de ne pas avoir le statut SIEGE MODE.", "While this Unit has the SIEGE MODE Status, it cannot target Enemy Units it is Engaged with.": "Tant que cette unité a le statut SIEGE MODE, elle ne peut pas viser les unités ennemies avec lesquelles elle est engagée.", "When this Unit has the SIEGE MODE Status, its Damage characteristic is treated as equal to the Size characteristic of the current target Unit (to a minimum of 1).": "Quand cette unité a le statut SIEGE MODE, sa caractéristique Damage est égale à la caractéristique Size de l’unité visée (minimum 1).", "Immediately after this Unit completes a successful Charge, resolve the IMPACT (4) 3+ effect.": "Juste après une charge réussie de cette unité, résous l’effet IMPACT (4) 3+.", "The active Unit gains or loses the SIEGE MODE Status. While this Unit has the SIEGE MODE Status, its Size characteristic is treated as if it was 3.": "L’unité active gagne ou perd le statut SIEGE MODE. Tant qu’elle a ce statut, sa caractéristique Size compte comme 3.", "Target a Friendly Non-Engaged Unit on the battlefield (Line of Sight is not required). When this Unit resolves a Ranged Attack using the Shock Cannon weapon profile this Round, it may choose to ignore the weapon's standard Range characteristic. If it does, it may target an Enemy Unit that is Within 8\" of, and Visible to, a model of the selected Friendly Unit, treating that model as the acting model.": "Désigne une unité amie non engagée sur le champ de bataille (sans ligne de vue nécessaire). Quand cette unité fait une Ranged Attack avec le profil Shock Cannon ce round, elle peut ignorer la portée normale de l’arme. Dans ce cas, elle peut viser une unité ennemie à 8\" d’une figurine de l’unité amie désignée et visible par elle, cette figurine étant considérée comme celle qui agit.", "When this Unit declares a Ranged Attack action. If this Unit has SIEGE MODE Status, its weapon gains PINPOINT and LOCKED IN (4).": "Quand cette unité déclare une Ranged Attack : si elle a le statut SIEGE MODE, son arme gagne PINPOINT et LOCKED IN (4).", "When this Unit declares a Ranged Attack action. If this Unit has SIEGE MODE Status, its weapon gains INDIRECT FIRE and LONG RANGE (24).": "Quand cette unité déclare une Ranged Attack : si elle a le statut SIEGE MODE, son arme gagne INDIRECT FIRE et LONG RANGE (24).", "When another Friendly Unit Within 4\" is targeted by a Ranged Attack without the INSTANT keyword, remove up to 2 dice from the Attack Pool. Then remove this Unit from the battlefield.": "Quand une autre unité amie à 4\" est visée par une Ranged Attack sans le mot-clé INSTANT, retire jusqu’à 2 dés du pool d’attaque. Retire ensuite cette unité du champ de bataille.", "This model has DISPLACEMENT.": "Cette figurine a DISPLACEMENT.", "This Unit cannot be Activated in any Phase and cannot perform actions. Additionally, its Current Supply Value is treated as 0, and it can never Control or Contest Mission Markers, ignoring the standard Zero Supply Exception. This Unit cannot be a target of an ability, unless stated otherwise.": "Cette unité ne peut être activée dans aucune phase et ne peut faire aucune action. De plus, son supply actuel compte comme 0 et elle ne peut jamais contrôler ni contester de marqueur de mission, sans tenir compte de l’exception habituelle des unités à supply 0. Elle ne peut pas être ciblée par une capacité, sauf mention contraire.", "When a Friendly Unit receives Damage, reduce the Total Damage by 2 (to a minimum of 1).": "Quand une unité amie subit des dégâts, réduis le total de dégâts de 2 (minimum 1).", "Set a Faction Indicator anywhere on the battlefield. All Friendly Protoss Units Within 6\" of this Faction Indicator are removed from the battlefield and returned to Reserves.": "Place un Faction Indicator n’importe où sur le champ de bataille. Toutes les unités Protoss amies à 6\" de ce Faction Indicator sont retirées du champ de bataille et remises en réserve.", "If there is no Friendly Pylon on the battlefield, set a Friendly Pylon Unit anywhere on the GROUND LEVEL of the battlefield more than 10\" away from any Enemy model. This Round, the Pylon is not eligible to use its Special Abilities (excluding Structure).": "S’il n’y a pas de Pylon ami sur le champ de bataille, place une unité Pylon amie n’importe où au GROUND LEVEL, à plus de 10\" de toute figurine ennemie. Ce round, le Pylon ne peut pas utiliser ses capacités spéciales (sauf Structure).", "At the end of the active Unit's Activation, select one other Friendly Unit eligible to Activate in the current Phase. Immediately Activate that Unit.": "À la fin de l’activation de l’unité active, choisis une autre unité amie qui peut être activée dans la phase en cours. Active-la immédiatement.", "If a Friendly Unit loses the HIDDEN Status, it gains Buff Speed (2) and its first Weapon used CRITICAL HIT (2).": "Si une unité amie perd le statut HIDDEN, elle gagne Buff Speed (2) et sa première arme utilisée gagne CRITICAL HIT (2).", "The active Biological Unit gains the HIDDEN Status until the End of the Round.": "L’unité Biological active gagne le statut HIDDEN jusqu’à la fin du round.", "Use before a Friendly Ground Unit makes an Armour Roll. That Unit gains TOUGH (1) for this roll.": "À utiliser avant qu’une unité Ground amie fasse un jet d’armure. Elle gagne TOUGH (1) pour ce jet.", "The active Ground Unit's first Ranged Weapon used gains CRITICAL HIT (1).": "La première arme de tir utilisée par l’unité Ground active gagne CRITICAL HIT (1).", "The active Unit gains BUFF Speed (2).": "L’unité active gagne BUFF Speed (2).", "The active Unit's first Close Combat Weapon used gains PRECISION (2).": "La première arme de corps à corps utilisée par l’unité active gagne PRECISION (2).", "The active Unit's first Weapon used gains INSTANT.": "La première arme utilisée par l’unité active gagne INSTANT.", "Use after a Friendly Unit rolls a D6 for Charge Distance. Add 1 to the Charge Distance for this Unit.": "À utiliser après qu’une unité amie a lancé un D6 pour sa distance de charge. Ajoute 1 à la distance de charge de cette unité.", "Use when an Enemy Unit enters the battlefield from Reserves via a location other than its own Entry Edge. That Unit immediately suffers HITS 3 (1).": "À utiliser quand une unité ennemie entre sur le champ de bataille depuis la réserve par un autre endroit que sa propre Entry Edge. Elle subit immédiatement HITS 3 (1).", "Use before a Friendly Ground Unit makes an Armour Roll. That Unit gains DODGE (2) for this roll.": "À utiliser avant qu’une unité Ground amie fasse un jet d’armure. Elle gagne DODGE (2) pour ce jet.", "Use before a Friendly Mechanical Ground Unit makes an Armour Roll. If this Unit has the Shielded Status, it gains TOUGH (1) and DODGE (1) for this roll.": "À utiliser avant qu’une unité Mechanical Ground amie fasse un jet d’armure. Si cette unité a le statut Shielded, elle gagne TOUGH (1) et DODGE (1) pour ce jet.", "Use after a Friendly Unit resolves a PLACE effect. That Unit immediately resolves the HEAL (2) effect.": "À utiliser après qu’une unité amie a résolu un effet PLACE. Elle résout immédiatement l’effet HEAL (2).", "The active Ground Unit's first Ranged Weapon used gains BUFF Range (4).": "La première arme de tir utilisée par l’unité Ground active gagne BUFF Range (4).", "Instead of performing an action, the active, Unengaged Ground Unit is returned to Reserves. Then, it performs a Deploy action.": "Au lieu de faire une action, l’unité Ground active, non engagée, retourne en réserve. Elle fait ensuite une action Deploy.", "This Unit gains the HIDDEN Status until it performs another action.": "Cette unité gagne le statut HIDDEN jusqu’à ce qu’elle fasse une autre action.", "The active GROUND Unit Deploys from any table edge that is not a player's Entry Edge. This deployment must end more than 10\" away from any Enemy model. The controlling player cannot use this ability if another Friendly Ground Unit has already Deployed this Round.": "L’unité GROUND active se déploie depuis n’importe quel bord de table qui n’est pas l’Entry Edge d’un joueur. Ce déploiement doit se terminer à plus de 10\" de toute figurine ennemie. Impossible si une autre unité Ground amie s’est déjà déployée ce round.", "The active Unit resolves the PLACE (3) effect.": "L’unité active résout l’effet PLACE (3).", "Set a Faction Indicator anywhere on the battlefield more than 10\" away from any Enemy model. At the End of the Round, you may Deploy one Ground unit from Reserves in base-to-base Contact with this Faction Indicator.": "Place un Faction Indicator n’importe où sur le champ de bataille, à plus de 10\" de toute figurine ennemie. À la fin du round, tu peux déployer une unité Ground depuis la réserve, au contact socle à socle de ce Faction Indicator.", "All Weapons of Friendly Units targeting an Enemy Unit Within 4\" of this Unit's Shade token gain PRECISION (1).": "Toutes les armes des unités amies qui visent une unité ennemie à 4\" du jeton Shade de cette unité gagnent PRECISION (1).", "Set a Shade token Wholly Within 12\" of any model in this Unit. At the End of the Round, the controlling player may set all models of this Unit in Coherency, treating the Shade token as the Leading Model. The Shade token has DISPLACEMENT.": "Place un jeton Shade entièrement à 12\" d’une figurine de cette unité. À la fin du round, le joueur qui la contrôle peut placer toutes les figurines de l’unité en cohésion, en prenant le jeton Shade comme modèle de tête. Le jeton Shade a DISPLACEMENT.", "This Unit's Glaive Cannon gains BUFF RoA (1).": "Le Glaive Cannon de cette unité gagne BUFF RoA (1).", "This Unit's Glaive Cannon Ranged weapon gains ANTI-EVADE (2).": "L’arme de tir Glaive Cannon de cette unité gagne ANTI-EVADE (2).", "When Artanis is nominated to deploy from Reserves, it may resolve the PLACE (0) effect from another Friendly Unit. That Friendly Unit is removed from the battlefield and returned to Reserves. Artanis' Activation ends.": "Quand Artanis est désigné pour se déployer depuis la réserve, il peut résoudre l’effet PLACE (0) à partir d’une autre unité amie. Cette unité amie est retirée du champ de bataille et remise en réserve. L’activation d’Artanis se termine.", "After this Unit resolves a successful Charge action, it may declare a second Charge action against a different Enemy Unit, ignoring the restriction on Charging while Engaged. The Devastating Charge ability does not trigger a second time.": "Après une charge réussie, cette unité peut déclarer une deuxième charge contre une autre unité ennemie, en ignorant l’interdiction de charger en étant engagée. La capacité Devastating Charge ne se déclenche pas une deuxième fois.", "When another Friendly Unit Within 8\" is declared as the target of a Ranged Attack and this Unit is a valid target, redirect the attack to this Unit. This Unit is eligible to make an Evade Roll against the redirected attack. This Special Ability remains active until the End of the current Activation.": "Quand une autre unité amie à 8\" est déclarée cible d’une Ranged Attack et que cette unité est une cible valide, redirige l’attaque sur cette unité. Elle peut faire un jet d’Evade contre l’attaque redirigée. Cette capacité reste active jusqu’à la fin de l’activation en cours.", "Immediately after this Unit completes a successful Charge, resolve the IMPACT (6) 4+ effect.": "Juste après une charge réussie de cette unité, résous l’effet IMPACT (6) 4+.", "Use when this Unit is selected as the target of an attack. If this Unit has the Shielded Status, the Damage characteristic of the attacking weapon is treated as a maximum of 1 for this attack.": "À utiliser quand cette unité est choisie comme cible d’une attaque. Si elle a le statut Shielded, la caractéristique Damage de l’arme qui attaque est limitée à 1 pour cette attaque.", "Use before this Unit makes an Armour Roll. If this Unit has the Shielded Status, It gains TOUGH (2) for this roll.": "À utiliser avant que cette unité fasse un jet d’armure. Si elle a le statut Shielded, elle gagne TOUGH (2) pour ce jet.", "While this Unit is Within 3\" of a Mission Marker, its Ranged Weapons gain CRITICAL HIT (1) when targeting an Enemy Unit that is also Within 3\" of that same Mission Marker.": "Tant que cette unité est à 3\" d’un marqueur de mission, ses armes de tir gagnent CRITICAL HIT (1) contre une unité ennemie qui est aussi à 3\" de ce même marqueur.", "When this Unit makes a Ranged Attack, if the target Unit is more than 8\" away, the attacking weapons gain PRECISION (1).": "Quand cette unité fait une Ranged Attack sur une cible à plus de 8\", les armes qui attaquent gagnent PRECISION (1).", "This Unit gains HIDDEN Status until it performs another action.": "Cette unité gagne le statut HIDDEN jusqu’à ce qu’elle fasse une autre action.", "While Enemy Units are Within 6\" of this Unit's Shade token, they lose HIDDEN Status.": "Les unités ennemies à 6\" du jeton Shade de cette unité perdent le statut HIDDEN.", "This Unit gains TOUGH (2) on the first Armour Roll each Round.": "Cette unité gagne TOUGH (2) sur son premier jet d’armure de chaque round.", "This Unit performs a 2\" Move action. This does not count towards its action limit.": "Cette unité fait une action Move de 2\". Elle ne compte pas dans sa limite d’actions.", "Immediately after this Unit completes a successful Charge, resolve the IMPACT (3) 4+ effect.": "Juste après une charge réussie de cette unité, résous l’effet IMPACT (3) 4+.", "When this Unit makes a Close Combat Attack, and the target is Size 3 or larger, the weapon's Damage characteristic is treated as 2.": "Quand cette unité fait une Close Combat Attack contre une cible de Size 3 ou plus, la caractéristique Damage de l’arme compte comme 2.", "This Unit is eligible to make an Evade roll against all attacks targeting it.": "Cette unité peut faire un jet d’Evade contre toutes les attaques qui la visent.", "All Ranged Attacks targeting a Friendly Unit Within 4\" (Line of Sight is not required) are made with 1 fewer die in the Attack Pool.": "Toutes les Ranged Attacks qui visent une unité amie à 4\" (sans ligne de vue nécessaire) se font avec 1 dé de moins dans le pool d’attaque.", "Set a Force Field token Within 8\" in an unoccupied space. Units of Size 2 or lower cannot move across Force Fields. Models of Size 3 or more can move over it, and it's then removed.": "Place un jeton Force Field à 8\", dans un espace libre. Les unités de Size 2 ou moins ne peuvent pas traverser les Force Fields. Les figurines de Size 3 ou plus peuvent passer dessus, et le jeton est alors retiré.", "When an Enemy Unit declares a Ranged Attack against a Friendly Unit Within 4\", the targeted Friendly Unit is eligible to make an Evade Roll against that attack.": "Quand une unité ennemie déclare une Ranged Attack contre une unité amie à 4\", l’unité amie visée peut faire un jet d’Evade contre cette attaque.", "When this Unit resolves IMPACT, each eligible model generates 1 additional IMPACT die.": "Quand cette unité résout IMPACT, chaque figurine éligible génère 1 dé d’IMPACT supplémentaire.", "When this Unit is not Activated and receives Damage, the controlling player may count this Unit as Activated in this Phase (flip its Activation Marker) to reduce the Total Damage by 2.": "Quand cette unité n’est pas activée et subit des dégâts, son joueur peut la considérer comme activée pour cette phase (retourne son marqueur d’activation) pour réduire le total de dégâts de 2.", "When this Unit makes a Close Combat Attack, if the target is Engaged with at least 1 other Friendly Unit, this Unit's Close Combat Weapon gains PRECISION (2).": "Quand cette unité fait une Close Combat Attack contre une cible engagée avec au moins 1 autre unité amie, son arme de corps à corps gagne PRECISION (2).", "Resolve the PLACE (6) effect. Models set by this effect cannot be set up Within the Engagement Range of any Enemy Unit.": "Résous l’effet PLACE (6). Les figurines placées par cet effet ne peuvent pas l’être dans l’Engagement Range d’une unité ennemie.", "When this Unit attacks an Enemy Unit that has already been Activated during this Phase, its Particle Disruptors gain INSTANT for that attack.": "Quand cette unité attaque une unité ennemie déjà activée pendant cette phase, ses Particle Disruptors gagnent INSTANT pour cette attaque.", "After this Unit fully resolves an Action, it gains the HIDDEN Status.": "Quand cette unité a entièrement résolu une action, elle gagne le statut HIDDEN.", "REPEATABLE. Use when this Unit is selected as the target of an attack. This Unit's Evade characteristic is treated as 4+ against this attack and cannot be modified.": "REPEATABLE. À utiliser quand cette unité est choisie comme cible d’une attaque. Sa caractéristique Evade compte comme 4+ contre cette attaque et ne peut pas être modifiée.", "Target Enemy Unit on the battlefield. Whenever Zeratul makes a Close Combat Attack targeting the selected Unit, its weapon gains CRITICAL HIT (2).": "Désigne une unité ennemie sur le champ de bataille. Chaque fois que Zeratul fait une Close Combat Attack contre elle, son arme gagne CRITICAL HIT (2).", "Set a Faction Indicator on the battlefield Within 8\" of this Unit. While Enemy Units are Within 2\" of this Faction Indicator they suffer DEBUFF Speed (2).": "Place un Faction Indicator sur le champ de bataille à 8\" de cette unité. Les unités ennemies à 2\" de ce Faction Indicator subissent DEBUFF Speed (2).", "If Unengaged, resolve the PLACE (6) effect.": "Si elle n’est pas engagée, résous l’effet PLACE (6).", "Immediately after this Unit completes a successful Charge, resolve the IMPACT (4) 4+ effect.": "Juste après une charge réussie de cette unité, résous l’effet IMPACT (4) 4+.", "All Enemy Units Engaged with this Unit suffer HITS 4 (1).": "Toutes les unités ennemies engagées avec cette unité subissent HITS 4 (1).", "Once per Round, when a Friendly Unit Within 4\" of this Pylon uses a Special Ability that costs Psionic Energy, that ability's PE cost is reduced by 1.": "Une fois par round, quand une unité amie à 4\" de ce Pylon utilise une capacité spéciale qui coûte de l’énergie psionique, son coût en PE est réduit de 1.", "Once per Round, the controlling player may deploy a Ground Unit from Reserves using this Pylon base as the Entry Edge. This Unit's Activation ends.": "Une fois par round, le joueur qui le contrôle peut déployer une unité Ground depuis la réserve en utilisant le socle de ce Pylon comme Entry Edge. L’activation de cette unité se termine.", "Select up to two of your Exhausted Tactical Cards. Return them to the Ready state.": "Choisis jusqu’à deux de tes Tactical Cards épuisées. Remets-les prêtes.", "Instead of performing an action, select one other Friendly Biological Unit that has already been Activated this Phase. That Unit immediately performs one action available in the current Phase, then suffers NON-LETHAL DAMAGE (3).": "Au lieu de faire une action, choisis une autre unité Biological amie déjà activée pendant cette phase. Elle fait immédiatement une action possible dans la phase en cours, puis subit NON-LETHAL DAMAGE (3).", "Once per Round, when a Friendly Support Unit activates a Special Ability that costs PE, resolve that ability with its PE cost reduced by 1 (to a minimum of 0). Do not Exhaust this card.": "Une fois par round, quand une unité Support amie active une capacité spéciale qui coûte des PE, résous-la avec un coût réduit de 1 PE (minimum 0). N’épuise pas cette carte.", "Set two Force Wall tokens Wholly Within 8\" in an unoccupied space. Units of Size 2 or lower cannot move across the Force Wall. Models of Size 3 or more can move over it, and it's then removed.": "Place deux jetons Force Wall entièrement à 8\", dans un espace libre. Les unités de Size 2 ou moins ne peuvent pas traverser le Force Wall. Les figurines de Size 3 ou plus peuvent passer dessus, et il est alors retiré.", "Target another Friendly Biological Unit Within 12\". Until the End of the Round, that Unit resolves its first Special Ability with the cost reduced by 1 (to a minimum of 0).": "Désigne une autre unité Biological amie à 12\". Jusqu’à la fin du round, elle résout sa première capacité spéciale avec un coût réduit de 1 (minimum 0).", "Target two Enemy Units on the battlefield (Line of Sight is not required) and place a Faction Indicator next to each of them. During the next Assault Phase, if either of these Units ends its Activation while its Faction Indicator remains on the battlefield, you may Activate two Friendly Units consecutively. Remove both Faction Indicators after any Enemy Unit completes its Activation in the following Assault Phase.": "Désigne deux unités ennemies sur le champ de bataille (sans ligne de vue nécessaire) et place un Faction Indicator à côté de chacune. Pendant la phase d’Assaut suivante, si l’une d’elles termine son activation alors que son Faction Indicator est encore sur le champ de bataille, tu peux activer deux unités amies à la suite. Retire les deux Faction Indicators après qu’une unité ennemie a terminé son activation pendant cette phase d’Assaut.", "Each Unit Within 2\" of one or more Friendly Force Wall tokens suffers 1 Damage.": "Chaque unité à 2\" d’un ou plusieurs jetons Force Wall amis subit 1 dégât.", "Set each Friendly Force Wall token Wholly Within 6\" of its current position.": "Replace chaque jeton Force Wall ami entièrement à 6\" de sa position actuelle.", "Use when the Current Supply Value of another Friendly Unit Within 8\" of this Unit is reduced. Return one Non-Unique Exhausted Tactical Card to the Ready state.": "À utiliser quand le supply actuel d’une autre unité amie à 8\" de cette unité diminue. Remets prête une Tactical Card non Unique épuisée.", "Set a Psionic Storm token Within 10\" and Line of Sight of this Unit. This token is not removed if this Unit is Destroyed. At the End of each Phase, set a Psionic Storm Blast Template on the centre of this token. For each Unit that has at least one model whose base is partially covered by the template, roll 3 dice, plus 1 additional die for each model in that Unit whose base is partially covered. For each result of 4+, that Unit suffers an effect depending on the current Phase: Movement Phase: NON-LETHAL DAMAGE (1). Assault Phase: 1 Damage. If multiple effects trigger at the End of the Assault Phase, resolve them in the order specified in Part 8.9.4.": "Place un jeton Psionic Storm à 10\" et en ligne de vue de cette unité. Ce jeton n’est pas retiré si l’unité est détruite. À la fin de chaque phase, pose un Blast Template Psionic Storm au centre de ce jeton. Pour chaque unité dont au moins une figurine a son socle en partie recouvert par le gabarit, lance 3 dés, plus 1 dé par figurine de cette unité dont le socle est en partie recouvert. Pour chaque résultat de 4+, l’unité subit un effet qui dépend de la phase en cours : phase de Mouvement : NON-LETHAL DAMAGE (1) ; phase d’Assaut : 1 dégât. Si plusieurs effets se déclenchent à la fin de la phase d’Assaut, résous-les dans l’ordre indiqué en 8.9.4.", "Target one Enemy Mechanical or Psionic Unit Within 8\". Until the End of the Round, after that Unit resolves an Active or Reaction Special Ability (excluding abilities granted by a Tactical Card or Faction Card), it suffers NON-LETHAL DAMAGE (3).": "Désigne une unité ennemie Mechanical ou Psionic à 8\". Jusqu’à la fin du round, chaque fois qu’elle résout une capacité spéciale Active ou Reaction (sauf celles données par une Tactical Card ou une Faction Card), elle subit ensuite NON-LETHAL DAMAGE (3).", "Resolve the PLACE (6) effect.": "Résous l’effet PLACE (6).", "While this Unit's Current Supply Value is 2, it gains the following effects: The first Special Ability resolved by this Unit each Round has its PE cost reduced by 1 (to a minimum of 0). Apply a +1 Modifier to the dice rolled for its Psionic Storm Special Ability.": "Tant que le supply actuel de cette unité est de 2, elle gagne ces effets : la première capacité spéciale qu’elle résout chaque round coûte 1 PE de moins (minimum 0) ; applique un modificateur +1 aux dés lancés pour sa capacité Psionic Storm.", "Set a Psionic Storm token Within 10\" and Line of Sight of this Unit. This token is not removed if this Unit is Destroyed. At the End of each Phase, set a Psionic Storm Blast Template on the centre of this token. For each Unit that has at least one model whose base is partially covered by the template, roll 3 dice, plus 1 additional die for each model in that Unit whose base is partially covered. For each result of 5+, that Unit suffers an effect depending on the current Phase: Movement Phase: NON-LETHAL DAMAGE (1). Assault Phase: 1 Damage. If multiple effects trigger at the End of the Assault Phase, resolve them in the order specified in Part 8.9.4.": "Place un jeton Psionic Storm à 10\" et en ligne de vue de cette unité. Ce jeton n’est pas retiré si l’unité est détruite. À la fin de chaque phase, pose un Blast Template Psionic Storm au centre de ce jeton. Pour chaque unité dont au moins une figurine a son socle en partie recouvert par le gabarit, lance 3 dés, plus 1 dé par figurine de cette unité dont le socle est en partie recouvert. Pour chaque résultat de 5+, l’unité subit un effet qui dépend de la phase en cours : phase de Mouvement : NON-LETHAL DAMAGE (1) ; phase d’Assaut : 1 dégât. Si plusieurs effets se déclenchent à la fin de la phase d’Assaut, résous-les dans l’ordre indiqué en 8.9.4.", "Target one Friendly Unit Within 12\". Until the End of the Round, that Unit is eligible to make an Evade Roll against any attacks targeting it.": "Désigne une unité amie à 12\". Jusqu’à la fin du round, elle peut faire un jet d’Evade contre toutes les attaques qui la visent.", "Use when an Enemy Unit declares a Close Combat Attack against a Friendly Unit. That Friendly Unit becomes eligible to make an Evade Roll against that attack.": "À utiliser quand une unité ennemie déclare une Close Combat Attack contre une unité amie. Cette unité amie peut alors faire un jet d’Evade contre cette attaque.", "If the active Unit contains more models than the combined number of models in all Engaged Enemy Units, its Close Combat Weapons gain INSTANT and PRECISION (4).": "Si l’unité active a plus de figurines que l’ensemble des unités ennemies engagées avec elle, ses armes de corps à corps gagnent INSTANT et PRECISION (4).", "While a Friendly Zerg Unit is ON CREEP, it gains DODGE (1) against any attacks targeting it.": "Tant qu’une unité Zerg amie est ON CREEP, elle gagne DODGE (1) contre toutes les attaques qui la visent.", "Set a Faction Indicator on the active Friendly Unit. At the end of the Assault Phase, all Biological Enemy Units Engaged with the marked Unit suffer NON-LETHAL DAMAGE (2).": "Place un Faction Indicator sur l’unité amie active. À la fin de la phase d’Assaut, toutes les unités ennemies Biological engagées avec l’unité marquée subissent NON-LETHAL DAMAGE (2).", "The base of the Zagara counts as an Entry Edge. Each Round, Friendly Units with a combined Supply cost of 1 may be Deployed via this Entry Edge.": "Le socle de Zagara compte comme une Entry Edge. À chaque round, des unités amies dont le coût de supply cumulé est de 1 peuvent être déployées par cette Entry Edge.", "Immediately after this Unit completes a successful Charge, resolve the IMPACT (6) 3+ effect.": "Juste après une charge réussie de cette unité, résous l’effet IMPACT (6) 3+.", "Apply one of the following effects to all Friendly units (Line of Sight is not required). You cannot apply the effect chosen in the previous Game Round: Units of Size 1 gain a +1 Modifier to all IMPACT Rolls. All weapons of Size 2 Units gain CRITICAL HIT (1). Units of Size 3 or more gain TOUGH (1).": "Applique l’un des effets suivants à toutes les unités amies (sans ligne de vue nécessaire). Tu ne peux pas choisir l’effet appliqué au round précédent : les unités de Size 1 gagnent un modificateur +1 à tous leurs jets d’IMPACT ; toutes les armes des unités de Size 2 gagnent CRITICAL HIT (1) ; les unités de Size 3 ou plus gagnent TOUGH (1).", "Resolve the RESPAWN (2) effect, or RESPAWN (3) if the Unit is ON CREEP.": "Résous l’effet RESPAWN (2), ou RESPAWN (3) si l’unité est ON CREEP.", "When this Unit is nominated to deploy from the Reserves, it may resolve the PLACE (18) effect from the controlling player's Entry Edge. No model may be set Within 10\" of any Enemy model. This Unit's Activation ends.": "Quand cette unité est désignée pour se déployer depuis la réserve, elle peut résoudre l’effet PLACE (18) depuis l’Entry Edge de son joueur. Aucune figurine ne peut être placée à 10\" d’une figurine ennemie. L’activation de cette unité se termine.", "Immediately after this Unit completes a successful Charge, resolve the IMPACT (1) 5+ effect.": "Juste après une charge réussie de cette unité, résous l’effet IMPACT (1) 5+.", "After an Enemy Unit suffers Damage from this Unit, apply DEBUFF Hit (1) to each of that Unit's Weapons.": "Après qu’une unité ennemie a subi des dégâts de cette unité, applique DEBUFF Hit (1) à chacune de ses armes.", "When this Unit resolves a Special Ability that costs BM, it can remove one model from a Friendly Unit Within 4\" to generate 1 BM to spend towards that ability's cost.": "Quand cette unité résout une capacité spéciale qui coûte des BM, elle peut retirer une figurine d’une unité amie à 4\" pour générer 1 BM à dépenser pour ce coût.", "Set a Dark Swarm token in an unoccupied space Within 4\" and Line of Sight of this Unit. The Dark Swarm token has DISPLACEMENT.": "Place un jeton Dark Swarm dans un espace libre à 4\" et en ligne de vue de cette unité. Le jeton Dark Swarm a DISPLACEMENT.", "REPEATABLE. Use when a Friendly Unit Within 4\" of a Friendly Dark Swarm token is selected as the target of an attack. If this Unit is Within 4\" of the same token, the Targeted Friendly Unit is eligible to make an Evade Roll against that attack. If the targeted Unit is a Size 1, it gains a +1 Modifier to this Evade Roll.": "REPEATABLE. À utiliser quand une unité amie à 4\" d’un jeton Dark Swarm ami est choisie comme cible d’une attaque. Si cette unité est à 4\" du même jeton, l’unité amie visée peut faire un jet d’Evade contre cette attaque. Si l’unité visée est de Size 1, elle gagne un modificateur +1 à ce jet d’Evade.", "When this Unit is nominated to deploy from Reserves, it may resolve the PLACE (18) effect from the controlling player's Entry Edge. No model may be placed Within 10\" of any Enemy model. This Unit's Activation ends.": "Quand cette unité est désignée pour se déployer depuis la réserve, elle peut résoudre l’effet PLACE (18) depuis l’Entry Edge de son joueur. Aucune figurine ne peut être placée à 10\" d’une figurine ennemie. L’activation de cette unité se termine.", "You may spend 1 to 3 BM to activate this ability. Set a Plague Blast Template Wholly Within 10\" and Line of Sight of this Unit. For each Unit that has at least one model whose base is partially covered by the template, roll 2 dice, plus 1 additional die for each model in that Unit whose base is partially covered. That Unit loses its HIDDEN Status, and, depending on the BM spent, it suffers NON-LETHAL DAMAGE (1) for: 1 BM: each result of 5+. 2 BM: each result of 4+. 3 BM: each result of 3+.": "Tu peux dépenser de 1 à 3 BM pour activer cette capacité. Place un Blast Template Plague entièrement à 10\" et en ligne de vue de cette unité. Pour chaque unité dont au moins une figurine a son socle en partie recouvert, lance 2 dés, plus 1 dé par figurine de cette unité dont le socle est en partie recouvert. L’unité perd le statut HIDDEN et, selon les BM dépensés, subit NON-LETHAL DAMAGE (1) pour : 1 BM, chaque résultat de 5+ ; 2 BM, chaque résultat de 4+ ; 3 BM, chaque résultat de 3+.", "This Unit cannot gain the BURROWED Status, cannot be returned to Reserves, and is immune to the IMPACT keyword.": "Cette unité ne peut pas gagner le statut BURROWED, ne peut pas être remise en réserve et est immunisée au mot-clé IMPACT.", "While Enemy Units are Within 6\" of this Unit, they lose the HIDDEN Status.": "Les unités ennemies à 6\" de cette unité perdent le statut HIDDEN.", "A Friendly or Enemy Ground Zerg Unit Within 6\" of this Unit counts as being ON CREEP.": "Une unité Zerg Ground, amie ou ennemie, à 6\" de cette unité compte comme ON CREEP.", "Set a Bile Bomb token on the battlefield Within 24\" of this Unit. When this Unit resolves a Ranged Attack using the Bile Bomb weapon profile this Round, it may choose to ignore the weapon's standard Range characteristic. If it does, it may target an Enemy Unit that is Within 3\" of that token (Line of Sight is not required), ignoring the HIDDEN Status. After the attack is fully resolved, remove the Bile Bomb token from the battlefield. When the Bile Bomb token is about to be removed, set a Creep Tumor token in base-to-base contact with it. The Bile Bomb token has DISPLACEMENT.": "Place un jeton Bile Bomb sur le champ de bataille à 24\" de cette unité. Quand cette unité fait une Ranged Attack avec le profil Bile Bomb ce round, elle peut ignorer la portée normale de l’arme. Dans ce cas, elle peut viser une unité ennemie à 3\" de ce jeton (sans ligne de vue nécessaire), en ignorant le statut HIDDEN. Une fois l’attaque entièrement résolue, retire le jeton Bile Bomb. Juste avant de le retirer, place un jeton Creep Tumor au contact socle à socle de lui. Le jeton Bile Bomb a DISPLACEMENT.", "Set a Friendly Sabotage Drone Unit Within 12\" of a Friendly Unit, more than 1\" away from any Enemy model. Remove this Unit at the End of the Round.": "Place une unité Sabotage Drone amie à 12\" d’une unité amie, à plus de 1\" de toute figurine ennemie. Retire cette unité à la fin du round.", "Target an Enemy Unit on the battlefield. When a Friendly Unit makes an Attack targeting that Unit, its first Melee or Ranged Weapon used gains CRITICAL HIT (1) and PRECISION (1).": "Désigne une unité ennemie sur le champ de bataille. Quand une unité amie fait une attaque contre elle, sa première arme de mêlée ou de tir utilisée gagne CRITICAL HIT (1) et PRECISION (1).", "Use before a Friendly Mechanical Unit makes an Armour Roll. That Unit gains DODGE (2) for this roll.": "À utiliser avant qu’une unité Mechanical amie fasse un jet d’armure. Elle gagne DODGE (2) pour ce jet.", "During Army Building, your army cannot include both the Nova Assault Mode Unit and the Nova Stealth Mode Unit.": "Pendant la construction d’armée, ton armée ne peut pas contenir à la fois l’unité Nova Assault Mode et l’unité Nova Stealth Mode.", "This Unit gains BUFF Speed (2). Additionally, all its Weapons gain PRECISION (2).": "Cette unité gagne BUFF Speed (2). De plus, toutes ses armes gagnent PRECISION (2).", "Resolve the SUMMON (Holo Decoy) effect. Then, Holo Decoy may immediately perform a Move action.": "Résous l’effet SUMMON (Holo Decoy). Holo Decoy peut ensuite faire immédiatement une action Move.", "After this Unit fully resolves a Ranged Attack with its C-20A Canister Rifle, if the target Enemy Unit was Destroyed or its Current Supply Value was reduced, the active player may return one of their Exhausted non-Unique Tactical Cards to its Ready state.": "Après que cette unité a entièrement résolu une Ranged Attack avec son C-20A Canister Rifle, si l’unité ennemie visée a été détruite ou si son supply actuel a diminué, le joueur actif peut remettre prête une de ses Tactical Cards non Unique épuisées.", "Once Per Game. While this Unit is Unengaged and has the Stationary Status, when it makes a Ranged Attack with its C-20A Canister Rifle, treat that weapon's Damage characteristic as 3, and it gains CONCENTRATED FIRE (1).": "Une fois par partie. Tant que cette unité est non engagée et a le statut Stationary, quand elle fait une Ranged Attack avec son C-20A Canister Rifle, la caractéristique Damage de cette arme vaut 3 et elle gagne CONCENTRATED FIRE (1).", "This Unit gains BUFF Speed (3). Additionally, its Quad K12 and all Close Combat Weapons gain PRECISION (2).": "Cette unité gagne BUFF Speed (3). De plus, son Quad K12 et toutes ses armes de corps à corps gagnent PRECISION (2).", "This Unit's first Attack in the game with its Quad K12 gains PIERCE Armoured (3).": "La première attaque de la partie de cette unité avec son Quad K12 gagne PIERCE Armoured (3).", "When an Enemy declares a Charge against a Friendly Unit Within 8\", that Enemy gains DEBUFF Speed (3).": "Quand un ennemi déclare une Charge contre une unité amie à 8\", cet ennemi subit DEBUFF Speed (3).", "Set a Friendly Auto-Turret Unit Within 6\", and not Within the Engagement Range of any Enemy Unit.": "Place une unité Auto-Turret amie à 6\", hors de l’Engagement Range de toute unité ennemie.", "Select one Enemy Unit Within 12\". Apply DEBUFF Armour (1).": "Choisis une unité ennemie à 12\". Applique-lui DEBUFF Armour (1).", "This Unit may resolve its first Special Ability with the CP cost reduced by 1 if it targets the closest Enemy Unit.": "Cette unité peut résoudre sa première capacité spéciale avec un coût réduit de 1 CP si elle vise l’unité ennemie la plus proche.", "When this Unit is nominated to deploy from Reserves, it may Deploy from any table edge that is not a player's Entry Edge. This Unit cannot be set Within 8\" of any Enemy model.": "Quand cette unité est désignée pour se déployer depuis la réserve, elle peut se déployer depuis n’importe quel bord de table qui n’est pas l’Entry Edge d’un joueur. Elle ne peut pas être placée à 8\" d’une figurine ennemie.", "Select one Enemy Unit Within 12\". At the End of the Assault Phase, if that Enemy Unit has the Stationary Status or it is Within 8\" of this Unit, it suffers HITS 4 (2). If that Unit is Engaged, it is eligible to make an Evade Roll against these hits.": "Choisis une unité ennemie à 12\". À la fin de la phase d’Assaut, si cette unité a le statut Stationary ou est à 8\" de cette unité, elle subit HITS 4 (2). Si elle est engagée, elle peut faire un jet d’Evade contre ces touches.", "The Gauss Cannon of the Auto-Turret set by this Unit gains Surge Type: Light and S-Dice: D3+1.": "Le Gauss Cannon de l’Auto-Turret placée par cette unité gagne Surge Type : Light et S Dice : D3+1.", "Remove this Unit at the End of the Round.": "Retire cette unité à la fin du round.", "This Unit is never Engaged. It cannot Engage Enemy Units, cannot be Engaged by Enemy Units and cannot perform a Charge Action. This Unit cannot be the target of an ability, unless stated otherwise. It can never Control or Contest Mission Markers.": "Cette unité n’est jamais engagée. Elle ne peut pas engager d’unités ennemies, ne peut pas être engagée par elles et ne peut pas faire de Charge. Elle ne peut pas être ciblée par une capacité, sauf mention contraire. Elle ne peut jamais contrôler ni contester de marqueur de mission.", "At the End of the Round, you can set a Friendly Nova Stealth Mode or Nova Assault Mode in Coherency with this Unit.": "À la fin du round, tu peux placer une Nova Stealth Mode ou une Nova Assault Mode amie en cohésion avec cette unité.", "All Weapons of Friendly Units targeting an Enemy Unit Within 4\" of this Unit gain PRECISION (1).": "Toutes les armes des unités amies qui visent une unité ennemie à 4\" de cette unité gagnent PRECISION (1).", "Use when an Enemy Unit ends its Activation Within 8\" of this Unit. This Unit immediately performs a Ranged Attack against that Enemy Unit.": "À utiliser quand une unité ennemie termine son activation à 8\" de cette unité. Cette unité fait immédiatement une Ranged Attack contre cette unité ennemie.", "At the End of the Assault Phase, target each Unit Within 3\" of this Unit (including Units with the Structure ability) suffers HITS 5 (1). If an affected Unit has the Structure ability, that Unit suffers an additional HITS 5 (1).": "À la fin de la phase d’Assaut, chaque unité à 3\" de cette unité (y compris celles qui ont la capacité Structure) subit HITS 5 (1). Une unité touchée qui a la capacité Structure subit HITS 5 (1) supplémentaires."}</script>
<script type="application/json" id="db">{"metadata":{"game":"StarCraft: Tabletop Miniatures Game (Archon Studio)","database_version":"2.6.2","schema_version":"2.0-unified","last_updated":"2026-11-01","cost_table_version":"Units and Upgrade Points 09.10.2026 (PDF officiel)","status":"COMPLET — 3 races vérifiées carte par carte et recoupées avec la table de coûts officielle Sept 2026.","sources":{"ZERG":"Zerg-Database-v1.1.json","TERRAN":"Terran-Database-v1.1.json","PROTOSS":"Protoss-Database-v1.1.json"},"verification_method":"Chaque carte vérifiée depuis les photos recto/verso officielles fournies par l'utilisateur ; coûts recoupés avec la table officielle Sept 2026. Fusion réalisée par script avec contrôle automatique d'égalité vs les bases v1.1.","resource_system_clarification":"PE, BM et CP sont trois noms différents pour le même mécanisme de ressource de faction (Part 10.5.1 du rulebook) : Terran utilise CP, Zerg utilise BM, Protoss utilise PE. Il n'existe AUCUNE règle officielle limitant le nombre de cartes tactiques en construction de liste (contrairement à ce qu'affichait l'app précédente sous le nom 'PE'). Seuls le cap minéraux et le cap gas (10% du cap minéraux) sont des limites officielles de liste.","ability_cost_clarification":"Les abilities imprimées sur une Unit Card coûtent la ressource de la race (BM/CP/PE), payée en Exhaustant une Tactical Card ou la Faction Card. Les abilities imprimées sur une Tactical Card, Creep Card ou Faction Card sont gratuites à l'usage : leur coût est d'Exhaust la carte elle-même (Part 10.5.2), sauf mention contraire (Terran Academy / ADVANCED_TRAINING : 'Do not Exhaust this card').","changelog":[{"version":"2.0","date":"2026-09-27","notes":"Fusion des bases Zerg, Terran et Protoss v1.1 en un seul fichier. Aucune donnée de jeu modifiée."},{"version":"2.0.1","date":"2026-09-27","notes":"stats.speed_secondary renommé speed_last_model : vitesse de l'unité quand il ne lui reste qu'une figurine (sens confirmé par l'utilisateur). Aucune valeur modifiée."},{"version":"2.1","date":"2026-09-27","notes":"Ajout de la section 'model_families' (table des familles de figurines, versionnée séparément, v1.0). Aucune donnée de jeu modifiée."},{"version":"2.1.1","date":"2026-09-27","notes":"keyword_rules.SIDEARM remplacé par le texte officiel ; note sur le Goliath : Scatter et Haywire Missiles cumulables. Aucune valeur de jeu modifiée."},{"version":"2.1.2","date":"2026-09-27","notes":"Ajout du champ 'builder_effect' (effets d'upgrades calculés par le builder) : Medic / Advanced Medic Facilities → supply_pool_value 0. Aucune valeur de jeu modifiée. Confirmé : l'occupation des Army Slots n'est pas modifiée."},{"version":"2.1.3","date":"2026-09-27","notes":"Ajout de keyword_rules.SPECIALIST (texte officiel) ; upgrades SPECIALIST marquées 'specialist: true' ; display_name avec tirets (AGG-12, A-13, Grenades - Frag, Ares-Class, C-14, Solid-Field). Aucune valeur de jeu modifiée."},{"version":"2.1.4","date":"2026-09-27","notes":"Annotations 'builder_effect' Terran pour la création intelligente : Stimpack (Marine, Raynor's Raider, Marauder), Medic (Medpack, Life Support, Stabilizer Medpacks), réductions de coût (Raiders Roll!, Academy / Advanced Training). Aucune valeur de jeu modifiée."},{"version":"2.1.5","date":"2026-09-27","notes":"Siege Tank : champ 'requires_upgrade' (Coordinated Strike, Shaped Blast, Smart Shells et l'arme Shock Cannon exigent Mode Transformation) ; Mode Transformation marqué auto_include pour le générateur ; Aftershock Rounds annoté (Dmg = Size de la cible). Confirmé par l'utilisateur. Aucune valeur de jeu modifiée."},{"version":"2.1.6","date":"2026-09-27","notes":"Annotations 'builder_effect' Zerg (Creep, Burrow/Regeneration, Transfusion, Psionic Link, Corrosive Bile + upgrades, Zergling Reconstitution, Cocoon, sources de Creep, burrow gratuit) et Zeratul / Shadow Strike. Aucune valeur de jeu modifiée."},{"version":"2.1.7","date":"2026-09-27","notes":"Champ 'summoned_from' sur les invocations (Omega Worm, Roachling, Point Defense Drone, Pylon) : source (Faction Card ou unité), capacité et figurines nécessaires. Aucune valeur de jeu modifiée."},{"version":"2.1.7","date":"2026-09-28","notes":"keyword_rules : définition d'IMPACT(X) Y+ confirmée par l'utilisateur (points restants à préciser)."},{"version":"2.1.8","date":"2026-09-28","notes":"keyword_rules.IMPACT : texte officiel complet ; annotations impact_mod (Malignant Creep, Evolution Chamber / Extended Claws, Adrenal Overload des Raptors). Aucune valeur de jeu modifiée."},{"version":"2.1.9","date":"2026-09-28","notes":"keyword_rules.RESPAWN(X) : texte officiel (plafonné par le palier de Supply de l'unité). Aucune valeur de jeu modifiée."},{"version":"2.1.9","date":"2026-09-28","notes":"Roachling : 3 figurines invoquées exactement (confirmé par l'utilisateur)."},{"version":"2.2.0","date":"2026-09-28","notes":"Règle EVADE (texte officiel) ; annotations builder_effect : Tactical Cards Terran (Engineering Bay, Armory, Factory, Factory Tech Lab), Jim Raynor / Orders, Goliath / Target Lock, capacités donnant l'Evade (Combat Shield, Precognition, Prophetic Vision, Lurking). Aucune valeur de jeu modifiée."},{"version":"2.2.1","date":"2026-09-28","notes":"Evade : éligibilité uniquement via les règles qui l'accordent (confirmé). Annotations : Mutating Carapace (Kerrigan), Brood Instinct (Zerg Swarm), Hierarch's Stand (Artanis), Hallucination (Sentry), Indomitable (sans effet chiffrable)."},{"version":"2.2.2","date":"2026-09-28","notes":"Annotations : Barracks (Tech Lab) / Let's Have a Blast (ANTI-EVADE 1), Slugthrower et Grenades-Frag (Marine, Raynor's Raider, conditionnels à 8\"), Raynor's Raiders / Rapid Ingress (Point Defense Drone). Aucune valeur de jeu modifiée."},{"version":"2.3.0","date":"2026-09-28","notes":"Règles HIDDEN et INSTANT (textes officiels). Annotations builder_effect Protoss : Shielded (Improved Barrier, Shield Overcharge, Plasma Shields), réductions de dégâts (Dae'Uhl, Guardian Shield, Power Field, Zealous Round), bonus d'attaque (Quick Strikes, Psionic Presence, Resonating Glaives, Guidance, We Stand as One, My Life for Aiur, For the Ancients, Fury Unyielding, Titan Killers, Sentenced to Death, Fury of the Nerazim, Ancient Pride, Forge), Khalai / Pylon, HIDDEN (Darkness Descends, Might of the Nerazim, Path of Shadows, One with the Shadows, Anakh Su'n), Photon Overcharge, Veil of Shadows ; Zerg Lair / Predation (INSTANT). Aucune valeur de jeu modifiée."},{"version":"2.4.0","date":"2026-10-10","notes":"Équilibrage « Patch octobre 2026 » (changelog officiel fourni par l'utilisateur) : 40 valeurs de coût modifiées (36 lignes du changelog) (unités, upgrades, gas des Tactical Cards). Les coûts de septembre 2026 remplacés (décision utilisateur) ; ancienne base archivée. Aucune autre donnée modifiée."},{"version":"2.5.0","date":"2026-10-29","notes":"Vague Protoss P2P W3 (cartes v1.09.26) : unités Tassadar, Twilight Templar (High Templar), High Templar (améliorations Psionic Storm et Farsight), Faction Card Templar Caste, Tactical Card Templar Archives. Coûts recoupés avec la table officielle « Units and Upgrade Points » du 09.10.2026, qui remplace le patch d'octobre ; 4 écarts appliqués : Raptor_Zergling · Burrow_Ambush (18 fig.) : 20 → 30; Ravager · Bloated_Bile_Ducts (2 fig.) : 20 → 40; Ravager · Burrow_Ambush (2 fig.) : 20 → 40; Ravager · Potent_Bile (2 fig.) : 20 → 40. Famille de figurines HIGH_TEMPLAR (table v1.1). Aucune autre donnée modifiée."},{"version":"2.6.0","date":"2026-10-29","notes":"Vagues Terran et Zerg P2P W3 (cartes v1.09.26). Terran : Faction Card Nova Covert Ops, Nova Stealth Mode, Nova Assault Mode (exclusives entre elles : champ 'exclusive_with'), Spec Ops Marauder [Nova Covert Ops], Raven (4 améliorations), Tactical Card Vanadium Plating ; invocations Holo Decoy, Auto-Turret, Sabotage Drone. Zerg : Faction Card Zagara's Swarm, Creep Card Reactive Creep, Zagara, Vileling [Zagara's Swarm], Defiler (3 améliorations), Bile Launcher, Tactical Card Defiler Mound. Coûts de la table 09.10.2026. Zagara / Broodmother : amélioration imprimée mais absente de la table de coûts (non achetable). Familles v1.2. Aucune donnée existante modifiée."},{"version":"2.6.1","date":"2026-10-29","notes":"Zagara / Broodmother : coût 0 minerai (confirmé par l'utilisateur), amélioration désormais achetable. Vileling : profil de supply confirmé. Aucune autre donnée modifiée."},"2.6.2 : builder_effect weapon_set ajouté à Hydriodic Bile (Roach, Vile Roach, Corpser Roach) : Acid Saliva gagne Surge Type Light et S Dice D3+1 (texte de la carte inchangé)."]},"army_building_rules":{"engagement_scales":{"Skirmish":{"mineral_limit":1000,"gas_limit_percent":10,"battlefield":"36x36"},"Standard":{"mineral_limit":2000,"gas_limit_percent":10,"battlefield":"36x54"},"Grand_Offensive":{"mineral_limit":"2001+","gas_limit_percent":10,"battlefield":"36x72"}},"list_limits_note":"Seules limites officielles de liste : cap minéraux (selon l'Engagement Scale) et cap gas = 10% du cap minéraux. Aucune limite sur le nombre de Tactical Cards.","faction_eligibility":"Une carte dont les faction_tags incluent une sous-faction (ex. ['Protoss','Khalai']) n'est jouable qu'avec la Faction Card de cette sous-faction. Une carte avec seulement le tag de race est jouable avec toutes les Faction Cards de cette race.","army_slots":"Une unité occupe un nombre de slots de son army_slot égal à sa Supply Value d'achat. La Faction Card donne le pool initial (starting_army_slots), les Tactical Cards en ajoutent (grants_army_slots).","race_specific":{"ZERG":{"creep_card_requirement":"Le joueur DOIT sélectionner exactement une Creep Card et l'ajouter à sa liste, en payant son coût gas listé (règle ZERG_CREEP, présente sur toutes les Faction Cards Zerg)."}}},"keyword_rules":{"SHIELD / SHIELDED":"If a Shield value is present on a Unit Card, add it to the Hit Points (HP) of the first model. The Unit is Shielded. The Unit loses its Shielded Status when the Total Damage assigned to it exceeds its Shield value or when the first model in the Unit is removed. The Shielded Status is referenced by other abilities. Losing Shielded Status does not remove any remaining Hit Points, it only ends effects that require the Unit to be Shielded. Shielded Status cannot be restored by HEAL. [Builder : le Shield s'ajoute aux HP du premier modèle seulement.]","CONCENTRATED FIRE(X)":"Attacks with this weapon may remove no more than X models as casualties. Once X models have been removed, discard any remaining Total Damage. It is not recorded as a Damage Marker and does not carry over.","HITS X (Y)":"X touches de Y dégât(s) chacune (ex : Zeratul Shadow Strike HITS 4 (1) ; Ravager Corrosive Bile HITS 5 (1) par token ; Overcharged Nexus HITS 3 (1)).","BLAST TEMPLATE (BT)":"Gabarit centré sur un modèle de l'unité Primary (Target Point). Main target : dés = modèles affectés + modificateurs de RoA ; pas de jet de Surge, Surge Result = modèles affectés. Spillover : batch séparé par autre unité recouverte (amie ou ennemie) de même élévation et même Combat Tag, dés = modèles affectés, sans modificateur de RoA ni Surge. Voir section 3bis du document de méthodologie pour la règle complète.","PRECISION(X)":"Après le jet pour toucher, convertit jusqu'à X dés ratés en touches réussies.","CRITICAL HIT(X)":"Déplace X dés de l'Armour Pool vers la Damage Pool (contourne l'armure), plafonné au nombre de dés présents dans l'Armour Pool.","PIERCE [TAG](X)":"Contre une cible avec ce Combat Tag, la caractéristique Dmg de l'arme est remplacée par X.","ANTI-EVADE(X)":"-X en modificateur sur le jet d'Evade de la cible.","TOUGH(X)":"Transforme jusqu'à X échecs au jet d'Armure en réussites.","DODGE(X)":"Réduit de X (min 0) le nombre de dés qui passent de l'Armour Pool à la Damage Pool via Surge ou Critical Hit.","BUFF [Carac](X)":"Bonus de X à la caractéristique jusqu'à la fin du round. Les BUFF ne se cumulent pas entre eux.","SIDEARM":"When this Unit performs a Ranged Attack or Close Combat Attack, models equipped with this weapon may use it, ignoring the normal restriction of one weapon per model (Part 8.7.3). If a model is equipped with multiple SIDEARM weapons, it may use all of them in the same activation. Attacks made with each SIDEARM must be resolved in separate Batches. Because they are separate Batches, SIDEARM attacks may target a different Enemy Unit than the Unit's other weapons, subject to all standard target eligibility requirements. (Texte officiel fourni par l'utilisateur.)","BULKY":"Arme inutilisable en Ranged Attack si l'unité est Engaged.","SPEED X/Y":"X = vitesse de l'unité. Y = vitesse quand il ne reste qu'UNE seule figurine dans l'unité (après pertes). Une valeur unique (ex. 7) s'applique en permanence ; speed_last_model = null dans ce cas. (Confirmé par l'utilisateur.)","SPECIALIST":"A Unit may include only one model equipped with this weapon. Multiple upgrades configuring more than one instance of this weapon are not permitted (Part 9.1.7). [Builder : une upgrade SPECIALIST n'équipe qu'UNE figurine de l'unité ; deux SPECIALIST différents (ex. AGG-12 + Rocket Launcher) restent cumulables.] (Texte officiel fourni par l'utilisateur.)","builder_effect":"Annotations lues par le builder pour la création intelligente (pas des règles de jeu) : stim (PRECISION temporaire + NON-LETHAL DAMAGE), heal / damage_reduction (soin par figurine), heal_bonus, cost_reduction (réduction du coût en ressource), supply_pool_value. Ajoutées à partir du texte des cartes et des retours de l'utilisateur.","requires_upgrade":"Champ de base (pas un mot-clé de jeu) : l'upgrade ou l'arme n'est utilisable que si l'upgrade nommé est aussi pris.","IMPACT(X) Y+":"Immediately after this Unit completes a successful Charge, check every model in the Fighting Rank or Supporting Rank. For each eligible model, generate X Impact Dice: if the model is in the Fighting Rank or Supporting Rank against only one Enemy Unit, all X dice go to that Unit; if against multiple Enemy Units, the controlling player may split the dice between those Units. Roll the allocated dice for each target Unit separately (Impact Hit Roll). For each result of Y or higher, set 1 die into the target's Armour Pool. Proceed immediately to Armour Rolls. These hits do not generate Surge and treat Damage as 1. (Texte officiel fourni par l'utilisateur.)","RESPAWN(X)":"Return up to X Destroyed models to this Unit. The return cannot increase the Unit's Current Supply Value: do not return a model if doing so would push the Unit into a higher Supply bracket. Set each returned model in Base-to-Base contact with an existing model in the Unit. Returned models cannot be set Within the Engagement Range of any Enemy Unit. If a model cannot be set legally, it cannot be returned. (Texte officiel fourni par l'utilisateur.)","EVADE":"Damage Pool : each die remaining in this pool inflicts Damage equal to the weapon's Damage characteristic. If the target Unit is eligible for an Evade Roll, the defender rolls all dice in this pool against the Unit's Evade characteristic before Damage is applied. Each die that meets or exceeds the Evade value is a success and is discarded. Remaining dice inflict Damage as normal. (Texte officiel fourni par l'utilisateur.) Evade Roll: If eligible, each die result equal to or higher than the Evade characteristic is saved and discarded. (Texte officiel.) Aucune unité n'a droit à l'Evade par défaut : seules les règles qui écrivent « is eligible to make an Evade Roll » l'accordent (confirmé par l'utilisateur).","HIDDEN":"This Unit cannot be selected as the target of a Ranged Attack or any LoS-requiring Special Ability unless the acting model is Within 4\" of it. A HIDDEN Unit is immune to the IMPACT keyword. A HIDDEN Unit may make an Evade Roll against every attack targeting it. HIDDEN is classified as a Status. (Texte officiel fourni par l'utilisateur.)","INSTANT":"Enemy Units cannot declare or resolve Reaction abilities in response to attacks ma
