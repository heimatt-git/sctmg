<html lang="fr"><head><meta charset="utf-8"><link rel="manifest" href="../manifest.webmanifest"><meta name="theme-color" content="#0e1319"><link rel="icon" type="image/svg+xml" href="../icons/icon.svg"><link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png"><link rel="apple-touch-icon" href="../icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="SC:TMG"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><script>try{if(localStorage.getItem('sctmg-skin')==='terran')document.documentElement.setAttribute('data-skin','terran')}catch(e){}</script><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>StarCraft TMG Builder</title>

<style>
:root{
  --bg:#E9EDF1; --surface:#FFFFFF; --surface-2:#F3F5F8; --ink:#15202B; --muted:#586676; --line:#D3DAE2;
  --zerg:#8E3FA8; --terran:#B5561C; --protoss:#9A7410;
  --ok:#23734A; --ok-bg:#E3F3EA; --warn:#9A6212; --warn-bg:#FBF0DC; --err:#B3261E; --err-bg:#FBE4E2;
  --acc:var(--zerg);
  --f-display:"Rajdhani","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0E1318; --surface:#151C23; --surface-2:#1B242D; --ink:#E4EAF0; --muted:#95A3B1; --line:#29343F;
  --zerg:#C98BE3; --terran:#F0925A; --protoss:#E2B642;
  --ok:#6FCF97; --ok-bg:#16301F; --warn:#F2B55C; --warn-bg:#35280F; --err:#FF8A80; --err-bg:#3A1714;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1318; --surface:#151C23; --surface-2:#1B242D; --ink:#E4EAF0; --muted:#95A3B1; --line:#29343F;
  --zerg:#C98BE3; --terran:#F0925A; --protoss:#E2B642;
  --ok:#6FCF97; --ok-bg:#16301F; --warn:#F2B55C; --warn-bg:#35280F; --err:#FF8A80; --err-bg:#3A1714;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);padding-inline:16px;padding-block:0 40px}
.app[data-race="ZERG"]{--acc:var(--zerg)} .app[data-race="TERRAN"]{--acc:var(--terran)} .app[data-race="PROTOSS"]{--acc:var(--protoss)}
.app{max-width:1280px;margin:0 auto;display:grid;gap:14px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.02em;margin:0;text-wrap:balance}
button,select,input,textarea{font:inherit;color:inherit}
*{-webkit-tap-highlight-color:transparent}
@media (max-width:600px){select,input,textarea{font-size:16px}}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:14px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand-mark{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.14em;color:var(--surface);background:var(--acc);padding:4px 7px;clip-path:polygon(0 0,100% 0,100% 70%,85% 100%,0 100%)}
.brand h1{font-size:24px;line-height:1}
.brand .sub{margin:2px 0 0;color:var(--muted);font-size:12px}
.seg{display:flex;border:1px solid var(--line);background:var(--surface)}
.seg button{border:0;background:none;padding:7px 14px;font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-selected="true"]{color:var(--surface);background:var(--acc)}
.seg .r-ZERG[aria-selected="true"]{background:var(--zerg)} .seg .r-TERRAN[aria-selected="true"]{background:var(--terran)} .seg .r-PROTOSS[aria-selected="true"]{background:var(--protoss)}

/* controls */
.controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end}
.field{display:grid;gap:3px}
.field>span,.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
select,input[type=number],textarea{background:var(--surface);border:1px solid var(--line);padding:6px 8px;border-radius:3px}
input[type=number]{width:74px}
.btn{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:3px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--acc)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--surface)}
.btn.danger{color:var(--err)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:3px 9px;font-size:13px}
.spacer{flex:1}

/* strip */
.strip{display:flex;flex-wrap:wrap;gap:1px;background:var(--line);border:1px solid var(--line)}
.strip>.cell{flex:1 1 190px}
.cell{background:var(--surface);padding:10px 14px;display:grid;gap:6px;align-content:start}
.m-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.big{font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums}
.big small{font-size:13px;color:var(--muted)}
.bar{height:6px;background:var(--surface-2);border:1px solid var(--line);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--acc)}
.bar.over i{background:var(--err)}
.slots{display:flex;flex-wrap:wrap;gap:6px}
.slot{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);padding:2px 7px;background:var(--surface-2)}
.slot b{font-family:var(--f-display);font-size:12px;letter-spacing:.08em;margin-right:4px}
.slot.over{border-color:var(--err);color:var(--err);background:var(--err-bg)}
.slot.full{border-color:var(--acc)}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px;padding:3px 10px;border-radius:99px;width:max-content}
.pill.ok{color:var(--ok);background:var(--ok-bg)} .pill.warn{color:var(--warn);background:var(--warn-bg)} .pill.err{color:var(--err);background:var(--err-bg)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}

/* issues */
.issues{display:grid;gap:4px;margin:0;padding:0;list-style:none}
.issues li{padding:6px 10px 6px 12px;border-left:3px solid;font-size:13px}
.issues .err{border-color:var(--err);background:var(--err-bg)}
.issues .warn{border-color:var(--warn);background:var(--warn-bg)}
.issues .info{border-color:var(--line);background:var(--surface)}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px 12px;border:1px dashed var(--acc);background:var(--surface);font-size:13px}

/* columns */
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr)} .army{order:-1}}
.panel{background:var(--surface);border:1px solid var(--line)}
.panel>header{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.panel>header h2{font-size:19px}
.group-h{font-family:var(--f-display);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);padding:10px 14px 4px;display:flex;justify-content:space-between}
.group-h .num{color:var(--muted);letter-spacing:0;font-size:12px}
.hint{color:var(--muted);font-size:13px;padding:6px 14px 12px;margin:0}

/* catalog */
.cat-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:start;padding:8px 14px;border-top:1px solid var(--line)}
.cat-item summary{cursor:pointer;list-style:none;display:grid;gap:2px}
.cat-item summary::-webkit-details-marker{display:none}
.cat-item summary .nm{font-weight:600}
.cat-item summary .nm::before{content:"▸";display:inline-block;width:1em;color:var(--muted);transition:transform .15s}
.cat-item details[open] summary .nm::before{transform:rotate(90deg)}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted)}
.meta .num{color:var(--ink)}
.chip{font-size:11px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);padding:0 6px;border-radius:2px;color:var(--muted);white-space:nowrap}
.chip.acc{border-color:var(--acc);color:var(--acc)}
.chip.uni{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip.low{border-color:var(--warn);color:var(--warn)}

/* army */
.fc{padding:10px 14px;display:grid;gap:6px;border-bottom:1px solid var(--line)}
.fc-row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.tac-list{list-style:none;margin:0;padding:0}
.tac-list li{display:flex;align-items:center;gap:10px;padding:6px 14px;border-top:1px solid var(--line)}
.tac-list li .nm{font-weight:600;margin-right:auto}
/* fenêtre des tactical cards */
.tac-list li .nm{border:0;background:none;padding:0;text-align:left;color:inherit;font:inherit;font-weight:600;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.tac-list li .nm:hover{color:var(--acc)}
.tacdlg .hd{display:flex;align-items:start;justify-content:space-between;gap:10px}
.tacdlg .meta{display:flex;flex-wrap:wrap;gap:6px}
.tacdlg .meta span{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);padding:2px 7px;background:var(--surface-2)}
.tacdlg .abil li{padding:6px 0 6px 10px}
.tacdlg .abil p{font-size:14px}
.tacdlg details{margin-top:4px;font-size:12px;color:var(--muted)}
.tacdlg details p{font-size:12px;color:var(--muted)}
@media (max-width:700px){#tov{place-items:end stretch;padding:0} #tov .dlg{width:100%;max-height:85vh;border-radius:12px 12px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}}

.unit{border-top:1px solid var(--line);padding:10px 14px;display:grid;gap:8px}
.u-head{display:flex;justify-content:space-between;gap:10px;align-items:start}
.u-head h3{font-size:18px;line-height:1.1}
.u-cost{font-family:var(--f-mono);font-size:18px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.u-cost small{display:block;font-size:11px;color:var(--muted)}
.u-body{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.ups{display:flex;flex-wrap:wrap;gap:6px}
.up{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);padding:3px 8px;font-size:13px;cursor:pointer;background:var(--surface-2)}
.up.locked{opacity:.5;cursor:not-allowed}
.up:has(input:checked){border-color:var(--acc);background:var(--surface)}
.up .num{color:var(--muted);font-size:12px}
.u-actions{display:flex;gap:8px;margin-left:auto}

/* sheet */
.sheet{display:grid;gap:10px;padding:10px 0 4px;font-size:13px}
.stats{display:flex;flex-wrap:wrap;gap:1px;background:var(--line);border:1px solid var(--line);width:max-content;max-width:100%}
.stats div{background:var(--surface-2);padding:4px 10px;text-align:center;display:grid}
.stats b{font-family:var(--f-mono);font-size:15px}
.stats span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{padding:4px 7px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--surface-2)}
td.num{font-family:var(--f-mono)}
td.kw{white-space:normal;min-width:140px}
.abil{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.abil li{border-left:2px solid var(--line);padding-left:8px}
.abil .an{font-weight:600}
.abil .ty{font-size:10px;letter-spacing:.08em;padding:0 5px;margin-left:6px;border-radius:2px;font-weight:600}
.ty.ACTIVE{background:#2F7FD0;color:#fff} .ty.PASSIVE{background:#B3261E;color:#fff} .ty.REACTION{background:#B98A12;color:#fff}
.abil .ph{font-size:11px;color:var(--muted);margin-left:6px}
.abil .co{font-family:var(--f-mono);font-size:11px;margin-left:6px;color:var(--ok)}
.abil p{margin:2px 0 0;max-width:70ch}
.tags{font-size:12px;color:var(--muted)}

/* collection */
.col-grid.one{grid-template-columns:minmax(0,640px)}
.col-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
.crow{display:flex;align-items:center;gap:10px;padding:6px 14px;border-top:1px solid var(--line)}
.crow .nm{margin-right:auto;min-width:0}
.star{border:0;background:none;font-size:20px;line-height:1;width:32px;height:32px;padding:0;color:var(--muted);flex:none;border-radius:3px}
.star.on{color:var(--acc)}
.star:hover{color:var(--acc)}
.star-sp{width:32px;flex:none}
.gen-card .star{font-size:14px;width:auto;height:auto;display:inline}
.stepper{display:flex;align-items:stretch;flex:none}
.stepper input{width:56px;text-align:center;font-size:16px;font-family:var(--f-mono);background:var(--surface-2);color:var(--ink);-webkit-text-fill-color:var(--ink);border:1px solid var(--line);border-inline:0;border-radius:0;padding:6px 4px;opacity:1}
.stepper input:focus{outline:2px solid var(--acc);outline-offset:-2px;background:var(--surface)}
.stp{width:40px;min-height:38px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:18px;line-height:1;-webkit-tap-highlight-color:transparent}
.stp:first-child{border-radius:3px 0 0 3px}.stp:last-child{border-radius:0 3px 3px 0}
.stp:active{background:var(--acc);color:var(--surface)}
.fam{border-top:1px solid var(--line)}
.fam-h{display:flex;justify-content:space-between;align-items:baseline;padding:8px 14px 2px;font-family:var(--f-display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:13px;color:var(--acc)}
.fam .crow{border-top:0;padding-left:26px}
.radio{display:flex;flex-wrap:wrap;gap:8px}
.radio label{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);background:var(--surface);padding:8px 12px;cursor:pointer;max-width:360px;font-size:13px}
.radio label:has(input:checked){border-color:var(--acc)}
.radio b{display:block}

/* mission */
.strip>.cell.wide{flex:2 1 380px}
.rounds{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mis .lbl{width:100%}
@media (max-width:520px){.strip>.cell.wide{flex-basis:100%}}
.mis{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:13px}
.mis input{width:48px;text-align:center;font-family:var(--f-mono);background:var(--surface-2);color:var(--ink);-webkit-text-fill-color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:4px}
/* générateur */
.gen-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;align-items:start}
.gen-card .score-rows{display:grid;gap:6px;margin-top:6px}
.srow{display:grid;grid-template-columns:90px 1fr 32px;gap:8px;align-items:center}
.srow .num{text-align:right;font-size:12px}
.gen-card .tac-list li{padding-block:4px}
.dlg.wide{width:min(900px,100%)}
.fopts{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.fprev{overflow:auto;max-height:55vh;border:1px solid var(--line);background:#dfe4e9;padding:10px}
.fprev .fiche{zoom:.75;margin:0 auto;box-shadow:0 1px 4px rgb(0 0 0 / .2)}
@media (max-width:600px){.fprev .fiche{zoom:.5}}
/* overlay */
.overlay{position:fixed;inset:0;background:rgb(0 0 0 / .45);display:grid;place-items:center;padding:16px;z-index:20}
.dlg{background:var(--surface);border:1px solid var(--line);width:min(640px,100%);max-height:calc(100% - 32px);overflow:auto;padding:16px;display:grid;gap:10px}
.dlg h2{font-size:21px}
.dlg p{margin:0;color:var(--muted);font-size:13px}
.dlg textarea{width:100%;min-height:220px;font-family:var(--f-mono);font-size:12px}
.dlg .row{display:flex;flex-wrap:wrap;gap:8px}
.msg{font-weight:600;font-size:13px}
.msg.ok{color:var(--ok)} .msg.err{color:var(--err)} .msg.warn{color:var(--warn)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* bandeau repliable + barre de budget fixe + menu Actions */
.top{transition:transform .2s ease}
.top.hid{transform:translateY(calc(-100% - env(safe-area-inset-top,0px) - 2px))}
.hdtog{order:9;width:34px;height:34px;flex:none;border:1px solid var(--line);background:var(--surface);border-radius:4px;font-size:15px;line-height:1;display:inline-grid;place-items:center;color:var(--ink)}
.hdtog:hover{border-color:var(--acc)}
.top.compact{padding-block:6px;gap:6px 10px}
.top.compact .sub{display:none}
.top.compact .brand h1{font-size:17px}
.top.compact .seg button{padding:4px 9px;font-size:13px}
.top.compact #races button[aria-selected="false"]{display:none}
.top.compact .skinbtn{display:none}
@media (max-width:700px){.top.compact .brand h1,.top.compact .brand-mark{display:none} .top.compact .brand{margin-right:0} .top.compact{gap:6px;flex-wrap:nowrap} .top.compact #views{margin-right:auto} .top.compact .seg button{padding:4px 7px;font-size:12px;letter-spacing:.03em}}
.budget{position:fixed;left:0;right:0;top:var(--hdH,0px);z-index:4;background:var(--bg);border-bottom:1px solid var(--line);box-shadow:0 6px 14px rgba(0,0,0,.14);padding:6px max(16px,env(safe-area-inset-left,0px));transition:top .2s ease}

.bud-m{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.bud-m .lbl{font-family:var(--f-body)}
.bud-m .bar{width:54px;height:5px}

.budget .slots{gap:4px}
.budget .slot{font-size:11px;padding:1px 5px}

@media (max-width:700px){.budget .in{gap:3px 10px;font-size:12px} .bud-m .bar{width:40px}}

.top.floating{position:fixed;left:0;right:0;top:0;z-index:6;padding:calc(6px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px));box-shadow:0 4px 12px rgba(0,0,0,.12)}
.actmenu{position:relative}
.actmenu>summary{list-style:none;cursor:pointer}
.actmenu>summary::-webkit-details-marker{display:none}
.actmenu .actlist{position:absolute;right:0;top:calc(100% + 4px);z-index:6;display:grid;gap:6px;min-width:220px;padding:8px;background:var(--surface);border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.actmenu .actlist .btn{justify-content:flex-start}

<script type="application/json" id="db">{"metadata":{"game":"StarCraft: Tabletop Miniatures Game (Archon Studio)","database_version":"2.6.2","schema_version":"2.0-unified","last_updated":"2026-11-01","cost_table_version":"Units and Upgrade Points 09.10.2026 (PDF officiel)","status":"COMPLET — 3 races vérifiées carte par carte et recoupées avec la table de coûts officielle Sept 2026.","sources":{"ZERG":"Zerg-Database-v1.1.json","TERRAN":"Terran-Database-v1.1.json","PROTOSS":"Protoss-Database-v1.1.json"},"verification_method":"Chaque carte vérifiée depuis les photos recto/verso officielles fournies par l'utilisateur ; coûts recoupés avec la table officielle Sept 2026. Fusion réalisée par script avec contrôle automatique d'égalité vs les bases v1.1.","resource_system_clarification":"PE, BM et CP sont trois noms différents pour le même mécanisme de ressource de faction (Part 10.5.1 du rulebook) : Terran utilise CP, Zerg utilise BM, Protoss utilise PE. Il n'existe AUCUNE règle officielle limitant le nombre de cartes tactiques en construction de liste (contrairement à ce qu'affichait l'app précédente sous le nom 'PE'). Seuls le cap minéraux et le cap gas (10% du cap minéraux) sont des limites officielles de liste.","ability_cost_clarification":"Les abilities imprimées sur une Unit Card coûtent la ressource de la race (BM/CP/PE), payée en Exhaustant une Tactical Card ou la Faction Card. Les abilities imprimées sur une Tactical Card, Creep Card ou Faction Card sont gratuites à l'usage : leur coût est d'Exhaust la carte elle-même (Part 10.5.2), sauf mention contraire (Terran Academy / ADVANCED_TRAINING : 'Do not Exhaust this card').","changelog":[{"version":"2.0","date":"2026-09-27","notes":"Fusion des bases Zerg, Terran et Protoss v1.1 en un seul fichier. Aucune donnée de jeu modifiée."},{"version":"2.0.1","date":"2026-09-27","notes":"stats.speed_secondary renommé speed_last_model : vitesse de l'unité quand il ne lui reste qu'une figurine (sens confirmé par l'utilisateur). cations (Omega Worm, Roachling, Point Defense Drone, Pylon) : source (Faction Card ou unité), capacité et figurines nécessaires. Aucune valeur de jeu modifiée."},{"version":"2.1.7","date":"2026-09-28","notes":"keyword_rules : définition d'IMPACT(X) Y+ confirmée par l'utilisateur (points restants à préciser)."},{"version":"2.1.8","date":"2026-09-28","notes":"keyword_rules.IMPACT : texte officiel complet ; annotations impact_mod (Malignant Creep, Evolution Chamber / Extended Claws, Adrenal Overload des Raptors). Aucune valeur de jeu modifiée."},{"version":"2.1.9","date":"2026-09-28","notes":"keyword_rules.RESPAWN(X) : texte officiel (plafonné par le palier de Supply de l'unité). Aucune valeur de jeu modifiée."},{"version":"2.1.9","date":"2026-09-28","notes":"Roachling : 3 figurines invoquées exactement (confirmé par l'utilisateur)."},{"version":"2.2.0","date":"2026-09-28","notes":"Règle EVADE (texte officiel) ; annotations builder_effect : Tactical Cards Terran (Engineering Bay, Armory, Factory, Factory Tech Lab), Jim Raynor / Orders, Goliath / Target Lock, capacités donnant l'Evade (Combat Shield, Precognition, Prophetic Vision, Lurking). Aucune valeur de jeu modifiée."},{"version":"2.2.1","date":"2026-09-28","notes":"Evade : éligibilité uniquement via les règles qui l'accordent (confirmé). Annotations : Mutating Carapace (Kerrigan), Brood Instinct (Zerg Swarm), Hierarch's Stand (Artanis), Hallucination (Sentry), Indomitable (sans effet chiffrable)."},{"version":"2.2.2","date":"2026-09-28","notes":"Annotations : Barracks (Tech Lab) / Let's Have a Blast (ANTI-EVADE 1), Slugthrower et Grenades-Frag (Marine, Raynor's Raider, conditionnels à 8\"), Raynor's Raiders / Rapid Ingress (Point Defense Drone). Aucune valeur de jeu modifiée."},{"version":"2.3.0","date":"2026-09-28","notes":"Règles HIDDEN et INSTANT (textes officiels). Annotations builder_effect Protoss : Shielded (Improved Barrier, Shield Overcharge, Plasma Shields), réductions de dégâts (Dae'Uhl, Guardian Shield  Tactical Card Defiler Mound. Coûts de la table 09.10.2026. Zagara / Broodmother : amélioration imprimée mais absente de la table de coûts (non achetable). Familles v1.2. Aucune donnée existante modifiée."},{"version":"2.6.1","date":"2026-10-29","notes":"Zagara / Broodmother : coût 0 minerai (confirmé par l'utilisateur), amélioration désormais achetable. Vileling : profil de supply confirmé. Aucune autre donnée modifiée."},"2.6.2 : builder_effect weapon_set ajouté à Hydriodic Bile (Roach, Vile Roach, Corpser Roach) : Acid Saliva gagne Surge Type Light et S Dice D3+1 (texte de la carte inchangé)."]},"army_building_rules":{"engagement_scales":{"Skirmish":{"mineral_limit":1000,"gas_limit_percent":10,"battlefield":"36x36"},"Standard":{"mineral_limit":2000,"gas_limit_percent":10,"battlefield":"36x54"},"Grand_Offensive":{"mineral_limit":"2001+","gas_limit_percent":10,"battlefield":"36x72"}},"list_limits_note":"Seules limites officielles de liste : cap minéraux (selon l'Engagement Scale) et cap gas = 10% du cap minéraux. Aucune limite sur le nombre de Tactical Cards.","faction_eligibility":"Une carte dont les faction_tags incluent une sous-faction (ex. ['Protoss','Khalai']) n'est jouable qu'avec la Faction Card de cette sous-faction. Une carte avec seulement le tag de race est jouable avec toutes les Faction Cards de cette race.","army_slots":"Une unité occupe un nombre de slots de son army_slot égal à sa Supply Value d'achat. La Faction Card donne le pool initial (starting_army_slots), les Tactical Cards en ajoutent (grants_army_slots).","race_specific":{"ZERG":{"creep_card_requirement":"Le joueur DOIT sélectionner exactement une Creep Card et l'ajouter à sa liste, en payant son coût gas listé (règle ZERG_CREEP, présente sur toutes les Faction Cards Zerg)."}}},"keyword_rules":{"SHIELD / SHIELDED":"If a Shield value is present on a Unit Card, add it to the Hit Points (HP) of the first model. The Unit is Shielded. The Unit loses its Shielded Status when the Total Damage assigned to it exceeds its Shield value or when the first model in the Unit is removed. The Shielded Status is referenced by other abilities. Losing Shielded Status does not remove any remaining Hit Points, it only ends effects that require the Unit to be Shielded. Shielded Status cannot be restored by HEAL. [Builder : le Shield s'ajoute aux HP du premier modèle seulement.]","CONCENTRATED FIRE(X)":"Attacks with this weapon may remove no more than X models as casualties. Once X models have been removed, discard any remaining Total Damage. It is not recorded as a Damage Marker and does not carry over.","HITS X (Y)":"X touches de Y dégât(s) chacune (ex : Zeratul Shadow Strike HITS 4 (1) ; Ravager Corrosive Bile HITS 5 (1) par token ; Overcharged Nexus HITS 3 (1)).","BLAST TEMPLATE (BT)":"Gabarit centré sur un modèle de l'unité Primary (Target Point). Main target : dés = modèles affectés + modificateurs de RoA ; pas de jet de Surge, Surge Result = modèles affectés. Spillover : batch séparé par autre unité recouverte (amie ou ennemie) de même élévation et même Combat Tag, dés = modèles affectés, sans modificateur de RoA ni Surge. Voir section 3bis du document de méthodologie pour la règle complète.","PRECISION(X)":"Après le jet pour toucher, convertit jusqu'à X dés ratés en touches réussies.","CRITICAL HIT(X)":"Déplace X dés de l'Armour Pool vers la Damage Pool (contourne l'armure), plafonné au nombre de dés présents dans l'Armour Pool.","PIERCE [TAG](X)":"Contre une cible avec ce Combat Tag, la caractéristique Dmg de l'arme est remplacée par X.","ANTI-EVADE(X)":"-X en modificateur sur le jet d'Evade de la cible.","TOUGH(X)":"Transforme jusqu'à X échecs au jet d'Armure en réussites.","DODGE(X)":"Réduit de X (min 0) le nombre de dés qui passent de l'Armour Pool à la Damage Pool via Surge ou Critical Hit.","BUFF [Carac](X)":"Bonus de X à la caractéristique jusqu'à la fin du round. Les BUFF ne se cumulent pas entre eux.","SIDEARM":"When this Unit performs a Ranged Attack or Close Combat Attack, models equipped with this weapon may use it, ignoring the normal restriction of one weapon per model (Part 8.7.3). If a model is equipped with multiple SIDEARM weapons, it may use all of them in the same activation. Attacks made with each SIDEARM must be resolved in separate Batches. Because they are separate Batches, SIDEARM attacks may target a different Enemy Unit than the Unit's other weapons, subject to all standard target eligibility requirements. (Texte officiel fourni par l'utilisateur.)","BULKY":"Arme inutilisable en Ranged Attack si l'unité est Engaged.","SPEED X/Y":"X = vitesse de l'unité. Y = vitesse quand il ne reste qu'UNE seule figurine dans l'unité (après pertes). Une valeur unique (ex. 7) s'applique en permanence ; speed_last_model = null dans ce cas. (Confirmé par l'utilisateur.)","SPECIALIST":"A Unit may include only one model equipped with this weapon. Multiple upgrades configuring more than one instance of this weapon are not permitted (Part 9.1.7). [Builder : une upgrade SPECIALIST n'équipe qu'UNE figurine de l'unité ; deux SPECIALIST différents (ex. AGG-12 + Rocket Launcher) restent cumulables.] (Texte officiel fourni par l'utilisateur.)","builder_effect":"Annotations lues par le builder pour la création intelligente (pas des règles de jeu) : stim (PRECISION temporaire + NON-LETHAL DAMAGE), heal / damage_reduction (soin par figurine), heal_bonus, cost_reduction (réduction du coût en ressource), supply_pool_value. Ajoutées à partir du texte des cartes et des retours de l'utilisateur.","requires_upgrade":"Champ de base (pas un mot-clé de jeu) : l'upgrade ou l'arme n'est utilisable que si l'upgrade nommé est aussi pris.","IMPACT(X) Y+":"Immediately after this Unit completes a successful Charge, check every model in the Fighting Rank or Supporting Rank. For each eligible model, generate X Impact Dice: if the model is in the Fighting Rank or Supporting Rank against only one Enemy Unit, all X dice go to that Unit; if against multiple Enemy Units, the controlling player may split the dice between those Units. Roll the allocated dice for each target Unit separately (Impact Hit Roll). For each result of Y or higher, set 1 die into the target's Armour Pool. Proceed immediately to Armour Rolls. These hits do not generate Surge and treat Damage as 1. (Texte officiel fourni par l'utilisateur.)","RESPAWN(X)":"Return up to X Destroyed models to this Unit. The return cannot increase the Unit's Current Supply Value: do not return a model if doing so would push the Unit into a higher Supply bracket. Set each returned model in Base-to-Base contact with an existing model in the Unit. Returned models cannot be set Within the Engagement Range of any Enemy Unit. If a model cannot be set legally, it cannot be returned. (Texte officiel fourni par l'utilisateur.)","EVADE":"Damage Pool : each die remaining in this pool inflicts Damage equal to the weapon's Damage characteristic. If the target Unit is eligible for an Evade Roll, the defender rolls all dice in this pool against the Unit's Evade characteristic before Damage is applied. Each die that meets or exceeds the Evade value is a success and is discarded. Remaining dice inflict Damage as normal. (Texte officiel fourni par l'utilisateur.) Evade Roll: If eligible, each die result equal to or higher than the Evade characteristic is saved and discarded. (Texte officiel.) Aucune unité n'a droit à l'Evade par défaut : seules les règles qui écrivent « is eligible to make an Evade Roll » l'accordent (confirmé par l'utilisateur).","HIDDEN":"This Unit cannot be selected as the target of a Ranged Attack or any LoS-requiring Special Ability unless the acting model is Within 4\" of it. A HIDDEN Unit is immune to the IMPACT keyword. A HIDDEN Unit may make an Evade Roll against every attack targeting it. HIDDEN is classified as a Status. (Texte officiel fourni par l'utilisateur.)","INSTANT":"Enemy Units cannot declare or resolve Reaction abilities in response to attacks ma 1,"hit":"3+","surge_type":"Light","s_dice":"D3","dmg":2,"keywords":["INSTANT"]},"STRIKE":{"phase":"COMBAT","rng":"E","target":"Ground","roa":1,"hit":"4+","surge_type":null,"s_dice":null,"dmg":1,"keywords":[]}},"upgrades":{"Psionic_Storm":{"display_name":"Psionic Storm","phase":"MOVEMENT","mineral_cost":{"2":20,"4":30},"type":"ACTIVE","cost":{"PE":2},"text":"Set a Psionic Storm token Within 10\" and Line of Sight of this Unit. This token is not removed if this Unit is Destroyed. At the End of each Phase, set a Psionic Storm Blast Template on the centre of this token. For each Unit that has at least one model whose base is partially covered by the template, roll 3 dice, plus 1 additional die for each model in that Unit whose base is partially covered. For each result of 5+, that Unit suffers an effect depending on the current Phase: Movement Phase: NON-LETHAL DAMAGE (1). Assault Phase: 1 Damage. If multiple effects trigger at the End of the Assault Phase, resolve them in the order specified in Part 8.9.4.","upgrade_kind":"ABILITY","builder_effect":{"kind":"hits_ability","hits":2,"dmg":1,"per_model":false,"note":"Psionic Storm : ~5 dés à 5+ en fin de phase d'Assaut (≈1,7 dégât direct), estimation prudente."}},"Farsight":{"display_name":"Farsight","phase":"MOVEMENT","mineral_cost":{"2":20,"4":20},"type":"ACTIVE","cost":{"PE":1},"text":"Target one Friendly Unit Within 12\". Until the End of the Round, that Unit is eligible to make an Evade Roll against any attacks targeting it.","upgrade_kind":"ABILITY","rules_note":"Deux améliorations séparées (Psionic Storm, Farsight) : confirmé par l'utilisateur et par la table de coûts 09.10.2026.","builder_effect":{"kind":"evade_aura","coverage":0.4,"paid":true,"note":"Farsight : une unité alliée à 12\" gagne l'Evade contre toutes les attaques jusqu'à la fin du round."}}}}},"summoned_units":{},"summoned_structures":{"Pylon":{"faction_tags":["Protoss","Khalai"],"combat_role":"TACTICIAN","combat_tags":["Armoured","Ground"],"base_mm":8 ne entrée au 'changelog'. Les fichiers de collection exportés mémorisent la version de table utilisée ; le builder avertit si elle diffère.","changelog":[{"version":"1.0","date":"2026-09-27","notes":"Table initiale validée par l'utilisateur : 5 familles (Zergling, Roach, Marine, Zealot, Adept)."},{"version":"1.1","date":"2026-10-29","notes":"Ajout de la famille HIGH_TEMPLAR (High Templar, Twilight Templar). Les autres familles sont inchangées."},{"version":"1.2","date":"2026-10-29","notes":"Famille MARAUDER (Marauder, Spec Ops Marauder) ; Vileling ajouté à la famille ZERGLING."}],"families":{"ZERGLING":{"race":"ZERG","base_mm":32,"members":["Zergling","Swarmling_Zergling","Raptor_Zergling","Kerrigan_Swarm_Raptor_Zergling","Vileling_Zergling"]},"ROACH":{"race":"ZERG","base_mm":50,"members":["Roach","Vile_Roach","Corpser_Roach"]},"MARINE":{"race":"TERRAN","base_mm":32,"members":["Marine","Raynors_Raiders_Marine"]},"ZEALOT":{"race":"PROTOSS","base_mm":40,"members":["Zealot","Praetor_Guard_Zealot"]},"ADEPT":{"race":"PROTOSS","base_mm":40,"members":["Adept","Nerazim_Watchers_Adept"]},"HIGH_TEMPLAR":{"race":"PROTOSS","base_mm":40,"members":["High_Templar","Twilight_Templar_High_Templar"]},"MARAUDER":{"race":"TERRAN","base_mm":50,"members":["Marauder","Spec_Ops_Marauder"]}}}}</script>
<script>
(function(){
"use strict";
const DB=JSON.parse(document.getElementById('db').textContent);
const RACES=['ZERG','TERRAN','PROTOSS'];
const RLABEL={ZERG:'Zerg',TERRAN:'Terran',PROTOSS:'Protoss'};
const SLOTS=['CORE','ELITE','SUPPORT','AIR','HERO'];
const SLOTFR={CORE:'Core',ELITE:'Élite',SUPPORT:'Support',AIR:'Air',HERO:'Héros'};
const SCALEFR={Skirmish:'Skirmish',Standard:'Standard',Grand_Offensive:'Grand Offensive'};
const NAMES={Swarmling_Zergling:'Swarmling (Zergling)',Raptor_Zergling:'Raptor (Zergling)',Kerrigan_Swarm_Raptor_Zergling:'Raptor de Kerrigan (Zergling)',Raynors_Raiders_Marine:"Raynor's Raiders (Marine)",Spawning_Pool_Six_Pool:'Spawning Pool (Six Pool)',Kerrigans_Swarm:"Kerrigan's Swarm",Raynors_Raiders:"Raynor's Raiders",Terran_Armed_Forces:'Terran Armed Forces'};
const FAM=DB.model_families;
const famOf={};Object.entries(FAM.families).forEach(([f,o])=>o.members.forEach(m=>famOf[m]=f));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nm=(k,o)=>(o&&o.display_name)||NAMES[k]||k.replace(/_/g,' ');
const WN={C_14_RIFLE:'C-14 Rifle',QUAD_K12:'Quad K12'};
const abName=(k,o)=>(o&&o.display_name)||WN[k]||k.split('_').map(w=>w.charAt(0)+w.slice(1).toLowerCase()).join(' ');
const cap=s=>s.charAt(0)+s.slice(1).toLowerCase();

/* ---------- state ---------- */
const LS='sctmg-builder-v1';
function defaultState(){
  const lists={};RACES.forEach(r=>lists[r]={units:[],tactical:[],creep:null});
  lists.ZERG={example:true,creep:'Accelerating_Creep',tactical:['Spawning_Pool','Hydralisk_Den','Hatchery'],
    units:[{uid:1,key:'Zergling',comp:1,up:['Adrenal_Glands']},{uid:2,key:'Roach',comp:0,up:[]},{uid:3,key:'Ravager',comp:0,up:[]},{uid:4,key:'Hydralisk',comp:1,up:[]},{uid:5,key:'Queen',comp:0,up:[]}]};
  return {race:'ZERG',view:'list',faction:{ZERG:'Zerg_Swarm',TERRAN:'Terran_Armed_Forces',PROTOSS:'Daelaam'},
    scale:'Skirmish',custom:3000,mission:{r1:null,inc:null},mode:'proxy',lists,collection:{units:{}},nextUid:100};
}
function load(){try{const s=JSON.parse(localStorage.getItem(LS));if(s&&s.lists&&s.collection){const d=defaultState();return Object.assign(d,s,{faction:Object.assign(d.faction,s.faction),mission:Object.assign(d.mission,s.mission||{})});}}catch(e){}return defaultState();}
function save(){try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}}
let state=load();
const openSheets=new Set();

/* ---------- rules engine ---------- */
function limitOf(){const sc=DB.army_building_rules.engagement_scales[state.scale];return typeof sc.mineral_limit==='number'?sc.mineral_limit:Math.max(2001,Math.round(+state.custom)||2001);}
const poolKey=k=>state.mode==='proxy'&&famOf[k]?famOf[k]:k;
const isFav=k=>!!(state.collection.favorites&&state.collection.favorites[k]);
const summonsOf=race=>{const R=DB.races[race];return [...Object.entries(R.summoned_units||{}),...Object.entries(R.summoned_structures||{})].filter(([k,s])=>s.summoned_from).map(([k,s])=>({k,s,src:s.summoned_from}));};
const activeSummons=(race,fk,L)=>summonsOf(race).filter(x=>x.src.faction_card===fk||(x.src.unit&&[x.src.unit,...(x.src.alt_units||[])].some(un=>L.units.some(e=>e.key===un))));
function srcTxt(race,x){const R=DB.races[race];return x.src.faction_card?`Faction Card ${nm(x.src.faction_card,R.faction_cards[x.src.faction_card])} (${abName(x.src.ability)})`:`${[x.src.unit,...(x.src.alt_units||[])].map(un=>nm(un,R.units[un])).join(' / ')} (${abName(x.src.ability)})`;}
function poolLabel(p,R){return FAM.families[p]?'famille '+cap(p):nm(p,R.units[p]);}
function colActive(race){
  const R=DB.races[race],C=state.collection;
  return [...Object.keys(R.units),...summonsOf(race).map(x=>x.k)].some(k=>(C.units[k]||0)>0);
}
function ownedPools(race){const R=DB.races[race],o={};Object.keys(R.units).forEach(k=>{const p=poolKey(k);o[p]=(o[p]||0)+(state.collection.units[k]||0);});return o;}

function compute(){
  const race=state.race,R=DB.races[race],L=state.lists[race],fk=state.faction[race],F=R.faction_cards[fk];
  const lim=limitOf(),gasCap=Math.floor(lim*DB.army_building_rules.engagement_scales.Standard.gas_limit_percent/100);
  const elig=tags=>tags.every(t=>F.faction_tags.includes(t));
  const issues=[];let min=0,gas=0,res=F.resource_generated||0,pool=0;const poolNotes=[];
  const avail={},used={};SLOTS.forEach(s=>{avail[s]=F.starting_army_slots[s]||0;used[s]=0;});
  const rows=[];
  L.units.forEach(e=>{const u=R.units[e.key];if(!u)return;const c=u.composition_options[e.comp]||u.composition_options[0];
    let upc=0;e.up.forEach(k=>{const up=u.upgrades[k];if(up)upc+=(up.mineral_cost||{})[String(c.models)]||0;});
    const cost=c.mineral_cost+upc;min+=cost;used[u.army_slot]=(used[u.army_slot]||0)+c.supply_value;
    let sp=c.supply_value,spBy=null;e.up.forEach(k=>{const be=u.upgrades[k]&&u.upgrades[k].builder_effect;if(be&&be.supply_pool_value!=null){sp=be.supply_pool_value;spBy=k;}});
    pool+=sp;if(spBy)poolNotes.push(`${nm(e.key,u)} compte ${sp} au lieu de ${c.supply_value} (${abName(spBy,u.upgrades[spBy])})`);
    rows.push({e,u,c,cost,upc,sp,spBy});});
  L.tactical.forEach(k=>{const t=R.tactical_cards[k];if(!t)return;gas+=t.gas_cost;res+=t.resource_generated||0;
    Object.entries(t.grants_army_slots||{}).forEach(([s,n])=>avail[s]=(avail[s]||0)+n);});
  const creep=L.creep&&R.creep_cards[L.creep];if(creep)gas+=creep.gas_cost||0;
  const fname=nm(fk,F);
  if(min>lim)issues.push(['err',`Minéraux dépassés : ${min} pour ${lim} autorisés. Retirez ${min-lim} minéraux d'unités ou d'upgrades.`]);
  if(gas>gasCap)issues.push(['err',`Gas dépassé : ${gas} pour ${gasCap} autorisés (10 % du plafond minéraux). Retirez une Tactical Card${race==='ZERG'?' ou prenez une Creep Card moins chère':''}.`]);
  SLOTS.forEach(s=>{if(used[s]>avail[s])issues.push(['err',`Slots ${SLOTFR[s]} : ${used[s]} occupés pour ${avail[s]} disponibles. Ajoutez une Tactical Card qui donne des slots ${SLOTFR[s]}, ou retirez une unité.`]);});
  if(Object.keys(R.creep_cards).length&&!creep)issues.push(['err','Une Creep Card est obligatoire pour les Zerg : choisissez-en une dans la liste.']);
  if(creep&&!elig(creep.faction_tags))issues.push(['err',`${nm(L.creep,creep)} n'est pas jouable avec ${fname}.`]);
  rows.forEach(r=>{if(!elig(r.u.faction_tags))issues.push(['err',`${nm(r.e.key,r.u)} n'est pas jouable avec ${fname} : unité réservée à ${r.u.faction_tags.filter(t=>t!==RLABEL[race]).join(', ')}.`]);});
  L.tactical.forEach(k=>{const t=R.tactical_cards[k];if(t&&!elig(t.faction_tags))issues.push(['err',`${nm(k,t)} n'est pas jouable avec ${fname}.`]);});
  const uc={};rows.forEach(r=>uc[r.e.key]=(uc[r.e.key]||0)+1);
  Object.entries(uc).forEach(([k,n])=>{if(n>1&&R.units[k].unique)issues.push(['err',`${nm(k,R.units[k])} est Unique : une seule unité autorisée dans la liste.`]);});
  Object.keys(uc).forEach(k=>(R.units[k].exclusive_with||[]).forEach(x=>{if(uc[x]&&k<x)issues.push(['err',`${nm(k,R.units[k])} et ${nm(x,R.units[x])} ne peuvent pas être dans la même armée (Battle Preparation).`]);}));
  const tc={};L.tactical.forEach(k=>tc[k]=(tc[k]||0)+1);
  Object.entries(tc).forEach(([k,n])=>{const t=R.tactical_cards[k];if(t&&n>1&&t.unique)issues.push(['err',`${nm(k,t)} est Unique : une seule copie autorisée.`]);});
  // collection
  const active=colActive(race),own=ownedPools(race),use={};
  rows.forEach(r=>{const p=poolKey(r.e.key);use[p]=(use[p]||0)+r.c.models;});
  if(active){
    Object.entries(use).forEach(([p,n])=>{const o=own[p]||0;if(n>o)issues.push(['warn',`Collection : ${n} figurine${n>1?'s':''} ${poolLabel(p,R)} nécessaire${n>1?'s':''}, vous en avez ${o}.`]);});
    activeSummons(race,fk,L).forEach(x=>{const o=state.collection.units[x.k]||0,n=x.src.models_needed||1;if(o<n)issues.push(['warn',`Collection : ${n>1?(x.src.exact?'':'jusqu\'à ')+n+' figurines':'1 figurine'} ${nm(x.k,x.s)} pour ${srcTxt(race,x)}, vous en avez ${o}.`]);});
  }
  return {race,R,L,F,fk,lim,gasCap,min,gas,res,avail,used,rows,issues,elig,active,own,use,tc,pool,poolNotes};
}

/* ---------- rendering helpers ---------- */
const resName=r=>DB.races[r].resource;
function costTxt(cost){if(!cost)return '';return Object.entries(cost).map(([k,v])=>`${v} ${k}`).join(' + ');}
function wRow(n,w,label){
  const rng=w.rng==='E'?'E':(w.rng+'"');const surge=Array.isArray(w.surge_type)?w.surge_type.join(', '):(w.surge_type||'–');
  return `<tr><td>${esc(label||abName(n))}</td><td>${w.phase?esc(cap(w.phase)):''}</td><td class="num">${esc(rng)}</td><td>${esc(w.target)}</td><td class="num">${esc(w.roa)}</td><td class="num">${esc(w.hit)}</td><td>${esc(surge)}</td><td class="num">${esc(w.s_dice||'–')}</td><td class="num">${esc(w.dmg)}</td><td class="kw">${esc((w.keywords||[]).join(', ')||'–')}</td></tr>`;
}
function wTable(rows){return `<div class="tbl-wrap"><table><thead><tr><th>Arme</th><th>Phase</th><th>Rng</th><th>Cible</th><th>RoA</th><th>Hit</th><th>Surge</th><th>S Dice</th><th>Dmg</th><th>Mots-clés</th></tr></thead><tbody>${rows}</tbody></table></div>`;}
function abilList(abs,race){
  return `<ul class="abil">${Object.entries(abs||{}).map(([k,a])=>{
    let body=`<p>${esc(a.text||'')}</p>`;
    if(a.options)body+=`<ul>${a.options.map(o=>`<li><span class="num">${esc(costTxt(o.cost))}</span> : ${esc(o.effect)}</li>`).join('')}</ul>`;
    return `<li><span class="an">${esc(abName(k,a))}</span><span class="ty ${esc(a.type)}">${esc(a.type)}</span><span class="ph">${esc(cap(a.phase||''))}${a.restriction?' · '+esc(a.restriction):''}</span>${a.cost?`<span class="co">${esc(costTxt(a.cost))}</span>`:''}${body}</li>`;}).join('')}</ul>`;
}
function unitSheet(u,race){
  const s=u.stats;const sp=s.speed==null?'–':(s.speed_last_model!=null?`${s.speed}/${s.speed_last_model}`:s.speed);
  const st=[s.shield?['Shield',s.shield]:null,['Vitesse',sp],['Armure',s.armour],['Evade',s.evade],['PV',s.hp],['Size',s.size]].filter(Boolean);
  const sup=(u.supply_profile||[]).map(p=>`${p.models_min===p.models_max?p.models_min:p.models_min+'–'+p.models_max} fig. → ${p.supply}`).join(' · ');
  const ws=Object.entries(u.weapons||{}).map(([k,w])=>wRow(k,w)).join('');
  return `<div class="sheet">
    <div class="stats">${st.map(([l,v])=>`<div><b>${esc(v)}</b><span>${l}</span></div>`).join('')}</div>
    <div class="tags">${esc(u.combat_tags.join(', '))} · socle ${esc(typeof u.base_mm==='number'?u.base_mm+' mm':'de vol')} · supply restant : ${esc(sup)}${s.speed_last_model!=null?` · vitesse ${s.speed_last_model} quand il ne reste qu'une figurine`:''}</div>
    ${ws?wTable(ws):''}
    ${abilList(u.abilities,race)}
  </div>`;
}
function grantsTxt(g){return Object.entries(g||{}).map(([s,n])=>`+${n} ${SLOTFR[s]}`).join(', ');}

function missionRounds(n){const m=state.mission;if(m.r1==null)return null;const out=[];for(let i=0;i<n;i++)out.push(m.r1+i*(m.inc||0));return out;}
function missionTxt(){const r=missionRounds(5);return r?r.map((v,i)=>`T${i+1} ${v}`).join(' · '):'non renseigné';}
function missionChips(pool){const r=missionRounds(5);if(!r)return '<span class="tags">Saisissez les valeurs de votre carte de mission pour voir le supply utilisable à chaque tour.</span>';
  return r.map((v,i)=>`<span class="slot ${v>=pool?'full':''}" title="${v>=pool?'Couvre tout le Supply Pool de la liste':''}"><b>T${i+1}</b>${v}</span>`).join('')+`<span class="tags">Encadré : le supply du tour couvre tout le Supply Pool de la liste (${pool}).</span>`;}

      <label for="mis-inc">Par tour +</label><input type="text" inputmode="numeric" pattern="[0-9]*" id="mis-inc" data-act="mis" data-v="inc" value="${state.mission.inc??''}" placeholder="–"></div>

function renderCatalog(c){
  const {R,race}=c;let hidden=0;

  SLOTS.forEach(s=>{
    const items=Object.entries(R.units).filter(([k,u])=>u.army_slot===s);
    const vis=items.filter(([k,u])=>c.elig(u.faction_tags));hidden+=items.length-vis.length;
    if(!vis.length)return;
    h+=`<div class="group-h"><span>${SLOTFR[s]}</span><span class="num">${c.avail[s]||0} slot${(c.avail[s]||0)>1?'s':''}</span></div>`;
    vis.forEach(([k,u])=>{
      const inList=c.L.units.some(e=>e.key===k);const excl=(u.exclusive_with||[]).some(x=>c.L.units.some(e=>e.key===x));const block=(u.unique&&inList)||excl;
      const comps=u.composition_options.map(o=>`<span class="num">${o.models}</span> fig. <span class="num">${o.mineral_cost}</span>`).join(' · ');
      let colc='';if(c.active){const p=poolKey(k),o=c.own[p]||0,us=c.use[p]||0,left=o-us;colc=`<span class="chip ${left<u.composition_options[0].models?'low':''}">${left} fig. dispo${FAM.families[p]&&state.mode==='proxy'?' ('+cap(p).toLowerCase()+')':''}</span>`;}
      h+=`<div class="cat-item"><details><summary><span class="nm">${isFav(k)?'<span class="star on" style="font-size:14px;width:auto;height:auto">★</span> ':''}${esc(nm(k,u))}</span><span class="meta">${u.unique?'<span class="chip uni">Unique</span>':''}<span class="chip">${esc(u.combat_role)}</span>${comps}${colc}</span></summary>${unitSheet(u,race)}${renderUpgradesInfo(u)}</details><button class="btn sm primary" data-act="add-unit" data-v="${k}" ${block?'disabled title="Unité Unique déjà dans la liste"':''}>Ajouter</button></div>`;
    });
  });
  const tv=Object.entries(R.tactical_cards).filter(([k,t])=>c.elig(t.faction_tags));hidden+=Object.keys(R.tactical_cards).length-tv.length;
  h+=`<div class="group-h"><span>Tactical Cards</span><span class="num">gas ${c.gas} / ${c.gasCap}</span></div>`;
  tv.forEach(([k,t])=>{
    const block=t.unique&&c.L.tactical.includes(k);
    const colc='';
    h+=`<div class="cat-item"><details><summary><span class="nm">${esc(nm(k,t))}</span><span class="meta">${t.unique?'<span class="chip uni">Unique</span>':''}<span><span class="num">${t.gas_cost}</span> gas</span><span>${esc(grantsTxt(t.grants_army_slots))}</span><span>+${t.resource_generated} ${resName(race)}</span>${colc}</span></summary><div class="sheet">${abilList(t.abilities,race)}<div class="tags">Les capacités d'une Tactical Card sont gratuites : on Exhauste la carte, qui ne génère alors pas sa ressource ce round.</div></div></details><button class="btn sm primary" data-act="add-tac" data-v="${k}" ${block?'disabled title="Carte Unique déjà dans la liste"':''}>Ajouter</button></div>`;
  });
  const sv=summonsOf(race).filter(x=>c.elig(x.s.faction_tags));
  if(sv.length){h+=`<div class="group-h"><span>Invocations</span><span class="num">gratuites</span></div>`;
    sv.forEach(x=>{h+=`<div class="cat-item"><details><summary><span class="nm">${esc(nm(x.k,x.s))}</span><span class="meta"><span class="chip">${esc(x.s.combat_role||'')}</span><span>via ${esc(srcTxt(race,x))}</span></span></summary>${unitSheet(x.s,race)}</details><span class="chip">Hors liste</span></div>`;});}
  if(hidden)h+=`<p class="hint">${hidden} carte${hidden>1?'s':''} réservée${hidden>1?'s':''} à une autre Faction Card ${hidden>1?'sont masquées':'est masquée'}.</p>`;

function renderUpgradesInfo(u){
  const ups=Object.entries(u.upgrades||{});if(!ups.length)return '';

function upText(up){
  const pre=up.requires_upgrade?`Nécessite ${abName(up.requires_upgrade)}. `:'';return pre+upText0(up);}
function upText0(up){
  if(up.weapon_replacement){const w=up.weapon_replacement;return `${up.specialist?'SPECIALIST · 1 seule figurine. ':''}Remplace ${abName(up.for_weapon)} : Rng ${w.rng==='E'?'E':w.rng+'"'}, ${w.target}, RoA ${w.roa}, Hit ${w.hit}, Surge ${Array.isArray(w.surge_type)?w.surge_type.join('/'):(w.surge_type||'–')} ${w.s_dice||''}, Dmg ${w.dmg}${w.keywords&&w.keywords.length?', '+w.keywords.join(', '):''}.`;}
  if(up.weapon_added){const w=up.weapon_added;return `${up.specialist?'SPECIALIST · 1 seule figurine. ':''}Arme ajoutée : Rng ${w.rng}", ${w.target}, RoA ${w.roa}, Hit ${w.hit}, Dmg ${w.dmg}, ${(w.keywords||[]).join(', ')}.`;}
  return up.text||'';
}

  if(!L.tactical.length)h+=`<p class="hint">Aucune Tactical Card. Elles donnent des slots d'armée et de la ressource.</p>`;
  else h+=`<ul class="tac-list">${L.tactical.map((k,i)=>{const t=R.tactical_cards[k];return t?`<li><button type="button" class="nm" data-act="tac-info" data-k="${esc(k)}" aria-haspopup="dialog" title="Voir l’effet de la carte">${esc(nm(k,t))}</button><span class="tags">${esc(grantsTxt(t.grants_army_slots))} · +${t.resource_generated} ${resName(race)}</span><span class="num">${t.gas_cost} gas</span><button class="btn sm" data-act="rm-tac" data-v="${i}" aria-label="Retirer ${esc(nm(k,t))}">Retirer</button></li>`:'';}).join('')}</ul>`;
  h+=`<div class="group-h"><span>Unités</span><span class="num">${c.rows.length} unité${c.rows.length>1?'s':''}</span></div>`;

    h+=`<article class="unit"><div class="u-head"><div><h3>${esc(nm(e.key,u))}</h3><div class="meta"><span class="chip acc">${SLOTFR[u.army_slot]} · ${cmp.supply_value} slot${cmp.supply_value>1?'s':''}</span>${r.spBy?`<span class="chip acc">Supply Pool ${r.sp}</span>`:''}<span class="chip">${esc(u.combat_role)}</span>${u.unique?'<span class="chip uni">Unique</span>':''}</div></div><div class="u-cost">${r.cost}<small>${r.upc?`dont ${r.upc} d'upgrades`:'minéraux'}</small></div></div>
      <div class="u-body"><label class="field"><span>Effectif</span><select id="comp-${uid}" data-act="comp" data-uid="${uid}">${opts}</select></label>
      ${ups?`<div class="field"><span>Upgrades</span><div class="ups">${ups}</div></div>`:''}

      ${openSheets.has(uid)?unitSheet(u,race)+renderUpgradesInfo(u):''}</article>`;
  });
  return h+`</section>`;
}

/* ---------- collection view ---------- */
function renderCollection(){
  const race=state.race,R=DB.races[race],C=state.collection;

    x.redB=opts.roles.includes('LIFESAVER')?Math.min(0.06,0.03*x.sy.red):0;x.creepB=Math.min(0.08,0.02*x.sy.onCreepN*x.sy.creepLevel);x.distinct=new Set(x.L.tactical).size;x.dups=x.L.tactical.length-x.distinct;x.divB=divMode==='allow'?0:Math.min(0.08,0.012*x.distinct)-0.03*x.dups;x.favIn=new Set(x.per.filter(p=>p.fav).map(p=>p.e.key)).size;x.favB=favMode==='prefer'?Math.min(0.15,0.04*x.favIn):0;x.score=(0.6*x.sO+0.4*x.sE)*dm+0.05*x.resR+x.redB+x.creepB+x.favB+x.divB;x.dm=dm;});
  out.sort((a,b)=>favMode==='force'?(b.favIn-a.favIn)||(b.score-a.score):b.score-a.score);
  // diversité : pas deux listes avec exactement les mêmes unités
  const pick=[],us=new Set();for(const x of out){const s=x.fk+'|'+x.L.units.map(e=>e.key+':'+e.comp).sort().join(',');if(us.has(s))continue;us.add(s);pick.push(x);if(pick.length>=5)break;}
  const top=pick[0]?pick[0].score:1;pick.forEach(x=>x.pct=Math.round(x.score/top*100));
  return {lists:pick,built,valid:out.length,prof,lim,gasCap,race,colUsed:useCol,favN:favs.size,favMode};
}

let genRes=null,genBusy=false;
function genOpts(){const g=state.gen||(state.gen={});const race=state.race;
  if(!g.opp)g.opp=RACES.find(r=>r!==race);
  if(!g.roles)g.roles=['DAMAGE DEALER','TANK'];if(!g.favMode)g.favMode='prefer';if(!g.divMode)g.divMode='prefer';if(g.minPct==null)g.minPct=95;if(g.useCol==null)g.useCol=true;if(g.allFac==null)g.allFac=false;
  if(g.oppFac&&!DB.races[g.opp].faction_cards[g.oppFac])g.oppFac='';return g;}
function renderGen(){
  const g=genOpts(),race=state.race,R=DB.races[race],act=colActive(race);
  let h=`<section class="controls">
    <label class="field"><span>Adversaire</span><select id="g-opp" data-act="gen" data-v="opp">${RACES.map(r=>`<option value="${r}" ${r===g.opp?'selected':''}>${RLABEL[r]}</option>`).join('')}</select></label>
    <label class="field"><span>Faction adverse</span><select id="g-oppfac" data-act="gen" data-v="oppFac"><option value="">Toutes</option>${Object.entries(DB.races[g.opp].faction_cards).map(([k,f])=>`<option value="${k}" ${k===g.oppFac?'selected':''}>${esc(nm(k,f))}</option>`).join('')}</select></label>
    <label class="field"><span>Ma Faction Card</span><select id="g-allfac" data-act="gen" data-v="allFac"><option value="0" ${!g.allFac?'selected':''}>${esc(nm(state.faction[race],R.faction_cards[state.faction[race]]))} (actuelle)</option><option value="1" ${g.allFac?'selected':''}>Essayer toutes</option></select></label>
    <label class="field"><span>Budget minimum</span><select id="g-min" data-act="gen" data-v="minPct">${[100,98,95,90,85,80].map(v=>`<option value="${v}" ${v===g.minPct?'selected':''}>${v} % de ${limitOf()}</option>`).join('')}</select></label>
    <span class="spacer"></span>
    <button class="btn primary" data-act="gen-run" ${genBusy?'disabled':''}>${genBusy?'Calcul…':'Générer 5 listes'}</button>
  </section>
  <section class="controls">
    <div class="field"><span>Rôles obligatoires (si disponibles pour la faction)</span><div class="ups">${ROLES.map(r=>`<label class="up"><input type="checkbox" id="g-role-${r.replace(/\s/g,'_')}" data-act="gen-role" data-v="${r}" ${g.roles.includes(r)?'checked':''}>${esc(cap(r.split(' ').map(cap).join(' ')))}</label>`).join('')}</div></div>
    <label class="field"><span>Diversité des Tactical Cards</span><select id="g-div" data-act="gen" data-v="divMode"><option value="prefer" ${g.divMode==='prefer'?'selected':''}>Privilégier des cartes différentes</option><option value="forbid" ${g.divMode==='forbid'?'selected':''}>Aucun doublon</option><option value="allow" ${g.divMode==='allow'?'selected':''}>Doublons autorisés</option></select></label>
    ${(()=>{const nf=Object.keys(R.units).filter(isFav).length;return `<label class="field"><span>Unités favorites ★ (${nf})</span><select id="g-fav" data-act="gen" data-v="favMode" ${nf?'':'disabled'}><option value="prefer" ${g.favMode==='prefer'?'selected':''}>Privilégier</option><option value="force" ${g.favMode==='force'?'selected':''}>Inclure en priorité</option><option value="ignore" ${g.favMode==='ignore'?'selected':''}>Ignorer</option></select></label>`;})()}
    <label class="up" style="align-self:end"><input type="checkbox" id="g-col" data-act="gen" data-v="useCol" ${g.useCol?'checked':''} ${act?'':'disabled'}>Limiter à ma collection${act?` (mode ${state.mode})`:' (collection vide)'}</label>
  </section>
  <p class="tags" style="margin:0">Format ${SCALEFR[state.scale]||state.scale} · ${limitOf()} minéraux. Le score compare les listes entre elles : 100 = meilleure liste trouvée. Il s'appuie uniquement sur la base (dégâts attendus des armes contre les unités adverses, PV effectifs, Surge, PIERCE, détection des unités HIDDEN) et reste une estimation.</p>`;
  if(!genRes){h+=`<div class="panel"><p class="hint" style="padding-top:12px">Choisissez l'adversaire puis lancez la génération. Chaque liste proposée respecte les règles de liste et peut être chargée dans l'onglet Liste pour être ajustée.</p></div>`;return h;}
  const G=genRes;
  if(G.race!==race){h+=`<div class="panel"><p class="hint" style="padding-top:12px">Les derniers résultats concernent les ${RLABEL[G.race]}. Relancez la génération pour les ${RLABEL[race]}.</p></div>`;return h;}
  h+=`<p class="tags" style="margin:0">${G.built} listes construites, ${G.valid} passent les filtres. Adversaire type : ${G.prof.units.length} unités ${RLABEL[G.prof.race]}${G.prof.fac?' ('+esc(nm(G.prof.fac,DB.races[G.prof.race].faction_cards[G.prof.fac]))+')':''}${G.prof.hidden?', dont des unités capables de devenir HIDDEN':''}.</p>`;
  if(!G.lists.length){h+=`<ul class="issues"><li class="warn">Aucune liste ne passe les filtres. Baissez le budget minimum, décochez un rôle obligatoire${G.colUsed?' ou désactivez la limite de collection':''}.</li></ul>`;return h;}
  h+=`<div class="gen-grid">`+G.lists.map((x,i)=>{
    const F=R.faction_cards[x.fk];
    return `<article class="panel gen-card"><header><h2>Liste ${i+1}</h2><span class="big">${x.pct}<small> / 100</small></span></header>
      <div class="fc"><div class="meta"><span class="chip acc">${esc(nm(x.fk,F))}</span><span><span class="num">${x.spent}</span>/${G.lim} min</span><span><span class="num">${x.gas}</span>/${G.gasCap} gas</span><span>${x.res} ${resName(race)}/round</span></div>
      <div class="score-rows">
        ${scoreRow('Offensive',x.sO,'Dégâts attendus par round contre les unités adverses')}
        ${scoreRow('Résistance',x.sE,'PV effectifs selon armure, Shield et Surge adverse')}
        <div class="tags">Détection : ${x.det?'oui':'non'}${G.prof.hidden?(x.det?' · bonus +10 % (adversaire HIDDEN)':' · malus −10 % (adversaire HIDDEN)'):''} · Ressources : ${x.res}${x.sy.red?` + ${x.sy.red} de réduction de coût${x.redB?' (bonus Lifesaver)':''}`:''} ${resName(race)} pour une demande de ${+x.sy.demand.toFixed(1)}${x.sy.cov<1?` (couverte à ${Math.round(x.sy.cov*100)} %)`:''} · Rôles : ${esc(x.roles.map(r=>r.split(' ').map(cap).join(' ')).join(', '))}</div>
        <div class="tags">Tactical Cards : ${x.distinct} différente${x.distinct>1?'s':''}${x.dups?` · ${x.dups} doublon${x.dups>1?'s':''}`:''}</div>
        ${G.favN?`<div class="tags">Favoris inclus : ${x.favIn}/${G.favN}${x.favB?` · bonus +${Math.round(x.favB*100)} %`:''}</div>`:''}
        ${x.synNotes.length?`<div class="tags">Capacités chiffrées : ${esc(x.synNotes.join(' · '))}</div>`:''}
        ${x.sy.creepSrc||x.sy.onCreepN?`<div class="tags">Creep : ${+x.sy.creepSrc.toFixed(1)} source${x.sy.creepSrc>1?'s':''} (couverture ${Math.round(x.sy.creepLevel*100)} %), ${x.sy.onCreepN} élément${x.sy.onCreepN>1?'s':''} avec bonus ON CREEP${x.creepB?` · bonus +${Math.round(x.creepB*100)} %`:''}</div>`:''}
        ${x.sy.stimN?`<div class="tags">Stimpack : ${x.sy.stimN} unité${x.sy.stimN>1?'s':''}, dégâts auto-infligés ${+x.sy.selfDmg.toFixed(1)} PV/round, soins ${+x.sy.healed.toFixed(1)} PV/round${x.sy.sustain<1?` (compensés à ${Math.round(x.sy.sustain*100)} %)`:' (compensés)'}</div>`:''}
      </div></div>
      <ul class="tac-list">${x.L.creep?`<li><span class="nm">${esc(nm(x.L.creep,R.creep_cards[x.L.creep]))}</span><span class="tags">Creep</span></li>`:''}${x.L.tactical.map(k=>`<li><span class="nm">${esc(nm(k,R.tactical_cards[k]))}</span><span class="num">${R.tactical_cards[k].gas_cost} gas</span></li>`).join('')}</ul>
      <ul class="tac-list">${x.per.slice().sort((a,b)=>b.o-a.o).map(p=>`<li><span class="nm">${p.fav?'<span class="star on" aria-label="favorite">★</span> ':''}${esc(nm(p.e.key,p.u))} ×${p.c.models}${p.e.up.length?`<br><span class="tags">${esc(p.e.up.map(k=>abName(k,p.u.upgrades[k])).join(', '))}</span>`:''}</span><span class="tags">${esc(p.u.combat_role.split(' ').map(cap).join(' '))}</span></li>`).join('')}</ul>
      <div class="fc"><button class="btn primary" data-act="gen-load" data-v="${i}">Charger dans la liste</button></div></article>`;}).join('')+`</div>`;
  return h;
}
function scoreRow(l,v,t){return `<div class="srow" title="${esc(t)}"><span class="lbl">${l}</span><div class="bar"><i style="width:${Math.round(v*100)}%"></i></div><span class="num">${Math.round(v*100)}</span></div>`;}
function runGen(){if(genBusy)return;genBusy=true;render();
  setTimeout(()=>{try{const g=genOpts();genRes=generate({opp:g.opp,oppFac:g.oppFac,allFac:g.allFac,minPct:g.minPct,roles:g.roles,useCol:g.useCol,favMode:g.favMode,divMode:g.divMode});}catch(e){genRes=null;console.error(e);}genBusy=false;render();},30);}
function loadGen(i){const x=genRes&&genRes.lists[i];if(!x)return;const race=genRes.race;
  state.faction[race]=x.fk;state.lists[race]={units:x.L.units.map(e=>({uid:state.nextUid++,key:e.key,comp:e.comp,up:e.up.slice()})),tactical:x.L.tactical.slice(),creep:x.L.creep};
  state.race=race;state.view='list';openSheets.clear();render();window.scrollTo(0,0);}

/* ---------- main render ---------- */
function render(){renderHeader();if(state.view!=='list')lastC=null;document.getElementById('main').innerHTML=state.view==='list'?renderList():state.view==='gen'?renderGen():renderCollection();save();updateBudget();applyHd();}

/* ---------- mutations ---------- */
const curList=()=>state.lists[state.race];
function touch(){curList().example=false;}
function findUnit(uid){return curList().units.find(e=>e.uid===+uid);}

document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]');if(!b||b.tagName==='SELECT'||b.tagName==='INPUT')return;
  const a=b.dataset.act,v=b.dataset.v,L=curList();
  if(a==='tac-info'){openTac(b.dataset.k);return;}
  switch(a){
    case 'race':if(topEl().classList.contains('compact')&&v===state.race){toggleHd();return;}state.race=v;break;
    case 'view':state.view=v;break;
    case 'add-unit':L.units.push({uid:state.nextUid++,key:v,comp:0,up:[]});touch();break;
    case 'add-tac':L.tactical.push(v);touch();break;
    case 'rm-tac':L.tactical.splice(+v,1);touch();break;
    case 'rm-unit':L.units=L.units.filter(e=>e.uid!==+b.dataset.uid);openSheets.delete(+b.dataset.uid);touch();break;
    case 'sheet':{const u=+b.dataset.uid;openSheets.has(u)?openSheets.delete(u):openSheets.add(u);break;}
    case 'clear':
      if(!b.dataset.armed){b.dataset.armed='1';b.textContent='Confirmer : tout retirer';setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent='Vider la liste';}},3500);return;}
      // fallthrough
    case 'clear-now':state.lists[state.race]={units:[],tactical:[],creep:null};openSheets.clear();break;
    case 'fiche':openFiche();return;
    case 'recap':openExport('Récapitulatif de la liste','Texte à coller dans un message ou un document.',recapText(),null);return;
    case 'export-list':openExport('Exporter la liste',"Gardez ce fichier pour recharger la liste plus tard avec « Importer ». Si le téléchargement ne démarre pas, copiez le texte dans un fichier .json.",JSON.stringify(listFile(),null,2),`liste-${state.race.toLowerCase()}.json`);return;
    case 'export-col':openExport('Exporter ma collection',"Ce fichier est votre sauvegarde de référence : le navigateur garde une copie automatique, mais elle peut être effacée. Si le téléchargement ne démarre pas, copiez le texte dans un fichier .json.",JSON.stringify(colFile(),null,2),'collection-sctmg.json');return;
    case 'import':openImport();return;
    case 'fav':{const f=state.collection.favorites||(state.collection.favorites={});if(f[v])delete f[v];else f[v]=true;break;}
    case 'gen-run':runGen();return;
    case 'gen-load':loadGen(+v);return;
    case 'col-step':{const bag=state.collection.units;const n=setCol(b.dataset.t,b.dataset.v,(bag[b.dataset.v]||0)+(+b.dataset.d));const inp=document.getElementById(`col-${b.dataset.t}-${b.dataset.v}`);if(inp)inp.value=n;refreshColTotals();return;}
    default:return;
  }
  render();
});
document.addEventListener('change',ev=>{
  const t=ev.target,a=t.dataset&&t.dataset.act;if(!a)return;const L=curList();
  switch(a){
    case 'faction':state.faction[state.race]=t.value;break;
    case 'scale':state.scale=t.value;break;
    case 'custom':state.custom=Math.max(2001,Math.round(+t.value)||2001);break;
    case 'mis':{const raw=String(t.value).replace(/[^0-9]/g,'');state.mission[t.dataset.v]=raw===''?null:Math.min(99,+raw);break;}
    case 'creep':L.creep=t.value||null;touch();break;
    case 'comp':{const e=findUnit(t.dataset.uid);if(e){e.comp=+t.value;touch();}break;}
    case 'up':{const e=findUnit(t.dataset.uid);if(!e)return;const u=DB.races[state.race].units[e.key],k=t.dataset.v;
      if(t.checked){if(!e.up.includes(k))e.up.push(k);}else e.up=e.up.filter(x=>x!==k&&(u.upgrades[x]||{}).requires_upgrade!==k);touch();break;}
    case 'mode':state.mode=t.value;break;
    case 'gen':{const g=genOpts(),k=t.dataset.v;if(k==='useCol')g.useCol=t.checked;else if(k==='allFac')g.allFac=t.value==='1';else if(k==='minPct')g.minPct=+t.value;else{g[k]=t.value;if(k==='opp')g.oppFac='';}break;}
    case 'gen-role':{const g=genOpts();g.roles=t.checked?[...new Set([...g.roles,t.dataset.v])]:g.roles.filter(r=>r!==t.dataset.v);break;}
    case 'col':{const n=setCol(t.dataset.t,t.dataset.v,+String(t.value).replace(/[^0-9]/g,''));t.value=n;refreshColTotals();return;}
    default:return;
  }
  render();
});

document.addEventListener('input',ev=>{const t=ev.target;if(!t.dataset||t.dataset.act!=='col')return;const raw=String(t.value).replace(/[^0-9]/g,'');if(raw!==t.value)t.value=raw;if(raw==='')return;setCol(t.dataset.t,t.dataset.v,+raw);refreshColTotals();});
document.addEventListener('focusin',ev=>{const t=ev.target;if(t.dataset&&t.dataset.act==='col'){try{t.select();}catch(e){}}});

function listFile(){const L=curList(),R=DB.races[state.race];return {type:'sctmg-list',format_version:1,database_version:DB.metadata.database_version,saved:new Date().toISOString(),race:state.race,faction:state.faction[state.race],scale:state.scale,mineral_limit:limitOf(),mission:{round1:state.mission.r1,per_round:state.mission.inc},creep:L.creep,tactical:L.tactical.slice(),units:L.units.map(e=>{const u=R.units[e.key];return {key:e.key,models:(u.composition_options[e.comp]||u.composition_options[0]).models,upgrades:e.up.slice()};})};}
function colFile(){return {type:'sctmg-collection',format_version:1,families_version:FAM.version,database_version:DB.metadata.database_version,saved:new Date().toISOString(),mode:state.mode,units:state.collection.units,favorites:Object.keys(state.collection.favorites||{})};}
function recapText(){
  const c=compute(),{R,L,F,race}=c;const lines=[];
  lines.push(`StarCraft TMG · ${RLABEL[race]} · ${nm(c.fk,F)} · ${SCALEFR[state.scale]||state.scale} ${c.lim}`);
  lines.push(`Minéraux ${c.min}/${c.lim} · Gas ${c.gas}/${c.gasCap}`);
  lines.push(`Ressource : ${c.res} ${resName(race)} par round (cartes)`);
  lines.push(state.mission.r1!=null?`Supply par tour (mission) : ${state.mission.r1} au tour 1, +${state.mission.inc||0} par tour suivant (${missionTxt()})`:'Supply par tour (mission) : non renseigné');
  lines.push(`Supply Pool : ${c.pool}${c.poolNotes.length?' ('+c.poolNotes.join(' ; ')+')':''}`);
  lines.push(`Slots : ${SLOTS.filter(s=>c.avail[s]||c.used[s]).map(s=>`${SLOTFR[s]} ${c.used[s]}/${c.avail[s]}`).join(', ')}`);
  if(L.creep&&R.creep_cards[L.creep])lines.push(`Creep Card : ${nm(L.creep,R.creep_cards[L.creep])} (${R.creep_cards[L.creep].gas_cost} gas)`);
  {const sm=activeSummons(race,c.fk,L);if(sm.length)lines.push(`Invocations : ${sm.map(x=>nm(x.k,x.s)+' (via '+srcTxt(race,x)+')').join(', ')}`);}
  lines.push(`Tactical Cards : ${L.tactical.map(k=>`${nm(k,R.tactical_cards[k])} (${R.tactical_cards[k].gas_cost})`).join(', ')||'aucune'}`);
  lines.push('Unités :');
  c.rows.forEach(r=>lines.push(`- ${nm(r.e.key,r.u)} ×${r.c.models} [${SLOTFR[r.u.army_slot]}, supply ${r.c.supply_value}] ${r.cost} min${r.e.up.length?' · '+r.e.up.map(k=>abName(k,r.u.upgrades[k])+(r.u.upgrades[k].specialist?' (1 fig.)':'')).join(', '):''}`));
  const errs=c.issues.filter(i=>i[0]==='err');lines.push(errs.length?`⚠ ${errs.length} problème(s) de règles`:'Liste légale');
  return lines.join('\n');
}
function importData(txt){
  let d;try{d=JSON.parse(txt);}catch(e){return ['err',"Ce texte n'est pas un JSON valide. Vérifiez que tout le contenu du fichier a été collé."];}
  if(d&&d.type==='sctmg-collection'){
    const clean=o=>{const r={};Object.entries(o||{}).forEach(([k,v])=>{const n=Math.max(0,Math.round(+v)||0);if(n)r[k]=n;});return r;};
    state.collection={units:clean(d.units),favorites:Object.fromEntries((Array.isArray(d.favorites)?d.favorites:[]).map(k=>[k,true]))};if(d.mode==='proxy'||d.mode==='strict')state.mode=d.mode;
    state.view='collection';render();
    if(d.families_version&&d.families_version!==FAM.version)return ['warn',`Collection importée. Elle a été créée avec la table des familles v${d.families_version}, la base utilise la v${FAM.version} : vérifiez les regroupements en mode proxy.`];
    return ['ok','Collection importée.'];
  }
  if(d&&d.type==='sctmg-list'){
    const R=DB.races[d.race];if(!R)return ['err',`Race inconnue dans le fichier : ${d.race}.`];
    let skipped=0;
    const units=(d.units||[]).map(u=>{const U=R.units[u.key];if(!U){skipped++;return null;}let ci=U.composition_options.findIndex(o=>o.models===u.models);if(ci<0){ci=0;skipped++;}
      return {uid:state.nextUid++,key:u.key,comp:ci,up:(u.upgrades||[]).filter(k=>U.upgrades[k])};}).filter(Boolean);
    const tactical=(d.tactical||[]).filter(k=>R.tactical_cards[k]||(skipped++,false));
    state.race=d.race;if(R.faction_cards[d.faction])state.faction[d.race]=d.faction;
    if(DB.army_building_rules.engagement_scales[d.scale])state.scale=d.scale;if(d.mineral_limit)state.custom=d.mineral_limit;if(d.mission)state.mission={r1:d.mission.round1??null,inc:d.mission.per_round??null};
    state.lists[d.race]={units,tactical,creep:R.creep_cards[d.creep]?d.creep:null};state.view='list';openSheets.clear();render();
    return skipped?['warn',`Liste importée. ${skipped} élément(s) ne correspondent plus à la base actuelle et ont été ignorés ou ajustés.`]:['ok','Liste importée.'];
  }
  return ['err',"Fichier non reconnu : il doit venir de l'export Liste ou Collection de ce builder."];
}

  const xml=new XMLSerializer().serializeToString(el);host.innerHTML='';

  const s=3,cv=document.createElement('canvas');cv.width=w*s;cv.height=h*s;const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.scale(s,s);cx.drawImage(img,0,0);return cv;}
function b64bytes(d){const b=atob(d.split(',')[1]);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function buildPdf(canvases){const enc=new TextEncoder();const parts=[];let off=0;const offs=[];
  const push=x=>{const u=typeof x==='string'?enc.encode(x):x;parts.push(u);off+=u.length;};
  const obj=(n,body)=>{offs[n]=off;push(`${n} 0 obj\n`);body.forEach(push);push(`\nendobj\n`);};
  push('%PDF-1.4\n%\u00e2\u00e3\n');const PW=595.28,PH=841.89;const n=canvases.length;const kids=[];
  canvases.forEach((cv,i)=>{kids.push(`${3+i*3} 0 R`);});
  obj(1,['<< /Type /Catalog /Pages 2 0 R >>']);obj(2,[`<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${n} >>`]);
  canvases.forEach((cv,i)=>{const p=3+i*3,c=p+1,im=p+2;const jpg=b64bytes(cv.toDataURL('image/jpeg',0.92));
    const w=PW,h=Math.min(PH,cv.height*PW/cv.width);const cs=`q ${w.toFixed(2)} 0 0 ${h.toFixed(2)} 0 ${(PH-h).toFixed(2)} cm /Im0 Do Q`;
    obj(p,[`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 ${im} 0 R >> >> /Contents ${c} 0 R >>`]);
    obj(c,[`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`]);
    obj(im,[`<< /Type /XObject /Subtype /Image /Width ${cv.width} /Height ${cv.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`,jpg,'\nendstream']);});

  push(x+`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);return new Blob(parts,{type:'application/pdf'});}
async function saveBlob(filename,blob){

function fWeapons(u,e,c){
  const rows=[];const ups=e.up;
  Object.entries(u.weapons||{}).forEach(([k,w])=>{if(w.requires_upgrade&&!ups.includes(w.requires_upgrade))return;
    const rep=ups.map(x=>[x,u.upgrades[x]]).find(([x,up])=>up&&up.weapon_replacement&&up.for_weapon===k&&!up.specialist);
    if(rep)rows.push([abName(rep[0],rep[1]),{...rep[1].weapon_replacement,phase:rep[1].phase||w.phase},`remplace ${abName(k)}`]);else rows.push([abName(k),w,'']);});
  ups.forEach(x=>{const up=u.upgrades[x];if(!up)return;
    if(up.weapon_replacement&&up.specialist)rows.push([abName(x,up),{...up.weapon_replacement,phase:up.phase||'ASSAULT'},`1 figurine, remplace ${abName(up.for_weapon)}`]);
    if(up.weapon_added)rows.push([abName(x,up),{...up.weapon_added,phase:'ASSAULT'},up.specialist?'1 figurine':'ajoutée']);});

/* découpe en pages A4 (680 × 962 px, ratio A4) : mesure réelle page par page ; un bloc trop haut pour une page est scindé entre ses capacités */
const PAGE_H=962;

  while(queue.length){const b=queue.shift();const w=document.createElement('div');w.className='blk';w.innerHTML=b;page.appendChild(w);

    page.removeChild(w);

    const parts=splitBlock(b,page);if(parts){queue.unshift(...parts);continue;}

  if(cur.length)pages.push(cur);host.innerHTML='';return pages;}
function splitBlock(b,page){const w=document.createElement('div');w.className='blk';w.innerHTML=b;const lis=[...w.querySelectorAll('ul.ab > li, .cc > p')];if(lis.length<2)return null;
  const title=(w.querySelector('h3')||w.querySelector('.cch b')||{}).textContent||'';
  page.appendChild(w);const rest=[];
  while(page.offsetHeight>PAGE_H-36&&lis.length>1){const li=lis.pop();rest.unshift(li.outerHTML);li.remove();}
  const first=w.innerHTML;page.removeChild(w);if(!rest.length)return null;
  const cont=`<div class="ub"><div class="uh"><h3>${esc(title.replace(/\s+/g,' ').trim())} <span>(suite)</span></h3></div><ul class="ab">${rest.map(x=>x.startsWith('<p')?x.replace(/^<p/,'<li').replace(/<\/p>$/,'</li>'):x).join('')}</ul></div>`;
  return [first,cont];}
async function ficheCanvas(blocks,acc,small){return domToCanvas(fichePage(blocks,acc,small));}
async function exportFiche(kind,mode,opts){opts=opts||{};
  const {blocks,acc,race}=ficheBlocks(mode,opts);const sm=!!opts.small;const base=`liste-${race.toLowerCase()}-${mode==='detail'?'aide-de-jeu':'resume'}`;
  if(kind==='png'){const cv=await ficheCanvas(blocks,acc,sm);const blob=await new Promise(r=>cv.toBlob(r,'image/png'));return saveBlob(base+'.png',blob);}
  const pages=fichePaginate(blocks,acc,sm);const cvs=[];
  for(const pg of pages){const el=fichePage(pg,acc,sm);el.style.height=PAGE_H+'px';cvs.push(await domToCanvas(el));}
  return saveBlob(base+'.pdf',buildPdf(cvs));
}

/* ---------- bandeau repliable, barre de budget ----------
   Ordinateur : bouton ▴/▾ (mémorisé) + masquage du bandeau au défilement.
   Téléphone : tout en haut, bandeau déplié ; dès qu'on défile, bandeau replié fixé en haut + barre de budget, sans va-et-vient. */
const HDK='sctmg-builder-hd', isPhone=()=>matchMedia('(max-width:700px)').matches;
let hdCompact=(()=>{try{const v=localStorage.getItem(HDK);if(v)return v==='1';}catch(e){}return false;})();
let lastC=null, lastPhone=isPhone(), floatOn=false, manualOpen=false, topCompact=false;
function topEl(){return document.querySelector('.top');}
function isCompact(){return isPhone()?(floatOn?!manualOpen:topCompact):hdCompact;}
function applyHd(){const t=topEl(),b=document.getElementById('hdTog');if(!t||!b)return;const c=isCompact();
  t.classList.toggle('compact',c);t.classList.toggle('floating',isPhone()&&floatOn);
  b.textContent=c?'▾':'▴';b.setAttribute('aria-expanded',c?'false':'true');b.setAttribute('aria-label',c?'Afficher tout le bandeau':'Réduire le bandeau');b.title=b.getAttribute('aria-label');syncHd();}
function toggleHd(){if(isPhone()){if(floatOn)manualOpen=!manualOpen;else topCompact=!topCompact;}
  else{hdCompact=!hdCompact;try{localStorage.setItem(HDK,hdCompact?'1':'0');}catch(e){}topEl().classList.remove('hid');}applyHd();}
function setFloat(on){const t=topEl(),sp=document.getElementById('hdSpacer');if(!t||on===floatOn)return;
  if(sp)sp.style.height=on?(t.offsetHeight+(parseFloat(getComputedStyle(t.parentElement).rowGap)||0))+'px':'0px';floatOn=on;manualOpen=false;topCompact=false;applyHd();}
function syncHd(){const t=topEl();if(!t)return;const h=t.classList.contains('hid')?0:Math.max(0,t.getBoundingClientRect().bottom);
  document.documentElement.style.setProperty('--hdH',h+'px');syncBudget();}
function syncBudget(){const bd=document.getElementById('budget'),st=document.querySelector('.strip');if(!bd)return;
  if(state.view!=='list'||!st||!lastC){bd.hidden=true;return;}
  if(isPhone()){bd.hidden=!floatOn;return;}
  const hdH=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hdH'))||0;
  const ref=st.querySelector('.cell')||st;bd.hidden=!(ref.getBoundingClientRect().bottom<hdH+4);}
function updateBudget(){const bd=document.getElementById('budget');if(!bd)return;const c=lastC;if(state.view!=='list'||!c){bd.hidden=true;return;}
  const errs=c.issues.filter(i=>i[0]==='err').length,warns=c.issues.filter(i=>i[0]==='warn').length;
  const st=errs?`<span class="pill err">${errs} problème${errs>1?'s':''}</span>`:warns?`<span class="pill warn">Légale</span>`:`<span class="pill ok">Légale</span>`;
  const m=(l,u,lim)=>`<span class="bud-m"><span class="lbl">${l}</span><b class="${u>lim?'over':''}">${u}</b>/${lim}<span class="bar ${u>lim?'over':''}"><i style="width:${Math.min(100,lim?u/lim*100:0)}%"></i></span></span>`;
  const slots=SLOTS.filter(s=>c.avail[s]||c.used[s]).map(s=>`<span class="slot ${c.used[s]>c.avail[s]?'over':c.used[s]===c.avail[s]?'full':''}"><b>${SLOTFR[s]}</b>${c.used[s]}/${c.avail[s]}</span>`).join('');
  bd.innerHTML=`<button class="in" type="button" id="budJump" aria-label="Budget de la liste : afficher le détail">${m('Min.',c.min,c.lim)}${m('Gas',c.gas,c.gasCap)}<span class="slots">${slots}</span><span class="bud-m"><span class="lbl">Supply</span><b>${c.pool}</b></span>${st}</button>`;
  syncBudget();}
function actionsHTML(btns){return isPhone()?`<details class="actmenu"><summary class="btn">Actions ▾</summary><div class="actlist">${btns}</div></details>`:btns;}
let lastY=scrollY,ticking=false;
addEventListener('scroll',()=>{if(ticking)return;ticking=true;requestAnimationFrame(()=>{ticking=false;const y=scrollY,t=topEl();if(!t)return;
  if(isPhone()){t.classList.remove('hid');const want=floatOn?y>4:y>16;
    if(want!==floatOn)setFloat(want);else if(floatOn&&manualOpen&&Math.abs(y-lastY)>10){manualOpen=false;applyHd();}}
  else{if(y>lastY+6&&y>90)t.classList.add('hid');else if(y<lastY-6||y<40)t.classList.remove('hid');}
  lastY=y;syncHd();});},{passive:true});
addEventListener('resize',()=>{const p=isPhone();if(p!==lastPhone){lastPhone=p;const sp=document.getElementById('hdSpacer');if(sp)sp.style.height='0px';floatOn=false;manualOpen=false;topCompact=false;topEl().classList.remove('hid');render();}syncHd();});
document.addEventListener('transitionend',e=>{if(e.target===topEl())syncHd();});
document.addEventListener('click',e=>{
  if(e.target.closest('#hdTog')){toggleHd();return;}
  if(e.target.closest('#budJump')){const s=document.querySelector('.strip');if(s){const hdH=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hdH'))||0;scrollTo({top:Math.max(0,scrollY+s.getBoundingClientRect().top-hdH-8),behavior:'smooth'});}return;}
  const a=e.target.closest('.actmenu [data-act]');if(a&&a.dataset.act!=='clear'){const d=a.closest('details');if(d)d.open=false;}
  if(!e.target.closest('.actmenu'))document.querySelectorAll('details.actmenu[open]').forEach(d=>d.open=false);
},true);
