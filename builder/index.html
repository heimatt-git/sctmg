<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><link rel="manifest" href="../manifest.webmanifest"><meta name="theme-color" content="#0e1319"><link rel="icon" type="image/svg+xml" href="../icons/icon.svg"><link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png"><link rel="apple-touch-icon" href="../icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="SC:TMG"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><script>try{if(localStorage.getItem('sctmg-skin')==='terran')document.documentElement.setAttribute('data-skin','terran')}catch(e){}</script><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>StarCraft TMG Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#E9EDF1; --surface:#FFFFFF; --surface-2:#F3F5F8; --ink:#15202B; --muted:#586676; --line:#D3DAE2;
  --zerg:#8E3FA8; --terran:#B5561C; --protoss:#9A7410;
  --ok:#23734A; --ok-bg:#E3F3EA; --warn:#9A6212; --warn-bg:#FBF0DC; --err:#B3261E; --err-bg:#FBE4E2;
  --acc:var(--zerg);
  --f-display:"Rajdhani","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0E1318; --surface:#151C23; --surface-2:#1B242D; --ink:#E4EAF0; --muted:#95A3B1; --line:#29343F;
  --zerg:#C98BE3; --terran:#F0925A; --protoss:#E2B642;
  --ok:#6FCF97; --ok-bg:#16301F; --warn:#F2B55C; --warn-bg:#35280F; --err:#FF8A80; --err-bg:#3A1714;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1318; --surface:#151C23; --surface-2:#1B242D; --ink:#E4EAF0; --muted:#95A3B1; --line:#29343F;
  --zerg:#C98BE3; --terran:#F0925A; --protoss:#E2B642;
  --ok:#6FCF97; --ok-bg:#16301F; --warn:#F2B55C; --warn-bg:#35280F; --err:#FF8A80; --err-bg:#3A1714;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);padding-inline:16px;padding-block:0 40px}
.app[data-race="ZERG"]{--acc:var(--zerg)} .app[data-race="TERRAN"]{--acc:var(--terran)} .app[data-race="PROTOSS"]{--acc:var(--protoss)}
.app{max-width:1280px;margin:0 auto;display:grid;gap:14px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.02em;margin:0;text-wrap:balance}
button,select,input,textarea{font:inherit;color:inherit}
*{-webkit-tap-highlight-color:transparent}
@media (max-width:600px){select,input,textarea{font-size:16px}}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:14px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand-mark{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.14em;color:var(--surface);background:var(--acc);padding:4px 7px;clip-path:polygon(0 0,100% 0,100% 70%,85% 100%,0 100%)}
.brand h1{font-size:24px;line-height:1}
.brand .sub{margin:2px 0 0;color:var(--muted);font-size:12px}
.seg{display:flex;border:1px solid var(--line);background:var(--surface)}
.seg button{border:0;background:none;padding:7px 14px;font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-selected="true"]{color:var(--surface);background:var(--acc)}
.seg .r-ZERG[aria-selected="true"]{background:var(--zerg)} .seg .r-TERRAN[aria-selected="true"]{background:var(--terran)} .seg .r-PROTOSS[aria-selected="true"]{background:var(--protoss)}

/* controls */
.controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end}
.field{display:grid;gap:3px}
.field>span,.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
select,input[type=number],textarea{background:var(--surface);border:1px solid var(--line);padding:6px 8px;border-radius:3px}
input[type=number]{width:74px}
.btn{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:3px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--acc)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--surface)}
.btn.danger{color:var(--err)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:3px 9px;font-size:13px}
.spacer{flex:1}

/* strip */
.strip{display:flex;flex-wrap:wrap;gap:1px;background:var(--line);border:1px solid var(--line)}
.strip>.cell{flex:1 1 190px}
.cell{background:var(--surface);padding:10px 14px;display:grid;gap:6px;align-content:start}
.m-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.big{font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums}
.big small{font-size:13px;color:var(--muted)}
.bar{height:6px;background:var(--surface-2);border:1px solid var(--line);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--acc)}
.bar.over i{background:var(--err)}
.slots{display:flex;flex-wrap:wrap;gap:6px}
.slot{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);padding:2px 7px;background:var(--surface-2)}
.slot b{font-family:var(--f-display);font-size:12px;letter-spacing:.08em;margin-right:4px}
.slot.over{border-color:var(--err);color:var(--err);background:var(--err-bg)}
.slot.full{border-color:var(--acc)}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px;padding:3px 10px;border-radius:99px;width:max-content}
.pill.ok{color:var(--ok);background:var(--ok-bg)} .pill.warn{color:var(--warn);background:var(--warn-bg)} .pill.err{color:var(--err);background:var(--err-bg)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}

/* issues */
.issues{display:grid;gap:4px;margin:0;padding:0;list-style:none}
.issues li{padding:6px 10px 6px 12px;border-left:3px solid;font-size:13px}
.issues .err{border-color:var(--err);background:var(--err-bg)}
.issues .warn{border-color:var(--warn);background:var(--warn-bg)}
.issues .info{border-color:var(--line);background:var(--surface)}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px 12px;border:1px dashed var(--acc);background:var(--surface);font-size:13px}

/* columns */
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr)} .army{order:-1}}
.panel{background:var(--surface);border:1px solid var(--line)}
.panel>header{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.panel>header h2{font-size:19px}
.group-h{font-family:var(--f-display);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);padding:10px 14px 4px;display:flex;justify-content:space-between}
.group-h .num{color:var(--muted);letter-spacing:0;font-size:12px}
.hint{color:var(--muted);font-size:13px;padding:6px 14px 12px;margin:0}

/* catalog */
.cat-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:start;padding:8px 14px;border-top:1px solid var(--line)}
.cat-item summary{cursor:pointer;list-style:none;display:grid;gap:2px}
.cat-item summary::-webkit-details-marker{display:none}
.cat-item summary .nm{font-weight:600}
.cat-item summary .nm::before{content:"▸";display:inline-block;width:1em;color:var(--muted);transition:transform .15s}
.cat-item details[open] summary .nm::before{transform:rotate(90deg)}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted)}
.meta .num{color:var(--ink)}
.chip{font-size:11px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);padding:0 6px;border-radius:2px;color:var(--muted);white-space:nowrap}
.chip.acc{border-color:var(--acc);color:var(--acc)}
.chip.uni{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip.low{border-color:var(--warn);color:var(--warn)}

/* army */
.fc{padding:10px 14px;display:grid;gap:6px;border-bottom:1px solid var(--line)}
.fc-row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.tac-list{list-style:none;margin:0;padding:0}
.tac-list li{display:flex;align-items:center;gap:10px;padding:6px 14px;border-top:1px solid var(--line)}
.tac-list li .nm{font-weight:600;margin-right:auto}
/* fenêtre des tactical cards */
.tac-list li .nm{border:0;background:none;padding:0;text-align:left;color:inherit;font:inherit;font-weight:600;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.tac-list li .nm:hover{color:var(--acc)}
.tacdlg .hd{display:flex;align-items:start;justify-content:space-between;gap:10px}
.tacdlg .meta{display:flex;flex-wrap:wrap;gap:6px}
.tacdlg .meta span{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);padding:2px 7px;background:var(--surface-2)}
.tacdlg .abil li{padding:6px 0 6px 10px}
.tacdlg .abil p{font-size:14px}
.tacdlg details{margin-top:4px;font-size:12px;color:var(--muted)}
.tacdlg details p{font-size:12px;color:var(--muted)}
@media (max-width:700px){#tov{place-items:end stretch;padding:0} #tov .dlg{width:100%;max-height:85vh;border-radius:12px 12px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}}

.unit{border-top:1px solid var(--line);padding:10px 14px;display:grid;gap:8px}
.u-head{display:flex;justify-content:space-between;gap:10px;align-items:start}
.u-head h3{font-size:18px;line-height:1.1}
.u-cost{font-family:var(--f-mono);font-size:18px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.u-cost small{display:block;font-size:11px;color:var(--muted)}
.u-body{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.ups{display:flex;flex-wrap:wrap;gap:6px}
.up{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);padding:3px 8px;font-size:13px;cursor:pointer;background:var(--surface-2)}
.up.locked{opacity:.5;cursor:not-allowed}
.up:has(input:checked){border-color:var(--acc);background:var(--surface)}
.up .num{color:var(--muted);font-size:12px}
.u-actions{display:flex;gap:8px;margin-left:auto}

/* sheet */
.sheet{display:grid;gap:10px;padding:10px 0 4px;font-size:13px}
.stats{display:flex;flex-wrap:wrap;gap:1px;background:var(--line);border:1px solid var(--line);width:max-content;max-width:100%}
.stats div{background:var(--surface-2);padding:4px 10px;text-align:center;display:grid}
.stats b{font-family:var(--f-mono);font-size:15px}
.stats span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{padding:4px 7px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--surface-2)}
td.num{font-family:var(--f-mono)}
td.kw{white-space:normal;min-width:140px}
.abil{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.abil li{border-left:2px solid var(--line);padding-left:8px}
.abil .an{font-weight:600}
.abil .ty{font-size:10px;letter-spacing:.08em;padding:0 5px;margin-left:6px;border-radius:2px;font-weight:600}
.ty.ACTIVE{background:#2F7FD0;color:#fff} .ty.PASSIVE{background:#B3261E;color:#fff} .ty.REACTION{background:#B98A12;color:#fff}
.abil .ph{font-size:11px;color:var(--muted);margin-left:6px}
.abil .co{font-family:var(--f-mono);font-size:11px;margin-left:6px;color:var(--ok)}
.abil p{margin:2px 0 0;max-width:70ch}
.tags{font-size:12px;color:var(--muted)}

/* collection */
.col-grid.one{grid-template-columns:minmax(0,640px)}
.col-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
.crow{display:flex;align-items:center;gap:10px;padding:6px 14px;border-top:1px solid var(--line)}
.crow .nm{margin-right:auto;min-width:0}
.star{border:0;background:none;font-size:20px;line-height:1;width:32px;height:32px;padding:0;color:var(--muted);flex:none;border-radius:3px}
.star.on{color:var(--acc)}
.star:hover{color:var(--acc)}
.star-sp{width:32px;flex:none}
.gen-card .star{font-size:14px;width:auto;height:auto;display:inline}
.stepper{display:flex;align-items:stretch;flex:none}
.stepper input{width:56px;text-align:center;font-size:16px;font-family:var(--f-mono);background:var(--surface-2);color:var(--ink);-webkit-text-fill-color:var(--ink);border:1px solid var(--line);border-inline:0;border-radius:0;padding:6px 4px;opacity:1}
.stepper input:focus{outline:2px solid var(--acc);outline-offset:-2px;background:var(--surface)}
.stp{width:40px;min-height:38px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:18px;line-height:1;-webkit-tap-highlight-color:transparent}
.stp:first-child{border-radius:3px 0 0 3px}.stp:last-child{border-radius:0 3px 3px 0}
.stp:active{background:var(--acc);color:var(--surface)}
.fam{border-top:1px solid var(--line)}
.fam-h{display:flex;justify-content:space-between;align-items:baseline;padding:8px 14px 2px;font-family:var(--f-display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:13px;color:var(--acc)}
.fam .crow{border-top:0;padding-left:26px}
.radio{display:flex;flex-wrap:wrap;gap:8px}
.radio label{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);background:var(--surface);padding:8px 12px;cursor:pointer;max-width:360px;font-size:13px}
.radio label:has(input:checked){border-color:var(--acc)}
.radio b{display:block}

/* mission */
.strip>.cell.wide{flex:2 1 380px}
.rounds{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mis .lbl{width:100%}
@media (max-width:520px){.strip>.cell.wide{flex-basis:100%}}
.mis{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:13px}
.mis input{width:48px;text-align:center;font-family:var(--f-mono);background:var(--surface-2);color:var(--ink);-webkit-text-fill-color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:4px}
/* générateur */
.gen-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;align-items:start}
.gen-card .score-rows{display:grid;gap:6px;margin-top:6px}
.srow{display:grid;grid-template-columns:90px 1fr 32px;gap:8px;align-items:center}
.srow .num{text-align:right;font-size:12px}
.gen-card .tac-list li{padding-block:4px}
.dlg.wide{width:min(900px,100%)}
.fopts{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.fprev{overflow:auto;max-height:55vh;border:1px solid var(--line);background:#dfe4e9;padding:10px}
.fprev .fiche{zoom:.75;margin:0 auto;box-shadow:0 1px 4px rgb(0 0 0 / .2)}
@media (max-width:600px){.fprev .fiche{zoom:.5}}
/* overlay */
.overlay{position:fixed;inset:0;background:rgb(0 0 0 / .45);display:grid;place-items:center;padding:16px;z-index:20}
.dlg{background:var(--surface);border:1px solid var(--line);width:min(640px,100%);max-height:calc(100% - 32px);overflow:auto;padding:16px;display:grid;gap:10px}
.dlg h2{font-size:21px}
.dlg p{margin:0;color:var(--muted);font-size:13px}
.dlg textarea{width:100%;min-height:220px;font-family:var(--f-mono);font-size:12px}
.dlg .row{display:flex;flex-wrap:wrap;gap:8px}
.msg{font-weight:600;font-size:13px}
.msg.ok{color:var(--ok)} .msg.err{color:var(--err)} .msg.warn{color:var(--warn)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* bandeau repliable + barre de budget fixe + menu Actions */
.top{transition:transform .2s ease}
.top.hid{transform:translateY(calc(-100% - env(safe-area-inset-top,0px) - 2px))}
.hdtog{order:9;width:34px;height:34px;flex:none;border:1px solid var(--line);background:var(--surface);border-radius:4px;font-size:15px;line-height:1;display:inline-grid;place-items:center;color:var(--ink)}
.hdtog:hover{border-color:var(--acc)}
.top.compact{padding-block:6px;gap:6px 10px}
.top.compact .sub{display:none}
.top.compact .brand h1{font-size:17px}
.top.compact .seg button{padding:4px 9px;font-size:13px}
.top.compact #races button[aria-selected="false"]{display:none}
.top.compact .skinbtn{display:none}
@media (max-width:700px){.top.compact .brand h1,.top.compact .brand-mark{display:none} .top.compact .brand{margin-right:0} .top.compact{gap:6px;flex-wrap:nowrap} .top.compact #views{margin-right:auto} .top.compact .seg button{padding:4px 7px;font-size:12px;letter-spacing:.03em}}
.budget{position:fixed;left:0;right:0;top:var(--hdH,0px);z-index:4;background:var(--bg);border-bottom:1px solid var(--line);box-shadow:0 6px 14px rgba(0,0,0,.14);padding:6px max(16px,env(safe-area-inset-left,0px));transition:top .2s ease}
.budget .in{max-width:1280px;margin:0 auto;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;font-size:13px;width:100%;border:0;background:none;padding:0;text-align:left;color:inherit;cursor:pointer}
.bud-m{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.bud-m .lbl{font-family:var(--f-body)}
.bud-m .bar{width:54px;height:5px}
.bud-m b.over{color:var(--err)}
.budget .slots{gap:4px}
.budget .slot{font-size:11px;padding:1px 5px}
.budget .pill{font-size:12px;padding:2px 8px}
@media (max-width:700px){.budget .in{gap:3px 10px;font-size:12px} .bud-m .bar{width:40px}}

.top.floating{position:fixed;left:0;right:0;top:0;z-index:6;padding:calc(6px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px));box-shadow:0 4px 12px rgba(0,0,0,.12)}
.actmenu{position:relative}
.actmenu>summary{list-style:none;cursor:pointer}
.actmenu>summary::-webkit-details-marker{display:none}
.actmenu .actlist{position:absolute;right:0;top:calc(100% + 4px);z-index:6;display:grid;gap:6px;min-width:220px;padding:8px;background:var(--surface);border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.actmenu .actlist .btn{justify-content:flex-start}

/* mots-clés cliquables + traductions */
.kwl{display:inline;border:0;background:none;padding:0;font:inherit;color:inherit;border-bottom:1.5px dotted var(--acc);cursor:help;text-align:inherit}
.kwl:hover,.kwl:focus-visible{color:var(--acc)}
.abil details.en{margin-top:4px;font-size:12px;color:var(--muted)}
.abil details.en p{font-size:12px;color:var(--muted)}
.abil details.en summary{cursor:pointer}
#kov{z-index:60}
.kwdlg .kwv{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.kwdlg .kwv span{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);padding:2px 7px;background:var(--surface-2)}
.kwdlg .kwt{white-space:pre-line;margin-top:6px;font-size:14px}
.kwdlg .when{font-size:12px;color:var(--muted);margin-top:4px}
.kwdlg details{margin-top:8px;font-size:12px;color:var(--muted)}.kwdlg .kwen{white-space:pre-line}
@media (max-width:700px){#kov{place-items:end stretch;padding:0} #kov .dlg{width:100%;max-height:80vh;border-radius:12px 12px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}}
</style>

<style>[hidden]{display:none!important}body{margin:0}
/* plan de jeu */
.planbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;justify-content:center;padding:16px;border:1px dashed var(--line);background:var(--surface)}
.planbar .btn{font-size:15px;padding:9px 18px}
.plandlg{width:min(940px,100%)}
@media (max-width:700px){#pov{place-items:end stretch;padding:0} #pov .dlg{width:100%;max-height:88vh;border-radius:12px 12px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}}
.plan{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.plandlg{overflow-x:hidden}
.plan-sec{min-width:0;overflow-wrap:anywhere}
.plan .pt{table-layout:fixed}
.plan .pt th:nth-child(1){width:22%}.plan .pt th:nth-child(2){width:12%}
.plan-sec{border:1px solid var(--line);border-left:3px solid var(--acc);background:var(--surface);padding:10px 14px}
.plan-sec h3{font-size:17px;margin:0 0 8px}
.plan .pt{width:100%;border-collapse:collapse;font-size:13px}
.plan .pt th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding:5px 6px}
.plan .pt td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top;white-space:normal}
.plan .pt i,.plan .pl-list i{color:var(--muted);font-style:normal;font-size:12px}
.plan .pl-list{margin:0;padding-left:18px;display:grid;gap:5px;font-size:13.5px}
.plan .pl-ph{margin:10px 0 4px;font-family:var(--f-display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:13px;color:var(--acc)}
.plan .pl-note,.plan .pl-foot{font-size:12px;color:var(--muted);margin:6px 0 0}
@media (max-width:700px){.plan .pt thead{display:none}.plan .pt tr{display:grid;border-bottom:1px solid var(--line);padding:6px 0}.plan .pt td{border:0;padding:2px 0}.plan .pt td[data-l]::before{content:attr(data-l);font-weight:600;color:var(--muted)}}

:root[data-skin="terran"] .sheetnav button.on{background:linear-gradient(180deg,#123b73 0%,#0a2145 100%);border-color:#46b4ff;color:#fff;box-shadow:0 0 12px rgba(70,180,255,.45)}
:root[data-skin="terran"] .case .lt{background:#46b4ff;color:#04141c}
